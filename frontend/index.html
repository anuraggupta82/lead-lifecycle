      alert('Action failed: ' + (e?.detail || e?.message || 'Unknown error'));
    } finally {
      setCampActionLoading(prev => ({...prev, [campId]: null}));
      setStopConfirm(null);
    }
  }

  async function deleteCampaign(campId, campName) {
    if (!confirm(`Delete "${campName}" from the dashboard?\n\nThis only removes the local record — no changes are made in Google Ads.`)) return;
    try {
      await api(`/api/admin/campaigns/${campId}`, { method: 'DELETE' });
      await loadManagedCamps();
    } catch(e) {
      alert('Delete failed: ' + (e?.detail || e?.message || 'Unknown error'));
    }
  }

  // Campaign Creation Wizard
  const [showWizard, setShowWizard] = useState(false);
  const [wizardStep, setWizardStep] = useState(1);
  const [savingCamp, setSavingCamp] = useState(false);
  const [campSaveMsg, setCampSaveMsg] = useState('');
  const [wizardStepError, setWizardStepError] = useState('');
  const [wizardWorkflows, setWizardWorkflows] = useState([]);
  const [wizardWfId, setWizardWfId] = useState('');
  const [wizardSkipWorkflow, setWizardSkipWorkflow] = useState(false);
  const [wizardCopyFrom, setWizardCopyFrom] = useState(''); // campaign_id to copy settings from
  const [wizardStrategy, setWizardStrategy] = useState(null);
  const [wizardStrategyLoading, setWizardStrategyLoading] = useState(false);
  const EMPTY_CAMP = {
    campaign_name:'', campaign_type:'MANUAL', campaign_id:'',
    service_focus:'', promo_offer:'', target_audience:'',
    objective:'', monthly_budget:'', expected_cpl:'',
    start_date:'', end_date:'', landing_page:'', notes:'',
    workflow_id: null,
  };
  const [newCamp, setNewCamp] = useState(EMPTY_CAMP);
  const setNC = (k, v) => setNewCamp(p => ({...p, [k]: v}));
  // Raw daily-budget value the user is typing in the wizard (kept locally; canonical
  // monthly_budget on newCamp is derived from this on every keystroke).
  const [wizardDailyBudget, setWizardDailyBudget] = useState('');
  // Practice settings — used to default landing page + show practice phone in wizard
  const wizardPractice = usePracticeSettings();

  async function openWizard() {
    setShowWizard(true);
    setWizardStep(1);
    // Pre-fill landing_page from practice_website if available; otherwise leave blank
    const initial = {...EMPTY_CAMP};
    if (wizardPractice && wizardPractice.website) {
      initial.landing_page = wizardPractice.website;
    }
    setNewCamp(initial);
    setWizardDailyBudget('');
    setWizardWfId('');
    setWizardSkipWorkflow(false);
    setWizardCopyFrom('');
    setCampSaveMsg('');
    setWizardStepError('');
    try {
      const d = await api('/api/admin/workflows');
      setWizardWorkflows(d.workflows || []);
    } catch(_) { setWizardWorkflows([]); }
  }

  function closeWizard() {
    setShowWizard(false);
    setWizardStep(1);
    setNewCamp(EMPTY_CAMP);
    setWizardDailyBudget('');
    setWizardWfId('');
    setWizardSkipWorkflow(false);
    setWizardCopyFrom('');
    setCampSaveMsg('');
    setWizardStepError('');
    setWizardStrategy(null);
    setWizardStrategyLoading(false);
    loadManagedCamps(); // refresh so new campaign + strategy appear immediately
  }

  function wizardNext() {
    setWizardStepError('');
    if (wizardStep === 1) {
      if (!newCamp.campaign_name.trim()) { setWizardStepError('Campaign name is required'); return; }
      setWizardStep(2);
    } else if (wizardStep === 2) {
      if (newCamp.end_date && newCamp.start_date && newCamp.end_date < newCamp.start_date) {
        setWizardStepError('End date must be on or after start date'); return;
      }
      if (newCamp.landing_page && !newCamp.landing_page.startsWith('http')) {
        setWizardStepError('Landing page URL must start with http:// or https://'); return;
      }
      setWizardStep(3);
    }
  }

  async function wizardLaunch() {
    setSavingCamp(true); setCampSaveMsg(''); setWizardStepError('');
    try {
      const wfIdVal = wizardSkipWorkflow ? null : (wizardWfId === '' ? null : parseInt(wizardWfId) || null);
      const savedCamp = { ...newCamp,
        monthly_budget: parseFloat(newCamp.monthly_budget) || 0,
        expected_cpl: parseFloat(newCamp.expected_cpl) || 0,
        workflow_id: wfIdVal,
        skip_workflow: wizardSkipWorkflow,
      };
      const createRes = await api('/api/admin/campaigns/create', { method: 'POST', body: JSON.stringify(savedCamp) });
      const createdCampId = createRes?.campaign?.campaign_id || null;
      // Campaign saved — move to Step 4: Opus Strategy Review
      setWizardStep(4);
      setWizardStrategy(null);
      setWizardStrategyLoading(true);
      setSavingCamp(false);
      try {
        const budgetHint = savedCamp.monthly_budget
          ? `$${monthlyToDaily(savedCamp.monthly_budget).toFixed(0)}/day budget (~$${Math.round(savedCamp.monthly_budget)}/mo)` + (savedCamp.expected_cpl ? `, target CPL $${savedCamp.expected_cpl}` : '')
          : '';
        const goalParts = [
          savedCamp.objective || `Generate leads for ${savedCamp.service_focus || savedCamp.campaign_name}`,
          savedCamp.target_audience ? `Target audience: ${savedCamp.target_audience}` : '',
          savedCamp.promo_offer ? `Offer: ${savedCamp.promo_offer}` : '',
          savedCamp.notes ? `Notes: ${savedCamp.notes}` : '',
        ].filter(Boolean);
        const res = await api('/api/admin/ai/campaign-strategy', {
          method: 'POST',
          body: JSON.stringify({
            campaign_goal: goalParts.join('. '),
            target_service: savedCamp.service_focus || 'Dental Implants',
            budget_hint: budgetHint,
            additional_context: `Campaign type: ${savedCamp.campaign_type}. Campaign name: ${savedCamp.campaign_name}.`,
          }),
        });
        const strategy = res.strategy || null;
        setWizardStrategy(strategy);
        // Persist strategy to the campaign record so it's never lost
        if (strategy && createdCampId) {
          api(`/api/admin/campaigns/${createdCampId}/strategy`, {
            method: 'PATCH',
            body: JSON.stringify({ strategy }),
          }).catch(() => {}); // best-effort, don't block UI
        }
      } catch(e) {
        setWizardStrategy({ _error: e?.detail || e?.message || 'Strategy generation failed' });
      }
      setWizardStrategyLoading(false);
    } catch(e) {
      setCampSaveMsg('❌ ' + (e?.detail || e?.message || 'Save failed'));
      setSavingCamp(false);
    }
  }

  // Lazy-loaded ad-group and search-term data (fetched on first ReportsTab mount)
  const [adGroupStats, setAdGroupStats] = useState([]);
  const [searchTermStats, setSearchTermStats] = useState([]);
  const [dailyStats, setDailyStats] = useState([]);

  useEffect(() => {
    Promise.all([
      api('/api/admin/gads/ad-groups').catch(() => ({ ad_groups: [] })),
      api('/api/admin/gads/search-terms').catch(() => ({ search_terms: [] })),
      api('/api/admin/gads/daily-stats?days=30').catch(() => ({ rows: [] })),
    ]).then(([ag, st, ds]) => {
      setAdGroupStats(ag.ad_groups || []);
      setSearchTermStats(st.search_terms || []);
      setDailyStats(ds.rows || []);
    });
  }, []);

  const presets = [
    { label: '7d', days: 7 },
    { label: '30d', days: 30 },
    { label: '90d', days: 90 },
    { label: 'All', days: 365 },
  ];

  async function refreshGA4() {
    setGa4Refreshing(true);
    try { await api('/api/admin/ga4/refresh', {method:'POST'}); window.location.reload(); }
    catch(e) { alert('GA4 refresh failed: '+e.message); }
    setGa4Refreshing(false);
  }

  function togglePanel(campKey, tab) {
    // If same campaign + same tab → close. Otherwise open that tab.
    setExpanded(prev =>
      prev && prev.key === campKey && prev.tab === tab ? null : { key: campKey, tab }
    );
  }

  const COLS = 8; // number of columns in campaign table

  return (
    <div>
      {/* View toggle */}
      <div className="reports-view-toggle">
        {[['campaigns','Campaigns'],['adgroups','Ad Groups'],['searchterms','Search Terms'],['adcreatives','Ad Creatives']].map(([k,l])=>(
          <button key={k} className={'reports-view-btn'+(view===k?' active':'')} onClick={()=>setView(k)}>{l}</button>
        ))}
      </div>

      {/* ── Ad Groups view ── */}
      {view==='adgroups' && <AdGroupsView adGroupStats={adGroupStats} dailyStats={dailyStats} />}

      {/* ── Search Terms view ── */}
      {view==='searchterms' && <SearchTermsView searchTermStats={searchTermStats} />}

      {/* ── Ad Creatives view ── */}
      {view==='adcreatives' && (
        <div>
          <div style={{display:'flex',gap:6,alignItems:'center',marginBottom:10}}>
            <span style={{fontSize:11,color:'var(--text-muted)'}}>Window:</span>
            {[7,30,90].map(d=>(
              <button key={d}
                style={{padding:'3px 8px',fontSize:10,border:'1px solid var(--border)',borderRadius:4,cursor:'pointer',
                  background:adCreativesDays===d?'var(--teal)':'#fff',
                  color:adCreativesDays===d?'#fff':'var(--text-muted)'}}
                onClick={()=>setAdCreativesDays(d)}>
                {d}d
              </button>
            ))}
          </div>
          <AdCreativesView days={adCreativesDays} />
        </div>
      )}

      {/* ── Campaigns view ── */}
      {view==='campaigns' && <div>
      <div className="report-section">
        {/* Header */}
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:8,marginBottom:12}}>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <div className="report-title" style={{marginBottom:0}}>Campaigns</div>
            <button className="btn btn-teal btn-sm" style={{fontSize:11}} onClick={openWizard}>+ New Campaign</button>
            <button className="btn btn-sm" style={{fontSize:10,background:'#4285f4',color:'#fff',border:'none',cursor:'pointer',padding:'3px 10px',borderRadius:4}}
              onClick={openGadsImport}>⬇ Import from Google Ads</button>
          </div>
          <div style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap'}}>
            <label style={{fontSize:10,color:'var(--text-muted)',display:'flex',alignItems:'center',gap:4,cursor:'pointer',userSelect:'none'}}>
              <input type="checkbox" checked={showInactive} onChange={e=>setShowInactive(e.target.checked)} />
              Show inactive (90d+)
            </label>
            {presets.map(p=>(
              <button key={p.label}
                style={{padding:'3px 8px',fontSize:10,border:'1px solid var(--border)',borderRadius:4,cursor:'pointer',
                  background:unifiedDays===p.days?'var(--teal)':'#fff',
                  color:unifiedDays===p.days?'#fff':'var(--text-muted)'}}
                onClick={()=>setUnifiedDays(p.days)}>{p.label}</button>
            ))}
            <button className="btn btn-ghost btn-sm" onClick={loadUnifiedCamps} style={{fontSize:10}}>↻ Refresh</button>
          </div>
        </div>

        {/* Table */}
        <table className="report-table">
          <thead>
            <tr>
              <th>Campaign</th>
              <th>Status</th>
              <th style={{width:90}}>Type</th>
              <th style={{width:88}}>Start</th>
              <th style={{width:88}}>End</th>
              <th className="num">Daily Budget</th>
              <th className="num">Leads</th>
              <th className="num">Cost</th>
              <th className="num">CPL</th>
              <th className="num">ROI</th>
              <th style={{textAlign:'center',width:80}}>AI Review</th>
              <th style={{textAlign:'center',width:76}}>AI Max</th>
              <th style={{width:190}}>Actions</th>
            </tr>
          </thead>
          <tbody>
            {unifiedLoading && (
              <tr><td colSpan={13} style={{textAlign:'center',color:'var(--text-muted)',padding:20,fontStyle:'italic'}}>Loading…</td></tr>
            )}
            {!unifiedLoading && unifiedCamps.length === 0 && (
              <tr><td colSpan={13} style={{textAlign:'center',color:'var(--text-muted)',padding:20,fontStyle:'italic'}}>
                No campaigns yet — click "+ New Campaign" or "⬇ Import from Google Ads".
              </td></tr>
            )}
            {!unifiedLoading && unifiedCamps.map((c,ci) => {
              const m = c.metrics || {};
              const statusColor = {
                ACTIVE:'#059669', DRAFT:'#6b7280', PAUSED:'#d97706',
                COMPLETED:'#2563eb', ARCHIVED:'#9ca3af', UNMANAGED:'#a855f7',
                SCHEDULED:'#7c3aed', QUEUED:'#0891b2',
              }[c.status] || '#6b7280';
              const isLoading = !!campActionLoading[c.campaign_id];
              const aiSaving = !!aiReviewSaving[c.campaign_id];
              const rowKey = c.campaign_id || `synthetic_${ci}`;
              const strategyOpen = expandedStrategy === c.campaign_id;
              let parsedStrategy = null;
              if (c.strategy_json && typeof c.strategy_json === 'object') {
                parsedStrategy = c.strategy_json;
              } else if (c.strategy_json && typeof c.strategy_json === 'string') {
                try { parsedStrategy = JSON.parse(c.strategy_json); } catch(_) {}
              }

              return (
                <React.Fragment key={rowKey}>
                  <tr style={c.is_inactive_90d ? {opacity:0.5} : null}>
                    {/* Campaign name */}
                    <td style={{fontWeight:600,maxWidth:200}}>
                      {c.campaign_id ? (
                        <span style={{cursor:'pointer',color:'var(--teal)',textDecoration:'underline',
                          textDecorationStyle:'dotted',wordBreak:'break-word'}}
                          onClick={()=>openCampaignDetail(c.campaign_id, unifiedDays)}>{c.campaign_name}</span>
                      ) : (
                        <span style={{wordBreak:'break-word',color:'var(--text-muted)',fontStyle:'italic'}}
                          title="Not yet imported into dashboard">{c.campaign_name}</span>
                      )}
                      {c.is_inactive_90d && (
                        <span style={{fontSize:9,marginLeft:5,color:'var(--text-muted)'}}>· 90d inactive</span>
                      )}
                    </td>

                    {/* Status */}
                    <td>
                      <span style={{fontSize:10,fontWeight:600,color:statusColor,
                        background:statusColor+'18',padding:'2px 7px',borderRadius:3,whiteSpace:'nowrap'}}>
                        {c.status}
                      </span>
                    </td>

                    <td style={{fontSize:10,color:'var(--text-muted)'}}>{(c.campaign_type||'—').replace('GOOGLE_ADS','G-Ads')}</td>
                    <td style={{fontSize:11}}>{c.start_date || '—'}</td>
                    <td style={{fontSize:11}}>{c.end_date || '—'}</td>
                    <td className="num">{c.monthly_budget > 0 ? fmtDailyBudget(c.monthly_budget) : '—'}</td>
                    <td className="num">{m.leads > 0 ? m.leads : '—'}</td>
                    <td className="num">{m.cost > 0 ? fmtMoney(m.cost) : '—'}</td>
                    <td className="num">{m.cpl != null ? '$'+Number(m.cpl).toFixed(0) : '—'}</td>
                    <td className="num" style={{
                      color: m.roi == null ? 'var(--text-muted)'
                           : m.roi > 0 ? '#059669' : m.roi < 0 ? 'var(--red)' : 'var(--text-muted)'
                    }}>{m.roi != null ? Math.round(m.roi)+'%' : '—'}</td>

                    {/* AI Review toggle */}
                    <td style={{textAlign:'center'}}>
                      {c.is_synthetic ? (
                        <span style={{fontSize:9,color:'var(--text-muted)'}} title="Import this campaign to enable AI Review">—</span>
                      ) : (
                        <label style={{display:'inline-flex',alignItems:'center',gap:3,cursor:aiSaving?'wait':'pointer'}}
                          title={c.ai_review_enabled ? 'AI actively monitoring — click to disable' : 'Click to enable AI monitoring'}>
                          <input type="checkbox" disabled={aiSaving}
                            checked={!!c.ai_review_enabled}
                            onChange={()=>toggleAiReview(c)} />
                          {c.ai_review_enabled && !aiSaving && (
                            <span style={{fontSize:9,color:'#059669',fontWeight:600}}>ON</span>
                          )}
                          {aiSaving && <span style={{fontSize:9,color:'var(--text-muted)'}}>…</span>}
                        </label>
                      )}
                    </td>

                    {/* AI Max toggle */}
                    {(() => {
                      const maxSaving = !!aiMaxSaving[c.campaign_id];
                      const isLinked = c.is_gads_linked && !c.is_synthetic && c.campaign_id;
                      return (
                        <td style={{textAlign:'center'}}>
                          {!isLinked ? (
                            <span style={{fontSize:9,color:'var(--text-muted)'}}
                              title="Link to Google Ads to enable AI Max">—</span>
                          ) : (
                            <label style={{display:'inline-flex',alignItems:'center',gap:3,
                              cursor:maxSaving?'wait':'pointer'}}
                              title={c.ai_max_enabled
                                ? 'AI Max ON — Google AI expanding keyword reach. Click to disable.'
                                : 'Enable AI Max — Google AI will expand beyond your keyword list'}>
                              <input type="checkbox" disabled={maxSaving}
                                checked={!!c.ai_max_enabled}
                                onChange={()=>toggleAiMax(c)} />
                              {c.ai_max_enabled && !maxSaving && (
                                <span style={{fontSize:9,color:'#4285f4',fontWeight:600}}>ON</span>
                              )}
                              {maxSaving && <span style={{fontSize:9,color:'var(--text-muted)'}}>…</span>}
                            </label>
                          )}
                        </td>
                      );
                    })()}

                    {/* Actions */}
                    <td style={{textAlign:'right'}}>
                      {c.is_synthetic ? (
                        <button className="btn btn-sm" style={{fontSize:10,background:'#4285f4',color:'#fff',border:'none'}}
                          onClick={openGadsImport}>⬇ Import</button>
                      ) : (() => {
                        if (c.status === 'ARCHIVED' || c.status === 'COMPLETED') return null;
                        const loading = campActionLoading[c.campaign_id];
                        return (
                          <div style={{display:'flex',gap:3,justifyContent:'flex-end',flexWrap:'wrap'}}>
                            {c.strategy_json && (
                              <button className="btn btn-ghost btn-sm"
                                style={{fontSize:10,color:'#7c3aed',borderColor:'#7c3aed'}}
                                onClick={()=>setExpandedStrategy(strategyOpen ? null : c.campaign_id)}>
                                🧠 {strategyOpen ? '▲' : '▼'}
                              </button>
                            )}
                            {c.status === 'ACTIVE' && (
                              <button className="btn btn-ghost btn-sm" disabled={isLoading}
                                style={{fontSize:10,color:'#d97706',borderColor:'#d97706'}}
                                onClick={()=>campaignAction(c.campaign_id,'pause')}>
                                {loading==='pause'?'…':'⏸'}
                              </button>
                            )}
                            {c.status === 'PAUSED' && (
                              <button className="btn btn-sm" disabled={isLoading}
                                style={{fontSize:10,background:'#059669',color:'#fff',border:'none'}}
                                onClick={()=>campaignAction(c.campaign_id,'resume')}>
                                {loading==='resume'?'…':'▶ Enable'}
                              </button>
                            )}
                            {c.is_gads_linked ? (
                              <button className="btn btn-ghost btn-sm" disabled={isLoading}
                                style={{fontSize:10,color:'var(--red)',borderColor:'var(--red)'}}
                                onClick={()=>setStopConfirm(c)}>
                                {loading==='stop'?'…':'⏹ Stop'}
                              </button>
                            ) : (
                              <button className="btn btn-ghost btn-sm" disabled={isLoading}
                                style={{fontSize:10,color:'#9ca3af',borderColor:'#9ca3af'}}
                                onClick={()=>deleteCampaign(c.campaign_id, c.campaign_name)}>
                                🗑
                              </button>
                            )}
                          </div>
                        );
                      })()}
                    </td>
                  </tr>

                  {/* Strategy expansion row */}
                  {strategyOpen && parsedStrategy && (
                    <tr>
                      <td colSpan={13} style={{padding:0,background:'#fafafa',borderTop:'none'}}>
                        <div style={{padding:'16px 18px',borderLeft:'3px solid var(--teal)'}}>
                          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12}}>
                            <span style={{fontSize:13,fontWeight:700,color:'var(--text)'}}>🧠 Opus Strategy</span>
                            <span style={{fontSize:10,background:'#ede9fe',color:'#5b21b6',padding:'2px 7px',borderRadius:3,fontWeight:600}}>claude-opus-4-5</span>
                          </div>
                          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
                            <div>
                              {parsedStrategy.objective && (
                                <div style={{marginBottom:10}}>
                                  <div style={{fontSize:10,fontWeight:700,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'.5px',marginBottom:4}}>Objective</div>
                                  <div style={{fontSize:12,lineHeight:1.5}}>{parsedStrategy.objective}</div>
                                </div>
                              )}
                              {parsedStrategy.target_audience && (
                                <div style={{marginBottom:10}}>
                                  <div style={{fontSize:10,fontWeight:700,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'.5px',marginBottom:4}}>Target Audience</div>
                                  <div style={{fontSize:12,lineHeight:1.5}}>{parsedStrategy.target_audience}</div>
                                </div>
                              )}
                              {(parsedStrategy.key_messages||[]).length > 0 && (
                                <div style={{marginBottom:10}}>
                                  <div style={{fontSize:10,fontWeight:700,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'.5px',marginBottom:4}}>Key Messages</div>
                                  {(parsedStrategy.key_messages||[]).map((msg,i)=>(
                                    <div key={i} style={{display:'flex',gap:6,marginBottom:3}}>
                                      <span style={{color:'var(--teal)',fontWeight:700,fontSize:11}}>→</span>
                                      <span style={{fontSize:11,lineHeight:1.4}}>{msg}</span>
                                    </div>
                                  ))}
                                </div>
                              )}
                            </div>
                            <div>
                              {(parsedStrategy.ad_headlines||[]).length > 0 && (
                                <div style={{marginBottom:10}}>
                                  <div style={{fontSize:10,fontWeight:700,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'.5px',marginBottom:4}}>Ad Headlines</div>
                                  <div>{(parsedStrategy.ad_headlines||[]).map((h,i)=>(
                                    <span key={i} style={{background:'#e0f2fe',color:'#0c4a6e',fontSize:10,
                                      padding:'2px 7px',borderRadius:3,display:'inline-block',marginRight:4,marginBottom:4}}>{h}</span>
                                  ))}</div>
                                </div>
                              )}
                              {(parsedStrategy.ad_descriptions||[]).length > 0 && (
                                <div style={{marginBottom:10}}>
                                  <div style={{fontSize:10,fontWeight:700,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'.5px',marginBottom:4}}>Ad Descriptions</div>
                                  {(parsedStrategy.ad_descriptions||[]).map((d,i)=>(
                                    <div key={i} style={{fontSize:11,color:'var(--text)',marginBottom:3,lineHeight:1.4}}>"{d}"</div>
                                  ))}
                                </div>
                              )}
                              {parsedStrategy.implementation_instructions && (
                                <div style={{marginTop:6,background:'#f0fdf4',border:'1px solid #bbf7d0',borderRadius:5,padding:'8px 10px'}}>
                                  <div style={{fontSize:10,fontWeight:700,color:'#166534',marginBottom:3}}>📋 Implementation Instructions</div>
                                  <div style={{fontSize:11,lineHeight:1.5}}>{parsedStrategy.implementation_instructions}</div>
                                </div>
                              )}
                            </div>
                          </div>
                        </div>
                      </td>
                    </tr>
                  )}
                </React.Fragment>
              );
            })}
          </tbody>
        </table>
      </div>


      {/* ── Google Ads Import Modal ── */}
      {gadsImportOpen && (
        <div style={{position:'fixed',top:0,left:0,right:0,bottom:0,background:'rgba(0,0,0,.45)',
          zIndex:280,display:'flex',alignItems:'center',justifyContent:'center'}}
          onClick={()=>{ if (!gadsImporting) { setGadsImportOpen(false); setGadsLinkMap({}); setGadsUnlinkedLocal([]); } }}>
          <div style={{background:'#fff',borderRadius:12,width:620,maxWidth:'96vw',maxHeight:'88vh',
            display:'flex',flexDirection:'column',boxShadow:'0 8px 40px rgba(0,0,0,.25)'}}
            onClick={e=>e.stopPropagation()}>

            {/* Header */}
            <div style={{padding:'16px 20px',borderBottom:'1px solid var(--border)',flexShrink:0,
              display:'flex',alignItems:'center',justifyContent:'space-between'}}>
              <div>
                <div style={{fontSize:15,fontWeight:700,display:'flex',alignItems:'center',gap:8}}>
                  <span style={{color:'#4285f4',fontSize:18}}>⬇</span>
                  Import Campaigns from Google Ads
                </div>
                <div style={{fontSize:11,color:'var(--text-muted)',marginTop:2}}>
                  Select campaigns to bring into your dashboard with full Pause/Stop control
                </div>
              </div>
              <button style={{background:'none',border:'none',fontSize:20,cursor:'pointer',
                color:'var(--text-muted)',padding:'0 4px'}}
                onClick={()=>setGadsImportOpen(false)}>×</button>
            </div>

            {/* Body */}
            <div style={{flex:1,overflowY:'auto',padding:'12px 20px'}}>
              {gadsImportLoading ? (
                <div style={{display:'flex',alignItems:'center',justifyContent:'center',
                  flexDirection:'column',gap:10,padding:'40px 0',color:'var(--text-muted)'}}>
                  <div className="spinner" style={{width:24,height:24,borderWidth:3}}/>
                  <div style={{fontSize:12}}>Fetching campaigns from Google Ads…</div>
                </div>
              ) : gadsImportList.length === 0 ? (
                <div style={{textAlign:'center',padding:'32px 0',color:'var(--text-muted)',fontSize:12}}>
                  No campaigns found in your Google Ads account.
                </div>
              ) : (
                <>
                  <div style={{fontSize:11,color:'var(--text-muted)',marginBottom:10}}>
                    {gadsImportList.length} campaign(s) found ·
                    {gadsImportSelected.size > 0 ? ` ${gadsImportSelected.size} selected` : ' none selected'}
                  </div>
                  <table className="report-table">
                    <thead>
                      <tr>
                        <th style={{width:32}}>
                          <input type="checkbox"
                            checked={gadsImportSelected.size === gadsImportList.filter(c=>!c.already_imported).length
                              && gadsImportList.filter(c=>!c.already_imported).length > 0}
                            onChange={e => {
                              if (e.target.checked) {
                                setGadsImportSelected(new Set(
                                  gadsImportList.filter(c=>!c.already_imported).map(c=>c.campaign_id)
                                ));
                              } else {
                                setGadsImportSelected(new Set());
                              }
                            }} />
                        </th>
                        <th>Campaign</th>
                        <th>Status</th>
                        <th>Type</th>
                        <th className="num">Daily Budget</th>
                        <th className="num">~Monthly</th>
                        <th style={{fontSize:10,color:'var(--text-muted)'}}>Link to existing</th>
                      </tr>
                    </thead>
                    <tbody>
                      {gadsImportList.map(camp => {
                        const isImported = camp.already_imported;
                        const isSelected = gadsImportSelected.has(camp.campaign_id);
                        const statusColor = camp.gads_status === 'ENABLED' ? '#059669' : '#d97706';
                        const statusLabel = camp.gads_status === 'ENABLED' ? 'ACTIVE' : 'PAUSED';
                        return (
                          <tr key={camp.campaign_id}
                            style={{opacity: isImported ? 0.5 : 1,
                              background: isSelected ? 'rgba(13,122,127,.04)' : 'transparent',
                              cursor: isImported ? 'default' : 'pointer'}}
                            onClick={() => {
                              if (isImported) return;
                              const s = new Set(gadsImportSelected);
                              if (s.has(camp.campaign_id)) s.delete(camp.campaign_id);
                              else s.add(camp.campaign_id);
                              setGadsImportSelected(s);
                            }}>
                            <td onClick={e=>e.stopPropagation()}>
                              <input type="checkbox"
                                disabled={isImported}
                                checked={isSelected}
                                onChange={e => {
                                  const s = new Set(gadsImportSelected);
                                  if (e.target.checked) s.add(camp.campaign_id);
                                  else s.delete(camp.campaign_id);
                                  setGadsImportSelected(s);
                                }} />
                            </td>
                            <td style={{fontWeight:600,fontSize:12}}>{camp.campaign_name}</td>
                            <td>
                              <span style={{fontSize:10,fontWeight:700,color:statusColor,
                                background:statusColor+'18',padding:'2px 7px',borderRadius:3}}>
                                {statusLabel}
                              </span>
                            </td>
                            <td style={{fontSize:10,color:'var(--text-muted)'}}>{camp.channel_type}</td>
                            <td className="num" style={{fontSize:11}}>${camp.daily_budget_usd}/d</td>
                            <td className="num" style={{fontSize:11}}>${camp.monthly_budget_usd}</td>
                            <td onClick={e=>e.stopPropagation()} style={{fontSize:10,minWidth:150}}>
                              {isImported ? (
                                <span style={{color:'#059669',fontWeight:600}}>✓ Imported</span>
                              ) : gadsUnlinkedLocal.length > 0 ? (
                                <select
                                  value={gadsLinkMap[camp.campaign_id] || ''}
                                  onChange={e => {
                                    const v = e.target.value;
                                    setGadsLinkMap(m => {
                                      const next = {...m};
                                      if (v) next[camp.campaign_id] = v;
                                      else delete next[camp.campaign_id];
                                      return next;
                                    });
                                    // Auto-select the row when a link target is picked
                                    if (v) {
                                      const s = new Set(gadsImportSelected);
                                      s.add(camp.campaign_id);
                                      setGadsImportSelected(s);
                                    }
                                  }}
                                  style={{fontSize:10,padding:'2px 4px',maxWidth:180,borderRadius:4,
                                    border:'1px solid var(--border)',background:'#fff'}}>
                                  <option value="">— Link to existing… —</option>
                                  {gadsUnlinkedLocal.map(lc => (
                                    <option key={lc.campaign_id} value={lc.campaign_id}>{lc.campaign_name}</option>
                                  ))}
                                </select>
                              ) : null}
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </>
              )}
            </div>

            {/* Footer */}
            <div style={{padding:'12px 20px',borderTop:'1px solid var(--border)',flexShrink:0,
              display:'flex',alignItems:'center',justifyContent:'space-between'}}>
              <div style={{fontSize:11,color:'var(--text-muted)'}}>
                Imported campaigns get Pause / Stop controls immediately.
                Performance data syncs on next Google Ads sync run.
              </div>
              <div style={{display:'flex',gap:8}}>
                <button className="btn btn-ghost btn-sm" style={{fontSize:11}}
                  onClick={()=>setGadsImportOpen(false)}
                  disabled={gadsImporting}>Cancel</button>
                <button className="btn btn-sm" style={{fontSize:11,
                  background: gadsImportSelected.size > 0 ? '#4285f4' : '#9ca3af',
                  color:'#fff',border:'none'}}
                  disabled={gadsImportSelected.size === 0 || gadsImporting}
                  onClick={doGadsImport}>
                  {gadsImporting
                    ? 'Importing…'
                    : `⬇ Import Selected (${gadsImportSelected.size})`}
                </button>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* ── Campaign Detail Drawer ── */}
      {(campDetail || campDetailLoading) && (
        <div style={{position:'fixed',top:0,left:0,right:0,bottom:0,background:'rgba(0,0,0,.35)',
          zIndex:250,display:'flex',justifyContent:'flex-end'}}
          onClick={()=>{setCampDetail(null);setCampDetailLoading(false);}}>
          <div style={{background:'#fff',width:700,maxWidth:'96vw',height:'100%',overflowY:'auto',
            boxShadow:'-4px 0 24px rgba(0,0,0,.18)',display:'flex',flexDirection:'column'}}
            onClick={e=>e.stopPropagation()}>

            {campDetailLoading ? (
              <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',
                flexDirection:'column',gap:10,color:'var(--text-muted)'}}>
                <div className="spinner" style={{width:28,height:28,borderWidth:3}}/>
                <div style={{fontSize:12}}>Loading campaign details…</div>
              </div>
            ) : campDetail && (() => {
              const cd = campDetail;
              const camp = cd.campaign;
              const summary = cd.summary;
              const strategy = cd.strategy;
              const statusColor = {ACTIVE:'#059669',DRAFT:'#6b7280',PAUSED:'#d97706',COMPLETED:'#2563eb',ARCHIVED:'#9ca3af',SCHEDULED:'#7c3aed',QUEUED:'#0891b2'}[camp.status]||'#6b7280';
              const loading = campActionLoading[camp.campaign_id];
              const isLoading = !!loading;

              return (
                <>
                  {/* ── Header ── */}
                  <div style={{background:'var(--teal-dark)',color:'#fff',padding:'16px 20px',flexShrink:0}}>
                    <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:12}}>
                      <div style={{flex:1,minWidth:0}}>
                        {campEditMode ? (
                          <div style={{display:'flex',flexDirection:'column',gap:6}}>
                            <input value={campEditFields.campaign_name ?? camp.campaign_name}
                              onChange={e=>setCampEditFields(f=>({...f,campaign_name:e.target.value}))}
                              style={{fontSize:15,fontWeight:700,background:'rgba(255,255,255,.15)',border:'1px solid rgba(255,255,255,.4)',
                                color:'#fff',borderRadius:4,padding:'4px 8px',width:'100%'}}
                              placeholder="Campaign name"/>
                            <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                              <input value={campEditFields.service_focus ?? (camp.service_focus||'')}
                                onChange={e=>setCampEditFields(f=>({...f,service_focus:e.target.value}))}
                                style={{fontSize:11,background:'rgba(255,255,255,.1)',border:'1px solid rgba(255,255,255,.3)',
                                  color:'#fff',borderRadius:4,padding:'3px 7px',width:140}}
                                placeholder="Service focus"/>
                              <input type="number" min="0" step="0.01"
                                value={campEditFields.monthly_budget != null
                                  ? monthlyToDaily(campEditFields.monthly_budget)
                                  : (camp.monthly_budget ? monthlyToDaily(camp.monthly_budget) : '')}
                                onChange={e=>setCampEditFields(f=>({...f,monthly_budget: dailyToMonthly(parseFloat(e.target.value)||0)}))}
                                style={{fontSize:11,background:'rgba(255,255,255,.1)',border:'1px solid rgba(255,255,255,.3)',
                                  color:'#fff',borderRadius:4,padding:'3px 7px',width:110}}
                                placeholder="Daily budget"
                                title="Daily budget — Google Ads bills daily"/>
                              <input value={campEditFields.start_date ?? (camp.start_date||'')}
                                onChange={e=>setCampEditFields(f=>({...f,start_date:e.target.value}))}
                                style={{fontSize:11,background:'rgba(255,255,255,.1)',border:'1px solid rgba(255,255,255,.3)',
                                  color:'#fff',borderRadius:4,padding:'3px 7px',width:110}}
                                placeholder="Start date"/>
                              <input value={campEditFields.end_date ?? (camp.end_date||'')}
                                onChange={e=>setCampEditFields(f=>({...f,end_date:e.target.value}))}
                                style={{fontSize:11,background:'rgba(255,255,255,.1)',border:'1px solid rgba(255,255,255,.3)',
                                  color:'#fff',borderRadius:4,padding:'3px 7px',width:110}}
                                placeholder="End date"/>
                            </div>
                          </div>
                        ) : (
                          <>
                            <div style={{fontSize:17,fontWeight:700,lineHeight:1.2,marginBottom:4}}>{camp.campaign_name}</div>
                            <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
                              <span style={{fontSize:10,background:'rgba(255,255,255,.15)',padding:'2px 8px',borderRadius:3}}>
                                {camp.campaign_type}
                              </span>
                              <span style={{fontSize:10,background:statusColor,padding:'2px 8px',borderRadius:3,fontWeight:700}}>
                                {camp.status}
                              </span>
                              {camp.service_focus && (
                                <span style={{fontSize:10,color:'rgba(255,255,255,.75)'}}>
                                  Service: {camp.service_focus}
                                </span>
                              )}
                              {camp.monthly_budget > 0 && (
                                <span style={{fontSize:10,color:'#5eead4',fontWeight:600}}>
                                  {fmtDailyBudget(camp.monthly_budget)}
                                </span>
                              )}
                              {camp.status === 'SCHEDULED' && camp.launch_date && (
                                <span style={{fontSize:11,color:'rgba(255,255,255,.7)',marginLeft:6}}>
                                  Scheduled: {new Date(camp.launch_date).toLocaleDateString()}
                                </span>
                              )}
                            </div>
                          </>
                        )}
                      </div>
                      <div style={{display:'flex',gap:4,flexShrink:0}}>
                        {campEditMode ? (
                          <>
                            <button style={{background:'#059669',border:'none',color:'#fff',fontSize:11,
                              padding:'4px 10px',borderRadius:4,cursor:'pointer'}}
                              disabled={campEditSaving}
                              onClick={async()=>{
                                setCampEditSaving(true);
                                try {
                                  await api(`/api/admin/campaigns/${camp.campaign_id}`,{
                                    method:'PATCH',
                                    body:JSON.stringify(campEditFields)
                                  });
                                  await openCampaignDetail(camp.campaign_id, campDetailDays);
                                  setCampEditMode(false); setCampEditFields({});
                                } catch(e){alert('Save failed: '+e.message);}
                                finally{setCampEditSaving(false);}
                              }}>{campEditSaving?'Saving…':'✓ Save'}</button>
                            <button style={{background:'rgba(255,255,255,.15)',border:'none',color:'#fff',fontSize:11,
                              padding:'4px 10px',borderRadius:4,cursor:'pointer'}}
                              onClick={()=>{setCampEditMode(false);setCampEditFields({});}}>Cancel</button>
                          </>
                        ) : (
                          <button style={{background:'rgba(255,255,255,.12)',border:'1px solid rgba(255,255,255,.3)',color:'#fff',
                            fontSize:10,padding:'3px 8px',borderRadius:4,cursor:'pointer'}}
                            onClick={()=>setCampEditMode(true)}>✏ Edit</button>
                        )}
                        <button style={{background:'rgba(255,255,255,.15)',border:'none',color:'#fff',
                          width:28,height:28,borderRadius:5,cursor:'pointer',fontSize:16}}
                          onClick={()=>setCampDetail(null)}>×</button>
                      </div>
                    </div>

                    {/* Action buttons */}
                    <div style={{display:'flex',gap:6,marginTop:12,flexWrap:'wrap'}}>
                      {camp.status === 'ACTIVE' && (
                        <button className="btn btn-sm" disabled={isLoading}
                          style={{fontSize:10,background:'rgba(255,255,255,.15)',color:'#fff',border:'1px solid rgba(255,255,255,.3)'}}
                          onClick={async()=>{await campaignAction(camp.campaign_id,'pause');openCampaignDetail(camp.campaign_id);}}>
                          {loading==='pause'?'…':'⏸ Pause'}
                        </button>
                      )}
                      {camp.status === 'PAUSED' && (
                        <button className="btn btn-sm" disabled={isLoading}
                          style={{fontSize:10,background:'#059669',color:'#fff',border:'none'}}
                          onClick={async()=>{await campaignAction(camp.campaign_id,'resume');openCampaignDetail(camp.campaign_id);}}>
                          {loading==='resume'?'…':'▶ Enable'}
                        </button>
                      )}
                      {(camp.status === 'ACTIVE' || camp.status === 'PAUSED') && (
                        <button className="btn btn-sm" disabled={isLoading}
                          style={{fontSize:10,background:'rgba(239,68,68,.8)',color:'#fff',border:'none'}}
                          onClick={()=>setStopConfirm(camp)}>
                          {loading==='stop'?'…':'⏹ Stop'}
                        </button>
                      )}
                      {/* Sync from Google Ads — only for GAds-linked campaigns */}
                      {camp.gads_campaign_resource && (
                        <button className="btn btn-sm" disabled={!!syncingFromGads[camp.campaign_id]}
                          style={{fontSize:10,background:'rgba(255,255,255,.15)',color:'#fff',
                            border:'1px solid rgba(255,255,255,.35)',display:'flex',alignItems:'center',gap:4}}
                          onClick={async()=>{
                            setSyncingFromGads(s=>({...s,[camp.campaign_id]:true}));
                            try {
                              await api(`/api/admin/campaigns/${camp.campaign_id}/sync-from-gads`,{method:'POST'});
                              await openCampaignDetail(camp.campaign_id, campDetailDays);
                            } catch(e){
                              alert('Sync failed: '+(e?.detail||e?.message));
                            } finally {
                              setSyncingFromGads(s=>({...s,[camp.campaign_id]:false}));
                            }
                          }}>
                          {syncingFromGads[camp.campaign_id]
                            ? <><span className="spinner" style={{width:10,height:10,borderWidth:1.5,display:'inline-block'}}/> Syncing…</>
                            : '↻ Sync from Google Ads'
                          }
                        </button>
                      )}
                      {/* Days filter */}
                      <div style={{marginLeft:'auto',display:'flex',gap:4}}>
                        {[7,30,90].map(d=>(
                          <button key={d} className="btn btn-sm" style={{fontSize:10,
                            background: campDetailDays===d ? 'rgba(255,255,255,.3)':'rgba(255,255,255,.1)',
                            color:'#fff',border:'1px solid rgba(255,255,255,.2)'}}
                            onClick={()=>openCampaignDetail(camp.campaign_id, d)}>
                            {d}d
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>

                  {/* ── Body ── */}
                  {(() => {
                    const build = cd.build || {};
                    const gadsSnap = cd.gads_snapshot || {};
                    const snapSyncedAt = gadsSnap.synced_from_gads_at
                      ? new Date(gadsSnap.synced_from_gads_at).toLocaleString()
                      : null;

                    // Helper: seed a wizard step from the Google Ads snapshot
                    async function seedFromSnapshot(step) {
                      const stepData = gadsSnap[step];
                      if (!stepData) return;
                      setBuildLoading('seed_'+step);
                      try {
                        await api(`/api/admin/campaigns/${camp.campaign_id}/build-step-save`, {
                          method: 'POST',
                          body: JSON.stringify({ step, data: stepData }),
                        });
                        await openCampaignDetail(camp.campaign_id, campDetailDays);
                      } catch(e) { alert('Could not seed from snapshot: '+e.message); }
                      finally { setBuildLoading(''); }
                    }

                    // Snapshot banner component — shown on wizard tabs when snapshot data exists
                    // but the wizard step is empty, offering one-click seeding.
                    function SnapshotBanner({ step, label }) {
                      const hasSnap = !!(gadsSnap[step] && (
                        (gadsSnap[step].keywords && gadsSnap[step].keywords.length > 0) ||
                        (gadsSnap[step].ads && gadsSnap[step].ads.length > 0) ||
                        (gadsSnap[step].ad_groups && gadsSnap[step].ad_groups.length > 0)
                      ));
                      if (!hasSnap) return null;
                      const seeding = buildLoading === 'seed_'+step;
                      return (
                        <div style={{background:'#eff6ff',border:'1px solid #bfdbfe',borderRadius:8,
                          padding:'12px 16px',marginBottom:16,display:'flex',alignItems:'center',
                          justifyContent:'space-between',gap:12}}>
                          <div>
                            <div style={{fontSize:12,fontWeight:700,color:'#1e40af',marginBottom:2}}>
                              📥 Google Ads data available
                            </div>
                            <div style={{fontSize:11,color:'#3b82f6'}}>
                              {label} were imported from your live Google Ads campaign
                              {snapSyncedAt ? ` (synced ${snapSyncedAt})` : ''}.
                              Seed the wizard from this data to start with real settings.
                            </div>
                          </div>
                          <button className="btn btn-sm" disabled={seeding}
                            style={{fontSize:11,background:'#2563eb',color:'#fff',border:'none',whiteSpace:'nowrap',flexShrink:0}}
                            onClick={()=>seedFromSnapshot(step)}>
                            {seeding ? '⏳ Seeding…' : '📥 Seed from Google Ads'}
                          </button>
                        </div>
                      );
                    }

                    async function generateBuildStep(step) {
                      setBuildLoading(step);
                      // Clear any inline edit in progress so stale keys don't linger
                      if (step === 'launch_checklist') setChecklistEditing(null);
                      try {
                        await api(`/api/admin/campaigns/${camp.campaign_id}/build-step`, {
                          method: 'POST',
                          body: JSON.stringify({ step }),
                        });
                        // Reload detail to get fresh build data
                        await openCampaignDetail(camp.campaign_id, campDetailDays);
                      } catch(e) {
                        alert('AI generation failed: ' + e.message);
                      } finally {
                        setBuildLoading('');
                      }
                    }

                    // Wizard step completion helpers
                    const stepDone = {
                      strategy:    !!strategy,
                      keywords:    !!build.keywords,
                      ad_copy:     !!build.ad_copy,
                      ad_groups:   !!build.ad_groups,
                      launch:      !!(build.launch_checklist && build.launch_checklist.some(x=>x.category==='required') && build.launch_checklist.filter(x=>x.category==='required').every(x=>x.done)),
                      performance: true,
                    };
                    const WIZARD_ORDER = ['strategy','keywords','ad_copy','ad_groups','launch','performance'];
                    const TABS = [
                      { id: 'strategy',    label: '🧠 Strategy' },
                      { id: 'keywords',    label: '🔍 Keywords' },
                      { id: 'ad_copy',     label: '✍ Ad Copy' },
                      { id: 'ad_groups',   label: '📂 Ad Groups' },
                      { id: 'launch',      label: '🚀 Launch' },
                      { id: 'performance', label: '📊 Performance' },
                    ];
                    const currentIdx = WIZARD_ORDER.indexOf(detailTab);
                    const nextStep = WIZARD_ORDER[currentIdx + 1];
                    const canAdvance = detailTab !== 'performance' && stepDone[detailTab];

                    // Refine helpers (shared across keyword/ad_copy/ad_groups tabs)
                    async function handleRefine(step) {
                      if (!refineInput.trim()) return;
                      setRefineLoading(true);
                      // If there's already a preview for this step, refine from that
                      // (not the saved version) — supports iterative refinement before committing
                      const currentOverride = (refinedPreview?.step === step) ? refinedPreview.data : null;
                      try {
                        const res = await api(`/api/admin/campaigns/${camp.campaign_id}/build-step-refine`, {
                          method: 'POST',
                          body: JSON.stringify({ step, instruction: refineInput, current_override: currentOverride }),
                        });
                        setRefinedPreview({ step, data: res.data });
                        setRefineInput(''); // clear input so next instruction starts fresh
                      } catch(e) { alert('Refine failed: ' + e.message); }
                      finally { setRefineLoading(false); }
                    }

                    async function acceptRefined() {
                      if (!refinedPreview) return;
                      const { step, data } = refinedPreview;
                      await api(`/api/admin/campaigns/${camp.campaign_id}/build-step-save`, {
                        method: 'POST',
                        body: JSON.stringify({ step, data }),
                      });
                      setRefinedPreview(null);
                      setRefineInput('');
                      // Immediately update campDetail so strategy tab re-renders without full reload
                      if (step === 'strategy') {
                        setCampDetail(prev => prev ? { ...prev, strategy: data } : prev);
                      }
                      await openCampaignDetail(camp.campaign_id, campDetailDays);
                    }

                    // Refine box — called as a plain function (not a JSX component) to avoid
                    // remount-on-keystroke caused by defining a component inside render.
                    function renderRefineBox(step) {
                      const isThisStep = refinedPreview?.step === step;
                      return (
                        <div style={{marginTop:20,background:'#f5f3ff',border:'1px solid #c4b5fd',borderRadius:8,padding:'12px 14px'}}>
                          <div style={{fontSize:11,fontWeight:700,color:'#5b21b6',marginBottom:6}}>
                            🤖 Ask AI to refine
                          </div>
                          <div style={{display:'flex',gap:6}}>
                            <input value={refineInput} onChange={e=>setRefineInput(e.target.value)}
                              onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();handleRefine(step);}}}
                              placeholder={`e.g. "Remove all broad match keywords" or "Add keywords for weekend hours"`}
                              style={{flex:1,fontSize:11,padding:'6px 10px',border:'1px solid #c4b5fd',borderRadius:5,outline:'none'}}/>
                            <button className="btn btn-sm" disabled={refineLoading||!refineInput.trim()}
                              style={{fontSize:11,background:'#7c3aed',color:'#fff',border:'none',whiteSpace:'nowrap'}}
                              onClick={()=>handleRefine(step)}>
                              {refineLoading?'⏳ Refining…':'✨ Refine'}
                            </button>
                          </div>
                          {isThisStep && refinedPreview && (
                            <div style={{marginTop:10,background:'#fff',border:'1px solid #a78bfa',borderRadius:6,padding:'10px 12px'}}>
                              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
                                <span style={{fontSize:11,fontWeight:700,color:'#5b21b6'}}>✨ AI Suggestion (preview)</span>
                                <div style={{display:'flex',gap:6}}>
                                  <button className="btn btn-sm" style={{fontSize:10,background:'#059669',color:'#fff',border:'none'}}
                                    onClick={acceptRefined}>✓ Accept & Save</button>
                                  <button className="btn btn-ghost btn-sm" style={{fontSize:10}}
                                    onClick={()=>setRefinedPreview(null)}>✕ Discard</button>
                                </div>
                              </div>
                              <pre style={{fontSize:10,lineHeight:1.4,color:'#374151',whiteSpace:'pre-wrap',
                                maxHeight:200,overflowY:'auto',margin:0}}>
                                {JSON.stringify(refinedPreview.data, null, 2)}
                              </pre>
                            </div>
                          )}
                        </div>
                      );
                    }

                    return (
                      <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
                        {/* Tab bar with wizard indicators */}
                        <div style={{borderBottom:'2px solid var(--border)',background:'#fafafa',flexShrink:0}}>
                          <div style={{display:'flex',overflowX:'auto',padding:'0 20px',gap:0}}>
                            {TABS.map(t => {
                              const done = stepDone[t.id];
                              const active = detailTab === t.id;
                              return (
                                <button key={t.id}
                                  style={{padding:'10px 14px',fontSize:11,fontWeight:active?700:400,
                                    color:active?'var(--teal)':'var(--text-muted)',

                                    borderBottom:active?'2px solid var(--teal)':'2px solid transparent',

                                  method: 'PATCH',

                                setCampDetail(prev => prev ? {
                                  ...prev,
                                  campaign: {...prev.campaign, [fieldName]: value}

                                  curr?.field === fieldName && curr?.saved ? null : curr

                                setLaunchCardEdit(p => ({...p, saving: false}));

                                        {label:'Sitelinks',        val: camp.sitelinks || ''},
                                        {label:'Callouts',         val: camp.callouts || ''},
                                        {label:'Ad Schedule',      val: camp.ad_schedule || ''},
                                        {label:'UTM Parameters',   val: camp.utm_params || ''},
                                      ].map(({label, val}) => (
                                        <div key={label} style={{display:'flex',gap:10,padding:'7px 0',
                                          borderBottom:'1px solid var(--border)'}}>
                                          <div style={{width:140,fontSize:11,fontWeight:600,color:'var(--text-muted)',flexShrink:0}}>{label}</div>
                                          <div style={{fontSize:12,color: val ? 'var(--text)' : '#9ca3af',flex:1,
                                            wordBreak:'break-word',lineHeight:1.5}}>
                                            {val || <em>Not configured</em>}
                                          </div>
                                        </div>
                                      ))}
                                    </div>

                                        {label:'Ad Groups', val: adGroupCount > 0 ? adGroupCount : null, tab:'ad_groups', sub: null},
                                        {label:'Headlines', val: headlineCount > 0 ? headlineCount : null, tab:'ad_copy',   sub: null},
