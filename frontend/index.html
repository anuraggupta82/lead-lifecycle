function PendingApprovalsPanel() {
  const [rows, setRows]     = useState(null);   // null = loading
  const [acting, setActing] = useState({});     // {action_id: 'apply'|'reject'}
  const [error, setError]   = useState(null);

  async function load() {
    try {
      const pr = await api('/api/admin/gads/pending-approvals');
      setRows(pr.pending || []);
      setError(null);
    } catch(e) {
      setError(e.message);
      setRows([]);
    }
  }

  useEffect(() => { load(); }, []);

  async function handleApply(action_id) {
    if (!confirm('Apply this recommendation to Google Ads now?')) return;
    setActing(prev => ({...prev, [action_id]: 'apply'}));
    try {
      await api(`/api/admin/gads/approve/${action_id}`, { method: 'POST' });
      setRows(prev => prev.map(r => r.action_id === action_id
        ? {...r, _result: 'applied'} : r));
    } catch(e) {
      alert('Apply failed: ' + e.message);
    }
    setActing(prev => ({...prev, [action_id]: null}));
  }

  async function handleReject(action_id) {
    if (!confirm('Reject and dismiss this recommendation?')) return;
    setActing(prev => ({...prev, [action_id]: 'reject'}));
    try {
      await api(`/api/admin/gads/reject/${action_id}`, { method: 'POST' });
      setRows(prev => prev.map(r => r.action_id === action_id
        ? {...r, _result: 'rejected'} : r));
    } catch(e) {
      alert('Reject failed: ' + e.message);
    }
    setActing(prev => ({...prev, [action_id]: null}));
  }

  const OP_ICONS = {
    pause_keyword:       '⛔',
    increase_bid:        '⬆️',
    decrease_bid:        '⬇️',
    add_exact_keyword:   '✨',
    add_negative_keyword:        '🚫',
    add_to_shared_negative_list: '🛡️',
  };
  const OP_COLORS = {
    pause_keyword:              { bg:'#fef2f2', label:'#dc2626' },
    increase_bid:               { bg:'#f0fdf4', label:'#16a34a' },
    decrease_bid:               { bg:'#fffbeb', label:'#f59e0b' },
    add_exact_keyword:          { bg:'#f0f9ff', label:'#0891b2' },
    add_negative_keyword:       { bg:'var(--gray-light)', label:'#6b7280' },
    add_to_shared_negative_list:{ bg:'#fdf2f8', label:'#be185d' },
  };

  function fmtState(json_str, op) {
    if (!json_str) return '—';
    try {
      const obj = JSON.parse(json_str);
      if (op === 'pause_keyword')        return `enabled → paused`;
      if (op === 'increase_bid' || op === 'decrease_bid') {
        const before = obj.current_bid_micros ? `$${(obj.current_bid_micros/1e6).toFixed(2)}` : '—';
        const after  = obj.new_bid_micros     ? `$${(obj.new_bid_micros/1e6).toFixed(2)}`     : '—';
        return op === 'increase_bid' ? `${before} → ${after} ⬆️` : `${before} → ${after} ⬇️`;
      }
      if (op === 'add_exact_keyword')    return `[exact] "${obj.keyword_text}"`;
      if (op === 'add_negative_keyword') return `[neg/${obj.match_type||'broad'}] "${obj.keyword_text}"`;
      if (op === 'add_to_shared_negative_list') return `[shared/${obj.match_type||'broad'}] "${obj.keyword_text}"`;
      return JSON.stringify(obj).slice(0,80);
    } catch { return json_str.slice(0,80); }
  }

  return (
    <div className="report-section">
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
        <div className="report-title" style={{marginBottom:0}}>Pending Recommendations</div>
        <button className="btn" style={{fontSize:10,padding:'3px 8px'}} onClick={load}>↻ Refresh</button>
      </div>

      {error && (
        <div style={{padding:10,background:'#fef2f2',borderRadius:6,color:'#dc2626',fontSize:11,marginBottom:8}}>
          Error loading recommendations: {error}
        </div>
      )}

      {rows === null && !error && (
        <div style={{fontSize:11,color:'var(--text-muted)',textAlign:'center',padding:16}}>Loading…</div>
      )}

      {rows !== null && rows.length === 0 && (
        <div style={{fontSize:11,color:'var(--text-muted)',textAlign:'center',padding:16}}>
          No pending recommendations. Run the optimizer to generate new ones.
        </div>
      )}

      {rows !== null && rows.length > 0 && rows.map(row => {
        const done   = row._result === 'applied' || row._result === 'rejected';
        const colors = OP_COLORS[row.operation] || {bg:'var(--gray-light)',label:'#374151'};
        const icon   = OP_ICONS[row.operation] || '❓';
        const busy   = acting[row.action_id];
        return (
          <div key={row.action_id} style={{
            background: done ? '#f8fafc' : colors.bg,
            border:'1px solid var(--border)',
            borderRadius:6, padding:'10px 12px', marginBottom:8,
            opacity: done ? 0.65 : 1
          }}>
            <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:4}}>
              <span style={{fontSize:13}}>{icon}</span>
              <span style={{fontSize:11,fontWeight:700,color:colors.label,textTransform:'uppercase',letterSpacing:'0.5px'}}>
                {row.operation.replace(/_/g,' ')}
              </span>
              <span style={{fontSize:12,fontWeight:600,color:'var(--text)',marginLeft:4}}>
                "{row.entity_name}"
              </span>
              {row._result && (
                <span style={{marginLeft:'auto',fontSize:10,fontWeight:700,
                  color: row._result==='applied' ? '#16a34a' : '#dc2626'}}>
                  {row._result === 'applied' ? '✅ Applied' : '❌ Rejected'}
                </span>
              )}
            </div>

            <div style={{fontSize:10,color:'var(--text-muted)',marginBottom:3}}>
              <strong>Reason:</strong> {row.reason}
            </div>

            <div style={{fontSize:10,color:'var(--text-muted)',marginBottom:6}}>
              <strong>Change:</strong> {fmtState(row.after_state_json || row.before_state_json, row.operation)}
              &nbsp;&nbsp;
              <strong>Requested:</strong> {new Date(row.created_at).toLocaleString()}
            </div>

            {!done && (
              <div style={{display:'flex',gap:6}}>
                <button
                  className="btn btn-teal"
                  style={{fontSize:10,padding:'3px 12px'}}
                  onClick={()=>handleApply(row.action_id)}
                  disabled={!!busy}
                  title="Apply this recommendation to Google Ads"
                >
                  {busy==='apply' ? '…' : '✅ Apply'}
                </button>
                <button
                  className="btn"
                  style={{fontSize:10,padding:'3px 12px',background:'#fef2f2',color:'#dc2626'}}
                  onClick={()=>handleReject(row.action_id)}
                  disabled={!!busy}
                >
                  {busy==='reject' ? '…' : '❌ Reject'}
                </button>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

function InboxTab({ onOpenLead }) {

  useEffect(() => {
    loadInbox();
    const t = setInterval(loadInbox, 15000);
    return () => clearInterval(t);
  }, []);

  async function loadInbox() {
    try {
      const d = await api('/api/admin/inbox/unread');
      setData(d);
    } catch(e) { console.error('inbox load error', e); }
    finally { setLoading(false); }
  }

  async function markRead(leadId) {
    // Unmatched conversations have no lead record — skip the API call and just refresh
    if ((leadId || '').startsWith('unmatched-')) {
      loadInbox();
      return;
    }
    await api('/api/admin/lead/' + leadId + '/mark-read', { method: 'POST' });
    loadInbox();
    // Notify the App bell so the badge count refreshes immediately
    try { window.dispatchEvent(new CustomEvent('inbox-unread-changed')); } catch(_) {}
  }

  if (loading) return <div style={{padding:20,color:'var(--text-muted)',fontSize:12}}>Loading…</div>;

  return (
    <div style={{maxWidth:700}}>
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12}}>

          <span style={{background:'var(--red)',color:'#fff',borderRadius:10,padding:'1px 7px',fontSize:11,fontWeight:700}}>

        <div style={{background:'#fff',border:'1px solid var(--border)',borderRadius:8,padding:'24px',textAlign:'center',color:'var(--text-muted)',fontSize:12}}>
          ✓ All caught up — no unread messages

      ) : (
        data.leads.map(l => {
          const name = [l.first_name, l.last_name].filter(Boolean).join(' ') || l.email || l.phone || 'Unknown';
          // Normalize field names: SMS uses last_received_at/last_body, email uses latest_at/latest_body
          const ago = timeAgo(l.last_received_at || l.latest_at);
          const preview = l.last_body || l.latest_body || '';
          const isUnmatched = (l.lead_id || '').startsWith('unmatched-');
          const channelBadge = l.channel === 'email' ? '✉' : l.channel === 'both' ? '✉💬' : '💬';
          return (
            <div key={l.lead_id} style={{background:'#fff',border:'1px solid var(--border)',borderRadius:8,
              padding:'10px 14px',marginBottom:6,display:'flex',gap:10,alignItems:'flex-start'}}>

                <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:3}}>

                  <span style={{background:'var(--red)',color:'#fff',borderRadius:8,padding:'0 5px',fontSize:9,fontWeight:700}}>

                  <span style={{fontSize:9,color:'var(--teal)'}}>{channelBadge}</span>
                  <span style={{fontSize:9,color:'var(--text-muted)'}}>{ago}</span>
                </div>
                <div style={{fontSize:11,color:'var(--text)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:420}}>

                {isUnmatched && <div style={{fontSize:9,color:'var(--text-muted)',marginTop:1}}>⚠ No matching lead</div>}
              </div>
              <div style={{display:'flex',gap:4,flexShrink:0}}>

// Helper: summarise after_state_json as a human-readable change string
function fmtRecChange(json_str, op) {
  if (!json_str) return '';
  try {
    const obj = JSON.parse(json_str);
    if (op === 'pause_keyword')        return 'enabled → paused';
    if (op === 'increase_bid' || op === 'decrease_bid') {
      const before = obj.current_bid_micros ? `$${(obj.current_bid_micros/1e6).toFixed(2)}` : '—';
      const after  = obj.new_bid_micros     ? `$${(obj.new_bid_micros/1e6).toFixed(2)}`     : '—';
      return op === 'increase_bid' ? `${before} → ${after} ⬆` : `${before} → ${after} ⬇`;
    }
    if (op === 'add_exact_keyword')             return `[exact] "${obj.keyword_text}"`;
    if (op === 'add_negative_keyword')          return `[neg/${obj.match_type||'phrase'}] "${obj.keyword_text}"`;
    if (op === 'add_to_shared_negative_list')   return `[account-wide/${obj.match_type||'broad'}] "${obj.keyword_text}"`;
    if (op === 'change_bid_strategy')  return obj.target_strategy || JSON.stringify(obj).slice(0,60);
    if (op === 'change_match_type')    return obj.new_match_type  || JSON.stringify(obj).slice(0,60);
    return JSON.stringify(obj).slice(0,80);
  } catch { return (json_str||'').slice(0,80); }
}

// A single collapsible section (Account Level or one campaign)
function OptimizerSection({ title, recs, loading, onApprove, onIgnore, busy, open, onToggle }) {
  const [selected, setSelected] = React.useState({});
  const [bulkBusy, setBulkBusy] = React.useState(false);

  // Strip stale selections whenever recs change
  React.useEffect(() => {
    setSelected(prev => {
      const ids = new Set(recs.map(r => r.action_id));
      const next = {};
      Object.keys(prev).forEach(k => { if (ids.has(k)) next[k] = true; });
      return next;
    });
  }, [recs]);

  const selectedIds = Object.keys(selected).filter(k => selected[k]);
  const allChecked = recs.length > 0 && selectedIds.length === recs.length;
  const someChecked = selectedIds.length > 0 && selectedIds.length < recs.length;

  const toggle = (id) => setSelected(p => ({...p, [id]: !p[id]}));
  const toggleAll = () => {
    if (allChecked) setSelected({});
    else { const n = {}; recs.forEach(r => { n[r.action_id] = true; }); setSelected(n); }
  };

  const handleBulkApprove = async () => {
    if (!selectedIds.length) return;
    setBulkBusy(true);
    const failed = [];
    for (const id of selectedIds) {
      try { await onApprove(id); }
      catch(e) { failed.push(id); }
    }
    setSelected({});
    setBulkBusy(false);
    if (failed.length) alert(`${failed.length} item(s) failed to approve.`);
  };

  const handleBulkIgnore = async () => {
    if (!selectedIds.length) return;
    setBulkBusy(true);
    const failed = [];
    for (const id of selectedIds) {
      try { await onIgnore(id); }
      catch(e) { failed.push(id); }
    }
    setSelected({});
    setBulkBusy(false);
    if (failed.length) alert(`${failed.length} item(s) failed to ignore.`);
  };

  const pendingCount = recs.length;

  return (
    <div style={{border:'1px solid var(--border)',borderRadius:8,marginBottom:10,overflow:'hidden'}}>
      {/* Section header — always visible */}
      <button onClick={() => onToggle(title)}
        style={{width:'100%',display:'flex',alignItems:'center',gap:8,padding:'10px 14px',
          background: open ? '#f8fafc' : '#fff',border:'none',cursor:'pointer',textAlign:'left',
          borderBottom: open ? '1px solid var(--border)' : 'none'}}>
        <span style={{fontSize:13,transition:'transform .2s',display:'inline-block',
          transform: open ? 'rotate(90deg)' : 'rotate(0deg)',color:'var(--text-muted)'}}>▶</span>
        <span style={{fontWeight:700,fontSize:13,color:'var(--text)',flex:1}}>{title}</span>
        {pendingCount > 0 && (
          <span style={{background:'var(--teal)',color:'#fff',borderRadius:10,
            padding:'1px 8px',fontSize:11,fontWeight:700,flexShrink:0}}>
            {pendingCount}
          </span>
        )}
        {pendingCount === 0 && (
          <span style={{background:'#e2e8f0',color:'#64748b',borderRadius:10,
            padding:'1px 8px',fontSize:11,fontWeight:600,flexShrink:0}}>0</span>
        )}
      </button>

      {open && (
        <div style={{padding:'10px 14px'}}>
          {loading && <div style={{color:'var(--text-muted)',fontSize:12,padding:'8px 0'}}>Loading...</div>}

          {!loading && pendingCount === 0 && (
            <div style={{color:'var(--text-muted)',fontSize:12,textAlign:'center',padding:'12px 0',fontStyle:'italic'}}>
              No pending recommendations — looks good! ✓
            </div>
          )}

          {!loading && pendingCount > 0 && (
            <>
              {/* Bulk action bar */}
              <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:8,
                padding:'6px 10px',background:'#f8fafc',borderRadius:6,border:'1px solid var(--border)'}}>
                <label style={{display:'flex',alignItems:'center',gap:5,cursor:'pointer',fontSize:12}}>
                  <input type="checkbox"
                    checked={allChecked}
                    ref={el => { if (el) el.indeterminate = someChecked; }}
                    onChange={toggleAll}
                    style={{cursor:'pointer'}} />
                  <span style={{color:'var(--text-muted)',fontWeight:500}}>
                    {selectedIds.length > 0 ? `${selectedIds.length} selected` : 'Select all'}
                  </span>
                </label>
                {selectedIds.length > 0 && (
                  <>
                    <button onClick={handleBulkApprove} disabled={bulkBusy}
                      style={{padding:'3px 12px',fontSize:11,borderRadius:5,cursor:'pointer',
                        background:'var(--teal)',color:'#fff',border:'none',fontWeight:600}}>
                      {bulkBusy ? '⏳' : `✓ Approve ${selectedIds.length}`}
                    </button>
                    <button onClick={handleBulkIgnore} disabled={bulkBusy}
                      style={{padding:'3px 12px',fontSize:11,borderRadius:5,cursor:'pointer',
                        background:'#fee2e2',color:'#dc2626',border:'none',fontWeight:600}}>
                      {bulkBusy ? '⏳' : `✕ Ignore ${selectedIds.length}`}
                    </button>
                  </>
                )}
              </div>

              {/* Rec rows */}
              {recs.map(rec => {
                const opMeta = AI_OP_LABELS[rec.operation] || {label:rec.operation, color:'#64748b', icon:'•'};
                const isBusy = busy[rec.action_id];
                const change = fmtRecChange(rec.after_state_json || rec.before_state_json, rec.operation);
                return (
                  <div key={rec.action_id}
                    style={{display:'flex',alignItems:'flex-start',gap:8,padding:'8px 10px',
                      marginBottom:6,borderRadius:6,border:'1px solid var(--border)',
                      background: selected[rec.action_id] ? 'rgba(13,122,127,.04)' : '#fff',
                      borderColor: selected[rec.action_id] ? 'var(--teal)' : 'var(--border)'}}>
                    <input type="checkbox"
                      checked={!!selected[rec.action_id]}
                      onChange={() => toggle(rec.action_id)}
                      style={{marginTop:3,cursor:'pointer',flexShrink:0}} />
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap',marginBottom:3}}>
                        <span style={{fontSize:10,padding:'1px 6px',borderRadius:10,
                          background:opMeta.color+'22',color:opMeta.color,fontWeight:700}}>
                          {opMeta.icon} {opMeta.label}
                        </span>
                        <span style={{fontWeight:700,fontSize:12,color:'var(--text)'}}>{rec.entity_name}</span>
                      </div>
                      <div style={{fontSize:11,color:'var(--text-muted)',marginBottom:2,lineHeight:1.4}}>
                        {rec.reason}
                      </div>
                      {change && (
                        <div style={{fontSize:10,color:'#475569',fontFamily:'monospace',
                          background:'#f1f5f9',borderRadius:3,padding:'1px 5px',display:'inline-block'}}>
                          {change}
                        </div>
                      )}
                    </div>
                    <div style={{display:'flex',gap:4,flexShrink:0}}>
                      <button onClick={() => onApprove(rec.action_id)} disabled={!!isBusy}
                        style={{padding:'3px 10px',fontSize:11,borderRadius:4,cursor:'pointer',
                          background:'var(--teal)',color:'#fff',border:'none',fontWeight:600}}>
                        {isBusy === 'approve' ? '⏳' : '✓'}
                      </button>
                      <button onClick={() => onIgnore(rec.action_id)} disabled={!!isBusy}
                        style={{padding:'3px 10px',fontSize:11,borderRadius:4,cursor:'pointer',
                          background:'#fee2e2',color:'#dc2626',border:'none',fontWeight:600}}>
                        {isBusy === 'ignore' ? '⏳' : '✕'}
                      </button>
                    </div>
                  </div>
                );
              })}
            </>
          )}
        </div>
      )}
    </div>
  );
}

function AiOptimizerTab() {
  const [running, setRunning] = React.useState(false);
  const [lastRun, setLastRun] = React.useState('');
  const [recs, setRecs] = React.useState(null);
  const [queued, setQueued] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [pushBusy, setPushBusy] = React.useState(false);
  const [pushResult, setPushResult] = React.useState(null);
  const [runMsg, setRunMsg] = React.useState('');
  const [busy, setBusy] = React.useState({});
  const [innerTab, setInnerTab] = React.useState('recommendations');
  const [autoExpanded, setAutoExpanded] = React.useState(false);
  const [expandedSections, setExpandedSections] = React.useState({});
  const [impactHistory, setImpactHistory] = React.useState([]);
  const [impactLoading, setImpactLoading] = React.useState(false);

  const loadLastRun = React.useCallback(async () => {
    try {
      const d = await api('/api/admin/optimizer/dashboard-summary');
      if (d.last_run_at) setLastRun(d.last_run_at);
    } catch(_) {}
  }, []);

  const loadRecs = React.useCallback(async () => {
    setLoading(true);
    try {
      const d = await api('/api/admin/optimizer/account/recommendations?status=all&limit=500');
      setRecs(d);
    } catch(e) { console.error('Recs load error', e); }
    finally { setLoading(false); }
  }, []);

  const loadQueued = React.useCallback(async () => {
    try {
      const d = await api('/api/admin/gads/queued');
      setQueued(d.queued || []);
    } catch(e) { console.error('Queued load error', e); }
  }, []);

  const loadImpactHistory = React.useCallback(async () => {
    setImpactLoading(true);
    try {
      const d = await api('/api/admin/optimizer/impact-history?limit=30');
      setImpactHistory(d.impact_history || []);
    } catch(e) { console.error('Impact history load error', e); }
    finally { setImpactLoading(false); }
  }, []);

  React.useEffect(() => {
    loadLastRun();
    loadRecs();
    loadQueued();
  }, [loadLastRun, loadRecs, loadQueued]);

  // Load impact history when switching to Impact tab
  React.useEffect(() => {
    if (innerTab === 'impact' && impactHistory.length === 0) {
      loadImpactHistory();
    }
  }, [innerTab, impactHistory.length, loadImpactHistory]);

  // Auto-expand first non-empty section after a fresh run
  React.useEffect(() => {
    if (!autoExpanded && recs && !loading) {
      const allR = Object.values(recs.recommendations || {}).flat();
      const pending = allR.filter(r => r.execution_result === 'pending_approval');
      if (pending.length > 0) {
        const acct = pending.filter(r => !r.campaign_name);
        if (acct.length > 0) {
          setExpandedSections(p => ({...p, '__account__': true}));
        } else {
          const firstCamp = pending[0].campaign_name;
          if (firstCamp) setExpandedSections(p => ({...p, [firstCamp]: true}));
        }
        setAutoExpanded(true);
      }
    }
  }, [recs, loading, autoExpanded]);

  const timeAgoStr = (iso) => {
    if (!iso) return 'never';
    const diff = Date.now() - new Date(iso).getTime();
    const mins = Math.floor(diff / 60000);
    if (mins < 2) return 'just now';
    if (mins < 60) return `${mins}m ago`;
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return `${hrs}h ago`;
    return `${Math.floor(hrs/24)}d ago`;
  };

  const handleRunOptimizer = async () => {
    setRunning(true); setRunMsg('Running optimizer...');
    setAutoExpanded(false); // allow re-expansion after new run
    try {
      await api('/api/admin/optimize', {method:'POST'});
      setRunMsg('Optimizer running — polling for results...');
      let attempts = 0;
      const poll = setInterval(async () => {
        attempts++;
        if (attempts >= 12) {
          clearInterval(poll);
          setRunMsg('Done ✓');
          setRunning(false);
          await loadRecs();
          await loadQueued();
          await loadLastRun();
        }
      }, 3000);
    } catch(e) {
      setRunMsg('Error: ' + (e.message || 'Optimizer failed'));
      setRunning(false);
    }
  };

  const handleApprove = async (actionId) => {
    setBusy(p => ({...p, [actionId]: 'approve'}));
    try {
      await api(`/api/admin/gads/approve/${actionId}`, {method:'POST'});
      await loadRecs();
      await loadQueued();
    } catch(e) { alert('Approve failed: ' + (e.message || e)); }
    finally { setBusy(p => { const n={...p}; delete n[actionId]; return n; }); }
  };

  const handleIgnore = async (actionId) => {
    setBusy(p => ({...p, [actionId]: 'ignore'}));
    try {
      await api(`/api/admin/gads/reject/${actionId}`, {method:'POST', body:JSON.stringify({reason:''})});
      await loadRecs();
    } catch(e) { alert('Ignore failed: ' + (e.message || e)); }
    finally { setBusy(p => { const n={...p}; delete n[actionId]; return n; }); }
  };

  const handlePushToGoogle = async () => {
    if (!confirm(`Push ${queued.length} change${queued.length !== 1 ? 's' : ''} to Google Ads? This cannot be undone.`)) return;
    setPushBusy(true); setPushResult(null);
    try {
      const r = await api('/api/admin/gads/push-queued', {method:'POST'});
      setPushResult(r);
      await loadQueued();
      await loadRecs();
    } catch(e) { setPushResult({error: e.message || 'Push failed'}); }
    finally { setPushBusy(false); }
  };

  // Partition recs
  const allRecs = recs ? Object.values(recs.recommendations || {}).flat() : [];
  const pendingRecs = allRecs.filter(r => r.execution_result === 'pending_approval');
  const historyRecs = allRecs.filter(r => r.execution_result !== 'pending_approval' && r.execution_result !== 'queued');

  const accountPending = pendingRecs.filter(r => !r.campaign_name);
  // Use ALL recs (not just pending) to determine campaign sections — so sections don't vanish after ignoring
  const campaignNames = [...new Set(allRecs.filter(r => r.campaign_name).map(r => r.campaign_name))].sort();

  const handleToggleSection = React.useCallback((key) => {
    setExpandedSections(p => ({...p, [key]: !p[key]}));
  }, []);

  const totalPending = pendingRecs.length;
  const totalHistory = historyRecs.length;

  return (
    <div style={{padding:'16px 20px',maxWidth:960,margin:'0 auto'}}>
      {/* Header */}
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:16}}>
        <div>
          <div style={{fontSize:18,fontWeight:700,color:'var(--text)'}}>🤖 AI Optimizer</div>
          {lastRun && (
            <div style={{fontSize:11,color:'var(--text-muted)'}}>Last run: {timeAgoStr(lastRun)}</div>
          )}
        </div>
        <div style={{marginLeft:'auto',display:'flex',gap:8,alignItems:'center'}}>
          {runMsg && <span style={{fontSize:11,color:'var(--text-muted)'}}>{runMsg}</span>}
          <button onClick={handleRunOptimizer} disabled={running}
            style={{padding:'8px 18px',borderRadius:6,cursor:running?'not-allowed':'pointer',
              background:running?'#a3e635':'#16a34a',color:'#fff',border:'none',fontWeight:700,fontSize:13}}>
            {running ? '⏳ Running...' : '▶ Run AI Optimizer'}
          </button>
        </div>
      </div>

      {/* Inner tab bar */}
      <div style={{display:'flex',borderBottom:'2px solid var(--border)',marginBottom:16}}>
        {[
          {k:'recommendations', l:'Recommendations', count: totalPending, showCount: true},
          {k:'history',         l:'History',         count: totalHistory, showCount: true},
          {k:'impact',          l:'📈 Impact',        count: impactHistory.length, showCount: false},
        ].map(t => (
          <button key={t.k} onClick={() => setInnerTab(t.k)}
            style={{padding:'7px 18px',fontSize:13,fontWeight:600,cursor:'pointer',background:'none',border:'none',
              borderBottom: innerTab===t.k ? '2px solid var(--teal)' : '2px solid transparent',
              color: innerTab===t.k ? 'var(--teal)' : 'var(--text-muted)',
              marginBottom:-2,display:'flex',alignItems:'center',gap:6}}>
            {t.l}
            {t.showCount && (
              <span style={{
                background: innerTab===t.k ? 'var(--teal)' : '#e2e8f0',
                color: innerTab===t.k ? '#fff' : '#64748b',
                borderRadius:10,padding:'0 7px',fontSize:11,fontWeight:700}}>
                {t.count}
              </span>
            )}
          </button>
        ))}
      </div>

      {/* ── RECOMMENDATIONS TAB ── */}
      {innerTab === 'recommendations' && (
        <div>
          {loading && <div style={{color:'var(--text-muted)',fontSize:12,padding:'16px 0'}}>Loading recommendations...</div>}

          {!loading && totalPending === 0 && (
            <div style={{textAlign:'center',padding:'32px 0',color:'var(--text-muted)',fontSize:13}}>
              <div style={{fontSize:24,marginBottom:8}}>✅</div>
              No pending recommendations. Run the AI Optimizer to generate new ones.
            </div>
          )}

          {!loading && totalPending > 0 && (() => {
            // Compute batch impact banner from pending recs' impact_estimate fields
            let batchWaste = 0, batchLift = 0, batchBid = 0, batchCoverage = 0;
            pendingRecs.forEach(r => {
              try {
                const ie = typeof r.impact_estimate === 'object' ? r.impact_estimate
                  : JSON.parse(r.impact_estimate_json || '{}');
                const usd = parseFloat(ie.savings_usd || ie.savings_30d_usd || 0);
                const t = ie.impact_type || '';
                if (t === 'waste_reduction') batchWaste += usd;
                else if (t === 'conversion_lift') batchLift += usd;
                else if (t === 'bid_efficiency') batchBid += usd;
                else if (t === 'coverage_gain') batchCoverage += usd;
                else batchWaste += usd; // default to waste
              } catch(_) {}
            });
            const totalBatchImpact = batchWaste + batchLift + batchBid + batchCoverage;
            return (
              <>
                {/* Batch impact banner */}
                {totalBatchImpact > 0 && (
                  <div style={{background:'linear-gradient(135deg,#fff7ed,#fff)',
                    border:'1px solid #fed7aa',borderRadius:10,padding:'12px 16px',
                    marginBottom:14,display:'flex',alignItems:'center',gap:16,flexWrap:'wrap'}}>
                    <div style={{fontSize:13,fontWeight:700,color:'#9a3412'}}>
                      💰 This batch could save ~<strong>${Math.round(totalBatchImpact).toLocaleString()}/mo</strong>
                    </div>
                    <div style={{display:'flex',gap:8,flexWrap:'wrap',marginLeft:'auto'}}>
                      {batchWaste > 0 && (
                        <span style={{fontSize:10,background:'#fee2e2',color:'#dc2626',
                          borderRadius:8,padding:'2px 8px',fontWeight:700}}>
                          🗑️ ${Math.round(batchWaste).toLocaleString()} waste
                        </span>
                      )}
                      {batchLift > 0 && (
                        <span style={{fontSize:10,background:'#dcfce7',color:'#15803d',
                          borderRadius:8,padding:'2px 8px',fontWeight:700}}>
                          📈 ${Math.round(batchLift).toLocaleString()} conv. lift
                        </span>
                      )}
                      {batchBid > 0 && (
                        <span style={{fontSize:10,background:'#eff6ff',color:'#1d4ed8',
                          borderRadius:8,padding:'2px 8px',fontWeight:700}}>
                          💡 ${Math.round(batchBid).toLocaleString()} bid eff.
                        </span>
                      )}
                      {batchCoverage > 0 && (
                        <span style={{fontSize:10,background:'#f5f3ff',color:'#7c3aed',
                          borderRadius:8,padding:'2px 8px',fontWeight:700}}>
                          🎯 ${Math.round(batchCoverage).toLocaleString()} coverage
                        </span>
                      )}
                    </div>
                    <div style={{fontSize:9,color:'#c2410c',width:'100%',marginTop:2}}>
                      Estimates based on Claude's analysis of your campaign data · See Impact tab for full history
                    </div>
                  </div>
                )}

              {/* Account Level section */}
              <OptimizerSection
                key="__account__"
                title="Account Level"
                recs={accountPending}
                loading={loading}
                onApprove={handleApprove}
                onIgnore={handleIgnore}
                busy={busy}
                open={expandedSections['__account__'] || false}
                onToggle={() => handleToggleSection('__account__')}
              />

              {/* Per-campaign sections */}
              {campaignNames.map(name => (
                <OptimizerSection
                  key={name}
                  title={name}
                  recs={pendingRecs.filter(r => r.campaign_name === name)}
                  loading={loading}
                  onApprove={handleApprove}
                  onIgnore={handleIgnore}
                  busy={busy}
                  open={expandedSections[name] || false}
                  onToggle={() => handleToggleSection(name)}
                />
              ))}
            </>
          );
          })()}

          {/* Queue panel */}
          {queued.length > 0 && (
            <div style={{background:'#f0fdf4',border:'1px solid #86efac',borderRadius:8,
              padding:'14px 16px',marginTop:16}}>
              <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}>
                <span style={{fontWeight:700,fontSize:13,color:'#15803d'}}>🚀 Approved — Ready to Push</span>
                <span style={{background:'#16a34a',color:'#fff',borderRadius:10,
                  padding:'1px 7px',fontSize:10,fontWeight:700}}>
                  {queued.length}
                </span>
                <button onClick={handlePushToGoogle} disabled={pushBusy}
                  style={{marginLeft:'auto',padding:'6px 16px',borderRadius:6,
                    cursor:pushBusy?'not-allowed':'pointer',
                    background:pushBusy?'#a3e635':'#15803d',color:'#fff',border:'none',
                    fontWeight:700,fontSize:12}}>
                  {pushBusy ? '⏳ Pushing...' : '🚀 Push All to Google Ads'}
                </button>
              </div>
              {queued.map(q => {
                const op = AI_OP_LABELS[q.operation] || {label:q.operation, color:'#64748b', icon:'•'};
                return (
                  <div key={q.action_id} style={{padding:'7px 10px',marginBottom:5,borderRadius:6,
                    border:'1px solid #bbf7d0',background:'#fff',fontSize:11,
                    display:'flex',alignItems:'center',gap:8}}>
                    <span>{op.icon}</span>
                    <span style={{fontWeight:600}}>{q.entity_name}</span>
                    <span style={{color:'#64748b'}}>{op.label}</span>
                    {q.campaign_name && (
                      <span style={{marginLeft:'auto',fontSize:10,background:'#f0fdf4',
                        color:'#15803d',padding:'1px 6px',borderRadius:8,fontWeight:600}}>
                        {q.campaign_name}
                      </span>
                    )}
                  </div>
                );
              })}
              {pushResult && (
                <div style={{marginTop:8,fontSize:11,padding:'8px 12px',borderRadius:6,
                  background: pushResult.error ? '#fee2e2' : '#dcfce7',
                  color: pushResult.error ? '#dc2626' : '#15803d'}}>
                  {pushResult.error
                    ? `Error: ${pushResult.error}`
                    : `✓ ${pushResult.summary?.pushed_to_google||0} pushed to Google, ${pushResult.summary?.acknowledged_only||0} acknowledged, ${pushResult.summary?.error||0} errors`}
                </div>
              )}
            </div>
          )}
        </div>
      )}

      {/* ── IMPACT TAB ── */}
      {innerTab === 'impact' && (
        <div>
          {impactLoading && (
            <div style={{color:'var(--text-muted)',fontSize:12,padding:'16px 0'}}>Loading impact data...</div>
          )}
          {!impactLoading && impactHistory.length === 0 && (
            <div style={{textAlign:'center',padding:'32px 0',color:'var(--text-muted)',fontSize:13}}>
              <div style={{fontSize:24,marginBottom:8}}>📊</div>
              No impact data yet. Run the optimizer to start tracking impact.
            </div>
          )}
          {!impactLoading && impactHistory.length > 0 && (() => {
            // Compute totals from history
            const totalWasteSaved = impactHistory.reduce((s, r) => s + (r.estimated_waste_saved_usd || 0), 0);
            const latestCumSavings = impactHistory[0]?.cum_estimated_savings || 0;
            const totalApproved = impactHistory.reduce((s, r) => s + (r.approved_recs || 0), 0);
            const totalRecs = impactHistory.reduce((s, r) => s + (r.total_recs || 0), 0);
            const approvalRate = totalRecs > 0 ? Math.round(totalApproved / totalRecs * 100) : 0;

            // Aggregate impact_by_type across all runs
            const byType = {};
            impactHistory.forEach(r => {
              const ibt = r.impact_by_type || {};
              Object.entries(ibt).forEach(([k, v]) => {
                byType[k] = (byType[k] || 0) + v;
              });
            });

            // Collect all benchmark gaps (latest run has freshest gaps)
            const latestGaps = impactHistory[0]?.benchmark_gaps || {};

            const typeLabels = {
              waste_reduction: {label:'Waste Reduction', color:'#dc2626', icon:'🗑️'},
              conversion_lift: {label:'Conversion Lift', color:'#16a34a', icon:'📈'},
              bid_efficiency:  {label:'Bid Efficiency',  color:'#2563eb', icon:'💡'},
              coverage_gain:   {label:'Coverage Gain',   color:'#7c3aed', icon:'🎯'},
              data_quality:    {label:'Data Quality',    color:'#d97706', icon:'🔍'},
            };

            return (
              <div>
                {/* Summary cards */}
                <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12,marginBottom:20}}>
                  {/* Estimated Waste Saved */}
                  <div style={{background:'#fff7ed',border:'1px solid #fed7aa',borderRadius:10,padding:'14px 16px'}}>
                    <div style={{fontSize:11,fontWeight:700,color:'#c2410c',textTransform:'uppercase',letterSpacing:'0.04em',marginBottom:4}}>
                      💰 Est. Waste Recoverable
                    </div>
                    <div style={{fontSize:26,fontWeight:800,color:'#9a3412'}}>
                      ${totalWasteSaved.toLocaleString('en-US',{maximumFractionDigits:0})}<span style={{fontSize:13,fontWeight:500,color:'#c2410c'}}>/mo</span>
                    </div>
                    <div style={{fontSize:10,color:'#c2410c',marginTop:2}}>
                      Sum of all waste-reduction recs this period
                    </div>
                  </div>

                  {/* Cumulative Approved Savings */}
                  <div style={{background:'#f0fdf4',border:'1px solid #86efac',borderRadius:10,padding:'14px 16px'}}>
                    <div style={{fontSize:11,fontWeight:700,color:'#15803d',textTransform:'uppercase',letterSpacing:'0.04em',marginBottom:4}}>
                      ✅ Cumulative Approved Savings
                    </div>
                    <div style={{fontSize:26,fontWeight:800,color:'#14532d'}}>
                      ${latestCumSavings.toLocaleString('en-US',{maximumFractionDigits:0})}
                    </div>
                    <div style={{fontSize:10,color:'#15803d',marginTop:2}}>
                      From approved recs across {impactHistory.length} optimizer runs
                    </div>
                  </div>

                  {/* Approval Rate */}
                  <div style={{background:'#eff6ff',border:'1px solid #bfdbfe',borderRadius:10,padding:'14px 16px'}}>
                    <div style={{fontSize:11,fontWeight:700,color:'#1d4ed8',textTransform:'uppercase',letterSpacing:'0.04em',marginBottom:4}}>
                      👍 Approval Rate
                    </div>
                    <div style={{fontSize:26,fontWeight:800,color:'#1e3a8a'}}>
                      {approvalRate}%
                    </div>
                    <div style={{fontSize:10,color:'#1d4ed8',marginTop:2}}>
                      {totalApproved} approved of {totalRecs} recs across all runs
                    </div>
                  </div>
                </div>

                {/* Impact by type breakdown */}
                {Object.keys(byType).length > 0 && (
                  <div style={{background:'var(--bg-card)',border:'1px solid var(--border)',borderRadius:10,padding:'14px 16px',marginBottom:16}}>
                    <div style={{fontSize:12,fontWeight:700,color:'var(--text)',marginBottom:10}}>
                      Impact Breakdown by Type
                    </div>
                    <div style={{display:'flex',flexWrap:'wrap',gap:10}}>
                      {Object.entries(byType).sort((a,b)=>b[1]-a[1]).map(([type, usd]) => {
                        const meta = typeLabels[type] || {label:type, color:'#64748b', icon:'•'};
                        return (
                          <div key={type} style={{background:meta.color+'11',border:'1px solid '+meta.color+'33',
                            borderRadius:8,padding:'8px 14px',minWidth:140}}>
                            <div style={{fontSize:10,fontWeight:700,color:meta.color,marginBottom:3}}>
                              {meta.icon} {meta.label}
                            </div>
                            <div style={{fontSize:18,fontWeight:800,color:meta.color}}>
                              ${usd.toLocaleString('en-US',{maximumFractionDigits:0})}
                              <span style={{fontSize:10,fontWeight:500}}>/mo est.</span>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}

                {/* Benchmark Gap Analysis */}
                {Object.keys(latestGaps).length > 0 && (
                  <div style={{background:'var(--bg-card)',border:'1px solid var(--border)',borderRadius:10,padding:'14px 16px',marginBottom:16}}>
                    <div style={{fontSize:12,fontWeight:700,color:'var(--text)',marginBottom:10}}>
                      📏 Benchmark Gaps (vs Excellence Report targets)
                    </div>
                    {Object.entries(latestGaps).map(([metric, gap]) => {
                      const pct = gap.current && gap.target
                        ? Math.round(Math.abs((gap.current - gap.target) / gap.target) * 100)
                        : 0;
                      const isBehind = gap.current < gap.target;
                      const metricLabels = {
                        cpl: {label:'Cost Per Lead', good: 'below', unit:'$', fmt: v => '$'+Number(v).toFixed(0)},
                        roas: {label:'ROAS', good: 'above', unit:'x', fmt: v => Number(v).toFixed(1)+'x'},
                        ctr: {label:'Click-Through Rate', good: 'above', unit:'%', fmt: v => Number(v).toFixed(1)+'%'},
                      };
                      const m = metricLabels[metric] || {label: metric, good:'above', unit:'', fmt: v => v};
                      return (
                        <div key={metric} style={{display:'flex',alignItems:'center',gap:12,
                          padding:'8px 0',borderBottom:'1px solid var(--border)',fontSize:12}}>
                          <div style={{minWidth:120,fontWeight:600,color:'var(--text)'}}>{m.label}</div>
                          <div style={{display:'flex',alignItems:'center',gap:6}}>
                            <span style={{fontWeight:700,color: isBehind?'#dc2626':'#16a34a'}}>
                              {m.fmt(gap.current)}
                            </span>
                            <span style={{color:'var(--text-muted)'}}>→ target</span>
                            <span style={{fontWeight:600,color:'var(--text-muted)'}}>{m.fmt(gap.target)}</span>
                          </div>
                          <div style={{marginLeft:'auto',fontSize:10,padding:'2px 8px',borderRadius:8,
                            background: isBehind ? '#fee2e2' : '#dcfce7',
                            color: isBehind ? '#dc2626' : '#15803d',fontWeight:700}}>
                            {isBehind ? '▼' : '▲'} {pct}% {isBehind ? 'below' : 'above'} target
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}

                {/* Per-run history table */}
                <div style={{background:'var(--bg-card)',border:'1px solid var(--border)',borderRadius:10,padding:'14px 16px'}}>
                  <div style={{fontSize:12,fontWeight:700,color:'var(--text)',marginBottom:10}}>
                    Run-by-Run Impact History
                  </div>
                  <div style={{overflowX:'auto'}}>
                    <table style={{width:'100%',borderCollapse:'collapse',fontSize:11}}>
                      <thead>
                        <tr style={{borderBottom:'1px solid var(--border)'}}>
                          {['Date','Recs','Approved','Est. Waste Saved','Impact Types','Cumulative Savings'].map(h => (
                            <th key={h} style={{textAlign:'left',padding:'5px 8px',
                              color:'var(--text-muted)',fontWeight:700,fontSize:10,
                              textTransform:'uppercase',letterSpacing:'0.04em',whiteSpace:'nowrap'}}>{h}</th>
                          ))}
                        </tr>
                      </thead>
                      <tbody>
                        {impactHistory.map((run, idx) => {
                          const ibt = run.impact_by_type || {};
                          const typeChips = Object.entries(ibt)
                            .filter(([,v]) => v > 0)
                            .sort((a,b)=>b[1]-a[1])
                            .slice(0, 3);
                          return (
                            <tr key={run.run_id || idx}
                              style={{borderBottom:'1px solid var(--border)',background: idx%2===0?'transparent':'#fafafa'}}>
                              <td style={{padding:'6px 8px',whiteSpace:'nowrap',fontWeight:600,color:'var(--text)'}}>
                                {run.run_date ? new Date(run.run_date).toLocaleDateString('en-US',{month:'short',day:'numeric'}) : '—'}
                              </td>
                              <td style={{padding:'6px 8px',textAlign:'center'}}>
                                <span style={{background:'#f1f5f9',borderRadius:8,padding:'1px 7px',fontWeight:700}}>
                                  {run.total_recs || 0}
                                </span>
                              </td>
                              <td style={{padding:'6px 8px',textAlign:'center'}}>
                                <span style={{background:'#dcfce7',color:'#15803d',borderRadius:8,padding:'1px 7px',fontWeight:700}}>
                                  {run.approved_recs || 0}
                                </span>
                              </td>
                              <td style={{padding:'6px 8px',fontWeight:700,
                                color: (run.estimated_waste_saved_usd||0) > 0 ? '#dc2626' : 'var(--text-muted)'}}>
                                {(run.estimated_waste_saved_usd||0) > 0
                                  ? `$${Number(run.estimated_waste_saved_usd).toLocaleString('en-US',{maximumFractionDigits:0})}/mo`
                                  : '—'}
                              </td>
                              <td style={{padding:'6px 8px'}}>
                                <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
                                  {typeChips.map(([type, usd]) => {
                                    const meta = typeLabels[type] || {label:type, color:'#64748b', icon:'•'};
                                    return (
                                      <span key={type} style={{fontSize:9,background:meta.color+'18',
                                        color:meta.color,borderRadius:6,padding:'1px 5px',fontWeight:700,whiteSpace:'nowrap'}}>
                                        {meta.icon} ${Number(usd).toLocaleString('en-US',{maximumFractionDigits:0})}
                                      </span>
                                    );
                                  })}
                                  {typeChips.length === 0 && <span style={{color:'var(--text-muted)'}}>—</span>}
                                </div>
                              </td>
                              <td style={{padding:'6px 8px',fontWeight:700,color:'#15803d',whiteSpace:'nowrap'}}>
                                ${Number(run.cum_estimated_savings||0).toLocaleString('en-US',{maximumFractionDigits:0})}
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                  <div style={{fontSize:10,color:'var(--text-muted)',marginTop:8,fontStyle:'italic'}}>
                    * Savings are estimates based on Claude's analysis. Actual impact tracked once recs are approved and executed.
                  </div>
                </div>
              </div>
            );
          })()}
        </div>
      )}

      {/* ── HISTORY TAB ── */}
      {innerTab === 'history' && (
        <div>
          {loading && <div style={{color:'var(--text-muted)',fontSize:12,padding:'16px 0'}}>Loading history...</div>}
          {!loading && historyRecs.length === 0 && (
            <div style={{textAlign:'center',padding:'32px 0',color:'var(--text-muted)',fontSize:13}}>
              No optimization history yet.
            </div>
          )}
          {!loading && historyRecs.length > 0 && historyRecs.map(rec => {
            const opMeta = AI_OP_LABELS[rec.operation] || {label:rec.operation, color:'#64748b', icon:'•'};
            const isSuccess = rec.execution_result === 'success';
            const isRejected = (rec.execution_result || '').startsWith('rejected');
            const change = fmtRecChange(rec.after_state_json || rec.before_state_json, rec.operation);
            const statusColor = isSuccess ? '#16a34a' : isRejected ? '#dc2626' : '#d97706';
            const statusBg    = isSuccess ? '#dcfce7' : isRejected ? '#fee2e2' : '#fef9c3';
            const statusLabel = isSuccess ? '✓ Applied' : isRejected ? '✕ Ignored' : rec.execution_result;
            return (
              <div key={rec.action_id} style={{display:'flex',alignItems:'flex-start',gap:8,
                padding:'8px 12px',marginBottom:5,borderRadius:6,
                border:'1px solid var(--border)',
                background: isRejected ? '#fafafa' : '#fff',
                opacity: isRejected ? 0.7 : 1}}>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap',marginBottom:2}}>
                    <span style={{fontSize:10,padding:'1px 6px',borderRadius:10,
                      background:opMeta.color+'22',color:opMeta.color,fontWeight:700}}>
                      {opMeta.icon} {opMeta.label}
                    </span>
                    <span style={{fontWeight:700,fontSize:12,color:'var(--text)'}}>{rec.entity_name}</span>
                    <span style={{fontSize:10,padding:'1px 6px',borderRadius:10,
                      background:statusBg,color:statusColor,fontWeight:700,marginLeft:'auto'}}>
                      {statusLabel}
                    </span>
                  </div>
                  <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
                    {rec.campaign_name && (
                      <span style={{fontSize:10,background:'var(--teal-light)',color:'var(--teal)',
                        borderRadius:8,padding:'1px 7px',fontWeight:600}}>
                        {rec.campaign_name}
                      </span>
                    )}
                    {!rec.campaign_name && (
                      <span style={{fontSize:10,background:'#f1f5f9',color:'#64748b',
                        borderRadius:8,padding:'1px 7px',fontWeight:600}}>
                        Account Level
                      </span>
                    )}
                    {change && (
                      <span style={{fontSize:10,color:'#475569',fontFamily:'monospace',
                        background:'#f1f5f9',borderRadius:3,padding:'1px 5px'}}>
                        {change}
                      </span>
                    )}
                    <span style={{fontSize:10,color:'var(--text-muted)',marginLeft:'auto'}}>
                      {rec.created_at ? new Date(rec.created_at).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}) : ''}
                    </span>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function App() {
  const [tab, setTab] = useState('dashboard');  // Dashboard is now the landing tab
  const [pipeline, setPipeline] = useState([]);
  const [stats, setStats] = useState(null);
  const [campaignStats, setCampaignStats] = useState([]);
  const [keywordStats, setKeywordStats] = useState([]);
  const [ga4Data, setGa4Data] = useState(null);
  const [selectedId, setSelectedId] = useState(null);
  const [loading, setLoading] = useState(true);
  const [unreadCount, setUnreadCount] = useState(0);
  const [showNotifPanel, setShowNotifPanel] = useState(false);
  const [notifLeads, setNotifLeads] = useState([]);
  const [desktopPermission, setDesktopPermission] = useState(
    typeof Notification !== 'undefined' ? Notification.permission : 'denied'
  );
  const prevUnreadRef = React.useRef(null);
  const prevLeadIdsRef = React.useRef(null); // track which lead_ids had unread last poll

  useEffect(() => {
    loadData();
    const interval = setInterval(loadData, 30000);
    // Re-fetch inbox count immediately when a lead is marked read (from DetailPanel or InboxTab)
    window.addEventListener('inbox-unread-changed', loadData);
    return () => {
      clearInterval(interval);
      window.removeEventListener('inbox-unread-changed', loadData);
    };
  }, []);

  // Update browser tab title
  useEffect(() => {
    document.title = unreadCount > 0 ? `(${unreadCount}) nXtSmile Pipeline` : 'nXtSmile Pipeline';
  }, [unreadCount]);

  function requestDesktopNotifications() {
    if (typeof Notification === 'undefined') return;
    Notification.requestPermission().then(p => setDesktopPermission(p));
  }

  async function markReadAndRefreshBadge(leadId) {
    try {
      await api('/api/admin/lead/' + leadId + '/mark-read', { method: 'POST' });
      const d = await api('/api/admin/inbox/unread');
      setUnreadCount(d.count || 0);
      setNotifLeads(d.leads || []);
      try { window.dispatchEvent(new CustomEvent('inbox-unread-changed')); } catch(_) {}
    } catch(_) {}
  }

  async function loadData() {
    try {
      const [p, s, c, g] = await Promise.all([
        api('/api/pipeline/enriched'),
        api('/api/admin/stats'),
        api('/api/admin/campaigns'),
        api('/api/admin/ga4').catch(() => null),
      ]);
      setPipeline(p.leads || []);
      setStats(s);
      setCampaignStats(c.campaigns || []);
      setKeywordStats(c.keywords || []);
      if (g) setGa4Data(g);
      api('/api/admin/inbox/unread').then(d => {
        const newCount = d.count || 0;
        const leads = d.leads || [];
        setNotifLeads(leads);
        // Fire desktop notification for each newly-appeared unread lead
        // Read permission live (avoids stale closure after user grants mid-session)
        const livePermission = typeof Notification !== 'undefined' ? Notification.permission : 'denied';
        if (livePermission === 'granted' && prevLeadIdsRef.current !== null) {
          const prevIds = prevLeadIdsRef.current;
          const newLeads = leads.filter(l => !prevIds.has(l.lead_id));
          newLeads.forEach(l => {
            const name = [l.first_name, l.last_name].filter(Boolean).join(' ') || l.phone || 'Unknown';
            const n = new Notification('nXtSmile — New SMS', {
              body: `${name}: ${(l.last_body || '').slice(0, 80)}`,
              icon: '/favicon.ico',
              tag: `sms-${l.lead_id}`,
            });
            n.onclick = () => { window.focus(); n.close(); };
          });
        }
        prevLeadIdsRef.current = new Set(leads.map(l => l.lead_id));
        prevUnreadRef.current = newCount;
        setUnreadCount(newCount);
      }).catch(() => {});
    } catch (e) {
      console.error('Load error:', e);
    } finally {
      setLoading(false);
    }
  }

  function handleStageChange(leadId, newStage) {
    setPipeline(pipeline.map(l => l.id === leadId ? { ...l, stage: newStage } : l));
  }

  return (
    <div>
      <div className="header">
        <div className="header-logo">nXt<span>smile</span> Pipeline</div>
        <div className="header-right">
          <div className="header-dot" />
          <span style={{fontSize:10,opacity:.7}}>Live</span>

          {/* Desktop notification permission prompt */}
          {desktopPermission === 'default' && (
            <button onClick={requestDesktopNotifications}
              style={{fontSize:10,padding:'2px 8px',borderRadius:4,border:'1px solid rgba(255,255,255,.4)',
                background:'rgba(255,255,255,.1)',color:'#fff',cursor:'pointer',display:'flex',alignItems:'center',gap:4}}>
              🔔 Enable alerts
            </button>
          )}

          {/* Bell icon with dropdown */}
          <div style={{position:'relative'}}>
            <button onClick={() => setShowNotifPanel(v => !v)}
              style={{background:'none',border:'none',cursor:'pointer',color:'#fff',padding:'2px 4px',
                display:'flex',alignItems:'center',gap:4,position:'relative'}}>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
              </svg>
              {unreadCount > 0 && (
                <span style={{position:'absolute',top:-4,right:-4,background:'var(--red)',color:'#fff',
                  borderRadius:'50%',minWidth:16,height:16,fontSize:9,fontWeight:700,
                  display:'flex',alignItems:'center',justifyContent:'center',padding:'0 3px',lineHeight:1}}>
                  {unreadCount > 9 ? '9+' : unreadCount}
                </span>
              )}
            </button>

            {/* Click-outside overlay */}
            {showNotifPanel && (
              <div onClick={() => setShowNotifPanel(false)}
                style={{position:'fixed',inset:0,zIndex:9998}} />
            )}

            {/* Notification dropdown panel */}
            {showNotifPanel && (
              <div style={{position:'absolute',top:'calc(100% + 8px)',right:0,width:320,
                background:'#fff',borderRadius:8,boxShadow:'0 8px 32px rgba(0,0,0,.18)',
                border:'1px solid var(--border)',zIndex:9999,overflow:'hidden'}}>
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',
                  padding:'10px 14px',borderBottom:'1px solid var(--border)'}}>
                  <span style={{fontSize:12,fontWeight:700,color:'var(--text)'}}>
                    Unread Messages {unreadCount > 0 && (
                      <span style={{background:'var(--red)',color:'#fff',borderRadius:8,
                        padding:'0 5px',fontSize:9,fontWeight:700,marginLeft:4}}>{unreadCount}</span>
                    )}
                  </span>
                  <button onClick={() => { setShowNotifPanel(false); setTab('inbox'); }}
                    style={{fontSize:10,color:'var(--teal)',background:'none',border:'none',cursor:'pointer',fontWeight:600}}>
                    View all →
                  </button>
                </div>
                <div style={{maxHeight:320,overflowY:'auto'}}>
                  {notifLeads.length === 0 ? (
                    <div style={{padding:'20px',textAlign:'center',color:'var(--text-muted)',fontSize:11}}>
                      ✓ All caught up
                    </div>
                  ) : notifLeads.slice(0, 8).map(l => {
                    const name = [l.first_name, l.last_name].filter(Boolean).join(' ') || l.email || l.phone || 'Unknown';
                    const isUnmatched = (l.lead_id || '').startsWith('unmatched-');
                    const preview = l.last_body || l.latest_body || '';
                    const ago = timeAgo(l.last_received_at || l.latest_at);
                    const channelIcon = l.channel === 'email' ? '✉ ' : l.channel === 'both' ? '✉💬 ' : '💬 ';
                    return (
                      <div key={l.lead_id}
                        onClick={() => { if (!isUnmatched) { setShowNotifPanel(false); setSelectedId(l.lead_id); setTab('pipeline'); markReadAndRefreshBadge(l.lead_id); } }}
                        style={{display:'flex',gap:10,padding:'10px 14px',cursor: isUnmatched ? 'default' : 'pointer',
                          borderBottom:'1px solid var(--border)',background:'#fff'}}
                        onMouseOver={e => { if (!isUnmatched) e.currentTarget.style.background='var(--teal-light)'; }}
                        onMouseOut={e => e.currentTarget.style.background='#fff'}>
                        <div style={{width:32,height:32,borderRadius:'50%',background:'var(--teal-light)',
                          display:'flex',alignItems:'center',justifyContent:'center',
                          fontSize:12,fontWeight:700,color:'var(--teal)',flexShrink:0}}>
                          {(name[0]||'?').toUpperCase()}
                        </div>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:2}}>
                            <span style={{fontWeight:700,fontSize:11,color:'var(--text)'}}>{channelIcon}{name}</span>
                            <span style={{background:'var(--red)',color:'#fff',borderRadius:8,
                              padding:'0 4px',fontSize:8,fontWeight:700}}>{l.unread_count} new</span>
                          </div>
                          <div style={{fontSize:10,color:'var(--text-muted)',overflow:'hidden',
                            textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{preview}</div>
                          <div style={{fontSize:9,color:'var(--text-muted)',marginTop:1}}>{ago}</div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
          </div>
        </div>
      </div>
      <div className="tab-bar">
        <button className={'tab' + (tab === 'inbox' ? ' active' : '')} onClick={() => { setTab('inbox'); setShowNotifPanel(false); }} style={{position:'relative'}}>
          Inbox
          {unreadCount > 0 && (
            <span style={{display:'inline-flex',alignItems:'center',justifyContent:'center',
              background:'var(--red)',color:'#fff',borderRadius:8,fontSize:8,fontWeight:700,
              padding:'0 5px',minWidth:14,height:14,marginLeft:4,lineHeight:1}}>
              {unreadCount > 9 ? '9+' : unreadCount}
            </span>
          )}
        </button>
        <button className={'tab' + (tab === 'dashboard' ? ' active' : '')} onClick={() => setTab('dashboard')}>Dashboard</button>
        <button className={'tab' + (tab === 'pipeline' ? ' active' : '')} onClick={() => setTab('pipeline')}>Pipeline</button>
        <button className={'tab' + (tab === 'reports' ? ' active' : '')} onClick={() => setTab('reports')}>Reports & Campaigns</button>
        <button className={'tab' + (tab === 'workflows' ? ' active' : '')} onClick={() => setTab('workflows')}>Workflows</button>
        <button className={'tab' + (tab === 'calls' ? ' active' : '')} onClick={() => setTab('calls')}>📋 Call Analysis</button>
        <button className={'tab' + (tab === 'ai_optimizer' ? ' active' : '')} onClick={() => setTab('ai_optimizer')}>🤖 AI Optimizer</button>
        <button className={'tab' + (tab === 'admin' ? ' active' : '')} onClick={() => setTab('admin')}>Admin</button>
      </div>
      <div className="main">
        {loading ? (
          <div style={{ textAlign: 'center', padding: 20, color: 'var(--text-muted)' }}>Loading...</div>
        ) : (
          <React.Fragment>
            {tab === 'inbox' && (
              <InboxTab onOpenLead={(id) => { setSelectedId(id); setTab('pipeline'); }} />
            )}
            {tab === 'dashboard' && (
              <DashboardTab pipeline={pipeline} stats={stats} onTabSwitch={setTab} />
            )}
            {tab === 'pipeline' && (
              <React.Fragment>
                <PipelineTab pipeline={pipeline} stats={stats} selectedId={selectedId}
                  onCardClick={setSelectedId} onStageChange={handleStageChange} onRefresh={loadData} />
                {selectedId && (
                  <DetailPanel lead={pipeline.find(l => l.id === selectedId)} onClose={() => setSelectedId(null)}
                    onStageChange={handleStageChange} onRefresh={loadData}
                    onDelete={(id) => { setPipeline(p => p.filter(l => l.id !== id)); setSelectedId(null); }} />
                )}
              </React.Fragment>
            )}
            {tab === 'reports' && <ReportsTab campaignStats={campaignStats} keywordStats={keywordStats} ga4Data={ga4Data} />}
            {tab === 'workflows' && <WorkflowsSection />}
            {tab === 'calls' && <CallAnalysisView />}
            {tab === 'ai_optimizer' && <AiOptimizerTab onTabSwitch={setTab} />}
            {tab === 'admin' && (
              <AdminTab
                onSync={() => api('/api/admin/sync', { method: 'POST' })}
                onMatch={() => api('/api/admin/match', { method: 'POST' })}
                onGAds={() => api('/api/admin/gads-sync', { method: 'POST' })}
                onConversions={() => api('/api/admin/upload-conversions', { method: 'POST' })}
                onGA4Refresh={() => api('/api/admin/ga4/refresh', { method: 'POST' })}
                onOptimize={() => api('/api/admin/optimize', { method: 'POST' })}
                onTabSwitch={setTab} />
            )}
          </React.Fragment>
        )}
      </div>
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
