                      {headlines.length === 0 && (h1||h2||h3) && (
                        <div style={{marginBottom:8}}>
                          <div style={{fontSize:11,fontWeight:600,marginBottom:4}}>Headlines</div>
                          <div style={{display:'flex',flexWrap:'wrap',gap:4}}>
                            {[h1,h2,h3].filter(Boolean).map((h,i)=>(
                              <span key={i} style={{background:'#e8f4f4',color:'var(--teal-dark)',fontSize:10,padding:'2px 7px',borderRadius:3}}>{h}</span>
                            ))}
                          </div>
                        </div>
                      )}
                      {headlines.length === 0 && (d1||d2) && (
                        <div>
                          <div style={{fontSize:11,fontWeight:600,marginBottom:4}}>Descriptions</div>
                          <div style={{display:'flex',flexWrap:'wrap',gap:4}}>
                            {[d1,d2].filter(Boolean).map((d,i)=>(
                              <span key={i} style={{background:'#fef9c3',color:'#854d0e',fontSize:10,padding:'2px 7px',borderRadius:3}}>{d}</span>
                            ))}
                          </div>
                        </div>
                      )}
                    </td>
                  </tr>
                )}
              </React.Fragment>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

// ─── AI Campaign sub-tab (REMOVED — AI is now built into campaign wizard) ──
// function AICampaignView() {  ← kept as comment to preserve line refs
function _AICampaignView_REMOVED() {
  // Section 1 — Strategy (Opus)
  const [goal, setGoal] = useState('');
  const [targetService, setTargetService] = useState('All-on-4 Implants');
  const [customService, setCustomService] = useState('');
  const [budgetHint, setBudgetHint] = useState('');
  const [stratLoading, setStratLoading] = useState(false);
  const [stratErr, setStratErr] = useState('');
  const [strategy, setStrategy] = useState(null);
  const [strategyModel, setStrategyModel] = useState('');

  // Section 2 — Implementation (Haiku/Sonnet)
  const [deliverable, setDeliverable] = useState('full_package');
  const [implModel, setImplModel] = useState('haiku');
  const [implLoading, setImplLoading] = useState(false);
  const [implErr, setImplErr] = useState('');
  const [implementation, setImplementation] = useState(null);
  const [implModelUsed, setImplModelUsed] = useState('');

  // Section 3 — Performance Analysis (Opus)
  const [analysisDays, setAnalysisDays] = useState(30);
  const [analysisFocus, setAnalysisFocus] = useState('overall');
  const [analysisLoading, setAnalysisLoading] = useState(false);
  const [analysisErr, setAnalysisErr] = useState('');
  const [analysis, setAnalysis] = useState(null);
  const [analysisModel, setAnalysisModel] = useState('');

  async function generateStrategy() {
    setStratErr(''); setStrategy(null); setImplementation(null);
    if (!goal.trim()) { setStratErr('Please describe the campaign goal.'); return; }
    setStratLoading(true);
    try {
      const service = targetService === 'Custom' ? (customService.trim() || 'Custom') : targetService;
      const res = await api('/api/admin/ai/campaign-strategy', {
        method: 'POST',
        body: JSON.stringify({
          campaign_goal: goal.trim(),
          target_service: service,
          budget_hint: budgetHint.trim(),
          additional_context: '',
        }),
      });
      setStrategy(res.strategy || null);
      setStrategyModel(res.model_used || '');
    } catch (e) {
      setStratErr(e?.detail || e?.message || 'Strategy generation failed');
    }
    setStratLoading(false);
  }

  async function runImplementation() {
    setImplErr(''); setImplementation(null);
    if (!strategy) { setImplErr('Generate a strategy first.'); return; }
    setImplLoading(true);
    try {
      const res = await api('/api/admin/ai/campaign-implement', {
        method: 'POST',
        body: JSON.stringify({
          strategy,
          deliverable,
          model: implModel,
        }),
      });
      setImplementation(res.content || null);
      setImplModelUsed(res.model_used || '');
    } catch (e) {
      setImplErr(e?.detail || e?.message || 'Implementation failed');
    }
    setImplLoading(false);
  }

  async function runAnalysis() {
    setAnalysisErr(''); setAnalysis(null);
    setAnalysisLoading(true);
    try {
      const res = await api('/api/admin/ai/performance-analysis', {
        method: 'POST',
        body: JSON.stringify({
          time_range_days: analysisDays,
          focus: analysisFocus,
        }),
      });
      setAnalysis(res.analysis || null);
      setAnalysisModel(res.model_used || '');
    } catch (e) {
      setAnalysisErr(e?.detail || e?.message || 'Analysis failed');
    }
    setAnalysisLoading(false);
  }

  function copyText(text) {
    try { navigator.clipboard.writeText(text); } catch(_) {}
  }

  const cardStyle = {
    background:'#fff', border:'1px solid var(--border)', borderRadius:6,
    padding:14, marginBottom:14,
  };
  const sectionTitle = {
    fontSize:13, fontWeight:600, marginBottom:8, color:'var(--text)',
    display:'flex', alignItems:'center', gap:6,
  };
  const labelStyle = { fontSize:11, color:'var(--text-muted)', display:'block', marginBottom:3 };
  const inputStyle = {
    width:'100%', padding:'6px 8px', fontSize:12, border:'1px solid var(--border)',
    borderRadius:4, fontFamily:'inherit',
  };
  const pillGreen = {
    background:'#d1fae5', color:'#065f46', fontSize:10, padding:'3px 8px',
    borderRadius:3, display:'inline-block',
  };
  const pillAmber = {
    background:'#fef3c7', color:'#92400e', fontSize:10, padding:'3px 8px',
    borderRadius:3, display:'inline-block',
  };
  const badge = {
    fontSize:9, padding:'1px 6px', borderRadius:3, marginLeft:6,
    background:'#ede9fe', color:'#5b21b6', fontWeight:600,
  };

  function PriorityBadge({ p }) {
    const pl = (p||'').toLowerCase();
    const colors = {
      high:   { bg:'#fee2e2', fg:'#991b1b' },
      medium: { bg:'#fef3c7', fg:'#92400e' },
      low:    { bg:'#dbeafe', fg:'#1e40af' },
    };
    const c = colors[pl] || colors.low;
    return <span style={{...pillGreen, background:c.bg, color:c.fg}}>{(pl||'low').toUpperCase()}</span>;
  }

  function renderImplementation() {
    if (!implementation) return null;
    const renderAdCopy = (ad) => (
      <div style={{marginBottom:10}}>
        {ad.headlines && ad.headlines.length > 0 && (
          <div style={{marginBottom:8}}>
            <div style={{fontSize:11,fontWeight:600,marginBottom:4}}>Headlines ({ad.headlines.length})</div>
            <div style={{display:'flex',flexWrap:'wrap',gap:4}}>
              {ad.headlines.map((h,i)=>(
                <span key={i} style={{background:'#e8f4f4',color:'var(--teal-dark)',fontSize:10,padding:'2px 7px',borderRadius:3,cursor:'pointer'}}
                  onClick={()=>copyText(h)} title="Click to copy">{h}</span>
              ))}
            </div>
          </div>
        )}
        {ad.descriptions && ad.descriptions.length > 0 && (
          <div style={{marginBottom:8}}>
            <div style={{fontSize:11,fontWeight:600,marginBottom:4}}>Descriptions ({ad.descriptions.length})</div>
            <div style={{display:'flex',flexWrap:'wrap',gap:4}}>
              {ad.descriptions.map((d,i)=>(
                <span key={i} style={{background:'#fef9c3',color:'#854d0e',fontSize:10,padding:'2px 7px',borderRadius:3,cursor:'pointer'}}
                  onClick={()=>copyText(d)} title="Click to copy">{d}</span>
              ))}
            </div>
          </div>
        )}
        {ad.callouts && ad.callouts.length > 0 && (
          <div style={{marginBottom:8}}>
            <div style={{fontSize:11,fontWeight:600,marginBottom:4}}>Callouts ({ad.callouts.length})</div>
            <div style={{display:'flex',flexWrap:'wrap',gap:4}}>
              {ad.callouts.map((c,i)=>(
                <span key={i} style={{background:'#ede9fe',color:'#5b21b6',fontSize:10,padding:'2px 7px',borderRadius:3,cursor:'pointer'}}
                  onClick={()=>copyText(c)} title="Click to copy">{c}</span>
              ))}
            </div>
          </div>
        )}
        {ad.final_url && (
          <div style={{fontSize:11,color:'var(--text-muted)'}}>
            <strong>Final URL:</strong> <a href={ad.final_url} target="_blank" rel="noreferrer" style={{color:'var(--teal)'}}>{ad.final_url}</a>
          </div>
        )}
      </div>
    );

    const renderSequence = (seq, channel) => (
      <div style={{marginBottom:10}}>
        <div style={{fontSize:11,fontWeight:600,marginBottom:6}}>
          {channel === 'sms' ? 'SMS Sequence' : 'Email Sequence'} ({(seq.steps||[]).length} steps)
        </div>
        <ol style={{margin:0,paddingLeft:18}}>
          {(seq.steps||[]).map((s,i)=>(
            <li key={i} style={{marginBottom:8,fontSize:12}}>
              <div style={{fontSize:10,color:'var(--text-muted)',marginBottom:2}}>
                Day {s.sequence_day}{s.subject ? ' — ' + s.subject : ''}
                <button style={{marginLeft:8,padding:'1px 6px',fontSize:9,border:'1px solid var(--border)',
                  borderRadius:3,background:'#fff',cursor:'pointer'}}
                  onClick={()=>copyText(s.body || '')}>Copy</button>
              </div>
              <pre style={{background:'#f8f9fa',padding:8,borderRadius:4,fontSize:11,
                whiteSpace:'pre-wrap',fontFamily:'inherit',margin:0,border:'1px solid var(--border)'}}>{s.body}</pre>
            </li>
          ))}
        </ol>
      </div>
    );

    if (implementation.headlines || implementation.descriptions || implementation.callouts) {
      return renderAdCopy(implementation);
    }
    if (implementation.steps) {
      return renderSequence(implementation, deliverable === 'sms_sequence' ? 'sms' : 'email');
    }
    if (implementation.ad_copy || implementation.sms_sequence || implementation.email_sequence) {
      return (
        <div>
          {implementation.ad_copy && (
            <div style={{marginBottom:14,paddingBottom:10,borderBottom:'1px solid var(--border)'}}>
              <div style={{fontSize:12,fontWeight:600,marginBottom:6,color:'var(--teal-dark)'}}>Ad Copy</div>
              {renderAdCopy(implementation.ad_copy)}
            </div>
          )}
          {implementation.sms_sequence && (
            <div style={{marginBottom:14,paddingBottom:10,borderBottom:'1px solid var(--border)'}}>
              {renderSequence(implementation.sms_sequence, 'sms')}
            </div>
          )}
          {implementation.email_sequence && (
            <div>
              {renderSequence(implementation.email_sequence, 'email')}
            </div>
          )}
        </div>
      );
    }
    // Fallback: dump JSON
    return <pre style={{background:'#f8f9fa',padding:8,borderRadius:4,fontSize:10,
      maxHeight:300,overflow:'auto'}}>{JSON.stringify(implementation,null,2)}</pre>;
  }

  return (
    <div>
      {/* ── Section 1: Strategy (Opus) ── */}
      <div style={cardStyle}>
        <div style={sectionTitle}>
          <span>1. Campaign Strategy</span>
          <span style={badge}>OPUS</span>
        </div>
        <div style={{fontSize:11,color:'var(--text-muted)',marginBottom:10}}>

// ── Call Analysis — shared formatters ────────────────────────────────────────

function _fmtDur(sec) {
  if (!sec) return '—';
  const m = Math.floor(sec/60), s = sec%60;
  return m > 0 ? `${m}m ${s}s` : `${s}s`;
}
function _fmtTime(iso) {
  if (!iso) return '—';
  try { return new Date(iso).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit',hour12:true}); }
  catch { return iso; }
}
function _statusBadge(status) {
  const colors = { answered:'#16a34a', missed:'#dc2626', voicemail:'#d97706', busy:'#6b7280', unknown:'#94a3b8' };
  const color = colors[status] || '#94a3b8';
  return <span style={{padding:'1px 7px',borderRadius:10,fontSize:10,fontWeight:700,background:color+'22',color,border:`1px solid ${color}44`}}>{status||'unknown'}</span>;
}
function _attrBadge(call) {
  if (!call.attribution_label) return null;
  const isAd = call.attribution_label.includes('Ad call');
  return <span style={{padding:'1px 7px',borderRadius:10,fontSize:10,fontWeight:700,
    background:isAd?'#0369a133':'#71513033',color:isAd?'#0369a1':'#92400e',
    border:`1px solid ${isAd?'#0369a144':'#92400e44'}`}}>{call.attribution_label}</span>;
}
function _transcriptBadge(status) {
  // 'pending' is the DB default for every new call — treat as not-yet-transcribed (show —)
  if (!status || status === 'pending') return <span style={{color:'var(--text-muted)'}}>—</span>;
  const map = {
    in_progress:        {label:'⚙ Working',  color:'#0369a1'},
    done:               {label:'✓ Done',     color:'#16a34a'},
    failed:             {label:'✗ Failed',   color:'#dc2626'},
    skipped_too_short:  {label:'⏭ Too short', color:'#94a3b8'},
    skipped_no_audio:   {label:'⏭ No audio', color:'#94a3b8'},
  };
  const m = map[status] || {label:status, color:'#94a3b8'};
  return <span style={{fontSize:10,fontWeight:700,color:m.color}}>{m.label}</span>;
}
function _gradeBadge(score) {
  if (score == null) return <span style={{color:'var(--text-muted)'}}>—</span>;
  const color = score >= 80 ? '#16a34a' : score >= 60 ? '#d97706' : '#dc2626';
  return <span style={{padding:'1px 7px',borderRadius:10,fontSize:10,fontWeight:700,
    background:color+'22',color,border:`1px solid ${color}44`}}>{score}%</span>;
}

function _patientBadge(status, name) {
  if (!status) return <span style={{color:'var(--text-muted)',fontSize:10}}>—</span>;
  const cfg = {
    new_patient:        { bg:'#f0fdf4', color:'#15803d', label:'🆕 New' },
    existing_active:    { bg:'#eff6ff', color:'#1d4ed8', label:'✅ Existing' },
    existing_inactive:  { bg:'#fefce8', color:'#a16207', label:'😴 Inactive' },
    unknown:            { bg:'#f8fafc', color:'#64748b', label:'?' },
  };
  const c = cfg[status] || cfg.unknown;
  return (
    <span title={name||status} style={{padding:'2px 8px',borderRadius:10,fontSize:10,fontWeight:700,
      background:c.bg,color:c.color,border:`1px solid ${c.color}33`,whiteSpace:'nowrap'}}>
      {c.label}
    </span>
  );
}

// ── CallsSubView — enhanced call list with analysis columns ───────────────────

function CallsSubView() {
  const [calls, setCalls] = useState([]);
  const [total, setTotal] = useState(0);
  const [adCallCount, setAdCallCount] = useState(0);
  const [loading, setLoading] = useState(false);
  // GAds call conversions panel
  const [convCalls, setConvCalls] = useState([]);
  const [convLoading, setConvLoading] = useState(false);
  const [convExpanded, setConvExpanded] = useState(false);
  const [convMinDur, setConvMinDur] = useState(60); // default: show calls ≥60s (conversion threshold)
  const [days, setDays] = useState(30);
  const [dirFilter, setDirFilter] = useState('inbound');
  const [statusFilter, setStatusFilter] = useState('');
  const [syncing, setSyncing] = useState(false);
  const [syncMsg, setSyncMsg] = useState('');
  const [drawerCall, setDrawerCall] = useState(null); // call object shown in detail drawer
  // Per-call analyze state: { uuid: 'idle'|'processing'|'polling'|'done'|'error' }
  const [analyzeState, setAnalyzeState] = useState({});
  const [analyzeError, setAnalyzeError] = useState({});
  // Per-call grade-only state: { uuid: 'idle'|'working'|'done'|'error' }
  const [gradeOnlyState, setGradeOnlyState] = useState({});
  const [gradeOnlyError, setGradeOnlyError] = useState({});
  // GAds unmatched row — match + transcribe state: { call_id: 'idle'|'matching'|'no_record'|'error' }
  const [matchState, setMatchState] = useState({});
  const [matchError, setMatchError] = useState({});
  // Bulk job state
  const [bulkJob, setBulkJob] = useState(null); // {id, status, total, done, errors, current_label}
  const [bulkStarting, setBulkStarting] = useState(false);
  const [bulkMsg, setBulkMsg] = useState('');
  const bulkPollInFlight = React.useRef(false);
  const activePolls = React.useRef({}); // uuid → intervalId, for cleanup on unmount

  // Cleanup all per-call polls on unmount
  useEffect(() => {
    return () => {
      Object.values(activePolls.current).forEach(id => clearInterval(id));
    };
  }, []);

  async function loadCalls() {
    setLoading(true);
    try {
      const params = new URLSearchParams({ days, limit: 200, offset: 0 });
      if (dirFilter) params.set('direction', dirFilter);
      if (statusFilter) params.set('status', statusFilter);
      const d = await api(`/api/admin/calls?${params}`);
      const list = d.calls || [];
      setCalls(list);
      setTotal(d.total || 0);
      setAdCallCount(d.ad_calls_from_gads || 0);
    } catch(e) { console.error('Calls load error', e); }
    finally { setLoading(false); }
  }

  useEffect(() => { loadCalls(); }, [days, dirFilter, statusFilter]);

  async function loadConversions() {
    setConvLoading(true);
    try {
      const d = await api(`/api/admin/gads/call-conversions?days=${days}&min_duration_sec=${convMinDur}`);
      setConvCalls(d.calls || []);
    } catch(e) { console.error('Conversions load error', e); }
    finally { setConvLoading(false); }
  }

  useEffect(() => { loadConversions(); }, [days, convMinDur]);

  async function handleSync() {
    setSyncing(true); setSyncMsg('');
    try {
      const d = await api('/api/admin/calls/sync', { method: 'POST' });
      setSyncMsg(`✓ Synced ${d.synced} calls`);
      await loadCalls();
    } catch(e) { setSyncMsg('✗ Sync failed: ' + (e.message||'error')); }
    finally { setSyncing(false); }
  }

  // GAds call view sync + reconcile
  const [convSyncState, setConvSyncState] = useState('idle'); // idle|syncing-gads|syncing-mango|reconciling|done|error
  const [convSyncMsg, setConvSyncMsg]     = useState('');

  async function handleSyncAll() {
    setConvSyncMsg('');
    try {
      // Step 1: sync Mango calls
      setConvSyncState('syncing-mango');
      const m = await api('/api/admin/calls/sync', { method: 'POST' });
      // Step 2: sync GAds call_view
      setConvSyncState('syncing-gads');
      const g = await api('/api/admin/gads/sync-call-view', { method: 'POST' });
      // Step 3: reconcile (match GAds rows to Mango rows)
      setConvSyncState('reconciling');
      const r = await api('/api/admin/calls/reconcile', { method: 'POST' });
      setConvSyncState('done');
      setConvSyncMsg(`✓ Mango: ${m.synced} calls · GAds: ${g.synced} rows · Matched: ${r.attributed}`);
      await loadCalls();
      await loadConversions();
    } catch(e) {
      setConvSyncState('error');
      setConvSyncMsg('✗ ' + (e.message || 'Sync failed'));
    }
  }

  // ── Per-call analyze ──────────────────────────────────────────────────────
  async function handleAnalyze(uuid) {
    setAnalyzeState(s => ({...s, [uuid]: 'processing'}));
    setAnalyzeError(e => ({...e, [uuid]: null}));
    // Optimistic: mark row as pending immediately
    setCalls(cs => cs.map(c => c.uuid === uuid ? {...c, transcription_status: 'pending'} : c));
    try {
      await api(`/api/admin/calls/${uuid}/process`, { method: 'POST' });
      setAnalyzeState(s => ({...s, [uuid]: 'polling'}));
      // Poll this single call until done/failed or 2-min timeout
      let attempts = 0;
      const MAX = 24; // 24 × 5s = 120s
      const poll = setInterval(async () => {
        attempts++;
        try {
          const updated = await api(`/api/admin/calls/${uuid}`);
          const st = updated.transcription_status;
          setCalls(cs => cs.map(c => c.uuid === uuid ? {...c, ...updated} : c));
          if (st === 'done' || st === 'failed' || attempts >= MAX) {
            clearInterval(poll);
            delete activePolls.current[uuid];
            setAnalyzeState(s => ({...s, [uuid]: st === 'done' ? 'done' : 'error'}));
            if (st === 'failed') setAnalyzeError(e => ({...e, [uuid]: 'Analysis failed — check pipeline logs'}));
            if (attempts >= MAX && st !== 'done' && st !== 'failed') {
              setAnalyzeError(e => ({...e, [uuid]: 'Timed out — still processing. Refresh to check.'}));
            }
          }
        } catch(err) {
          clearInterval(poll);
          delete activePolls.current[uuid];
          setAnalyzeState(s => ({...s, [uuid]: 'error'}));
          setAnalyzeError(e => ({...e, [uuid]: 'Polling error: ' + (err.message||'unknown')}));
        }
      }, 5000);
      activePolls.current[uuid] = poll; // register for cleanup on unmount
    } catch(e) {
      setAnalyzeState(s => ({...s, [uuid]: 'error'}));
      setAnalyzeError(err => ({...err, [uuid]: 'Failed to start: ' + (e.message||'error')}));
      setCalls(cs => cs.map(c => c.uuid === uuid ? {...c, transcription_status: null} : c));
    }
  }

  function PlayButton({uuid}) {
    const [pState, setPState] = React.useState('idle'); // idle | loading | playing | error
    const audioRef = React.useRef(null);
    const url = `/api/admin/calls/recording/${uuid}/play`;
    const toggle = e => {
      e.stopPropagation();
      if (pState === 'playing') {
        audioRef.current && audioRef.current.pause();
        setPState('idle');
        return;
      }
      if (!audioRef.current) {
        const a = new Audio(url);
        audioRef.current = a;
        a.onended = () => setPState('idle');
        a.onerror = () => setPState('error');
      }
      setPState('loading');
      audioRef.current.play()
        .then(() => setPState('playing'))
        .catch(() => setPState('error'));
    };
    React.useEffect(() => () => { audioRef.current && audioRef.current.pause(); }, []);
    const label = pState === 'loading' ? '⏳' : pState === 'playing' ? '⏸' : pState === 'error' ? '⚠' : '▶';
    const color  = pState === 'error' ? '#dc2626' : pState === 'playing' ? '#7c3aed' : '#0369a1';
    const bg     = pState === 'error' ? '#fef2f2' : pState === 'playing' ? '#f5f3ff' : '#e0f2fe';
    const border = pState === 'error' ? '#dc2626' : pState === 'playing' ? '#7c3aed' : '#0369a1';
    return (
      <button onClick={toggle} title={pState==='playing'?'Pause':'Play recording (auto-deleted after 60 min)'}
        style={{fontSize:11,padding:'3px 8px',border:`1px solid ${border}`,borderRadius:3,
          cursor:'pointer',color,background:bg,whiteSpace:'nowrap'}}>
        {label}
      </button>
    );
  }

  function analyzeButton(call) {
    const st = call.transcription_status;
    const aState = analyzeState[call.uuid] || 'idle';
    const aErr   = analyzeError[call.uuid];
    const gState = gradeOnlyState[call.uuid] || 'idle';
    const gErr   = gradeOnlyError[call.uuid];
    const hasTranscript = st === 'done';
    const isGraded = call.grade_overall_score != null;
    // Only show "Transcribing…" if the UI actively triggered it (aState is set),
    // not just because the DB default is 'pending'. 'in_progress' means the backend is actively working.
    const transcribing = aState === 'processing' || aState === 'polling' || st === 'in_progress';
    const grading = gState === 'working';

    const playBtn = call.recording_url ? (
      <button onClick={e=>{e.stopPropagation();window.open(`/api/admin/calls/recording/${call.uuid}/play`,'_blank');}}
        title="Play recording"
        style={{fontSize:9,padding:'2px 5px',border:'1px solid #7c3aed',borderRadius:3,cursor:'pointer',
          color:'#7c3aed',background:'#f5f3ff'}}>
        🎵
      </button>
    ) : null;

    // Transcribing in progress
    if (transcribing) return (
      <span style={{display:'flex',gap:3,alignItems:'center'}}>
        <span style={{fontSize:9,color:'#d97706'}}>⚙ Transcribing…</span>
        {playBtn}
      </span>
    );

    // Transcribe failed / retry
    if (aState === 'error') return (
      <span style={{display:'flex',gap:3,alignItems:'center'}}>
        <button onClick={e=>{e.stopPropagation();handleAnalyze(call.uuid);}}
          style={{fontSize:9,padding:'1px 5px',border:'1px solid #dc2626',borderRadius:3,cursor:'pointer',color:'#dc2626',background:'#fef2f2'}}>
          ↺ Retry
        </button>
        {aErr && <span style={{fontSize:9,color:'#dc2626'}} title={aErr}>⚠</span>}
        {playBtn}
      </span>
    );

    return (
      <span style={{display:'flex',gap:3,alignItems:'center',flexWrap:'wrap'}}>
        {/* Transcribe button — show if no transcript yet. Backend fetches recording from Mango on demand,
            so we don't require call.recording_url to be present. */}
        {!hasTranscript && (
          <button onClick={e=>{e.stopPropagation();handleAnalyze(call.uuid);}}
            title="Transcribe this call with Whisper"
            style={{fontSize:9,padding:'2px 6px',border:'1px solid #0369a1',borderRadius:3,cursor:'pointer',
              color:'#0369a1',background:'#e0f2fe',whiteSpace:'nowrap'}}>
            🎙 Transcribe
          </button>
        )}
        {/* Grade button — only available once transcript exists */}
        {hasTranscript && (
          grading
            ? <span style={{fontSize:9,color:'#d97706'}}>⚙ Grading…</span>
            : gState === 'done'
              ? <span style={{fontSize:9,color:'#16a34a',fontWeight:700}}>✓ Graded</span>
              : (
                <button onClick={e=>{e.stopPropagation();handleGradeOnly(call.uuid);}}
                  title={isGraded ? 'Re-grade this call' : 'Grade this call with Vertex AI'}
                  style={{fontSize:9,padding:'2px 6px',
                    border:`1px solid ${isGraded?'#b45309':'#16a34a'}`,borderRadius:3,cursor:'pointer',
                    color:isGraded?'#b45309':'#16a34a',
                    background:isGraded?'#fef3c7':'#dcfce7',whiteSpace:'nowrap'}}>
                  {isGraded ? '↺ Re-grade' : '⭐ Grade'}
                </button>
              )
        )}
        {/* Transcript done badge when no grade yet */}
        {hasTranscript && !isGraded && gState === 'idle' && (
          <span style={{fontSize:9,color:'#0891b2'}}>✓ Transcript</span>
        )}
        {gErr && <span style={{fontSize:9,color:'#dc2626'}} title={gErr}>⚠</span>}
        {playBtn}
      </span>
    );
  }

  // ── Bulk job ──────────────────────────────────────────────────────────────
  async function loadBulkStatus() {
    if (bulkPollInFlight.current) return; // prevent overlapping requests
    bulkPollInFlight.current = true;
    try {
      const d = await api('/api/admin/calls/bulk-process/status');
      setBulkJob(d.job || null);
    } catch(e) { console.error('Bulk status error', e); }
    finally { bulkPollInFlight.current = false; }
  }

  const bulkActive = bulkJob && (bulkJob.status === 'queued' || bulkJob.status === 'running');

  useEffect(() => {
    if (!bulkActive) return;
    const id = setInterval(() => loadBulkStatus(), 3000);
    return () => clearInterval(id);
  }, [bulkActive]);

  // Stop polling when job reaches terminal state and reload calls
  useEffect(() => {
    if (bulkJob && (bulkJob.status === 'done' || bulkJob.status === 'failed')) {
      loadCalls(); // refresh list to show updated analysis columns
    }
  }, [bulkJob?.status]);

  async function handleBulkProcess() {
    setBulkStarting(true); setBulkMsg('');
    try {
      const d = await api('/api/admin/calls/bulk-process', { method: 'POST', body: JSON.stringify({days_back:days}) });
      if (!d.ok) { setBulkMsg('✗ ' + (d.error || 'Could not start bulk job')); return; }
      setBulkMsg('');
      await loadBulkStatus();
    } catch(e) { setBulkMsg('✗ ' + (e.message||'error')); }
    finally { setBulkStarting(false); }
  }

  // ── Drawer helpers ────────────────────────────────────────────────────────
  async function openDrawer(call) {
    setDrawerCall(call); // show immediately with row data
    try {
      const fresh = await api(`/api/admin/calls/${call.uuid}`);
      // Merge fresh data into both drawer and the row in the list
      setDrawerCall(prev => prev && prev.uuid === call.uuid ? {...prev, ...fresh} : prev);
      setCalls(cs => cs.map(c => c.uuid === call.uuid ? {...c, ...fresh} : c));
    } catch(e) { /* silently keep stale row data */ }
  }

  function updateCallInState(uuid, updates) {
    setCalls(cs => cs.map(c => c.uuid === uuid ? {...c, ...updates} : c));
    setDrawerCall(prev => prev && prev.uuid === uuid ? {...prev, ...updates} : prev);
  }

  async function handleGrade(uuid) {
    try {
      const d = await api(`/api/admin/calls/${uuid}/grade`, { method: 'POST' });
      if (d.ok && d.call) updateCallInState(uuid, d.call);
      return d;
    } catch(e) { return {ok: false, error: e.message}; }
  }

  // For unmatched GAds rows: widen reconciler window to find the Mango record, then transcribe
  async function handleMatchAndTranscribe(callId) {
    setMatchState(s => ({...s, [callId]: 'matching'}));
    setMatchError(e => ({...e, [callId]: null}));
    try {
      const d = await api(`/api/admin/gads/${callId}/match-and-transcribe`, { method: 'POST' });
      if (d.ok && d.uuid) {
        // Matched — refresh convCalls so the row turns green and gets normal buttons
        await loadConversions();
        // Also kick off polling on the newly-matched call (it was queued for transcription)
        setAnalyzeState(s => ({...s, [d.uuid]: 'polling'}));
        let attempts = 0;
        const MAX = 24;
        const poll = setInterval(async () => {
          attempts++;
          try {
            const updated = await api(`/api/admin/calls/${d.uuid}`);
            const st = updated.transcription_status;
            setCalls(cs => cs.map(c => c.uuid === d.uuid ? {...c, ...updated} : c));
            if (st === 'done' || st === 'failed' || attempts >= MAX) {
              clearInterval(poll);
              delete activePolls.current[d.uuid];
              setAnalyzeState(s => ({...s, [d.uuid]: st === 'done' ? 'done' : 'error'}));
              if (st === 'failed') setAnalyzeError(e => ({...e, [d.uuid]: 'Analysis failed'}));
              // Refresh conv panel so transcript/grade columns update
              await loadConversions();
            }
          } catch(err) {
            clearInterval(poll);
            delete activePolls.current[d.uuid];
            setAnalyzeState(s => ({...s, [d.uuid]: 'error'}));
          }
        }, 5000);
        activePolls.current[d.uuid] = poll;
        setMatchState(s => ({...s, [callId]: 'idle'}));
      }
    } catch(e) {
      const noRecord = e.message && e.message.includes('No PBX recording');
      setMatchState(s => ({...s, [callId]: noRecord ? 'no_record' : 'error'}));
      setMatchError(err => ({...err, [callId]: e.message || 'Failed'}));
    }
  }

  async function handleGradeOnly(uuid) {
    setGradeOnlyState(s => ({...s, [uuid]: 'working'}));
    setGradeOnlyError(e => ({...e, [uuid]: null}));
    try {
      const d = await api(`/api/admin/calls/${uuid}/grade`, { method: 'POST' });
      if (d.ok && d.call) {
        updateCallInState(uuid, d.call);
      }
      setGradeOnlyState(s => ({...s, [uuid]: 'done'}));
      setTimeout(() => setGradeOnlyState(s => ({...s, [uuid]: 'idle'})), 3000);
    } catch(e) {
      setGradeOnlyState(s => ({...s, [uuid]: 'error'}));
      setGradeOnlyError(err => ({...err, [uuid]: e.message || 'Grade failed'}));
    }
  }

  // ── Derived stats ─────────────────────────────────────────────────────────
  const missed      = calls.filter(c=>c.status==='missed').length;
  const answered    = calls.filter(c=>c.status==='answered').length;
  const transcribed = calls.filter(c=>c.transcription_status==='done').length;
  const graded      = calls.filter(c=>c.grade_overall_score != null).length;
  const avgDur = calls.filter(c=>c.duration_sec>0).length
    ? Math.round(calls.filter(c=>c.duration_sec>0).reduce((a,c)=>a+(c.duration_sec||0),0)/calls.filter(c=>c.duration_sec>0).length)
    : 0;

  const bulkPct = bulkJob && bulkJob.total > 0 ? Math.round(100 * (bulkJob.done||0) / bulkJob.total) : 0;

  return (
    <div>
      {/* Summary tiles */}
      <div style={{display:'flex',gap:10,marginBottom:14,flexWrap:'wrap'}}>
        {[
          {label:'Total Calls',   val:total,                              color:'#0f172a'},
          {label:'Answered',      val:answered,                           color:'#16a34a'},
          {label:'Missed',        val:missed,                             color:'#dc2626'},
          {label:'From Google Ads',val:adCallCount,                       color:'#0369a1'},
          {label:'Avg Duration',  val:avgDur?_fmtDur(avgDur):'—',        color:'#7c3aed'},
          {label:'Transcribed',   val:transcribed,                        color:'#0891b2'},
          {label:'Graded',        val:graded,                             color:'#b45309'},
        ].map(t=>(
          <div key={t.label} style={{flex:'1 1 100px',minWidth:90,background:'#fff',border:'1px solid var(--border)',borderRadius:8,padding:'10px 14px',textAlign:'center'}}>
            <div style={{fontSize:20,fontWeight:700,color:t.color}}>{t.val}</div>
            <div style={{fontSize:10,color:'var(--text-muted)',marginTop:2}}>{t.label}</div>
          </div>
        ))}
      </div>

      {/* ── GAds Call Conversions panel ──────────────────────────────────── */}
      <div style={{background:'#fff',border:'1px solid var(--border)',borderRadius:8,marginBottom:14,overflow:'hidden'}}>
        {/* Header row */}
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 14px',cursor:'pointer',userSelect:'none'}}
             onClick={()=>setConvExpanded(x=>!x)}>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <span style={{fontSize:13,fontWeight:700,color:'#0369a1'}}>📞 Google Ads Call Conversions</span>
            {convLoading
              ? <span style={{fontSize:11,color:'var(--text-muted)'}}>Loading…</span>
              : <span style={{fontSize:11,color:'var(--text-muted)'}}>{convCalls.length} call{convCalls.length!==1?'s':''} • {convCalls.filter(c=>c.mango_uuid).length} matched to Mango</span>
            }
          </div>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <select value={convMinDur} onChange={e=>{setConvMinDur(Number(e.target.value));setConvExpanded(true);}}
                    onClick={e=>e.stopPropagation()}
                    style={{fontSize:11,padding:'2px 6px',border:'1px solid var(--border)',borderRadius:4,background:'#f8fafc'}}>
              <option value={0}>All durations</option>
              <option value={60}>≥60s (conversions)</option>
              <option value={120}>≥2 min</option>
              <option value={180}>≥3 min</option>
            </select>
            <button onClick={e=>{e.stopPropagation();handleSyncAll();}}
                    disabled={convSyncState==='syncing-mango'||convSyncState==='syncing-gads'||convSyncState==='reconciling'}
                    style={{fontSize:11,padding:'3px 10px',border:'1px solid #0369a1',borderRadius:4,cursor:'pointer',
                      background:convSyncState==='done'?'#f0fdf4':convSyncState==='error'?'#fef2f2':'#eff6ff',
                      color:convSyncState==='done'?'#16a34a':convSyncState==='error'?'#dc2626':'#0369a1',
                      fontWeight:600,whiteSpace:'nowrap'}}>
              {convSyncState==='syncing-mango' ? '⏳ Syncing Mango…'
               : convSyncState==='syncing-gads' ? '⏳ Syncing GAds…'
               : convSyncState==='reconciling'  ? '⏳ Matching…'
               : convSyncState==='done'         ? '✓ Synced'
               : convSyncState==='error'        ? '✗ Failed'
               : '⟳ Sync All'}
            </button>
            {convSyncMsg && (
              <span style={{fontSize:10,color:convSyncState==='error'?'#dc2626':'#16a34a',maxWidth:220,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}
                    title={convSyncMsg}>{convSyncMsg}</span>
            )}
            <span style={{fontSize:11,color:'var(--text-muted)'}}>{convExpanded ? '▲' : '▼'}</span>
          </div>
        </div>

        {/* Expanded table — same columns/rows/drawer as main calls list */}
        {convExpanded && (
          convCalls.length === 0
          ? <div style={{padding:'12px 14px',fontSize:12,color:'var(--text-muted)',fontStyle:'italic'}}>
              {convLoading ? 'Loading…' : 'No Google Ads call data for this period. Run GAds Call View sync to populate.'}
            </div>
          : <div style={{overflowX:'auto'}}>
              <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
                <thead>
                  <tr style={{background:'#f8fafc',borderTop:'1px solid var(--border)'}}>
                    {['Time','Dir','From','To','Answered By','Duration','Status','Attribution','Transcript','Grade','Actions','Play'].map(h=>(
                      <th key={h} style={{padding:'8px 10px',textAlign:'left',fontWeight:600,fontSize:11,color:'var(--text-muted)',whiteSpace:'nowrap',borderBottom:'1px solid var(--border)'}}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {convCalls.map((c,i)=>{
                    const matched = !!c.mango_uuid;
                    // Build a call-shaped object for rows that came from a matched Mango record
                    // For unmatched rows we still render the row but greyed out / no actions
                    const isConv = (c.gads_duration_sec||0) >= 60;
                    const callObj = matched ? {
                      ...c,
                      uuid: c.mango_uuid,
                      started_at: c.started_at || c.start_call_date_time,
                      attribution_label: 'Ad call ✓',
                    } : null;
                    const ts = (c.started_at || c.start_call_date_time)
                      ? new Date(c.started_at || c.start_call_date_time).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit',hour12:true})
                      : '—';
                    return (
                      <tr key={c.call_id||i}
                          onClick={matched ? ()=>openDrawer(callObj) : undefined}
                          style={{borderBottom:'1px solid var(--border)',
                            background: drawerCall&&drawerCall.uuid===c.mango_uuid ? '#dbeafe'
                              : matched ? '#f0fdf4' : '#fffbeb',
                            cursor:matched?'pointer':'default'}}>
                        <td style={{padding:'8px 10px',whiteSpace:'nowrap'}}>
                          {ts}
                          {isConv && <span style={{marginLeft:5,fontSize:9,fontWeight:700,color:'#16a34a',background:'#dcfce7',padding:'1px 4px',borderRadius:3}}>CONV</span>}
                        </td>
                        <td style={{padding:'8px 10px'}}>
                          {matched
                            ? <span style={{fontSize:10,fontWeight:600,color:c.direction==='inbound'?'#0369a1':'#7c3aed'}}>{c.direction==='inbound'?'↙ IN':'↗ OUT'}</span>
                            : <span style={{fontSize:10,color:'#94a3b8'}}>↙ IN</span>}
                        </td>
                        <td style={{padding:'8px 10px',fontFamily:'monospace',fontSize:11}}>
                          {matched
                            ? <span style={{fontWeight:600}}>{c.from_number||'—'}</span>
                            : <span style={{color:'#94a3b8',fontStyle:'italic'}}>{c.caller_area_code?`(${c.caller_area_code}) ***-****`:'unmatched'}</span>}
                        </td>
                        <td style={{padding:'8px 10px',fontFamily:'monospace',fontSize:11}}>{c.to_number||'(508) 318-4477'}</td>
                        <td style={{padding:'8px 10px',fontWeight:600}}>{c.team_member||c.answered_by||'—'}</td>
                        <td style={{padding:'8px 10px'}}>{c.duration_sec ? _fmtDur(c.duration_sec) : c.gads_duration_sec ? _fmtDur(c.gads_duration_sec) : '—'}</td>
                        <td style={{padding:'8px 10px'}}>{matched ? _statusBadge(c.mango_status||c.status) : <span style={{fontSize:10,fontWeight:700,color:'#94a3b8'}}>{c.gads_call_status||'—'}</span>}</td>
                        <td style={{padding:'8px 10px'}}>
                          {matched
                            ? <span style={{padding:'1px 7px',borderRadius:10,fontSize:10,fontWeight:700,background:'#0369a133',color:'#0369a1',border:'1px solid #0369a144'}}>Ad call ✓</span>
                            : <span style={{padding:'1px 7px',borderRadius:10,fontSize:10,fontWeight:700,background:'#f1f5f9',color:'#94a3b8',border:'1px solid #e2e8f0'}}>unmatched</span>}
                        </td>
                        <td style={{padding:'8px 10px'}}>{matched ? _transcriptBadge(c.transcription_status) : <span style={{color:'var(--text-muted)'}}>—</span>}</td>
                        <td style={{padding:'8px 10px'}}>{matched ? _gradeBadge(c.grade_overall_score) : <span style={{color:'var(--text-muted)'}}>—</span>}</td>
                        <td style={{padding:'8px 10px'}} onClick={e=>e.stopPropagation()}>
                          {matched ? analyzeButton(callObj) : (()=>{
                            const ms = matchState[c.call_id] || 'idle';
                            const me = matchError[c.call_id];
                            if (ms === 'matching') return <span style={{fontSize:11,color:'#d97706'}}>⚙ Finding…</span>;
                            if (ms === 'no_record') return (
                              <span style={{fontSize:10,color:'#94a3b8'}} title={me||'No PBX recording for this call'}>
                                No recording
                              </span>
                            );
                            if (ms === 'error') return (
                              <span style={{display:'flex',gap:4,alignItems:'center'}}>
                                <button onClick={()=>handleMatchAndTranscribe(c.call_id)}
                                  style={{fontSize:9,padding:'2px 6px',border:'1px solid #dc2626',borderRadius:3,cursor:'pointer',color:'#dc2626',background:'#fef2f2'}}>
                                  ↺ Retry
                                </button>
                                <span style={{fontSize:9,color:'#dc2626'}} title={me}>⚠</span>
                              </span>
                            );
                            return (
                              <button onClick={()=>handleMatchAndTranscribe(c.call_id)}
                                title="Search for Mango PBX recording and transcribe"
                                style={{fontSize:9,padding:'2px 6px',border:'1px solid #0369a1',borderRadius:3,cursor:'pointer',
                                  color:'#0369a1',background:'#e0f2fe',whiteSpace:'nowrap'}}>
                                🎙 Transcribe
                              </button>
                            );
                          })()}
                        </td>
                        <td style={{padding:'8px 10px'}} onClick={e=>e.stopPropagation()}>
                          {matched ? <PlayButton uuid={c.mango_uuid} /> : <span style={{color:'var(--text-muted)'}}>—</span>}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
              <div style={{padding:'6px 14px',fontSize:10,color:'var(--text-muted)',borderTop:'1px solid var(--border)'}}>
                🟢 Matched = full Mango record (click to open) · 🟡 Unmatched = GAds call not yet linked to PBX · CONV badge = ≥60s
              </div>
            </div>
        )}
      </div>

      {/* Bulk job progress bar */}
      {bulkActive && bulkJob && (
        <div style={{background:'#f0f9ff',border:'1px solid #bae6fd',borderRadius:8,padding:'10px 14px',marginBottom:12}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
            <span style={{fontSize:12,fontWeight:600,color:'#0369a1'}}>
              ⚙ Bulk Processing — {bulkJob.current_label || `${bulkJob.done||0} / ${bulkJob.total||'?'} calls`}
            </span>
            <span style={{fontSize:11,color:'#0369a1'}}>{bulkPct}%</span>
          </div>
          <div style={{background:'#e0f2fe',borderRadius:4,height:8,overflow:'hidden'}}>
            <div style={{background:'#0369a1',height:'100%',width:`${bulkPct}%`,transition:'width 0.4s ease'}} />
          </div>
          {bulkJob.errors > 0 && <div style={{marginTop:4,fontSize:10,color:'#dc2626'}}>{bulkJob.errors} errors</div>}
        </div>
      )}
      {bulkJob && bulkJob.status === 'done' && (
        <div style={{background:'#f0fdf4',border:'1px solid #bbf7d0',borderRadius:8,padding:'8px 14px',marginBottom:12,fontSize:12,color:'#16a34a'}}>
          ✓ Bulk job complete — {bulkJob.done||0} processed, {bulkJob.errors||0} errors.{' '}
          <button onClick={()=>setBulkJob(null)} style={{background:'none',border:'none',cursor:'pointer',color:'#16a34a',textDecoration:'underline',fontSize:11}}>Dismiss</button>
        </div>
      )}
      {bulkJob && bulkJob.status === 'failed' && (
        <div style={{background:'#fef2f2',border:'1px solid #fecaca',borderRadius:8,padding:'8px 14px',marginBottom:12,fontSize:12,color:'#dc2626'}}>
          ✗ Bulk job failed: {bulkJob.error_msg || 'unknown error'}.{' '}
          <button onClick={()=>setBulkJob(null)} style={{background:'none',border:'none',cursor:'pointer',color:'#dc2626',textDecoration:'underline',fontSize:11}}>Dismiss</button>
        </div>
      )}

      {/* Toolbar */}
      <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:10,flexWrap:'wrap'}}>
        <div style={{display:'flex',gap:4}}>
          {[7,14,30,90].map(d=>(
            <button key={d} onClick={()=>setDays(d)}
              style={{padding:'3px 8px',fontSize:10,border:'1px solid var(--border)',borderRadius:4,cursor:'pointer',
                background:days===d?'var(--teal)':'#fff',color:days===d?'#fff':'var(--text-muted)'}}>
              {d}d</button>
          ))}
        </div>
        <select value={dirFilter} onChange={e=>setDirFilter(e.target.value)}
          style={{padding:'3px 8px',fontSize:11,border:'1px solid var(--border)',borderRadius:4}}>
          <option value="">All directions</option>
          <option value="inbound">Inbound</option>
          <option value="outbound">Outbound</option>
        </select>
        <select value={statusFilter} onChange={e=>setStatusFilter(e.target.value)}
          style={{padding:'3px 8px',fontSize:11,border:'1px solid var(--border)',borderRadius:4}}>
          <option value="">All statuses</option>
          <option value="answered">Answered</option>
          <option value="missed">Missed</option>
          <option value="voicemail">Voicemail</option>
        </select>
        <button onClick={handleSync} disabled={syncing}
          style={{padding:'4px 12px',fontSize:11,border:'1px solid var(--teal)',borderRadius:4,cursor:'pointer',
            background:syncing?'var(--bg-card)':'var(--teal)',color:syncing?'var(--text-muted)':'#fff'}}>
          {syncing?'Syncing…':'⟳ Sync Now'}
        </button>
        <button onClick={handleBulkProcess} disabled={bulkStarting || bulkActive}
          style={{padding:'4px 12px',fontSize:11,border:'1px solid #7c3aed',borderRadius:4,cursor:'pointer',
            background:(bulkStarting||bulkActive)?'var(--bg-card)':'#7c3aed',
            color:(bulkStarting||bulkActive)?'var(--text-muted)':'#fff'}}>
          {bulkStarting?'Starting…':bulkActive?'Processing…':'⚡ Bulk Analyze'}
        </button>
        <button onClick={loadCalls} disabled={loading}
          style={{padding:'4px 10px',fontSize:11,border:'1px solid var(--border)',borderRadius:4,cursor:'pointer',
            background:'#fff',color:'var(--text-muted)'}}>
          ↻ Refresh
        </button>
        {syncMsg && <span style={{fontSize:11,color:syncMsg.startsWith('✓')?'#16a34a':'#dc2626'}}>{syncMsg}</span>}
        {bulkMsg && <span style={{fontSize:11,color:bulkMsg.startsWith('✓')?'#16a34a':'#dc2626'}}>{bulkMsg}</span>}
        {loading && <span style={{fontSize:11,color:'var(--text-muted)'}}>Loading…</span>}
      </div>

      {/* Calls table */}
      <div style={{background:'#fff',border:'1px solid var(--border)',borderRadius:8,overflow:'hidden'}}>
        <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
          <thead>
            <tr style={{background:'var(--bg-card)',borderBottom:'1px solid var(--border)'}}>
              {['Time','Dir','From','To','Answered By','Duration','Status','Patient','Attribution','Transcript','Grade','Actions','Play'].map(h=>(
                <th key={h} style={{padding:'8px 10px',textAlign:'left',fontWeight:600,fontSize:11,color:'var(--text-muted)',whiteSpace:'nowrap'}}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {calls.length===0 && !loading && (
              <tr><td colSpan={11} style={{padding:'24px',textAlign:'center',color:'var(--text-muted)'}}>
                No calls found. Click "Sync Now" to pull latest data.
              </td></tr>
            )}
            {calls.map(call=>(
              <React.Fragment key={call.uuid}>
                <tr onClick={()=>openDrawer(call)}
                  style={{borderBottom:'1px solid var(--border)',cursor:'pointer',
                    background:drawerCall&&drawerCall.uuid===call.uuid?'#dbeafe':call.status==='missed'?'#fef2f2':'#fff'}}>
                  <td style={{padding:'8px 10px',whiteSpace:'nowrap'}}>
                    {_fmtTime(call.started_at)}
                    {(call.gads_duration_sec||0)>=60 && <span style={{marginLeft:5,fontSize:9,fontWeight:700,color:'#16a34a',background:'#dcfce7',padding:'1px 4px',borderRadius:3}}>CONV</span>}
                  </td>
                  <td style={{padding:'8px 10px'}}>
                    <span style={{fontSize:10,fontWeight:600,color:call.direction==='inbound'?'#0369a1':'#7c3aed'}}>
                      {call.direction==='inbound'?'↙ IN':'↗ OUT'}
                    </span>
                  </td>
                  <td style={{padding:'8px 10px',fontFamily:'monospace',fontSize:11}}>{call.from_number||(call.caller_id_number?'area:'+call.caller_id_number:null)||'—'}</td>
                  <td style={{padding:'8px 10px',fontFamily:'monospace',fontSize:11}}>{call.to_number||'—'}</td>
                  <td style={{padding:'8px 10px',fontWeight:600}}>{call.answered_by||'—'}</td>
                  <td style={{padding:'8px 10px'}}>{_fmtDur(call.duration_sec)}</td>
                  <td style={{padding:'8px 10px'}}>{_statusBadge(call.status)}</td>
                  <td style={{padding:'8px 10px'}}>{_patientBadge(call.od_patient_status, call.od_patient_name||call.caller_id_name)}</td>
                  <td style={{padding:'8px 10px'}}>{_attrBadge(call)}</td>
                  <td style={{padding:'8px 10px'}}>{_transcriptBadge(call.transcription_status)}</td>
                  <td style={{padding:'8px 10px'}}>{_gradeBadge(call.grade_overall_score)}</td>
                  <td style={{padding:'8px 10px'}} onClick={e=>e.stopPropagation()}>{analyzeButton(call)}</td>
                  <td style={{padding:'8px 10px'}} onClick={e=>e.stopPropagation()}><PlayButton uuid={call.uuid} /></td>
                </tr>
              </React.Fragment>
            ))}
          </tbody>
        </table>
      </div>
      <div style={{marginTop:8,fontSize:11,color:'var(--text-muted)'}}>
        Showing {calls.length} of {total} calls · Syncs automatically every 5 min
      </div>

      {/* Detail drawer */}
      {drawerCall && (
        <CallDetailDrawer
          call={drawerCall}
          onClose={()=>setDrawerCall(null)}
          onGrade={handleGrade}
          onAnalyze={handleAnalyze}
          updateCallInState={updateCallInState}
        />
      )}
    </div>
  );
}

// ── CallDetailDrawer — slide-in right panel with 4 tabs ───────────────────────

function CallDetailDrawer({ call, onClose, onGrade, onAnalyze, updateCallInState }) {
  const [drawerTab, setDrawerTab] = useState('overview'); // 'overview'|'transcript'|'grade'|'attribution'
  const [grading, setGrading]     = useState(false);
  const [gradeMsg, setGradeMsg]   = useState('');

  // Body scroll lock + Escape to close
  useEffect(() => {
    document.body.style.overflow = 'hidden';
    function onKey(e) { if (e.key === 'Escape') onClose(); }
    document.addEventListener('keydown', onKey);
    return () => {
      document.body.style.overflow = '';
      document.removeEventListener('keydown', onKey);
    };
  }, []);

  // Safe JSON parse helper
  function safeJson(str, fallback=[]) {
    try { return str ? JSON.parse(str) : fallback; }
    catch { return fallback; }
  }

  const scores       = safeJson(call.grade_scores_json, []);
  const recs         = safeJson(call.grade_recommendations_json, []);

  async function doGrade() {
    setGrading(true); setGradeMsg('');
    const result = await onGrade(call.uuid);
    setGrading(false);
    if (result && result.ok) setGradeMsg('✓ Re-graded');
    else setGradeMsg('✗ ' + ((result && result.error) || 'Grade failed'));
  }

  // Label maps
  const lqLabels = {
    new_patient_inquiry:'New Patient Inquiry', existing_patient:'Existing Patient',
    emergency:'Emergency', provider_referral:'Provider Referral',
    spam:'Spam', wrong_number:'Wrong Number', other_admin:'Other/Admin',
  };
  const hgLabels = { excellent:'Excellent ✓', good:'Good', needs_coaching:'Needs Coaching ⚠', poor:'Poor ✗' };
  const hgColors = { excellent:'#16a34a', good:'#0369a1', needs_coaching:'#d97706', poor:'#dc2626' };
  const boLabels = { booked:'Booked 📅', quoted_callback:'Quoted/Callback', declined:'Declined', no_action_needed:'No Action Needed', abandoned:'Abandoned' };
  const boColors = { booked:'#16a34a', quoted_callback:'#0369a1', declined:'#dc2626', no_action_needed:'#6b7280', abandoned:'#6b7280' };

  const tabBtn = (k, label) => (
    <button key={k} onClick={()=>setDrawerTab(k)}
      style={{padding:'6px 14px',fontSize:12,border:'none',borderBottom:'2px solid',cursor:'pointer',
        background:'transparent',
        borderBottomColor: drawerTab===k ? 'var(--teal)' : 'transparent',
        color: drawerTab===k ? 'var(--teal)' : 'var(--text-muted)',
        fontWeight: drawerTab===k ? 700 : 400}}>
      {label}
    </button>
  );

  return (
    <div>
      {/* Backdrop */}
      <div onClick={onClose}
        style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.35)',zIndex:10000}} />

      {/* Drawer panel */}
      <div style={{position:'fixed',top:0,right:0,bottom:0,width:'min(520px,90vw)',
        background:'#fff',zIndex:10001,display:'flex',flexDirection:'column',
        boxShadow:'-4px 0 24px rgba(0,0,0,0.15)'}}>

        {/* Header */}
        <div style={{padding:'16px 20px',borderBottom:'1px solid var(--border)',flexShrink:0}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
            <div>
              <div style={{fontSize:14,fontWeight:700,color:'var(--text)'}}>
                {call.caller_id_name || call.from_number || 'Unknown Caller'}
              </div>
              <div style={{fontSize:11,color:'var(--text-muted)',marginTop:2,display:'flex',gap:10,flexWrap:'wrap'}}>
                <span>{_fmtTime(call.started_at)}</span>
                <span>·</span>
                <span>{_fmtDur(call.duration_sec)}</span>
                <span>·</span>
                {_statusBadge(call.status)}
              </div>
            </div>
            <button onClick={onClose}
              style={{background:'none',border:'none',fontSize:20,cursor:'pointer',color:'var(--text-muted)',lineHeight:1,padding:'0 4px'}}>
              ×
            </button>
          </div>
        </div>

        {/* Tab bar */}
        <div style={{display:'flex',borderBottom:'1px solid var(--border)',flexShrink:0}}>
          {tabBtn('overview','Overview')}
          {tabBtn('transcript','Transcript')}
          {tabBtn('grade','Grade')}
          {tabBtn('attribution','Attribution')}
        </div>

        {/* Tab content — scrollable */}
        <div style={{flex:1,overflowY:'auto',padding:'16px 20px'}}>

          {/* ── Overview ── */}
          {drawerTab==='overview' && (
            <div>
              {/* Key metadata */}
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px 16px',marginBottom:16,fontSize:12}}>
                {[
                  ['Direction',  call.direction==='inbound'?'↙ Inbound':'↗ Outbound'],
                  ['Answered By', call.answered_by||'—'],
                  ['Team Member', call.team_member||'—'],
                  ['Extension',  call.extension_number||'—'],
                  ['Recording',  call.recording_url?'✓ Available':'—'],
                  ['Attempts',   call.pipeline_attempts||0],
                ].map(([k,v])=>(
                  <div key={k}>
                    <div style={{fontSize:10,color:'var(--text-muted)',marginBottom:2}}>{k}</div>
                    <div style={{fontWeight:500}}>{v}</div>
                  </div>
                ))}
              </div>

              {/* OD Patient status */}
              {call.od_patient_status && (
                <div style={{marginBottom:12,padding:'8px 12px',borderRadius:8,
                  background:'#f8fafc',border:'1px solid var(--border)',fontSize:12}}>
                  <div style={{display:'flex',alignItems:'center',gap:10}}>
                    <span style={{fontWeight:600,color:'var(--text-muted)',fontSize:10}}>OD PATIENT</span>
                    {_patientBadge(call.od_patient_status, call.od_patient_name||call.caller_id_name)}
                    {call.od_patient_name && (
                      <span style={{fontWeight:600,color:'var(--text)'}}>{call.od_patient_name}</span>
                    )}
                    {call.od_patient_num && (
                      <span style={{fontSize:10,color:'var(--text-muted)'}}>PatNum: {call.od_patient_num}</span>
                    )}
                  </div>
                  {call.od_patient_status === 'new_patient' && (
                    <div style={{marginTop:4,fontSize:10,color:'#15803d'}}>
                      📋 Phone not found in OpenDental — likely a new patient inquiry
                    </div>
                  )}
                  {call.od_patient_status === 'existing_active' && (
                    <div style={{marginTop:4,fontSize:10,color:'#1d4ed8'}}>
                      ℹ️ Existing active patient — exclude from offline conversion upload
                    </div>
                  )}
                </div>
              )}

              {/* Outcome badges */}
              <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:16}}>
                {call.lead_quality && (
                  <span style={{padding:'3px 10px',borderRadius:12,fontSize:11,fontWeight:700,
                    background:'#f0f9ff',color:'#0369a1',border:'1px solid #bae6fd'}}>
                    {lqLabels[call.lead_quality]||call.lead_quality}
                  </span>
                )}
                {call.handling_grade && (
                  <span style={{padding:'3px 10px',borderRadius:12,fontSize:11,fontWeight:700,
                    background:(hgColors[call.handling_grade]||'#6b7280')+'18',
                    color:hgColors[call.handling_grade]||'#6b7280',
                    border:`1px solid ${(hgColors[call.handling_grade]||'#6b7280')}44`}}>
                    {hgLabels[call.handling_grade]||call.handling_grade}
                  </span>
                )}
                {call.booked_outcome && (
                  <span style={{padding:'3px 10px',borderRadius:12,fontSize:11,fontWeight:700,
                    background:(boColors[call.booked_outcome]||'#6b7280')+'18',
                    color:boColors[call.booked_outcome]||'#6b7280',
                    border:`1px solid ${(boColors[call.booked_outcome]||'#6b7280')}44`}}>
                    {boLabels[call.booked_outcome]||call.booked_outcome}
                  </span>
                )}
                {call.is_empty ? (
                  <span style={{padding:'3px 10px',borderRadius:12,fontSize:11,fontWeight:700,
                    background:'#fef9c3',color:'#854d0e',border:'1px solid #fde68a'}}>
                    ⚠ Empty call
                  </span>
                ) : null}
              </div>

              {/* Summary */}
              {call.summary ? (
                <div style={{background:'#f8fafc',border:'1px solid var(--border)',borderRadius:8,padding:'12px 14px',fontSize:12}}>
                  <div style={{fontSize:10,fontWeight:600,color:'var(--text-muted)',marginBottom:6,textTransform:'uppercase',letterSpacing:'0.05em'}}>AI Summary</div>
                  <div style={{color:'var(--text)',lineHeight:1.6}}>{call.summary}</div>
                  {call.summarized_at && <div style={{fontSize:10,color:'var(--text-muted)',marginTop:6}}>Summarized {_fmtTime(call.summarized_at)}</div>}
                </div>
              ) : (
                <div style={{color:'var(--text-muted)',fontSize:12,fontStyle:'italic'}}>No summary yet — analyze this call to generate one.</div>
              )}

              {/* Pipeline error */}
              {call.pipeline_error && (
                <div style={{marginTop:12,background:'#fef2f2',border:'1px solid #fecaca',borderRadius:6,padding:'8px 12px',fontSize:11,color:'#dc2626'}}>
                  ⚠ Pipeline error: {call.pipeline_error}
                </div>
              )}
            </div>
          )}

          {/* ── Transcript ── */}
          {drawerTab==='transcript' && (
            <div>
              {call.is_empty && (
                <div style={{background:'#fef9c3',border:'1px solid #fde68a',borderRadius:6,padding:'8px 12px',marginBottom:12,fontSize:11,color:'#854d0e'}}>
                  ⚠ Empty call — voicemail or greeting only
                </div>
              )}
              {call.call_transcript ? (
                <pre style={{background:'#f8fafc',border:'1px solid var(--border)',borderRadius:8,padding:'14px',
                  fontSize:11,lineHeight:1.7,whiteSpace:'pre-wrap',wordBreak:'break-word',
                  maxHeight:'60vh',overflowY:'auto',margin:0,color:'var(--text)'}}>
                  {call.call_transcript}
                </pre>
              ) : (
                <div style={{textAlign:'center',padding:'40px 0',color:'var(--text-muted)'}}>
                  <div style={{fontSize:32,marginBottom:12}}>🎙</div>
                  <div style={{fontSize:13,marginBottom:16}}>
                    {call.transcription_status==='pending' ? 'Not yet transcribed. Click Transcribe to begin.' :
                     call.transcription_status==='in_progress' ? '⚙ Transcribing…' :
                     call.transcription_status==='failed' ? '✗ Transcription failed' :
                     'No transcript available'}
                  </div>
                  {(!call.transcription_status || call.transcription_status==='pending' || call.transcription_status==='failed') && (
                    <button onClick={()=>onAnalyze(call.uuid)}
                      style={{padding:'8px 20px',background:'var(--teal)',color:'#fff',border:'none',
                        borderRadius:6,cursor:'pointer',fontSize:12,fontWeight:600}}>
                      ▶ Transcribe This Call
                    </button>
                  )}
                  {call.transcription_status==='failed' && call.pipeline_error && (
                    <div style={{marginTop:10,fontSize:11,color:'#dc2626'}}>{call.pipeline_error}</div>
                  )}
                </div>
              )}
              {call.transcript_model && (
                <div style={{marginTop:8,fontSize:10,color:'var(--text-muted)'}}>Model: {call.transcript_model}</div>
              )}
            </div>
          )}

          {/* ── Grade ── */}
          {drawerTab==='grade' && (
            <div>
              {call.grade_gradeable === 0 ? (
                <div style={{background:'#f8fafc',border:'1px solid var(--border)',borderRadius:8,padding:'16px',marginBottom:16}}>
                  <div style={{fontWeight:600,color:'var(--text-muted)',marginBottom:6}}>Not Gradeable</div>
                  <div style={{fontSize:12,color:'var(--text-muted)'}}>{call.grade_reason || 'This call type does not require grading.'}</div>
                </div>
              ) : (
                <>
                  {/* Overall score */}
                  {call.grade_overall_score != null && (
                    <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:16}}>
                      <div style={{fontSize:36,fontWeight:800,color:call.grade_overall_score>=80?'#16a34a':call.grade_overall_score>=60?'#d97706':'#dc2626'}}>
                        {call.grade_overall_score}%
                      </div>
                      {call.grade_overall_notes && (
                        <div style={{fontSize:12,color:'var(--text)',lineHeight:1.5,flex:1}}>{call.grade_overall_notes}</div>
                      )}
                    </div>
                  )}

                  {/* Criteria scores table */}
                  {scores.length > 0 && (
                    <div style={{marginBottom:16}}>
                      <div style={{fontSize:11,fontWeight:700,color:'var(--text-muted)',marginBottom:8,textTransform:'uppercase',letterSpacing:'0.05em'}}>Criteria Scores</div>
                      <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
                        <thead>
                          <tr style={{background:'var(--bg-card)'}}>
                            {['Criterion','Score','Notes'].map(h=>(
                              <th key={h} style={{padding:'6px 8px',textAlign:'left',fontWeight:600,fontSize:11,color:'var(--text-muted)',borderBottom:'1px solid var(--border)'}}>{h}</th>
                            ))}
                          </tr>
                        </thead>
                        <tbody>
                          {scores.map((s,i)=>(
                            <tr key={i} style={{borderBottom:'1px solid var(--border)'}}>
                              <td style={{padding:'6px 8px',fontWeight:500}}>{s.criterion||s.name||'—'}</td>
                              <td style={{padding:'6px 8px'}}>{_gradeBadge(s.score)}</td>
                              <td style={{padding:'6px 8px',color:'var(--text-muted)',fontSize:11}}>{s.notes||'—'}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  )}

                  {/* Recommendations */}
                  {recs.length > 0 && (
                    <div style={{marginBottom:16}}>
                      <div style={{fontSize:11,fontWeight:700,color:'var(--text-muted)',marginBottom:8,textTransform:'uppercase',letterSpacing:'0.05em'}}>Recommendations</div>
                      <ul style={{margin:0,paddingLeft:16,fontSize:12,lineHeight:1.8,color:'var(--text)'}}>
                        {recs.map((r,i)=><li key={i}>{r}</li>)}
                      </ul>
                    </div>
                  )}

                  {!call.grade_overall_score && !scores.length && (
                    <div style={{color:'var(--text-muted)',fontSize:12,fontStyle:'italic',marginBottom:16}}>
                      No grade yet — transcribe the call first, then re-grade.
                    </div>
                  )}
                </>
              )}

              {/* Re-grade button */}
              <div style={{borderTop:'1px solid var(--border)',paddingTop:14,display:'flex',alignItems:'center',gap:10}}>
                <button onClick={doGrade} disabled={grading || !call.call_transcript}
                  title={!call.call_transcript?'Transcribe first':'Re-run grading with current criteria'}
                  style={{padding:'7px 18px',background:grading?'var(--bg-card)':'var(--teal)',color:grading?'var(--text-muted)':'#fff',
                    border:'1px solid var(--teal)',borderRadius:6,cursor:(!call.call_transcript||grading)?'not-allowed':'pointer',fontSize:12,fontWeight:600}}>
                  {grading ? '⚙ Grading…' : '↺ Re-grade'}
                </button>
                {gradeMsg && <span style={{fontSize:11,color:gradeMsg.startsWith('✓')?'#16a34a':'#dc2626'}}>{gradeMsg}</span>}
                {call.graded_at && <span style={{fontSize:10,color:'var(--text-muted)',marginLeft:'auto'}}>Graded {_fmtTime(call.graded_at)}</span>}
              </div>
            </div>
          )}

          {/* ── Attribution ── */}
          {drawerTab==='attribution' && (
            <div style={{fontSize:12}}>
              <div style={{display:'grid',gridTemplateColumns:'auto 1fr',gap:'10px 16px',alignItems:'start'}}>
                {[
                  ['Attribution', call.attribution_label || '—'],
                  ['From Number', call.from_number || '—'],
                  ['Caller ID',   call.caller_id_name || '—'],
                  ['To Number',   call.to_number || '—'],
                ].map(([k,v])=>(
                  <React.Fragment key={k}>
                    <div style={{color:'var(--text-muted)',fontWeight:500,whiteSpace:'nowrap'}}>{k}</div>
                    <div>{v}</div>
                  </React.Fragment>
                ))}

                {/* Campaign — GAds preferred, lead fallback */}
                {(call.effective_campaign_name || call.gads_campaign_name || call.lead_campaign_name) && (
                  <React.Fragment>
                    <div style={{color:'var(--text-muted)',fontWeight:500}}>Campaign</div>
                    <div>
                      <span style={{fontWeight:600,color:'#0369a1'}}>
                        {call.effective_campaign_name || call.gads_campaign_name || call.lead_campaign_name}
                      </span>
                      {call.gads_campaign_name
                        ? <span style={{marginLeft:6,fontSize:10,background:'#dbeafe',color:'#1e40af',padding:'1px 5px',borderRadius:3}}>GAds</span>
                        : <span style={{marginLeft:6,fontSize:10,background:'#f0fdf4',color:'#166534',padding:'1px 5px',borderRadius:3}}>Lead</span>
                      }
                    </div>
                  </React.Fragment>
                )}

                {/* OD Appointment */}
                {call.od_appointment_id ? (
                  <React.Fragment>
                    <div style={{color:'var(--text-muted)',fontWeight:500}}>OD Appointment</div>
                    <div>
                      <span style={{fontWeight:600,color:'#166534'}}>✓ Confirmed</span>
                      <span style={{marginLeft:8,fontSize:10,color:'var(--text-muted)'}}>AptNum {call.od_appointment_id}</span>
                    </div>
                  </React.Fragment>
                ) : call.booked_outcome === 'booked' ? (
                  <React.Fragment>
                    <div style={{color:'var(--text-muted)',fontWeight:500}}>OD Appointment</div>
                    <div style={{color:'#92400e'}}>⏳ Graded booked — OD match pending</div>
                  </React.Fragment>
                ) : null}

                {call.gads_call_id && (<React.Fragment>
                  <div style={{color:'var(--text-muted)',fontWeight:500}}>GAds Call ID</div>
                  <code style={{fontSize:10}}>{call.gads_call_id}</code>
                </React.Fragment>)}

                {call.match_method && (<React.Fragment>
                  <div style={{color:'var(--text-muted)',fontWeight:500}}>Match Method</div>
                  <div>{call.match_method} ({Math.round((call.match_confidence||0)*100)}% confidence)</div>
                </React.Fragment>)}

                {call.lead_id && (<React.Fragment>
                  <div style={{color:'var(--text-muted)',fontWeight:500}}>Lead ID</div>
                  <div>
                    <code style={{fontSize:10}}>{call.lead_id}</code>
                  </div>
                </React.Fragment>)}

                <div style={{color:'var(--text-muted)',fontWeight:500}}>UUID</div>
                <code style={{fontSize:10,wordBreak:'break-all'}}>{call.uuid}</code>
              </div>

              {!call.gads_call_id && !call.match_method && !call.lead_id && !call.effective_campaign_name && (
                <div style={{marginTop:16,color:'var(--text-muted)',fontStyle:'italic'}}>
                  No Google Ads or lead attribution for this call.
                </div>
              )}
            </div>
          )}

        </div>{/* end scrollable content */}
      </div>{/* end drawer panel */}
    </div>
  );
}

// ── CallPerformanceSubView — team member scoreboard ───────────────────────────

function CallPerformanceSubView() {
  const [days, setDays]         = useState(30);
  const [data, setData]         = useState(null);  // {period_days, members:[]}
  const [criteria, setCriteria] = useState([]);    // [{name, sort_order}] for column ordering
  const [loading, setLoading]   = useState(false);
  const reqId = React.useRef(0);

  useEffect(() => {
    let myId = ++reqId.current;
    setLoading(true);
    Promise.all([
      api(`/api/admin/calls/analysis/performance?days=${days}`),
      api('/api/admin/calls/analysis/criteria'),
    ]).then(([perf, crit]) => {
      if (reqId.current !== myId) return;
      setData(perf);
      setCriteria((crit.criteria || []).sort((a,b) => (a.sort_order||0) - (b.sort_order||0)));
    }).catch(e => {
      if (reqId.current !== myId) return;
      console.error('Performance load error', e);
    }).finally(() => {
      if (reqId.current === myId) setLoading(false);
    });
  }, [days]);

  function scoreColor(s) {
    if (s == null) return 'var(--text-muted)';
    return s >= 80 ? 'var(--green)' : s >= 60 ? 'var(--yellow)' : 'var(--red)';
  }

  // Build ordered column list from criteria (only those present in any member's data)
  const members = data?.members || [];
  const allMemberCriteria = new Set(members.flatMap(m => Object.keys(m.criteria || {})));
  // Use criteria sort_order if available; fallback to alphabetical
  const orderedCriteria = criteria.filter(c => allMemberCriteria.has(c.name));
  const orderedCriteriaNames = orderedCriteria.map(c => c.name);
  // Add any that didn't appear in the criteria list (alphabetical fallback)
  [...allMemberCriteria].sort().forEach(n => {
    if (!orderedCriteriaNames.includes(n)) orderedCriteriaNames.push(n);
  });

  return (
    <div>
      {/* Days filter */}
      <div style={{display:'flex',gap:4,marginBottom:16,alignItems:'center'}}>
        <span style={{fontSize:11,color:'var(--text-muted)',marginRight:4}}>Period:</span>
        {[7,14,30,90].map(d => (
          <button key={d} onClick={() => setDays(d)}
            style={{padding:'3px 8px',fontSize:10,border:'1px solid var(--border)',borderRadius:4,cursor:'pointer',
              background:days===d?'var(--teal)':'#fff',color:days===d?'#fff':'var(--text-muted)'}}>
            {d}d
          </button>
        ))}
        {loading && <span style={{fontSize:11,color:'var(--text-muted)',marginLeft:8}}>Loading…</span>}
      </div>

      {!loading && members.length === 0 && (
        <div style={{padding:'40px 0',textAlign:'center',color:'var(--text-muted)',fontSize:13}}>
          No graded calls in this period — analyze some calls first.
        </div>
      )}

      {members.length > 0 && (
        <div style={{background:'#fff',border:'1px solid var(--border)',borderRadius:8,overflow:'auto'}}>
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
            <thead>
              <tr style={{background:'var(--bg-card)',borderBottom:'1px solid var(--border)'}}>
                <th style={{padding:'8px 12px',textAlign:'left',fontWeight:600,fontSize:11,color:'var(--text-muted)',whiteSpace:'nowrap'}}>Team Member</th>
                <th style={{padding:'8px 12px',textAlign:'center',fontWeight:600,fontSize:11,color:'var(--text-muted)',whiteSpace:'nowrap'}}>Graded Calls</th>
                <th style={{padding:'8px 12px',textAlign:'center',fontWeight:600,fontSize:11,color:'var(--text-muted)',whiteSpace:'nowrap'}}>Overall Score</th>
                {orderedCriteriaNames.map(name => (
                  <th key={name} style={{padding:'8px 12px',textAlign:'center',fontWeight:600,fontSize:11,color:'var(--text-muted)',whiteSpace:'nowrap',maxWidth:120}}>
                    {name}
                  </th>
                ))}
              </tr>
            </thead>
            <tbody>
              {members.map((m, i) => (
                <tr key={m.name} style={{borderBottom:'1px solid var(--border)',background:i%2===0?'#fff':'#fafafa'}}>
                  <td style={{padding:'8px 12px',fontWeight:600}}>{m.name}</td>
                  <td style={{padding:'8px 12px',textAlign:'center',color:'var(--text-muted)'}}>{m.calls}</td>
                  <td style={{padding:'8px 12px',textAlign:'center'}}>
                    <span style={{fontWeight:700,fontSize:14,color:scoreColor(m.avg_score)}}>
                      {m.avg_score != null ? m.avg_score + '%' : '—'}
                    </span>
                  </td>
                  {orderedCriteriaNames.map(name => {
                    const val = m.criteria?.[name];
                    return (
                      <td key={name} style={{padding:'8px 12px',textAlign:'center'}}>
                        {val != null
                          ? <span style={{fontWeight:600,color:scoreColor(val)}}>{val}%</span>
                          : <span style={{color:'var(--text-muted)'}}>—</span>}
                      </td>
                    );
                  })}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
      <div style={{marginTop:8,fontSize:10,color:'var(--text-muted)'}}>
        {data ? `${members.length} team member${members.length!==1?'s':''} · Last ${data.period_days} days` : ''}
      </div>
    </div>
  );
}

// ── CallSettingsSubView — pipeline toggles + criteria editor + team members ────

function CallSettingsSubView() {
  // ── Pipeline toggles state ──────────────────────────────────────────────────
  const PIPE_EMPTY = { mango_enabled: false, mango_pipeline_enabled: false, mango_pipeline_auto_grade: true };
  const [pipeForm, setPipeForm]   = useState(PIPE_EMPTY);
  const [pipeLoading, setPipeLoading] = useState(true);
  const [pipeSaving, setPipeSaving]   = useState(false);
  const [pipeMsg, setPipeMsg]         = useState('');

  // ── Criteria state ──────────────────────────────────────────────────────────
  const [criteria, setCriteria]       = useState([]);
  const [critLoading, setCritLoading] = useState(true);
  const [critSaving, setCritSaving]   = useState(false);
  const [critMsg, setCritMsg]         = useState('');
  const [newCritName, setNewCritName] = useState('');

  // ── Team members state ──────────────────────────────────────────────────────
  const [members, setMembers]       = useState([]);
  const [tmLoading, setTmLoading]   = useState(true);
  const [tmSaving, setTmSaving]     = useState(false);
  const [tmMsg, setTmMsg]           = useState('');
  const [newName, setNewName]       = useState('');
  const [newExt, setNewExt]         = useState('');

  useEffect(() => {
    // Load pipeline settings
    api('/api/admin/mango-settings')
      .then(d => setPipeForm({
        mango_enabled:             !!d.mango_enabled,
        mango_pipeline_enabled:    !!d.mango_pipeline_enabled,
