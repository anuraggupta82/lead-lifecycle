<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pipeline Dashboard — Grafton Dental Care</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --teal: #0d7a7f; --teal-dark: #0a5f63; --teal-light: #e8f4f4;
      --green: #22c55e; --yellow: #f59e0b; --red: #ef4444; --purple: #8b5cf6;
      --gray: #6b7280; --gray-light: #f3f4f6; --border: #e5e7eb;
      --text: #111827; --text-muted: #6b7280;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
           background: #f0f4f8; color: var(--text); min-height: 100vh; }
    #root { display: flex; flex-direction: column; min-height: 100vh; }

    .header { background: var(--teal-dark); color: #fff; padding: 0 20px;
               display: flex; align-items: center; gap: 12px; height: 44px; flex-shrink: 0; }
    .header-logo { font-size: 15px; font-weight: 700; white-space: nowrap; }
    .header-logo span { color: #5eead4; }
    .header-right { margin-left: auto; display: flex; gap: 8px; align-items: center; font-size: 11px; }
    .header-dot { width: 6px; height: 6px; border-radius: 50%; background: #5eead4; }

    .btn { padding: 5px 10px; border-radius: 5px; border: none; cursor: pointer;
            font-size: 11px; font-weight: 500; transition: all .15s; }
    .btn:hover { opacity: .85; }
    .btn-teal { background: var(--teal); color: #fff; }
    .btn-white { background: rgba(255,255,255,.15); color: #fff; border: 1px solid rgba(255,255,255,.3); }
    .btn-sm { padding: 3px 8px; font-size: 10px; }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-muted); }

    /* Tabs */
    .tab-bar { background: #fff; border-bottom: 1px solid var(--border); display: flex; gap: 0; flex-shrink: 0; }
    .tab { padding: 8px 20px; font-size: 12px; font-weight: 500; cursor: pointer; border-bottom: 2px solid transparent;
           color: var(--text-muted); background: none; border-top: none; border-left: none; border-right: none; }
    .tab:hover { color: var(--text); background: var(--gray-light); }
    .tab.active { color: var(--teal); border-bottom-color: var(--teal); font-weight: 600; }

    /* Main content */
    .main { flex: 1; overflow-y: auto; padding: 12px 16px; }

    /* KPI strip */
    .kpi-strip { display: flex; gap: 0; background: #fff; border: 1px solid var(--border);
                 border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
    .kpi { flex: 1; padding: 10px 12px; text-align: center; border-right: 1px solid var(--border); }
    .kpi:last-child { border-right: none; }
    .kpi-val { font-size: 20px; font-weight: 700; color: var(--teal); line-height: 1.1; }
    .kpi-label { font-size: 9px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .3px; margin-top: 2px; }

    /* Filter bar */
    .filter-bar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
    .filter-select { padding: 5px 10px; border: 1px solid var(--border); border-radius: 5px;
                     font-size: 11px; background: #fff; color: var(--text); }
    .search-box { padding: 5px 10px; border: 1px solid var(--border); border-radius: 5px;
                  font-size: 11px; width: 200px; }
    .search-box:focus, .filter-select:focus { outline: none; border-color: var(--teal); }

    /* Stage rows */
    .stage-row { background: #fff; border: 1px solid var(--border); border-radius: 8px;
                 margin-bottom: 4px; display: flex; align-items: center; flex-wrap: wrap;
                 padding: 6px 12px; gap: 6px; min-height: 40px; }
    .stage-row.drag-over { background: rgba(13,122,127,.04); border-color: var(--teal); }
    .stage-row.special { border-left: 3px solid; }
    .stage-row.followup-row { border-left-color: #f59e0b; background: #fffbeb; }
    .stage-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .stage-label { font-size: 11px; font-weight: 600; color: var(--text); white-space: nowrap; }
    .stage-count { font-size: 10px; font-weight: 600; background: var(--gray-light); padding: 0 6px;
                   border-radius: 8px; color: var(--text-muted); }
    .stage-sep { width: 1px; height: 20px; background: var(--border); flex-shrink: 0; }

    /* Lead chips */
    .lead-chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px;
                 border: 1px solid var(--border); border-radius: 6px; background: #fff;
                 cursor: pointer; font-size: 11px; transition: all .12s; white-space: nowrap;
                 max-width: 300px; }
    .lead-chip:hover { border-color: var(--teal); background: var(--teal-light); }
    .lead-chip.selected { border-color: var(--teal); box-shadow: 0 0 0 2px rgba(13,122,127,.15); }
    .lead-chip.has-priority { border-left: 3px solid var(--yellow); }
    .chip-name { font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; }
    .chip-source { font-size: 8px; padding: 0 4px; border-radius: 3px; font-weight: 600; line-height: 14px; }
    .src-google { background: #dbeafe; color: #1d4ed8; }
    .src-fb { background: #ede9fe; color: #7c3aed; }
    .src-smile { background: #f3e8ff; color: #9333ea; }
    .src-phone { background: #fef9c3; color: #854d0e; }
    .src-form { background: #d1fae5; color: #065f46; }
    .src-chat { background: #fce7f3; color: #be185d; }
    .src-default { background: var(--gray-light); color: var(--gray); }
    .chip-phone { font-size: 10px; color: var(--text-muted); }
    .chip-time { font-size: 9px; color: var(--text-muted); }
    .chip-revenue { font-size: 9px; color: #059669; font-weight: 700; }
    .chip-notes { font-size: 8px; background: #fef3c7; color: #92400e; padding: 0 3px;
                  border-radius: 3px; font-weight: 700; }
    .chip-campaign { font-size: 8px; color: var(--purple); font-weight: 500; max-width: 80px;
                     overflow: hidden; text-overflow: ellipsis; }
    .chip-appt { font-size: 8px; color: #059669; font-weight: 600; }

    /* Detail modal */
    .detail-backdrop { position: fixed; top: 0; left: 0; right: 0; bottom: 0;
                       background: rgba(0,0,0,.45); z-index: 99;
                       display: flex; align-items: center; justify-content: center; }
    .detail-overlay { position: relative; width: 620px; max-width: 95vw;
                      max-height: 88vh; background: #fff; border-radius: 12px;
                      box-shadow: 0 8px 40px rgba(0,0,0,.18); z-index: 100;
                      display: flex; flex-direction: column;
                      opacity: 0; transform: scale(.96); transition: opacity .18s ease, transform .18s ease; }
    .detail-overlay.open { opacity: 1; transform: scale(1); }
    .detail-header { padding: 14px 18px; border-bottom: 1px solid var(--border);
                     display: flex; align-items: center; gap: 8px; flex-shrink: 0; border-radius: 12px 12px 0 0; }
    .detail-close { background: none; border: none; font-size: 18px; cursor: pointer; color: var(--text-muted); }
    .detail-body { flex: 1; overflow-y: auto; padding: 14px 18px; }
    .detail-section { margin-bottom: 14px; }
    .detail-section-title { font-size: 10px; font-weight: 600; text-transform: uppercase;
                            color: var(--text-muted); letter-spacing: .4px; margin-bottom: 6px; }
    .detail-row { display: flex; justify-content: space-between; align-items: flex-start;
                  padding: 4px 0; font-size: 11px; border-bottom: 1px solid #f5f5f5; gap: 12px; }
    .detail-row-label { color: var(--text-muted); flex-shrink: 0; }
    .detail-row-value { font-weight: 500; text-align: right; word-break: break-word; white-space: normal; }

    /* Stage move menu */
    .stage-move-menu { position: absolute; top: 100%; right: 0; background: #fff; border: 1px solid var(--border);
                       border-radius: 6px; box-shadow: 0 4px 12px rgba(0,0,0,.1); z-index: 100;
                       min-width: 180px; max-height: 280px; overflow-y: auto; white-space: nowrap; }
    .stage-move-item { padding: 6px 10px; font-size: 11px; cursor: pointer; display: flex;
                       align-items: center; gap: 6px; }
    .stage-move-item:hover { background: var(--teal-light); }
    .stage-move-item.current { background: #f0fdf4; font-weight: 600; }

    /* Notes */
    .note-item { background: #fffbeb; border: 1px solid #fef3c7; border-radius: 5px;
                 padding: 6px 8px; margin-bottom: 4px; font-size: 11px; }
    .note-header { display: flex; justify-content: space-between; margin-bottom: 2px; }
    .note-author { font-weight: 600; color: #92400e; font-size: 10px; }
    .note-time { color: var(--text-muted); font-size: 9px; }
    .note-input { width: 100%; border: 1px solid var(--border); border-radius: 5px;
                  padding: 6px 8px; font-size: 11px; resize: vertical; min-height: 50px; font-family: inherit; }
    .note-input:focus { outline: none; border-color: var(--teal); }

    /* Timeline */
    .timeline-item { display: flex; gap: 6px; padding: 4px 0; border-bottom: 1px solid #f5f5f5; font-size: 10px; }
    .timeline-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--teal); margin-top: 4px; flex-shrink: 0; }
    .timeline-type { font-weight: 600; color: var(--teal); }
    .timeline-time { color: var(--text-muted); font-size: 9px; white-space: nowrap; margin-left: auto; }

    /* Follow-up queue */
    .fq-item { display: flex; gap: 4px; align-items: center; padding: 3px 0; font-size: 10px; border-bottom: 1px solid #f5f5f5; }
    .fq-status { padding: 1px 4px; border-radius: 3px; font-size: 9px; font-weight: 500; }
    .fq-pending { background: #fef9c3; color: #854d0e; }
    .fq-sent { background: #d1fae5; color: #065f46; }
    .fq-skipped { background: #e5e7eb; color: #6b7280; }
    .fq-failed { background: #fef2f2; color: #dc2626; }

    /* Manual messaging thread */
    .msg-thread { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
    .msg-bubble { max-width: 85%; padding: 6px 10px; border-radius: 10px; font-size: 11px; line-height: 1.4; position: relative; }
    .msg-bubble.outbound { align-self: flex-end; background: var(--teal); color: #fff; border-bottom-right-radius: 3px; }
    .msg-bubble.auto-item { align-self: flex-start; background: #f3f4f6; color: var(--text); border-bottom-left-radius: 3px; border: 1px solid var(--border); }
    .msg-meta { font-size: 9px; margin-top: 2px; opacity: 0.7; }
    .msg-bubble.outbound .msg-meta { text-align: right; }
    .msg-tag { display: inline-block; font-size: 8px; font-weight: 600; text-transform: uppercase;
               padding: 1px 4px; border-radius: 3px; margin-bottom: 2px; letter-spacing: .4px; }
    .msg-tag.auto { background: #e0e7ff; color: #3730a3; }
    .msg-tag.manual { background: #d1fae5; color: #065f46; }
    .compose-bar { border-top: 1px solid var(--border); padding-top: 10px; margin-top: 4px; }
    .compose-channel { display: flex; gap: 4px; margin-bottom: 7px; }
    .compose-channel button { padding: 3px 10px; border-radius: 12px; border: 1px solid var(--border);
                              font-size: 10px; font-weight: 600; cursor: pointer; background: #fff; color: var(--text-muted); }
    .compose-channel button.active { background: var(--teal); color: #fff; border-color: var(--teal); }
    .compose-textarea { width: 100%; box-sizing: border-box; border: 1px solid var(--border);
                        border-radius: 6px; padding: 6px 8px; font-size: 11px; resize: vertical;
                        font-family: inherit; min-height: 52px; }
    .compose-textarea:focus { outline: none; border-color: var(--teal); }
    .compose-subject { width: 100%; box-sizing: border-box; border: 1px solid var(--border);
                       border-radius: 6px; padding: 5px 8px; font-size: 11px; margin-bottom: 4px;
                       font-family: inherit; }
    .compose-subject:focus { outline: none; border-color: var(--teal); }
    .compose-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 5px; }
    .char-count { font-size: 9px; color: var(--text-muted); }
    .char-count.warn { color: #f59e0b; }
    .char-count.over { color: var(--red); }

    /* Reports & Admin */
    .report-section { background: #fff; border: 1px solid var(--border); border-radius: 8px;
                      padding: 14px; margin-bottom: 12px; }
    .report-title { font-size: 13px; font-weight: 600; margin-bottom: 10px; }
    .report-table { width: 100%; border-collapse: collapse; font-size: 11px; }
    .report-table th { text-align: left; padding: 6px 8px; background: var(--gray-light);
                       font-weight: 600; font-size: 10px; text-transform: uppercase;
                       letter-spacing: .3px; color: var(--text-muted); border-bottom: 1px solid var(--border); }
    .report-table td { padding: 6px 8px; border-bottom: 1px solid #f5f5f5; }
    .report-table tr:hover td { background: #fafafa; }
    .report-table .num { text-align: right; font-variant-numeric: tabular-nums; }
    .report-table .money { color: #059669; font-weight: 600; }

    /* Reports sub-view toggle */
    .reports-view-toggle { display: flex; gap: 4px; margin-bottom: 14px; }
    .reports-view-btn { padding: 5px 14px; font-size: 11px; font-weight: 500; border: 1px solid var(--border);
                        border-radius: 20px; background: #fff; cursor: pointer; color: var(--text-muted); }
    .reports-view-btn.active { background: var(--teal); color: #fff; border-color: var(--teal); }

    /* Status pill for search terms */
    .st-status { display: inline-block; padding: 1px 6px; border-radius: 10px; font-size: 9px; font-weight: 600; }
    .st-status.added { background: #d1fae5; color: #065f46; }
    .st-status.excluded { background: #fee2e2; color: #991b1b; }
    .st-status.none { background: #f1f5f9; color: #64748b; }

    /* Trend chart container */
    .trend-chart-wrap { padding: 12px; }
    .trend-empty { color: var(--text-muted); font-size: 11px; font-style: italic; padding: 16px 0; text-align: center; }
    .trend-svg { display: block; width: 100%; max-width: 480px; border: 1px solid var(--border);
                 border-radius: 4px; background: #fafafa; }

    .admin-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .time-range { display: flex; gap: 4px; }
    .time-range button { padding: 4px 8px; font-size: 10px; border: 1px solid var(--border); border-radius: 4px; background: #fff; cursor: pointer; }
    .time-range button.active { background: var(--teal); color: #fff; border-color: var(--teal); }

    /* Campaign analytics expand panel */
    .camp-analytics-row { background: #f8fafc; border-top: 1px solid var(--border); }
    .camp-analytics-inner { padding: 12px 14px; }
    .camp-analytics-grid { display: grid; grid-template-columns: repeat(5,1fr); gap: 8px; margin-bottom: 12px; }
    .camp-kpi { background: #fff; border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; text-align: center; }
    .camp-kpi-val { font-size: 16px; font-weight: 700; color: var(--teal); }
    .camp-kpi-label { font-size: 9px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .3px; margin-top: 1px; }
    .date-filter-bar { display: flex; gap: 6px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
    .date-filter-bar label { font-size: 10px; color: var(--text-muted); }
    .date-input { padding: 3px 6px; border: 1px solid var(--border); border-radius: 4px; font-size: 10px; }
    .date-input:focus { outline: none; border-color: var(--teal); }
    .btn-expand { padding: 2px 7px; font-size: 10px; border: 1px solid var(--border); border-radius: 4px; background: #fff; cursor: pointer; color: var(--text-muted); }
    .btn-expand:hover { border-color: var(--teal); color: var(--teal); }
    .btn-expand.active { background: var(--teal-light); border-color: var(--teal); color: var(--teal); }

    /* Memory module */
    .memory-row { display: flex; gap: 8px; align-items: flex-start; padding: 6px 8px; border-bottom: 1px solid #f5f5f5; font-size: 11px; }
    .memory-category { padding: 2px 6px; border-radius: 3px; font-size: 9px; font-weight: 600; white-space: nowrap; }
    .mem-cat-override { background: #fef3c7; color: #92400e; }
    .mem-cat-classification { background: #dbeafe; color: #1d4ed8; }
    .mem-cat-rule { background: #d1fae5; color: #065f46; }
    .mem-cat-general { background: #f3f4f6; color: #374151; }
    .memory-key { font-weight: 600; flex: 1; }
    .memory-value { color: var(--teal); font-weight: 600; }
    .memory-reason { font-size: 10px; color: var(--text-muted); flex: 2; }
    .memory-author { font-size: 9px; color: var(--text-muted); white-space: nowrap; }

    .ai-chat { display: flex; flex-direction: column; height: 300px; }
    .ai-messages { flex: 1; overflow-y: auto; padding: 8px; border: 1px solid var(--border); border-radius: 5px;
                   background: #f9f9f9; margin-bottom: 8px; font-size: 11px; }
    .ai-message { padding: 6px; margin-bottom: 4px; border-radius: 4px; background: #fff; border: 1px solid var(--border); }
    .ai-input-area { display: flex; gap: 4px; }
    .ai-input-area textarea { flex: 1; padding: 6px; border: 1px solid var(--border); border-radius: 4px; font-size: 11px; font-family: inherit; resize: none; }
    .ai-input-area button { padding: 6px 10px; background: var(--teal); color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 10px; }

    .feature-list { font-size: 10px; color: var(--text-muted); margin: 6px 0; }
    .feature-list li { margin-left: 14px; }
    .coming-soon-badge { display: inline-block; background: #fef9c3; color: #854d0e; padding: 2px 6px; border-radius: 3px; font-size: 9px; font-weight: 600; margin-top: 4px; }

    .empty-row { font-size: 10px; color: var(--text-muted); font-style: italic; }

    /* ── Kanban Board ─────────────────────────────────────────────────────── */
    .kanban-board { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; align-items: flex-start; }
    .kanban-board::-webkit-scrollbar { height: 6px; }
    .kanban-board::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .kanban-col { flex: 0 0 210px; background: #fff; border: 1px solid var(--border);
                  border-radius: 8px; display: flex; flex-direction: column;
                  max-height: calc(100vh - 170px); min-height: 100px; }
    .kanban-col.drag-over { background: rgba(13,122,127,.05); border-color: var(--teal); }
    .kanban-col-header { padding: 8px 10px; border-bottom: 1px solid var(--border);
                         display: flex; align-items: center; gap: 6px; flex-shrink: 0;
                         border-radius: 7px 7px 0 0; border-top: 3px solid transparent; }
    .kanban-col-header .stage-label { font-size: 11px; font-weight: 600; }
    .kanban-col-header .stage-count { font-size: 10px; font-weight: 600; background: var(--gray-light);
                                       padding: 0 6px; border-radius: 8px; color: var(--text-muted); }
    .kanban-col-body { flex: 1; overflow-y: auto; padding: 6px; display: flex;
                       flex-direction: column; gap: 5px; }
    .kanban-col-body::-webkit-scrollbar { width: 4px; }
    .kanban-col-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .kanban-card { background: #fff; border: 1px solid var(--border); border-radius: 6px;
                   padding: 8px 10px; cursor: pointer; transition: all .12s; font-size: 11px;
                   display: flex; flex-direction: column; gap: 3px; user-select: none; }
    .kanban-card:hover { border-color: var(--teal); box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .kanban-card.selected { border-color: var(--teal); box-shadow: 0 0 0 2px rgba(13,122,127,.15); }
    .kanban-card.needs-followup { border-left: 3px solid #f59e0b; }
    .kanban-card.dragging { opacity: .5; }
    .kc-name { font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .kc-row { display: flex; justify-content: space-between; align-items: center; gap: 4px; }
    .kc-meta { font-size: 10px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .kc-revenue { font-size: 10px; color: #059669; font-weight: 700; }
    .kc-time { font-size: 9px; color: var(--text-muted); white-space: nowrap; }
    .kc-badge { font-size: 8px; padding: 1px 4px; border-radius: 3px; font-weight: 600; }
    .kc-notes { background: #fef3c7; color: #92400e; }
    .kc-appt { background: #d1fae5; color: #065f46; }
    .kc-kw { background: #ede9fe; color: #7c3aed; max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block; vertical-align: middle; }
    .kc-followup-pill { display: inline-flex; align-items: center; gap: 4px; background: #fef3c7;
                        color: #92400e; padding: 1px 6px; border-radius: 4px; font-size: 9px; font-weight: 600; }
    .kanban-empty { font-size: 10px; color: var(--text-muted); font-style: italic;
                    text-align: center; padding: 16px 0; }
    /* Stage dropdown on card */
    .kc-stage-select { font-size: 9px; border: 1px solid var(--border); border-radius: 3px;
                       background: #fff; color: var(--text-muted); padding: 1px 3px; cursor: pointer; }
    .kc-stage-select:focus { outline: none; border-color: var(--teal); }

    /* Follow-up filter pill in filter bar */
    .followup-pill-btn { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px;
                         border-radius: 5px; border: 1px solid #f59e0b; background: #fffbeb;
                         color: #92400e; font-size: 11px; font-weight: 500; cursor: pointer; }
    .followup-pill-btn.active { background: #f59e0b; color: #fff; }
    .followup-pill-btn .pill-count { font-weight: 700; }

    /* ── Dashboard Tab ────────────────────────────────────────────────────── */
    .dash-layout { display: grid; grid-template-columns: 1fr 260px; gap: 12px; align-items: start; }
    .dash-left { display: flex; flex-direction: column; gap: 12px; }
    .dash-right { display: flex; flex-direction: column; gap: 12px; }
    .dash-kpi-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
    .dash-kpi { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; }
    .dash-kpi-val { font-size: 26px; font-weight: 700; color: var(--teal); line-height: 1.1; }
    .dash-kpi-label { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
    .dash-kpi-sub { font-size: 10px; color: var(--text-muted); margin-top: 4px; }
    .dash-section { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; }
    .dash-section-title { font-size: 12px; font-weight: 600; margin-bottom: 12px; color: var(--text); }
    /* Funnel */
    .funnel-row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
    .funnel-label { width: 130px; font-size: 10px; color: var(--text); text-align: right; flex-shrink: 0; }
    .funnel-bar-wrap { flex: 1; height: 22px; background: var(--gray-light); border-radius: 4px; overflow: hidden; position: relative; }
    .funnel-bar { height: 100%; border-radius: 4px; transition: width .4s ease; min-width: 2px; }
    .funnel-count { width: 32px; font-size: 11px; font-weight: 600; color: var(--text); text-align: right; flex-shrink: 0; }
    .funnel-pct { width: 38px; font-size: 10px; color: var(--text-muted); flex-shrink: 0; }
    /* Alerts */
    .alert-item { display: flex; justify-content: space-between; align-items: center;
                  padding: 9px 0; border-bottom: 1px solid var(--border); cursor: pointer;
                  transition: background .1s; border-radius: 4px; }
    .alert-item:last-child { border-bottom: none; }
    .alert-item:hover { background: var(--teal-light); margin: 0 -14px; padding: 9px 14px; }
    .alert-label { font-size: 11px; color: var(--text); }
    .alert-sub { font-size: 10px; color: var(--text-muted); margin-top: 1px; }
    .alert-count { font-size: 20px; font-weight: 700; }
    .alert-count.warn { color: #f59e0b; }
    .alert-count.danger { color: #ef4444; }
    .alert-count.ok { color: #059669; }
    .alert-count.info { color: var(--teal); }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

const ADMIN_PW = 'GDC-pipeline-2026!';
const API = window.location.origin;

const STAGES = ['new','auto_nurture','scheduled','no_show','showed','treatment_presented','treatment_accepted','treatment_completed','cold'];
const STAGE_LABELS = {
  new:'New Lead', auto_nurture:'Auto-Nurture', scheduled:'Scheduled',
  no_show:'No-Show', showed:'Showed', treatment_presented:'Tx Presented',
  treatment_accepted:'Tx Accepted', treatment_completed:'Tx Completed', cold:'Cold',
};
const STAGE_COLORS = {
  new:'#3b82f6', auto_nurture:'#f59e0b', scheduled:'#059669',
  no_show:'#dc2626', showed:'#16a34a', treatment_presented:'#0891b2',
  treatment_accepted:'#0d9488', treatment_completed:'#059669',
};

async function api(path, opts = {}) {
  const res = await fetch(API + path, {
    ...opts,
    headers: { 'Content-Type':'application/json', 'X-Admin-Password':ADMIN_PW, ...(opts.headers||{}) },
  });
  if (!res.ok) {
    let detail = 'API ' + res.status;
    try { const j = await res.json(); detail = j.detail || detail; } catch(_) {}
    const err = new Error(detail);
    err.detail = detail;
    throw err;
  }
  return res.json();
}

function timeAgo(iso) {
  if (!iso) return '';
  const d = Date.now() - new Date(iso).getTime();
  const m = Math.floor(d/60000);
  if (m < 1) return '1m'; if (m < 60) return m+'m';
  const h = Math.floor(m/60);
  if (h < 24) return h+'h'; const dy = Math.floor(h/24);
  if (dy < 30) return dy+'d'; return Math.floor(dy/30)+'mo';
}
function fmtDate(iso) { if (!iso) return ''; return new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
function fmtDateTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}) + ' ' +
         d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true});
}
function fmtMoney(v) { if (!v) return '$0'; return '$'+Number(v).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0}); }
function pct(a,b) { if (!b) return '0%'; return Math.round(a/b*100)+'%'; }

function srcClass(s) {
  if (!s) return 'src-default';
  const l = s.toLowerCase();
  if (l.includes('google')) return 'src-google';
  if (l.includes('fb')||l.includes('facebook')) return 'src-fb';
  if (l.includes('smile')) return 'src-smile';
  if (l.includes('phone')||l.includes('call')) return 'src-phone';
  if (l.includes('contact')||l.includes('form')) return 'src-form';
  if (l.includes('pearly')||l.includes('chat')) return 'src-chat';
  return 'src-default';
}

function isStaffFollowUp(lead) {
  if (!['new','auto_nurture'].includes(lead.stage)) return false;
  // Must be older than 1 day
  const daysSince = (Date.now() - new Date(lead.created_at).getTime()) / (1000*60*60*24);
  if (daysSince < 1) return false;
  // Clear from this row if staff has contacted within the last 7 days
  if (lead.last_staff_contact_at) {
    const daysSinceContact = (Date.now() - new Date(lead.last_staff_contact_at).getTime()) / (1000*60*60*24);
    if (daysSinceContact < 7) return false;
  }
  return true;
}

function LeadChip({ lead, isSelected, onClick, onDragStart }) {
  const name = [lead.first_name,lead.last_name].filter(Boolean).join(' ') || lead.email || 'Unknown';
  const camp = lead.campaign_name || '';
  const shortCamp = camp.replace(/^grafton_nxtsmile_/,'');
  const apptDate = lead.appointment_date ? fmtDate(lead.appointment_date) : null;
  return (
    <span className={'lead-chip' + (isSelected?' selected':'') + (lead.next_follow_up?' has-priority':'')}
      onClick={()=>onClick(lead.id)}
      draggable onDragStart={e=>{e.dataTransfer.setData('text/plain',lead.id); e.dataTransfer.effectAllowed='move'; onDragStart&&onDragStart(lead.id);}}>
      <span className="chip-name">{name}</span>
      <span className={'chip-source '+srcClass(lead.source)}>{lead.source||'?'}</span>
      {lead.phone && <span className="chip-phone">{lead.phone}</span>}
      {apptDate && <span className="chip-appt">{apptDate}</span>}
      {shortCamp && <span className="chip-campaign" title={camp}>{shortCamp}</span>}
      {(lead.notes_count||0)>0 && <span className="chip-notes">{lead.notes_count}</span>}
      {lead.attributed_production>0 && <span className="chip-revenue">{fmtMoney(lead.attributed_production)}</span>}
      <span className="chip-time">{fmtDateTime(lead.created_at)}</span>
    </span>
  );
}

function StageRow({ stage, label, leads, selectedId, onCardClick, onDrop, onDragStart, color, className }) {
  const [dragOver, setDragOver] = useState(false);
  return (
    <div className={'stage-row' + (dragOver?' drag-over':'') + (className?' '+className:'')}
      onDragOver={e=>{e.preventDefault();e.dataTransfer.dropEffect='move';setDragOver(true);}}
      onDragLeave={()=>setDragOver(false)}
      onDrop={e=>{e.preventDefault();setDragOver(false);const id=e.dataTransfer.getData('text/plain');onDrop(id,stage);}}>
      <span className="stage-dot" style={{background:color}} />
      <span className="stage-label">{label}</span>
      <span className="stage-count">{leads.length}</span>
      {leads.length > 0 && <span className="stage-sep" />}
      {leads.map(l=>(
        <LeadChip key={l.id} lead={l} isSelected={selectedId===l.id}
          onClick={onCardClick} onDragStart={onDragStart} />
      ))}
      {leads.length === 0 && <span className="empty-row">No leads</span>}
    </div>
  );
}

function DetailPanel({ lead, onClose, onStageChange, onRefresh, onDelete }) {
  const [detail, setDetail] = useState(null);
  const [notes, setNotes] = useState([]);
  const [newNote, setNewNote] = useState('');
  const [showMove, setShowMove] = useState(false);
  const [tab, setTab] = useState('info');
  const [saving, setSaving] = useState(false);
  const [confirmDelete, setConfirmDelete] = useState(false);
  const [testEmailStatus, setTestEmailStatus] = useState('');
  // Manual messaging state
  const [messages, setMessages] = useState([]);
  const [composeChannel, setComposeChannel] = useState('sms');
  const [composeSubject, setComposeSubject] = useState('');
  const [composeBody, setComposeBody] = useState('');
  const [sendingMsg, setSendingMsg] = useState(false);
  const [sendError, setSendError] = useState('');

  useEffect(() => {
    if (!lead) return;
    api('/api/lead/' + lead.id).then(setDetail);
    api('/api/admin/lead/' + lead.id + '/notes').then(d=>setNotes(d.notes||[]));
    api('/api/admin/lead/' + lead.id + '/messages').then(d=>setMessages(d.messages||[]));
  }, [lead?.id]);

  function refreshMessages() {
    api('/api/admin/lead/' + lead.id + '/messages').then(d=>setMessages(d.messages||[]));
  }

  async function sendMessage() {
    const body = composeBody.trim();
    if (!body) return;
    setSendingMsg(true); setSendError('');
    try {
      if (composeChannel === 'sms') {
        await api('/api/admin/lead/' + lead.id + '/send-sms', {
          method: 'POST', body: JSON.stringify({message: body})
        });
      } else {
        const subj = composeSubject.trim();
        if (!subj) { setSendError('Subject is required'); setSendingMsg(false); return; }
        await api('/api/admin/lead/' + lead.id + '/send-email', {
          method: 'POST', body: JSON.stringify({subject: subj, body})
        });
      }
      setComposeBody(''); setComposeSubject('');
      refreshMessages();
    } catch(e) {
      setSendError(e?.detail || e?.message || 'Send failed');
    }
    setSendingMsg(false);
  }

  if (!lead) return null;
  const name = [lead.first_name,lead.last_name].filter(Boolean).join(' ')||lead.email||'Unknown';

  async function addNote() {
    if (!newNote.trim()) return;
    setSaving(true);
    await api('/api/admin/lead/' + lead.id + '/notes',{method:'POST',body:JSON.stringify({note_text:newNote.trim()})});
    setNewNote('');
    const d = await api('/api/admin/lead/' + lead.id + '/notes');
    setNotes(d.notes||[]); setSaving(false); onRefresh();
  }
  async function delNote(id) {
    await api('/api/admin/note/' + id,{method:'DELETE'});
    setNotes(notes.filter(n=>n.id!==id)); onRefresh();
  }
  async function moveStage(s) {
    setShowMove(false);
    await api('/api/admin/lead/' + lead.id + '/force-stage',{method:'PUT',body:JSON.stringify({stage:s,reason:'manual move'})});
    onStageChange(lead.id,s);
  }

  async function deleteLead() {
    const res = await api('/api/admin/lead/' + lead.id, {method:'DELETE'});
    if (res && res.firestore_deleted === false) {
      alert('Warning: Lead deleted locally but Firestore delete failed. The lead may reappear after sync.');
    }
    onDelete(lead.id);
    onClose();
  }

  const events = detail?.events||[];
  const queue = detail?.follow_up_queue||[];

  return (
    <div className="detail-backdrop" onClick={onClose}>
      <div className="detail-overlay open" onClick={e=>e.stopPropagation()}>
        <div className="detail-header">
          <button className="detail-close" onClick={onClose}>✕</button>
          <div style={{flex:1}}>
            <div style={{fontWeight:600,fontSize:13}}>{name}</div>
            <div style={{fontSize:10,color:'var(--text-muted)'}}>
              {lead.email}{lead.phone&&(' · '+lead.phone)}
            </div>
          </div>
          {confirmDelete ? (
            <div style={{display:'flex',gap:4,alignItems:'center'}}>
              <span style={{fontSize:10,color:'var(--red)',fontWeight:600}}>Delete?</span>
              <button className="btn btn-sm" style={{background:'var(--red)',color:'#fff',padding:'3px 8px',fontSize:11}}
                onClick={deleteLead}>Yes</button>
              <button className="btn btn-sm" style={{background:'var(--border)',color:'var(--text)',padding:'3px 8px',fontSize:11}}
                onClick={()=>setConfirmDelete(false)}>No</button>
            </div>
          ) : (
            <button title="Delete lead" onClick={()=>setConfirmDelete(true)}
              style={{background:'none',border:'none',cursor:'pointer',color:'var(--text-muted)',fontSize:14,padding:'2px 6px'}}
              onMouseOver={e=>e.target.style.color='var(--red)'}
              onMouseOut={e=>e.target.style.color='var(--text-muted)'}>🗑</button>
          )}
          <div style={{position:'relative'}}>
            <button className="btn btn-teal btn-sm" onClick={()=>setShowMove(!showMove)}>
              {STAGE_LABELS[lead.stage]||lead.stage} ▾
            </button>
            {showMove && (
              <div className="stage-move-menu">
                {STAGES.map(s=>(
                  <div key={s} className={'stage-move-item'+(s===lead.stage?' current':'')}
                    onClick={()=>s!==lead.stage&&moveStage(s)}>
                    <span className="stage-dot" style={{background:STAGE_COLORS[s],width:7,height:7}} />
                    {STAGE_LABELS[s]}{s===lead.stage&&' ✓'}
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
        <div style={{display:'flex',gap:0,borderBottom:'1px solid var(--border)'}}>
          {[{k:'info',l:'Info'},{k:'notes',l:'Notes'},{k:'communication',l:'Communication'},{k:'staff',l:'Staff Actions'}].map(t=>(
            <button key={t.k} style={{flex:1,padding:'6px 0',fontSize:10,fontWeight:500,cursor:'pointer',
              background:'none',border:'none',borderBottom:tab===t.k?'2px solid var(--teal)':'none',
              color:tab===t.k?'var(--teal)':'var(--text-muted)'}}
              onClick={()=>setTab(t.k)}>{t.l}</button>
          ))}
        </div>
        <div className="detail-body">
          {tab==='info' && (
            <div>
              <div className="detail-section">
                <div className="detail-section-title">Contact</div>
                {lead.email&&<div className="detail-row"><div className="detail-row-label">Email</div><div className="detail-row-value">{lead.email}</div></div>}
                {lead.phone&&<div className="detail-row"><div className="detail-row-label">Phone</div><div className="detail-row-value">{lead.phone}</div></div>}
              </div>
              <div className="detail-section">
                <div className="detail-section-title">Lead Info</div>
                {lead.source&&<div className="detail-row"><div className="detail-row-label">Source</div><div className="detail-row-value">{lead.source}</div></div>}
                <div className="detail-row"><div className="detail-row-label">Created</div><div className="detail-row-value">{fmtDateTime(lead.created_at)}</div></div>
                {lead.goals&&<div className="detail-row"><div className="detail-row-label">Goals</div><div className="detail-row-value">{lead.goals}</div></div>}
              </div>
              {(lead.campaign_name||lead.keyword_text||lead.gclid||lead.utm_source) && (
                <div className="detail-section">
                  <div className="detail-section-title">Ad Attribution</div>
                  {lead.campaign_name&&<div className="detail-row"><div className="detail-row-label">Campaign</div><div className="detail-row-value">{lead.campaign_name}</div></div>}
                  {lead.ad_group_name&&<div className="detail-row"><div className="detail-row-label">Ad Group</div><div className="detail-row-value">{lead.ad_group_name}</div></div>}
                  {lead.keyword_text&&<div className="detail-row"><div className="detail-row-label">Keyword</div><div className="detail-row-value">{lead.keyword_text}</div></div>}
                  {lead.search_term&&<div className="detail-row"><div className="detail-row-label">Search Term</div><div className="detail-row-value">{lead.search_term}</div></div>}
                  {lead.click_cost>0&&<div className="detail-row"><div className="detail-row-label">Click Cost</div><div className="detail-row-value">${Number(lead.click_cost).toFixed(2)}</div></div>}
                  {lead.gclid&&<div className="detail-row"><div className="detail-row-label">GCLID</div><div className="detail-row-value" style={{fontSize:9}}>{lead.gclid.substring(0,20)}...</div></div>}
                  {lead.utm_source&&<div className="detail-row"><div className="detail-row-label">UTM Source</div><div className="detail-row-value">{lead.utm_source}</div></div>}
                  {lead.utm_medium&&<div className="detail-row"><div className="detail-row-label">UTM Medium</div><div className="detail-row-value">{lead.utm_medium}</div></div>}
                  {lead.utm_term&&<div className="detail-row"><div className="detail-row-label">UTM Term</div><div className="detail-row-value">{lead.utm_term}</div></div>}
                  {lead.landing_url&&<div className="detail-row"><div className="detail-row-label">Landing URL</div><div className="detail-row-value" style={{fontSize:9}}>{lead.landing_url.substring(0,30)}...</div></div>}
                </div>
              )}
              {(lead.appointment_date||lead.od_patient_num||lead.attributed_production>0) && (
                <div className="detail-section">
                  <div className="detail-section-title">Treatment & Revenue</div>
                  {lead.appointment_date&&<div className="detail-row"><div className="detail-row-label">Appointment</div><div className="detail-row-value">{fmtDate(lead.appointment_date)}{lead.appointment_status&&(' ('+lead.appointment_status+')')}</div></div>}
                  {lead.no_show_count>0&&<div className="detail-row"><div className="detail-row-label">No-Shows</div><div className="detail-row-value" style={{color:'var(--red)'}}>{lead.no_show_count}</div></div>}
                  {lead.od_patient_num&&<div className="detail-row"><div className="detail-row-label">OD PatNum</div><div className="detail-row-value">{lead.od_patient_num}</div></div>}
                  {lead.treatment_plan_value>0&&<div className="detail-row"><div className="detail-row-label">Tx Plan Value</div><div className="detail-row-value">{fmtMoney(lead.treatment_plan_value)}</div></div>}
                  {lead.attributed_production>0&&<div className="detail-row"><div className="detail-row-label">Production</div><div className="detail-row-value">{fmtMoney(lead.attributed_production)}</div></div>}
                  {lead.attributed_income>0&&<div className="detail-row"><div className="detail-row-label">Collections</div><div className="detail-row-value">{fmtMoney(lead.attributed_income)}</div></div>}
                </div>
              )}
            </div>
          )}
          {tab==='notes' && (
            <div>
              <div className="detail-section">
                <textarea className="note-input" value={newNote} onChange={e=>setNewNote(e.target.value)} placeholder="Add a note..." />
                <button className="btn btn-teal btn-sm" onClick={addNote} style={{marginTop:6}} disabled={saving}>Save</button>
              </div>
              {notes.map(n=>(
                <div key={n.id} className="note-item">
                  <div className="note-header">
                    <div className="note-author">{n.author||'Unknown'}</div>
                    <button style={{background:'none',border:'none',cursor:'pointer',color:'var(--text-muted)',fontSize:10}} onClick={()=>delNote(n.id)}>×</button>
                  </div>
                  <div className="note-header" style={{marginBottom:0}}>
                    <div className="note-time">{timeAgo(n.created_at)}</div>
                  </div>
                  <div style={{marginTop:4}}>{n.note_text}</div>
                </div>
              ))}
            </div>
          )}
          {tab==='communication' && (
            <div>
              {/* Automated sequence schedule */}
              <div className="detail-section-title">Sequence Schedule</div>
              {queue.map((q,i)=>(
                <div key={i} className="fq-item">
                  <span className={'fq-status fq-'+q.status}>{q.status}</span>
                  <div style={{flex:1,marginLeft:4,fontSize:10}}>
                    <strong>{q.channel==='sms'?'SMS':'Email'}</strong> — {q.template||q.description||('Day '+q.sequence_day)}
                  </div>
                  <div style={{fontSize:9,color:'var(--text-muted)',marginLeft:'auto',whiteSpace:'nowrap'}}>
                    {q.sent_at ? fmtDate(q.sent_at) : fmtDate(q.scheduled_at)}
                  </div>
                </div>
              ))}
              {queue.length===0&&<div style={{fontSize:10,color:'var(--text-muted)',marginBottom:4}}>No sequence scheduled</div>}

              {/* Manual message thread */}
              <div className="detail-section-title" style={{marginTop:12}}>Messages</div>
              <div className="msg-thread">
                {messages.map((m,i)=>(
                  <div key={i} className={'msg-bubble ' + (m.direction==='outbound' ? 'outbound' : 'auto-item')}>
                    <div>
                      <span className={'msg-tag ' + (m.message_type==='manual' ? 'manual' : 'auto')}>
                        {m.message_type==='manual' ? (m.direction==='outbound'?'Manual':'Reply') : 'Auto'}
                        {' · '}{(m.channel||'').toUpperCase()}
                      </span>
                      {m.subject && <div style={{fontWeight:600,fontSize:10,marginBottom:2}}>{m.subject}</div>}
                    </div>
                    <div style={{whiteSpace:'pre-wrap'}}>{m.body}</div>
                    <div className="msg-meta">
                      {m.direction==='outbound' && m.sent_by ? (m.sent_by + ' · ') : ''}
                      {fmtDate(m.received_at)}
                    </div>
                  </div>
                ))}
                {messages.length===0&&<div style={{fontSize:10,color:'var(--text-muted)'}}>No messages yet</div>}
              </div>

              {/* Compose bar */}
              <div className="compose-bar">
                <div className="compose-channel">
                  <button className={composeChannel==='sms'?'active':''} onClick={()=>setComposeChannel('sms')}>SMS</button>
                  <button className={composeChannel==='email'?'active':''} onClick={()=>setComposeChannel('email')}>Email</button>
                </div>
                {composeChannel==='email' && (
                  <input className="compose-subject" placeholder="Subject..."
                    value={composeSubject} onChange={e=>setComposeSubject(e.target.value)} />
                )}
                <textarea className="compose-textarea"
                  placeholder={composeChannel==='sms'?'Type an SMS message... (Reply STOP to opt out)':'Type your email message...'}
                  value={composeBody} onChange={e=>setComposeBody(e.target.value)}
                  rows={composeChannel==='email'?4:2} />
                <div className="compose-footer">
                  <span className={'char-count'+(composeChannel==='sms'&&composeBody.length>140?' warn':'')+(composeChannel==='sms'&&composeBody.length>160?' over':'')}>
                    {composeChannel==='sms' ? composeBody.length+'/160' : ''}
                    {sendError && <span style={{color:'var(--red)',marginLeft:6}}>{sendError}</span>}
                  </span>
                  <button className="btn btn-teal btn-sm" onClick={sendMessage} disabled={sendingMsg||!composeBody.trim()}>
                    {sendingMsg?'Sending…':'Send'}
                  </button>
                </div>
              </div>

              {/* Event log */}
              <div className="detail-section-title" style={{marginTop:14}}>Event Log</div>
              {events.filter(e=>['email_sent','sms_sent','stage_changed','lead_created','smile_completed','booking_confirmed','od_matched','image_deleted'].includes(e.event_type)).map((e,i)=>(
                <div key={i} className="timeline-item">
                  <div className="timeline-dot" style={{background:e.event_type.includes('email')?'#3b82f6':e.event_type.includes('sms')?'#22c55e':'var(--teal)'}} />
                  <div style={{flex:1}}>
                    <div className="timeline-type">{e.event_type.replace(/_/g,' ')}</div>

              <div className="detail-section-title" style={{marginTop:14}}>Staff Action Log</div>

// ── Kanban Components ──────────────────────────────────────────────────────

function KanbanCard({ lead, isSelected, onClick, onStageChange }) {
  const name = [lead.first_name, lead.last_name].filter(Boolean).join(' ') || lead.email || 'Unknown';
  const needsFollowup = isStaffFollowUp(lead);
  const kw = (lead.keyword_text || '').replace(/^\[.*?\]\s*/, ''); // strip match type prefix
  const [dragging, setDragging] = useState(false);

  function handleStageSelect(e) {
    e.stopPropagation();
    const newStage = e.target.value;
    if (newStage && newStage !== lead.stage) onStageChange(lead.id, newStage);
  }

  return (
    <div
      className={'kanban-card' + (isSelected ? ' selected' : '') + (needsFollowup ? ' needs-followup' : '') + (dragging ? ' dragging' : '')}
      onClick={() => onClick(lead.id)}
      draggable
      onDragStart={e => {
        e.dataTransfer.setData('text/plain', lead.id);
        e.dataTransfer.effectAllowed = 'move';
        setDragging(true);
      }}
      onDragEnd={() => setDragging(false)}
    >
      <div className="kc-row">
        <span className="kc-name">{name}</span>
        <span className={'chip-source ' + srcClass(lead.source)} style={{fontSize:'8px'}}>{lead.source || '?'}</span>
      </div>
      {lead.phone && <div className="kc-meta">📞 {lead.phone}</div>}
      {lead.appointment_date && (
        <div className="kc-row">
          <span className="kc-badge kc-appt">📅 {fmtDate(lead.appointment_date)}</span>
        </div>
      )}
      {kw && <div className="kc-row"><span className="kc-badge kc-kw" title={kw}>🔑 {kw}</span></div>}
      <div className="kc-row">
        {lead.attributed_production > 0 && <span className="kc-revenue">{fmtMoney(lead.attributed_production)}</span>}
        {(lead.notes_count || 0) > 0 && <span className="kc-badge kc-notes">💬{lead.notes_count}</span>}
        <span className="kc-time" style={{marginLeft:'auto'}}>{timeAgo(lead.created_at)}</span>
      </div>
      {needsFollowup && (
        <div><span className="kc-followup-pill">⚠ Follow up</span></div>
      )}
      {/* Non-drag fallback: stage dropdown */}
      <div onClick={e => e.stopPropagation()} style={{marginTop:3}}>
        <select className="kc-stage-select" value={lead.stage} onChange={handleStageSelect}>
          {STAGES.filter(s => s !== 'cold').map(s => (
            <option key={s} value={s}>{STAGE_LABELS[s]}</option>
          ))}
          <option value="cold">{STAGE_LABELS.cold}</option>
        </select>
      </div>
    </div>
  );
}

function KanbanColumn({ stage, label, leads, color, selectedId, onCardClick, onDrop, onStageChange }) {
  const [dragOver, setDragOver] = useState(false);

  return (
    <div
      className={'kanban-col' + (dragOver ? ' drag-over' : '')}
    >
      <div className="kanban-col-header" style={{borderTopColor: color}}>
        <span className="stage-dot" style={{background: color}} />
        <span className="stage-label">{label}</span>
        <span className="stage-count">{leads.length}</span>
      </div>
      <div
        className="kanban-col-body"
        onDragOver={e => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; setDragOver(true); }}
        onDragLeave={e => { if (!e.currentTarget.contains(e.relatedTarget)) setDragOver(false); }}
        onDrop={e => {
          e.preventDefault();
          setDragOver(false);
          const id = e.dataTransfer.getData('text/plain');
          if (id) onDrop(id, stage);
        }}
      >
        {leads.length === 0 && <div className="kanban-empty">No leads</div>}
        {leads.map(l => (
          <KanbanCard
            key={l.id}
            lead={l}
            isSelected={selectedId === l.id}
            onClick={onCardClick}
            onStageChange={onStageChange}
          />
        ))}
      </div>
    </div>
  );
}

function KanbanBoard({ pipeline, stats, selectedId, onCardClick, onStageChange, onRefresh }) {
  const [searchTerm, setSearchTerm] = useState('');
  const [sourceFilter, setSourceFilter] = useState('all');
  const [showCold, setShowCold] = useState(false);
  const [followupOnly, setFollowupOnly] = useState(false);
  const boardRef = useRef(null);

  const filtered = useMemo(() => {
    return pipeline.filter(l => {
      if (!showCold && l.stage === 'cold') return false;
      if (sourceFilter !== 'all' && l.source !== sourceFilter) return false;
      if (followupOnly && !isStaffFollowUp(l)) return false;
      if (searchTerm) {
        const term = searchTerm.toLowerCase();
        const name = ((l.first_name || '') + ' ' + (l.last_name || '')).trim().toLowerCase();
        const email = (l.email || '').toLowerCase();
        const phone = (l.phone || '').toLowerCase();
        if (!name.includes(term) && !email.includes(term) && !phone.includes(term)) return false;
      }
      return true;
    });
  }, [pipeline, searchTerm, sourceFilter, showCold, followupOnly]);

  const byStage = useMemo(() => {
    const map = {};
    STAGES.forEach(s => { map[s] = []; });
    filtered.forEach(l => {
      if (map[l.stage] !== undefined) map[l.stage].push(l);
    });
    return map;
  }, [filtered]);

  const followupCount = useMemo(() => pipeline.filter(isStaffFollowUp).length, [pipeline]);

  const sources = useMemo(() => {
    const set = new Set(pipeline.filter(l => l.source).map(l => l.source));
    return ['all', ...Array.from(set).sort()];
  }, [pipeline]);

  async function handleDrop(leadId, newStage) {
    try {
      await api('/api/admin/lead/' + leadId + '/force-stage', { method: 'PUT', body: JSON.stringify({ stage: newStage, reason: 'drag-drop' }) });
      onStageChange(leadId, newStage);
    } catch (err) {
      console.error('Stage change failed', err);
      if (onRefresh) onRefresh();
    }
  }

  // Edge-scroll while dragging: scroll the kanban board when near edges
  function handleBoardDragOver(e) {
    const board = boardRef.current;
    if (!board) return;
    const rect = board.getBoundingClientRect();
    const edgeSize = 60;
    if (e.clientX < rect.left + edgeSize) board.scrollBy(-12, 0);
    else if (e.clientX > rect.right - edgeSize) board.scrollBy(12, 0);
  }

  const visibleStages = STAGES.filter(s => s !== 'cold');

  return (
    <div>
      {/* KPI strip */}
      <div className="kpi-strip">
        <div className="kpi"><div className="kpi-val">{stats?.total_leads || 0}</div><div className="kpi-label">Total</div></div>
        <div className="kpi"><div className="kpi-val">{filtered.length}</div><div className="kpi-label">Showing</div></div>
        <div className="kpi"><div className="kpi-val">{byStage.scheduled ? byStage.scheduled.length : 0}</div><div className="kpi-label">Scheduled</div></div>
        <div className="kpi"><div className="kpi-val">{byStage.no_show ? byStage.no_show.length : 0}</div><div className="kpi-label">No-Shows</div></div>
        <div className="kpi"><div className="kpi-val">{byStage.treatment_completed ? byStage.treatment_completed.length : 0}</div><div className="kpi-label">Treated</div></div>
        <div className="kpi"><div className="kpi-val">{fmtMoney(stats?.attributed_revenue || 0)}</div><div className="kpi-label">Revenue</div></div>
      </div>

      {/* Filter bar */}
      <div className="filter-bar">
        <select className="filter-select" value={sourceFilter} onChange={e => setSourceFilter(e.target.value)}>
          {sources.map(s => <option key={s} value={s}>{s === 'all' ? 'All Sources' : s}</option>)}
        </select>
        <input type="text" className="search-box" placeholder="Search name, email, phone..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} />
        <button
          className={'followup-pill-btn' + (followupOnly ? ' active' : '')}
          onClick={() => setFollowupOnly(f => !f)}
        >
          ⚠ <span className="pill-count">{followupCount}</span> Follow-up
        </button>
        <label style={{fontSize:11, display:'flex', gap:6, alignItems:'center', cursor:'pointer'}}>
          <input type="checkbox" checked={showCold} onChange={e => setShowCold(e.target.checked)} />
          Cold
        </label>
      </div>

      {/* Kanban board */}
      <div className="kanban-board" ref={boardRef} onDragOver={handleBoardDragOver}>
        {visibleStages.map(s => (
          <KanbanColumn
            key={s}
            stage={s}
            label={STAGE_LABELS[s]}
            leads={byStage[s] || []}
            color={STAGE_COLORS[s] || '#6b7280'}
            selectedId={selectedId}
            onCardClick={onCardClick}
            onDrop={handleDrop}
            onStageChange={(id, newStage) => handleDrop(id, newStage)}
          />
        ))}
        {showCold && (
          <KanbanColumn
            stage="cold"
            label="Cold"
            leads={byStage.cold || []}
            color="#9ca3af"
            selectedId={selectedId}
            onCardClick={onCardClick}
            onDrop={handleDrop}
            onStageChange={(id, newStage) => handleDrop(id, newStage)}
          />
        )}
      </div>
    </div>
  );
}

// ── Dashboard Tab ───────────────────────────────────────────────────────────

function DashboardTab({ pipeline, stats, onTabSwitch }) {
  const now = Date.now();

  // Compute KPIs from pipeline data
  const totalLeads = pipeline.length;
  const scheduled = pipeline.filter(l => l.stage === 'scheduled').length;
  const totalRevenue = pipeline.reduce((s, l) => s + (l.attributed_production || 0), 0);
  const treated = pipeline.filter(l => l.stage === 'treatment_completed').length;
  const convRate = totalLeads > 0 ? Math.round(scheduled / totalLeads * 100) : 0;
  const revPerLead = totalLeads > 0 ? Math.round(totalRevenue / totalLeads) : 0;

  // Avg days to appointment (leads with appointment_date set)
  const withAppt = pipeline.filter(l => l.appointment_date && l.created_at);
  const avgDaysToAppt = withAppt.length > 0
    ? Math.round(withAppt.reduce((s, l) => {
        return s + (new Date(l.appointment_date) - new Date(l.created_at)) / (1000 * 60 * 60 * 24);
      }, 0) / withAppt.length)
    : null;

  // Alerts
  const followupNeeded = pipeline.filter(isStaffFollowUp).length;
  const noShowsThisWeek = pipeline.filter(l => {
    if (l.stage !== 'no_show') return false;
    const d = (now - new Date(l.updated_at).getTime()) / (1000 * 60 * 60 * 24);
    return d <= 7;
  }).length;
  const stuckInNew = pipeline.filter(l => {
    if (l.stage !== 'new') return false;
    const d = (now - new Date(l.created_at).getTime()) / (1000 * 60 * 60 * 24);
    return d > 7;
  }).length;
  const scheduledThisWeek = pipeline.filter(l => {
    if (!l.appointment_date) return false;
    const appt = new Date(l.appointment_date).getTime();
    return appt >= now && appt <= now + 7 * 24 * 60 * 60 * 1000;
  }).length;

  // Funnel data
  const FUNNEL_STAGES = [
    { key: 'new', label: 'New Lead' },
    { key: 'auto_nurture', label: 'Auto-Nurture' },
    { key: 'scheduled', label: 'Scheduled' },
    { key: 'showed', label: 'Showed' },
    { key: 'treatment_presented', label: 'Tx Presented' },
    { key: 'treatment_accepted', label: 'Tx Accepted' },
    { key: 'treatment_completed', label: 'Tx Completed' },
  ];
  const stageCounts = {};
  pipeline.forEach(l => { stageCounts[l.stage] = (stageCounts[l.stage] || 0) + 1; });
  const maxCount = Math.max(...FUNNEL_STAGES.map(s => stageCounts[s.key] || 0), 1);

  return (
    <div className="dash-layout">
      <div className="dash-left">
        {/* KPI Cards */}
        <div className="dash-kpi-grid">
          <div className="dash-kpi">
            <div className="dash-kpi-val">{totalLeads}</div>
            <div className="dash-kpi-label">Total Leads</div>
            <div className="dash-kpi-sub">All time</div>
          </div>
          <div className="dash-kpi">
            <div className="dash-kpi-val">{convRate}%</div>
            <div className="dash-kpi-label">Booking Rate</div>
            <div className="dash-kpi-sub">{scheduled} scheduled / {totalLeads} leads</div>
          </div>
          <div className="dash-kpi">
            <div className="dash-kpi-val">{scheduled}</div>
            <div className="dash-kpi-label">Scheduled</div>
            <div className="dash-kpi-sub">Active appointments</div>
          </div>
          <div className="dash-kpi">
            <div className="dash-kpi-val">{fmtMoney(totalRevenue)}</div>
            <div className="dash-kpi-label">Attributed Revenue</div>
            <div className="dash-kpi-sub">{treated} treatment{treated !== 1 ? 's' : ''} completed</div>
          </div>
          <div className="dash-kpi">
            <div className="dash-kpi-val">{avgDaysToAppt !== null ? avgDaysToAppt + 'd' : '—'}</div>
            <div className="dash-kpi-label">Avg Days to Appt</div>
            <div className="dash-kpi-sub">{withAppt.length} leads with appt data</div>
          </div>
          <div className="dash-kpi">
            <div className="dash-kpi-val">{fmtMoney(revPerLead)}</div>
            <div className="dash-kpi-label">Revenue / Lead</div>
            <div className="dash-kpi-sub">Avg across all leads</div>
          </div>
        </div>

        {/* Funnel */}
        <div className="dash-section">
          <div className="dash-section-title">Funnel</div>
          {FUNNEL_STAGES.map((s, i) => {
            const count = stageCounts[s.key] || 0;
            const widthPct = Math.round(count / maxCount * 100);
            const prevCount = i > 0 ? (stageCounts[FUNNEL_STAGES[i-1].key] || 0) : null;
            const dropPct = prevCount !== null && prevCount > 0
              ? Math.round(count / prevCount * 100) + '%'
              : '';
            return (
              <div key={s.key} className="funnel-row">
                <span className="funnel-label">{s.label}</span>
                <div className="funnel-bar-wrap">
                  <div className="funnel-bar" style={{
                    width: widthPct + '%',
                    background: STAGE_COLORS[s.key] || '#6b7280',
                    opacity: 0.75
                  }} />
                </div>
                <span className="funnel-count">{count}</span>
                <span className="funnel-pct">{dropPct}</span>
              </div>
            );
          })}
        </div>

        {/* Coming soon placeholder */}
        <div className="dash-section" style={{color:'var(--text-muted)'}}>
          <div className="dash-section-title">Recent Activity</div>
          <span className="coming-soon-badge">Coming in v2</span>
          <p style={{fontSize:11, marginTop:8}}>Lead timeline feed — last 20 lifecycle events across all leads.</p>
        </div>
      </div>

      <div className="dash-right">
        {/* Alerts */}
        <div className="dash-section">
          <div className="dash-section-title">Action Items</div>
          <div className="alert-item" onClick={() => onTabSwitch('pipeline')}>
            <div>
              <div className="alert-label">Staff Follow-Up</div>
              <div className="alert-sub">Leads needing a call or email</div>
            </div>
            <div className={'alert-count ' + (followupNeeded > 0 ? 'warn' : 'ok')}>{followupNeeded}</div>
          </div>
          <div className="alert-item" onClick={() => onTabSwitch('pipeline')}>
            <div>
              <div className="alert-label">No-Shows This Week</div>
              <div className="alert-sub">Broken appointments (7d)</div>
            </div>
            <div className={'alert-count ' + (noShowsThisWeek > 0 ? 'danger' : 'ok')}>{noShowsThisWeek}</div>
          </div>
          <div className="alert-item" onClick={() => onTabSwitch('pipeline')}>
            <div>
              <div className="alert-label">Stuck in New {'>'} 7d</div>
              <div className="alert-sub">Not moving through funnel</div>
            </div>
            <div className={'alert-count ' + (stuckInNew > 0 ? 'warn' : 'ok')}>{stuckInNew}</div>
          </div>
          <div className="alert-item" onClick={() => onTabSwitch('pipeline')}>
            <div>
              <div className="alert-label">Scheduled This Week</div>
              <div className="alert-sub">Upcoming appointments (7d)</div>
            </div>
            <div className={'alert-count info'}>{scheduledThisWeek}</div>
          </div>
        </div>

        {/* Stage breakdown */}
        <div className="dash-section">
          <div className="dash-section-title">Leads by Stage</div>
          {STAGES.filter(s => (stageCounts[s] || 0) > 0).map(s => (
            <div key={s} style={{display:'flex',justifyContent:'space-between',alignItems:'center',
                                 padding:'5px 0',borderBottom:'1px solid var(--border)',fontSize:11}}>
              <div style={{display:'flex',alignItems:'center',gap:6}}>
                <span style={{width:8,height:8,borderRadius:'50%',background:STAGE_COLORS[s]||'#9ca3af',display:'inline-block'}} />
                {STAGE_LABELS[s]}
              </div>
              <span style={{fontWeight:600,color:'var(--text)'}}>{stageCounts[s] || 0}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// Default date range helpers
function defaultDateRange(days) {
  const end = new Date();
  const start = new Date();
  start.setDate(end.getDate() - days);
  const fmt = d => d.toISOString().split('T')[0];
  return { start: fmt(start), end: fmt(end) };
}

// ─── CampaignTrendChart ────────────────────────────────────────────────────
// NOTE: filter by campaign_name (not campaign_id) because get_campaign_stats()
// returns the name field as `campaign`, not a numeric ID.
function CampaignTrendChart({ campaignName, dailyStats }) {
  // Filter daily stats to this campaign (case-insensitive) and sort by date ascending
  const nameLower = (campaignName || '').toLowerCase();
  const rows = (dailyStats || [])
    .filter(r => (r.campaign_name || '').toLowerCase() === nameLower)
    .sort((a, b) => a.date.localeCompare(b.date));

  if (!rows.length) {
    return (
      <div className="trend-empty">
        No trend data yet — will populate after the next 6 AM Google Ads sync.
      </div>
    );
  }

  const W = 480, H = 80, PAD_L = 28, PAD_R = 8, PAD_T = 8, PAD_B = 20;
  const chartW = W - PAD_L - PAD_R;
  const chartH = H - PAD_T - PAD_B;
  const maxClicks = Math.max(...rows.map(r => r.clicks || 0), 1);
  const count = rows.length;

  // Build polyline points
  const pts = rows.map((r, i) => {
    const x = PAD_L + (count === 1 ? chartW / 2 : (i / (count - 1)) * chartW);
    const y = PAD_T + chartH - ((r.clicks || 0) / maxClicks) * chartH;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');

  const firstDate = rows[0].date.slice(5);  // MM-DD
  const lastDate = rows[rows.length - 1].date.slice(5);

  return (
    <div className="trend-chart-wrap">
      <div style={{fontSize:10, color:'var(--text-muted)', marginBottom:4}}>Clicks (last {count} days)</div>
      <svg className="trend-svg" viewBox={`0 0 ${W} ${H}`} xmlns="http://www.w3.org/2000/svg">
        {/* Axis lines */}
        <line x1={PAD_L} y1={PAD_T} x2={PAD_L} y2={PAD_T + chartH} stroke="var(--border)" strokeWidth="1"/>
        <line x1={PAD_L} y1={PAD_T + chartH} x2={W - PAD_R} y2={PAD_T + chartH} stroke="var(--border)" strokeWidth="1"/>
        {/* Y-axis labels */}
        <text x={PAD_L - 3} y={PAD_T + 4} fontSize="7" textAnchor="end" fill="var(--text-muted)">{maxClicks}</text>
        <text x={PAD_L - 3} y={PAD_T + chartH} fontSize="7" textAnchor="end" fill="var(--text-muted)">0</text>
        {/* X-axis date labels */}
        <text x={PAD_L} y={H - 4} fontSize="7" textAnchor="start" fill="var(--text-muted)">{firstDate}</text>
        <text x={W - PAD_R} y={H - 4} fontSize="7" textAnchor="end" fill="var(--text-muted)">{lastDate}</text>
        {/* Filled area under line */}
        <polygon
          points={`${PAD_L},${PAD_T + chartH} ${pts} ${PAD_L + (count === 1 ? chartW / 2 : chartW)},${PAD_T + chartH}`}
          fill="var(--teal)" fillOpacity="0.12"
        />
        {/* Trend line */}
        <polyline points={pts} fill="none" stroke="var(--teal)" strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round"/>
      </svg>
    </div>
  );
}

  const [expanded, setExpanded] = useState(null); // campKey → null | 'analytics' | 'keywords' | 'trend'
  const [ga4Refreshing, setGa4Refreshing] = useState(false);

  // Lazy-loaded ad-group and search-term data (fetched on first ReportsTab mount)
  const [adGroupStats, setAdGroupStats] = useState([]);
  const [searchTermStats, setSearchTermStats] = useState([]);
  const [dailyStats, setDailyStats] = useState([]);

  useEffect(() => {
    Promise.all([
      api('/api/admin/gads/ad-groups').catch(() => ({ ad_groups: [] })),
      api('/api/admin/gads/search-terms').catch(() => ({ search_terms: [] })),
      api('/api/admin/gads/daily-stats?days=30').catch(() => ({ rows: [] })),
    ]).then(([ag, st, ds]) => {
      setAdGroupStats(ag.ad_groups || []);
      setSearchTermStats(st.search_terms || []);
      setDailyStats(ds.rows || []);
    });
  }, []);

  const presets = [
    { label: '7d', days: 7 },
    { label: '30d', days: 30 },
    { label: '90d', days: 90 },
    { label: 'All', days: 365 },
  ];

  async function refreshGA4() {
    setGa4Refreshing(true);
    try { await api('/api/admin/ga4/refresh', {method:'POST'}); window.location.reload(); }
    catch(e) { alert('GA4 refresh failed: '+e.message); }
    setGa4Refreshing(false);
  }

  function togglePanel(campKey, tab) {
    // If same campaign + same tab → close. Otherwise open that tab.
    setExpanded(prev =>
      prev && prev.key === campKey && prev.tab === tab ? null : { key: campKey, tab }

  const COLS = 8; // number of columns in campaign table

      {/* View toggle */}

      {/* ── Ad Groups view ── */}
      {view==='adgroups' && <AdGroupsView adGroupStats={adGroupStats} dailyStats={dailyStats} />}

      {/* ── Search Terms view ── */}
      {view==='searchterms' && <SearchTermsView searchTermStats={searchTermStats} />}

      {/* ── Campaigns view ── */}
      {view==='campaigns' && <div>
      <div className="report-section">
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:8,marginBottom:12}}>
          <div className="report-title" style={{marginBottom:0}}>Campaign Performance</div>
          <div style={{display:'flex',gap:4,alignItems:'center',flexWrap:'wrap'}}>
            {presets.map(p=>(
              <button key={p.label}
                style={{padding:'3px 8px',fontSize:10,border:'1px solid var(--border)',borderRadius:4,cursor:'pointer',
                  background:dateRange.start===defaultDateRange(p.days).start?'var(--teal)':'#fff',
                  color:dateRange.start===defaultDateRange(p.days).start?'#fff':'var(--text-muted)'}}
                onClick={()=>setDateRange(defaultDateRange(p.days))}>
                {p.label}
              </button>
            ))}
            <label style={{fontSize:10,color:'var(--text-muted)',marginLeft:4}}>From</label>
            <input type="date" className="date-input" value={dateRange.start} onChange={e=>setDateRange(r=>({...r,start:e.target.value}))} />
            <label style={{fontSize:10,color:'var(--text-muted)'}}>To</label>
            <input type="date" className="date-input" value={dateRange.end} onChange={e=>setDateRange(r=>({...r,end:e.target.value}))} />
            <button className="btn btn-ghost btn-sm" onClick={refreshGA4} disabled={ga4Refreshing} style={{marginLeft:4}}>
              {ga4Refreshing?'Refreshing...':'Refresh GA4'}
            </button>
          </div>
        </div>

        <table className="report-table">
          <thead>
            <tr>
              <th>Campaign</th>
              <th className="num">Leads</th>
              <th className="num">Cost</th>
              <th className="num">CPL</th>
              <th className="num">Collections</th>
              <th className="num">ROI</th>
              <th className="num">Tx Accept %</th>
              <th style={{width:160}}></th>
            </tr>
          </thead>
          <tbody>
            {campaignStats.map((c,i)=>{
              const campKey = c.campaign||String(i);
              const isOpen = expanded?.key === campKey;
              const openTab = isOpen ? expanded.tab : null;

              // Treatment acceptance: presented vs accepted
              const presented = c.treatment_presented_count || 0;
              const accepted  = c.treatment_accepted_count  || 0;
              const txPct = presented > 0 ? Math.round(accepted/presented*100)+'%' : '—';

              // ROI = (collections - cost) / cost
              const collections = c.attributed_income || c.revenue || 0;
              const cost = c.total_ad_spend || c.total_cost || 0;
              const roi = cost > 0 ? ((collections - cost) / cost * 100).toFixed(0)+'%' : '—';

              return (
                <React.Fragment key={campKey}>
                  <tr>
                    <td style={{fontWeight:600}}>{(c.campaign||'').replace(/^grafton_nxtsmile_/,'')||'(unknown)'}</td>
                    <td className="num">{c.lead_count||0}</td>
                    <td className="num">{fmtMoney(cost)}</td>
                    <td className="num">{c.cpl ? '$'+Number(c.cpl).toFixed(0) : '—'}</td>
                    <td className="num money">{fmtMoney(collections)}</td>
                    <td className="num" style={{color:parseFloat(roi)>0?'#059669':parseFloat(roi)<0?'var(--red)':'var(--text-muted)'}}>{roi}</td>
                    <td className="num">{txPct}</td>
                    <td style={{textAlign:'right'}}>
                      <button
                        className={'btn-expand'+(openTab==='analytics'?' active':'')}
                        style={{marginRight:4}}
                        onClick={()=>togglePanel(campKey,'analytics')}>
                        Analytics {openTab==='analytics'?'▲':'▼'}
                      </button>
                      <button
                        className={'btn-expand'+(openTab==='keywords'?' active':'')}
                        style={{marginRight:4}}
                        onClick={()=>togglePanel(campKey,'keywords')}>
                        Keywords {openTab==='keywords'?'▲':'▼'}
                      </button>
                      <button
                        className={'btn-expand'+(openTab==='trend'?' active':'')}
                        onClick={()=>togglePanel(campKey,'trend')}>
                        Trend {openTab==='trend'?'▲':'▼'}
                      </button>
                    </td>
                  </tr>
                  {isOpen && (
                    <CampaignExpandedPanel
                      campaign={c}
                      keywordStats={keywordStats}
                      ga4Data={ga4Data}
                      dailyStats={dailyStats}
                      colSpan={COLS}
                    />
                  )}
                </React.Fragment>
              );
            })}
            {campaignStats.length===0 && (
              <tr><td colSpan={COLS} style={{textAlign:'center',color:'var(--text-muted)',padding:20,fontStyle:'italic'}}>
                No campaign data yet — run Google Ads Sync to populate.
              </td></tr>
            )}
          </tbody>
        </table>
      </div>
      </div>}
    </div>
  );
}

const JOB_META = {
  follow_up_engine:  { label: 'Follow-up Engine',      schedule: 'Every 15 min', desc: 'Send due emails/SMS to leads' },
  ga4_pull:          { label: 'GA4 Analytics Pull',     schedule: '5:30 AM',      desc: 'Pull website engagement from Google Analytics' },
  gads_sync:         { label: 'Google Ads Sync',        schedule: '6:00 AM',      desc: 'Resolve gclid → keyword, campaign, CPC' },
  ai_optimizer:      { label: 'AI Optimizer',           schedule: '7:00 AM',      desc: 'Analyze keywords, generate recommendations' },
  od_sync:           { label: 'OD Matcher',             schedule: '10:00 PM',     desc: 'Match leads to patients, sync treatment stages' },
  conversion_upload: { label: 'Conversion Upload',      schedule: '11:00 PM',     desc: 'Upload offline conversions to Google Ads' },
};

function ScheduledJobsSection() {
  const [jobs, setJobs] = useState([]);
  const [loaded, setLoaded] = useState(false);

  useEffect(() => {
    api('/api/admin/jobs')
      .then(r => { setJobs(r.jobs || []); setLoaded(true); })
      .catch(() => setLoaded(true));
  }, []);

  // Merge API data with static metadata so all jobs always appear
  const merged = Object.keys(JOB_META).map(id => {
    const live = jobs.find(j => j.id === id) || {};
    const meta = JOB_META[id];
    return { id, ...meta, ...live, label: meta.label, schedule: meta.schedule, desc: meta.desc };
  });

  function fmtRunTime(iso) {
    if (!iso) return <span style={{color:'var(--text-muted)',fontStyle:'italic'}}>not yet</span>;
    const d = new Date(iso);
    const ago = timeAgo(iso);
    return <span title={d.toLocaleString()}>{d.toLocaleDateString('en-US',{month:'short',day:'numeric'})} {d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})} <span style={{color:'var(--text-muted)',fontSize:9}}>({ago})</span></span>;
  }

  function fmtNextRun(iso) {
    if (!iso) return <span style={{color:'var(--text-muted)'}}>—</span>;
    const d = new Date(iso);
    const inMs = d - Date.now();
    const inH = Math.floor(inMs / 3600000);
    const inM = Math.floor((inMs % 3600000) / 60000);
    const label = inMs < 0 ? 'overdue' : inH > 0 ? `in ${inH}h ${inM}m` : `in ${inM}m`;
    return <span title={d.toLocaleString()}>{d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})} <span style={{color:'var(--text-muted)',fontSize:9}}>({label})</span></span>;
  }

  return (
    <div className="report-section">
      <div className="report-title">Scheduled Jobs</div>
      <table className="report-table">
        <thead>
          <tr>
            <th>Job</th>
            <th>Schedule</th>
            <th>Description</th>
            <th className="num">Last Ran</th>
            <th className="num">Next Run</th>
          </tr>
        </thead>
        <tbody>
          {merged.map(job => (
            <tr key={job.id}>
              <td style={{fontWeight:500}}>{job.label}</td>
              <td style={{color:'var(--text-muted)'}}>{job.schedule}</td>
              <td style={{color:'var(--text-muted)',fontSize:10}}>{job.desc}</td>
              <td className="num" style={{fontSize:10}}>{fmtRunTime(job.last_run)}</td>
              <td className="num" style={{fontSize:10}}>{fmtNextRun(job.next_run)}</td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}
