        mango_pipeline_auto_grade: d.mango_pipeline_auto_grade !== false,
      }))
      .catch(() => {})
      .finally(() => setPipeLoading(false));

    // Load criteria — normalize active→enabled
    setCritLoading(true);
    api('/api/admin/calls/analysis/criteria')
      .then(d => {
        const rows = (d.criteria || []).map(c => ({...c, enabled: c.enabled !== undefined ? c.enabled : (c.active !== 0)}));
        setCriteria(rows);
        // If table is empty (never seeded), reset to defaults automatically
        if (rows.length === 0) {
          return api('/api/admin/calls/analysis/criteria/reset', { method: 'POST' })
            .then(r => {
              const seeded = (r.criteria || []).map(c => ({...c, enabled: c.active !== 0}));
              setCriteria(seeded);
            });
        }
      })
      .catch(() => setCritMsg('✗ Failed to load criteria'))
      .finally(() => setCritLoading(false));

    setTmLoading(true);
    api('/api/admin/calls/analysis/team-members')
      .then(d => setMembers(d.members || []))
      .catch(() => setTmMsg('✗ Failed to load team members'))
      .finally(() => setTmLoading(false));
  }, []);

  // ── Pipeline helpers ─────────────────────────────────────────────────────────
  async function savePipelineSettings() {
    setPipeSaving(true); setPipeMsg('');
    try {
      await api('/api/admin/mango-settings', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(pipeForm),
      });
      setPipeMsg('✓ Saved');
    } catch(e) { setPipeMsg('✗ ' + e.message); }
    finally { setPipeSaving(false); }
  }

  // ── Criteria helpers ────────────────────────────────────────────────────────
  const weightTotal = criteria.reduce((s, c) => s + (Number(c.weight) || 0), 0);
  const weightOk    = Math.abs(weightTotal - 100) < 0.5;

  function updateCriterion(idx, field, val) {
    setCriteria(cs => cs.map((c, i) => i === idx ? {...c, [field]: val} : c));
    setCritMsg('');
  }

  function addCriterion() {
    const name = newCritName.trim();
    if (!name) return;
    setCriteria(cs => [...cs, {name, description: '', weight: 0, enabled: true}]);
    setNewCritName('');
    setCritMsg('');
  }

  function removeCriterion(idx) {
    setCriteria(cs => cs.filter((_, i) => i !== idx));
    setCritMsg('');
  }

  async function saveCriteria(force = false) {
    if (!force && !weightOk) return;
    setCritSaving(true); setCritMsg('');
    try {
      const payload = criteria.map(c => ({
        name: c.name, description: c.description || '',
        weight: Number(c.weight) || 0,
        enabled: c.enabled !== false && c.enabled !== 0,
      }));
      const d = await api('/api/admin/calls/analysis/criteria', { method: 'PUT', body: JSON.stringify({criteria: payload}) });
      if (d.ok) {
        const rows = (d.criteria || criteria).map(c => ({...c, enabled: c.enabled !== undefined ? c.enabled : (c.active !== 0)}));
        setCriteria(rows);
        setCritMsg('✓ Saved');
      } else setCritMsg('✗ Save failed');
    } catch(e) { setCritMsg('✗ ' + e.message); }
    finally { setCritSaving(false); }
  }

  async function resetCriteria() {
    if (!window.confirm('Reset all grading criteria to factory defaults? This cannot be undone.')) return;
    setCritSaving(true); setCritMsg('');
    try {
      const d = await api('/api/admin/calls/analysis/criteria/reset', { method: 'POST' });
      if (d.ok) {
        const rows = (d.criteria || []).map(c => ({...c, enabled: c.active !== 0}));
        setCriteria(rows);
        setCritMsg('✓ Reset to defaults');
      } else setCritMsg('✗ Reset failed');
    } catch(e) { setCritMsg('✗ ' + e.message); }
    finally { setCritSaving(false); }
  }

  // ── Team member helpers ─────────────────────────────────────────────────────
  function addMember() {
    const n = newName.trim();
    const e = newExt.trim();
    if (!n || !e) { setTmMsg('✗ Name and extension are required'); return; }
    if (members.some(m => String(m.extension) === e)) { setTmMsg('✗ Extension already exists'); return; }
    setMembers(ms => [...ms, {name: n, extension: e, active: true}]);
    setNewName(''); setNewExt(''); setTmMsg('');
  }

  function updateMember(idx, field, val) {
    setMembers(ms => ms.map((m, i) => i === idx ? {...m, [field]: val} : m));
    setTmMsg('');
  }

  function removeMember(idx) {
    setMembers(ms => ms.filter((_, i) => i !== idx));
    setTmMsg('');
  }

  async function saveMembers() {
    setTmSaving(true); setTmMsg('');
    try {
      const payload = members.map(m => ({
        name: m.name, extension: m.extension,
        active: m.active !== false && m.active !== 0,
      }));
      const d = await api('/api/admin/calls/analysis/team-members', { method: 'PUT', body: JSON.stringify({members: payload}) });
      if (d.ok) { setMembers(d.members || members); setTmMsg('✓ Saved'); }
      else setTmMsg('✗ Save failed');
    } catch(e) { setTmMsg('✗ ' + e.message); }
    finally { setTmSaving(false); }
  }

  const sectionHead = (title) => (
    <div style={{fontSize:12,fontWeight:700,color:'var(--text)',marginBottom:12,textTransform:'uppercase',letterSpacing:'0.04em',borderBottom:'1px solid var(--border)',paddingBottom:6}}>
      {title}
    </div>
  );

  return (
    <div style={{display:'flex',flexDirection:'column',gap:24}}>

      {/* ── Pipeline Toggles ────────────────────────────────────────────────── */}
      <div style={{background:'#fff',border:'1px solid var(--border)',borderRadius:8,padding:'16px 20px'}}>
        {sectionHead('Pipeline Settings')}
        {pipeLoading ? (
          <div style={{color:'var(--text-muted)',fontSize:12}}>Loading…</div>
        ) : (
          <>
            <div style={{fontSize:11,color:'var(--text-muted)',marginBottom:12,padding:'8px 12px',background:'#fff7ed',border:'1px solid #fed7aa',borderRadius:6}}>
              ⚠️ <strong>Important:</strong> The AI pipeline only processes <strong>new calls going forward</strong> when enabled. Enabling it will not retroactively analyze existing calls — use "Bulk Analyze" on the Calls tab for that.
            </div>
            {[
              ['mango_enabled', 'Enable Mango Sync', 'Sync call list from Mango Voice every 5 minutes'],
              ['mango_pipeline_enabled', 'Enable AI Pipeline', 'Download recordings, transcribe with Whisper, and grade with Claude — for new calls only'],
              ['mango_pipeline_auto_grade', 'Auto-grade after transcription', 'Automatically grade each call with Claude immediately after transcription completes'],
            ].map(([key, label, desc]) => (
              <div key={key} style={{display:'flex',alignItems:'flex-start',gap:10,marginBottom:10}}>
                <input type="checkbox" id={`pipe_${key}`} checked={!!pipeForm[key]}
                  onChange={e => setPipeForm(f => ({...f, [key]: e.target.checked}))}
                  style={{marginTop:2,flexShrink:0}} />
                <label htmlFor={`pipe_${key}`} style={{fontSize:12,cursor:'pointer'}}>
                  <span style={{fontWeight:600}}>{label}</span>
                  {desc && <span style={{color:'var(--text-muted)',marginLeft:6,fontSize:11}}>{desc}</span>}
                </label>
              </div>
            ))}
            <div style={{display:'flex',gap:8,alignItems:'center',marginTop:8}}>
              <button onClick={savePipelineSettings} disabled={pipeSaving}
                style={{padding:'6px 16px',background:pipeSaving?'var(--bg-card)':'var(--teal)',
                  color:pipeSaving?'var(--text-muted)':'#fff',border:'1px solid var(--teal)',
                  borderRadius:6,cursor:pipeSaving?'not-allowed':'pointer',fontSize:12,fontWeight:600}}>
                {pipeSaving ? 'Saving…' : 'Save Pipeline Settings'}
              </button>
              {pipeMsg && <span style={{fontSize:11,color:pipeMsg.startsWith('✓')?'var(--green)':'var(--red)'}}>{pipeMsg}</span>}
            </div>
          </>
        )}
      </div>

      {/* ── Grading Criteria Editor ─────────────────────────────────────── */}
      <div style={{background:'#fff',border:'1px solid var(--border)',borderRadius:8,padding:'16px 20px'}}>
        {sectionHead('Grading Criteria')}
        <div style={{fontSize:11,color:'var(--text-muted)',marginBottom:10}}>
          Each criterion is scored pass/fail during call analysis. Weights must sum to 100%.
        </div>
        {critLoading && <div style={{color:'var(--text-muted)',fontSize:12}}>Loading…</div>}
        {!critLoading && (
          <>
            <table style={{width:'100%',borderCollapse:'collapse',fontSize:12,marginBottom:12}}>
              <thead>
                <tr style={{background:'var(--bg-card)'}}>
                  {['Criterion','Description','Weight (%)','Enabled',''].map(h => (
                    <th key={h} style={{padding:'6px 10px',textAlign:'left',fontWeight:600,fontSize:11,color:'var(--text-muted)',borderBottom:'1px solid var(--border)'}}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {criteria.map((c, i) => (
                  <tr key={c.id || i} style={{borderBottom:'1px solid var(--border)'}}>
                    <td style={{padding:'6px 10px',fontWeight:600,whiteSpace:'nowrap'}}>
                      <input value={c.name || ''}
                        onChange={e => updateCriterion(i, 'name', e.target.value)}
                        style={{width:'100%',minWidth:140,border:'1px solid var(--border)',borderRadius:4,padding:'2px 6px',fontSize:11,fontWeight:600,color:'var(--text)'}} />
                    </td>
                    <td style={{padding:'6px 10px',color:'var(--text-muted)',fontSize:11,maxWidth:280}}>
                      <input value={c.description || ''}
                        onChange={e => updateCriterion(i, 'description', e.target.value)}
                        style={{width:'100%',border:'1px solid var(--border)',borderRadius:4,padding:'2px 6px',fontSize:11,color:'var(--text)'}} />
                    </td>
                    <td style={{padding:'6px 10px'}}>
                      <input type="number" min="0" max="100" value={c.weight ?? ''}
                        onChange={e => updateCriterion(i, 'weight', e.target.value)}
                        style={{width:60,border:'1px solid var(--border)',borderRadius:4,padding:'2px 6px',fontSize:11,
                          color: weightOk ? 'var(--text)' : 'var(--red)'}} />
                    </td>
                    <td style={{padding:'6px 10px'}}>
                      <input type="checkbox" checked={c.enabled !== false && c.enabled !== 0}
                        onChange={e => updateCriterion(i, 'enabled', e.target.checked)} />
                    </td>
                    <td style={{padding:'6px 10px'}}>
                      <button onClick={() => removeCriterion(i)}
                        style={{background:'none',border:'none',cursor:'pointer',color:'var(--red)',fontSize:13,padding:'0 4px'}}
                        title="Remove">✕</button>
                    </td>
                  </tr>
                ))}
                {/* Add row */}
                <tr style={{background:'#f8fafc'}}>
                  <td colSpan={4} style={{padding:'6px 10px'}}>
                    <input placeholder="New criterion name…" value={newCritName}
                      onChange={e => setNewCritName(e.target.value)}
                      onKeyDown={e => e.key==='Enter' && addCriterion()}
                      style={{width:'100%',border:'1px solid var(--border)',borderRadius:4,padding:'3px 6px',fontSize:11}} />
                  </td>
                  <td style={{padding:'6px 10px'}}>
                    <button onClick={addCriterion}
                      style={{padding:'3px 10px',background:'var(--teal)',color:'#fff',border:'none',borderRadius:4,cursor:'pointer',fontSize:11}}>
                      + Add
                    </button>
                  </td>
                </tr>
              </tbody>
            </table>

            {/* Weight total */}
            <div style={{fontSize:11,marginBottom:12,display:'flex',alignItems:'center',gap:8}}>
              <span style={{color: weightOk ? 'var(--green)' : 'var(--red)', fontWeight:600}}>
                Weight total: {weightTotal}%{!weightOk ? ` (must equal 100)` : ' ✓'}
              </span>
            </div>

            <div style={{display:'flex',gap:8,alignItems:'center'}}>
              <button onClick={() => saveCriteria(false)} disabled={critSaving || !weightOk}
                title={!weightOk ? 'Weights must sum to 100' : 'Save criteria'}
                style={{padding:'6px 16px',background:(!weightOk||critSaving)?'var(--bg-card)':'var(--teal)',
                  color:(!weightOk||critSaving)?'var(--text-muted)':'#fff',border:'1px solid var(--teal)',
                  borderRadius:6,cursor:(!weightOk||critSaving)?'not-allowed':'pointer',fontSize:12,fontWeight:600}}>
                {critSaving ? 'Saving…' : 'Save Criteria'}
              </button>
              {!weightOk && (
                <button onClick={() => saveCriteria(true)} disabled={critSaving}
                  style={{padding:'6px 12px',background:'none',color:'var(--red)',border:'1px solid var(--red)',
                    borderRadius:6,cursor:'pointer',fontSize:11}}>
                  Save anyway
                </button>
              )}
              <button onClick={resetCriteria} disabled={critSaving}
                style={{padding:'6px 12px',background:'none',color:'var(--text-muted)',border:'1px solid var(--border)',
                  borderRadius:6,cursor:'pointer',fontSize:11}}>
                Reset to Defaults
              </button>
              {critMsg && <span style={{fontSize:11,color:critMsg.startsWith('✓')?'var(--green)':'var(--red)'}}>{critMsg}</span>}
            </div>
          </>
        )}
      </div>

      {/* ── Team Members ───────────────────────────────────────────────────── */}
      <div style={{background:'#fff',border:'1px solid var(--border)',borderRadius:8,padding:'16px 20px'}}>
        {sectionHead('Team Members')}
        <div style={{fontSize:11,color:'var(--text-muted)',marginBottom:10}}>
          Extensions are matched from Mango Voice call data to resolve team member names.
        </div>
        {tmLoading && <div style={{color:'var(--text-muted)',fontSize:12}}>Loading…</div>}
        {!tmLoading && (
          <>
            <table style={{width:'100%',borderCollapse:'collapse',fontSize:12,marginBottom:12}}>
              <thead>
                <tr style={{background:'var(--bg-card)'}}>
                  {['Name','Extension','Active',''].map(h => (
                    <th key={h} style={{padding:'6px 10px',textAlign:'left',fontWeight:600,fontSize:11,color:'var(--text-muted)',borderBottom:'1px solid var(--border)'}}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {members.map((m, i) => (
                  <tr key={i} style={{borderBottom:'1px solid var(--border)'}}>
                    <td style={{padding:'6px 10px',fontWeight:600}}>{m.name}</td>
                    <td style={{padding:'6px 10px',fontFamily:'monospace'}}>{m.extension}</td>
                    <td style={{padding:'6px 10px'}}>
                      <input type="checkbox" checked={m.active !== false && m.active !== 0}
                        onChange={e => updateMember(i, 'active', e.target.checked)} />
                    </td>
                    <td style={{padding:'6px 10px'}}>
                      <button onClick={() => removeMember(i)}
                        style={{background:'none',border:'none',cursor:'pointer',color:'var(--red)',fontSize:13,padding:'0 4px'}}
                        title="Remove">✕</button>
                    </td>
                  </tr>
                ))}
                {/* Add row */}
                <tr style={{background:'#f8fafc'}}>
                  <td style={{padding:'6px 10px'}}>
                    <input placeholder="Name" value={newName} onChange={e => setNewName(e.target.value)}
                      style={{width:'100%',border:'1px solid var(--border)',borderRadius:4,padding:'3px 6px',fontSize:11}} />
                  </td>
                  <td style={{padding:'6px 10px'}}>
                    <input placeholder="Extension" value={newExt} onChange={e => setNewExt(e.target.value)}
                      style={{width:80,border:'1px solid var(--border)',borderRadius:4,padding:'3px 6px',fontSize:11,fontFamily:'monospace'}}
                      onKeyDown={e => e.key==='Enter' && addMember()} />
                  </td>
                  <td style={{padding:'6px 10px'}}>
                    <input type="checkbox" checked disabled />
                  </td>
                  <td style={{padding:'6px 10px'}}>
                    <button onClick={addMember}
                      style={{padding:'3px 10px',background:'var(--teal)',color:'#fff',border:'none',borderRadius:4,cursor:'pointer',fontSize:11}}>
                      + Add
                    </button>
                  </td>
                </tr>
              </tbody>
            </table>

            <div style={{display:'flex',gap:8,alignItems:'center'}}>
              <button onClick={saveMembers} disabled={tmSaving}
                style={{padding:'6px 16px',background:tmSaving?'var(--bg-card)':'var(--teal)',
                  color:tmSaving?'var(--text-muted)':'#fff',border:'1px solid var(--teal)',
                  borderRadius:6,cursor:tmSaving?'not-allowed':'pointer',fontSize:12,fontWeight:600}}>
                {tmSaving ? 'Saving…' : 'Save Team Members'}
              </button>
              {tmMsg && <span style={{fontSize:11,color:tmMsg.startsWith('✓')?'var(--green)':'var(--red)'}}>{tmMsg}</span>}
            </div>
          </>
        )}
      </div>
    </div>
  );
}

// ── CallAnalysisView — top-level wrapper with sub-nav ─────────────────────────

function CallAnalysisView() {
  const [subView, setSubView] = useState('calls'); // 'calls' | 'performance' | 'settings'

  const subNavStyle = (k) => ({
    padding:'5px 14px', fontSize:12, border:'none', borderBottom:'2px solid',
    cursor:'pointer', background:'transparent',
    borderBottomColor: subView===k ? 'var(--teal)' : 'transparent',
    color: subView===k ? 'var(--teal)' : 'var(--text-muted)',
    fontWeight: subView===k ? 700 : 400,
  });

  return (
    <div>
      {/* Sub-navigation */}
      <div style={{display:'flex',gap:2,borderBottom:'1px solid var(--border)',marginBottom:16}}>

}

  // PR 3: Save geographic targeting to Google Ads
  async function saveLocations(campId) {
    const cd = campDetail;
    const campResource = cd?.campaign?.gads_campaign_resource;
    if (!campResource) { alert('No campaign resource found'); return; }
    let parsed;
    try { parsed = JSON.parse(geoEditDraft); } catch(e) { alert('Invalid geo data'); return; }
    const locs = parsed?.locations || [];
    if (!locs.length) { alert('Add at least one location before saving'); return; }
    setGeoSaving(true);
    try {
      const res = await api(`/api/admin/campaigns/${campId}/set-locations`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({campaign_resource: campResource, geo_json: geoEditDraft}),
      });
      // Build a clear verification message
      const lines = [];
      lines.push(`✅ Location update sent to Google Ads`);
      lines.push(`   Removed: ${res.removed}  |  Added: ${res.added}`);
      if (res.live_criteria?.length) {
        lines.push('');
        lines.push('📍 Live in Google Ads now:');
        res.live_criteria.forEach(c => {
          const neg = c.negative ? ' [EXCLUDED]' : '';
          const gp  = c.lat != null ? ` ✓ geo_point` : ` ⚠ no geo_point`;
          lines.push(`  • ${c.summary}${gp}${neg}`);
        });
        if (res.verified) lines.push('');
        lines.push(res.has_live_criteria ? '✅ Confirmed — Google Ads has active targeting criteria' : '⚠️ Could not verify — check Google Ads directly');
      }
      if (res.errors?.length) {
        lines.push('');
        lines.push('⚠️ Soft errors:');
        res.errors.forEach(e => lines.push(`  • ${e}`));
      }
      alert(lines.join('\n'));
      setGeoEditOpen(false);
      setGeoEditDraft('');
      openCampaignDetail(campId, campDetailDays);
    } catch(e) {
      alert('Location update failed: ' + (e?.detail || e?.message || 'Unknown error'));
    } finally {
      setGeoSaving(false);
    }

  async function doGadsImport() {
    if (gadsImportSelected.size === 0) return;
    setGadsImporting(true);
    try {
      // Split selected rows: those with a link target → /link-campaign; rest → /import-campaigns
      const linkPairs = [];
      const createIds = [];
      for (const gid of gadsImportSelected) {
        if (gadsLinkMap[gid]) linkPairs.push({ gads_campaign_id: gid, local_campaign_id: gadsLinkMap[gid] });
        else createIds.push(gid);
      }

      let linked = 0;
      const linkErrors = [];
      for (const pair of linkPairs) {
        try {
          await api('/api/admin/gads/link-campaign', { method: 'POST', body: JSON.stringify(pair) });
          linked++;
        } catch(e) {
          linkErrors.push(e?.detail || e?.message || 'Unknown error');
        }
      }

      let importResult = { imported: [], skipped: [], errors: [] };
      if (createIds.length > 0) {
        importResult = await api('/api/admin/gads/import-campaigns', {
          method: 'POST',
          body: JSON.stringify({ campaign_ids: createIds }),
        });
      }

      const msg = [
        linked                          ? `🔗 Linked ${linked}` : null,
        importResult.imported?.length   ? `✅ Imported ${importResult.imported.length}` : null,
        importResult.skipped?.length    ? `⏭ ${importResult.skipped.length} already imported` : null,
        importResult.errors?.length     ? `❌ ${importResult.errors.length} import error(s)` : null,
        linkErrors.length               ? `❌ ${linkErrors.length} link error(s): ${linkErrors[0]}` : null,
      ].filter(Boolean).join(' · ');
      alert(msg || 'Done');
      setGadsImportOpen(false);
      await loadUnifiedCamps();
    } catch(e) {
      alert('Import failed: ' + (e?.detail || e?.message));
    } finally {
      setGadsImporting(false);
    }
  }

  async function wizardLaunch() {
    setSavingCamp(true); setCampSaveMsg(''); setWizardStepError('');
    try {
      const wfIdVal = wizardSkipWorkflow ? null : (wizardWfId === '' ? null : parseInt(wizardWfId) || null);

        workflow_id: wfIdVal,

      const createRes = await api('/api/admin/campaigns/create', { method: 'POST', body: JSON.stringify(savedCamp) });
      const createdCampId = createRes?.campaign?.campaign_id || null;
      setWizardCreatedCampId(createdCampId);
      // Campaign saved — move to Step 4: Opus Strategy Review
      setWizardStep(4);
      setWizardStrategy(null);
      setWizardStrategyLoading(true);
      setSavingCamp(false);
      try {
        const budgetHint = savedCamp.monthly_budget
          ? `$${monthlyToDaily(savedCamp.monthly_budget).toFixed(0)}/day budget (~$${Math.round(savedCamp.monthly_budget)}/mo)` + (savedCamp.expected_cpl ? `, target CPL $${savedCamp.expected_cpl}` : '')
          : '';
        const goalParts = [
          savedCamp.objective || `Generate leads for ${savedCamp.service_focus || savedCamp.campaign_name}`,
          savedCamp.target_audience ? `Target audience: ${savedCamp.target_audience}` : '',
          savedCamp.promo_offer ? `Offer: ${savedCamp.promo_offer}` : '',
          savedCamp.notes ? `Notes: ${savedCamp.notes}` : '',
        ].filter(Boolean);
        const res = await api('/api/admin/ai/campaign-strategy', {
          method: 'POST',
          body: JSON.stringify({
            campaign_goal: goalParts.join('. '),
            target_service: savedCamp.service_focus || 'Dental Implants',
            budget_hint: budgetHint,
            additional_context: `Campaign type: ${savedCamp.campaign_type}. Campaign name: ${savedCamp.campaign_name}.`,
            source_campaign_id: wizardCopyFrom || '',
          }),
        });
        const strategy = res.strategy || null;
        if (strategy && res.source_campaign_name) {
          strategy._source_campaign_name = res.source_campaign_name;
        }
        setWizardStrategy(strategy);
        // Persist strategy to the campaign record so it's never lost
        if (strategy && createdCampId) {
          api(`/api/admin/campaigns/${createdCampId}/strategy`, {
            method: 'PATCH',
            body: JSON.stringify({ strategy }),
          }).catch(() => {}); // best-effort, don't block UI
        }
      } catch(e) {
        setWizardStrategy({ _error: e?.detail || e?.message || 'Strategy generation failed' });
      }
      setWizardStrategyLoading(false);
    } catch(e) {
      setCampSaveMsg('❌ ' + (e?.detail || e?.message || 'Save failed'));
      setSavingCamp(false);
    }
  }

  // Lazy-loaded ad-group and search-term data (fetched on first ReportsTab mount)
  const [adGroupStats, setAdGroupStats] = useState([]);
  const [searchTermStats, setSearchTermStats] = useState([]);
  const [dailyStats, setDailyStats] = useState([]);

  useEffect(() => {
    Promise.all([
      api('/api/admin/gads/ad-groups').catch(() => ({ ad_groups: [] })),
      api('/api/admin/gads/search-terms').catch(() => ({ search_terms: [] })),
      api('/api/admin/gads/daily-stats?days=30').catch(() => ({ rows: [] })),
    ]).then(([ag, st, ds]) => {
      setAdGroupStats(ag.ad_groups || []);
      setSearchTermStats(st.search_terms || []);
      setDailyStats(ds.rows || []);
    });
  }, []);

  const presets = [
    { label: '7d', days: 7 },
    { label: '30d', days: 30 },
    { label: '90d', days: 90 },
    { label: 'All', days: 365 },
  ];

  async function refreshGA4() {
    setGa4Refreshing(true);
    try { await api('/api/admin/ga4/refresh', {method:'POST'}); window.location.reload(); }
    catch(e) { alert('GA4 refresh failed: '+e.message); }
    setGa4Refreshing(false);
  }

  function togglePanel(campKey, tab) {
    // If same campaign + same tab → close. Otherwise open that tab.
    setExpanded(prev =>
      prev && prev.key === campKey && prev.tab === tab ? null : { key: campKey, tab }
    );
  }

  const COLS = 8; // number of columns in campaign table

  return (
    <div>
      {/* View toggle */}
      <div className="reports-view-toggle">
        {[['campaigns','Campaigns'],['adgroups','Ad Groups'],['searchterms','Search Terms'],['adcreatives','Ad Creatives'],['landingpages','Landing Pages']].map(([k,l])=>(
          <button key={k} className={'reports-view-btn'+(view===k?' active':'')} onClick={()=>setView(k)}>{l}</button>
        ))}
      </div>

      {/* ── Ad Groups view ── */}
      {view==='adgroups' && <AdGroupsView adGroupStats={adGroupStats} dailyStats={dailyStats} />}

      {/* ── Search Terms view ── */}
      {view==='searchterms' && <SearchTermsView searchTermStats={searchTermStats} />}

      {/* ── Ad Creatives view ── */}
      {view==='adcreatives' && (
        <div>
          <div style={{display:'flex',gap:6,alignItems:'center',marginBottom:10}}>
            <span style={{fontSize:11,color:'var(--text-muted)'}}>Window:</span>
            {[7,30,90].map(d=>(
              <button key={d}
                style={{padding:'3px 8px',fontSize:10,border:'1px solid var(--border)',borderRadius:4,cursor:'pointer',
                  background:adCreativesDays===d?'var(--teal)':'#fff',
                  color:adCreativesDays===d?'#fff':'var(--text-muted)'}}
                onClick={()=>setAdCreativesDays(d)}>
                {d}d
              </button>
            ))}
          </div>
          <AdCreativesView days={adCreativesDays} />
        </div>
      )}

      {/* ── Landing Pages view ── */}
      {view==='landingpages' && <LandingPagesView ga4Data={ga4Data} />}

      {/* ── Campaigns view ── */}
      {view==='campaigns' && <div>
      <div className="report-section">
        {/* Header */}
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:8,marginBottom:12}}>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <div className="report-title" style={{marginBottom:0}}>Campaigns</div>
            <button className="btn btn-teal btn-sm" style={{fontSize:11}} onClick={openWizard}>+ New Campaign</button>
            <button className="btn btn-sm" style={{fontSize:10,background:'#4285f4',color:'#fff',border:'none',cursor:'pointer',padding:'3px 10px',borderRadius:4}}
              onClick={openGadsImport}>⬇ Import from Google Ads</button>
          </div>
          <div style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap'}}>
            <label style={{fontSize:10,color:'var(--text-muted)',display:'flex',alignItems:'center',gap:4,cursor:'pointer',userSelect:'none'}}>
              <input type="checkbox" checked={showInactive} onChange={e=>setShowInactive(e.target.checked)} />
              Show inactive (90d+)
            </label>
            {presets.map(p=>(
              <button key={p.label}
                style={{padding:'3px 8px',fontSize:10,border:'1px solid var(--border)',borderRadius:4,cursor:'pointer',
                  background:unifiedDays===p.days?'var(--teal)':'#fff',
                  color:unifiedDays===p.days?'#fff':'var(--text-muted)'}}
                onClick={()=>setUnifiedDays(p.days)}>{p.label}</button>
            ))}
            <button className="btn btn-ghost btn-sm" onClick={loadUnifiedCamps} style={{fontSize:10}}>↻ Refresh</button>
          </div>
        </div>

        {/* Table */}
        <table className="report-table">
          <thead>
            <tr>
              <th>Campaign</th>
              <th>Status</th>
              <th style={{width:90}}>Type</th>
              <th style={{width:88}}>Start</th>
              <th style={{width:88}}>End</th>
              <th className="num">Daily Budget</th>
              <th className="num">Leads</th>
              <th className="num" title="Inbound calls attributed to this campaign">Calls</th>
              <th className="num" title="Calls graded booked that matched an OD appointment">Appts</th>
              <th className="num">Cost</th>
              <th className="num">CPL</th>
              <th className="num">ROI</th>
              <th style={{textAlign:'center',width:80}}>AI Review</th>
              <th style={{textAlign:'center',width:76}}>AI Max</th>
              <th style={{width:190}}>Actions</th>
            </tr>
          </thead>
          <tbody>
            {unifiedLoading && (
              <tr><td colSpan={15} style={{textAlign:'center',color:'var(--text-muted)',padding:20,fontStyle:'italic'}}>Loading…</td></tr>
            )}
            {!unifiedLoading && unifiedCamps.length === 0 && (
              <tr><td colSpan={15} style={{textAlign:'center',color:'var(--text-muted)',padding:20,fontStyle:'italic'}}>
                No campaigns yet — click "+ New Campaign" or "⬇ Import from Google Ads".
              </td></tr>
            )}
            {!unifiedLoading && unifiedCamps.map((c,ci) => {
              const m = c.metrics || {};
              const statusColor = {
                ACTIVE:'#059669', DRAFT:'#6b7280', PAUSED:'#d97706',
                COMPLETED:'#2563eb', ARCHIVED:'#9ca3af', UNMANAGED:'#a855f7',
                SCHEDULED:'#7c3aed', QUEUED:'#0891b2',
              }[c.status] || '#6b7280';
              const isLoading = !!campActionLoading[c.campaign_id];
              const aiSaving = !!aiReviewSaving[c.campaign_id];
              const rowKey = c.campaign_id || `synthetic_${ci}`;
              const strategyOpen = expandedStrategy === c.campaign_id;
              let parsedStrategy = null;
              if (c.strategy_json && typeof c.strategy_json === 'object') {
                parsedStrategy = c.strategy_json;
              } else if (c.strategy_json && typeof c.strategy_json === 'string') {
                try { parsedStrategy = JSON.parse(c.strategy_json); } catch(_) {}
              }

              return (
                <React.Fragment key={rowKey}>
                  <tr style={c.is_inactive_90d ? {opacity:0.5} : null}>
                    {/* Campaign name */}
                    <td style={{fontWeight:600,maxWidth:200}}>
                      {c.campaign_id ? (
                        <span style={{cursor:'pointer',color:'var(--teal)',textDecoration:'underline',
                          textDecorationStyle:'dotted',wordBreak:'break-word'}}
                          onClick={()=>openCampaignDetail(c.campaign_id, unifiedDays)}>{c.campaign_name}</span>
                      ) : (
                        <span style={{wordBreak:'break-word',color:'var(--text-muted)',fontStyle:'italic'}}
                          title="Not yet imported into dashboard">{c.campaign_name}</span>
                      )}
                      {c.is_inactive_90d && (
                        <span style={{fontSize:9,marginLeft:5,color:'var(--text-muted)'}}>· 90d inactive</span>
                      )}
                      {(() => {
                        let slCount = 0;
                        try { slCount = c.sitelinks ? JSON.parse(c.sitelinks).length : 0; } catch(e) {}
                        return slCount > 0 ? (
                          <span title={`${slCount} sitelink${slCount!==1?'s':''} configured`}
                            style={{display:'inline-block',fontSize:9,marginLeft:5,
                              background:'#eff6ff',color:'#1d4ed8',border:'1px solid #bfdbfe',
                              borderRadius:8,padding:'0px 5px',fontWeight:600,lineHeight:'16px'}}>
                            🔗{slCount}
                          </span>
                        ) : null;
                      })()}
                    </td>

                    {/* Status */}
                    <td>
                      <span style={{fontSize:10,fontWeight:600,color:statusColor,
                        background:statusColor+'18',padding:'2px 7px',borderRadius:3,whiteSpace:'nowrap'}}>
                        {c.status}
                      </span>
                    </td>

                    <td style={{fontSize:10,color:'var(--text-muted)'}}>{(c.campaign_type||'—').replace('GOOGLE_ADS','G-Ads')}</td>
                    <td style={{fontSize:11}}>{c.start_date || '—'}</td>
                    <td style={{fontSize:11}}>{c.end_date || '—'}</td>
                    <td className="num">{c.monthly_budget > 0 ? fmtDailyBudget(c.monthly_budget) : '—'}</td>
                    <td className="num">{m.leads > 0 ? m.leads : '—'}</td>
                    {/* Calls + Appts from call attribution */}
                    {(()=>{
                      const ca = campCallAttrib[c.campaign_id] || campCallAttrib[c.campaign_name] || {};
                      return (
                        <React.Fragment>
                          <td className="num">
                            {ca.total_calls > 0
                              ? <span title={`${ca.booked_calls||0} graded booked`}>{ca.total_calls}</span>
                              : <span style={{color:'var(--text-muted)'}}>—</span>}
                          </td>
                          <td className="num">
                            {ca.confirmed_appts > 0
                              ? <span style={{color:'#059669',fontWeight:600}}>{ca.confirmed_appts}</span>
                              : ca.booked_calls > 0
                                ? <span style={{color:'#92400e'}} title="Booked calls, OD match pending">~{ca.booked_calls}</span>
                                : <span style={{color:'var(--text-muted)'}}>—</span>}
                          </td>
                        </React.Fragment>
                      );
                    })()}
                    <td className="num">{m.cost > 0 ? fmtMoney(m.cost) : '—'}</td>
                    <td className="num">{m.cpl != null ? '$'+Number(m.cpl).toFixed(0) : '—'}</td>
                    <td className="num" style={{
                      color: m.roi == null ? 'var(--text-muted)'
                           : m.roi > 0 ? '#059669' : m.roi < 0 ? 'var(--red)' : 'var(--text-muted)'
                    }}>{m.roi != null ? Math.round(m.roi)+'%' : '—'}</td>

                    {/* AI Review toggle */}
                    <td style={{textAlign:'center'}}>
                      {c.is_synthetic ? (
                        <span style={{fontSize:9,color:'var(--text-muted)'}} title="Import this campaign to enable AI Review">—</span>
                      ) : (
                        <label style={{display:'inline-flex',alignItems:'center',gap:3,cursor:aiSaving?'wait':'pointer'}}
                          title={c.ai_review_enabled ? 'AI actively monitoring — click to disable' : 'Click to enable AI monitoring'}>
                          <input type="checkbox" disabled={aiSaving}
                            checked={!!c.ai_review_enabled}
                            onChange={()=>toggleAiReview(c)} />
                          {c.ai_review_enabled && !aiSaving && (
                            <span style={{fontSize:9,color:'#059669',fontWeight:600}}>ON</span>
                          )}
                          {aiSaving && <span style={{fontSize:9,color:'var(--text-muted)'}}>…</span>}
                        </label>
                      )}
                    </td>

                    {/* AI Max toggle */}
                    {(() => {
                      const maxSaving = !!aiMaxSaving[c.campaign_id];
                      const isLinked = c.is_gads_linked && !c.is_synthetic && c.campaign_id;
                      return (
                        <td style={{textAlign:'center'}}>
                          {!isLinked ? (
                            <span style={{fontSize:9,color:'var(--text-muted)'}}
                              title="Link to Google Ads to enable AI Max">—</span>
                          ) : (
                            <label style={{display:'inline-flex',alignItems:'center',gap:3,
                              cursor:maxSaving?'wait':'pointer'}}
                              title={c.ai_max_enabled
                                ? 'AI Max ON — Google AI expanding keyword reach. Click to disable.'
                                : 'Enable AI Max — Google AI will expand beyond your keyword list'}>
                              <input type="checkbox" disabled={maxSaving}
                                checked={!!c.ai_max_enabled}
                                onChange={()=>toggleAiMax(c)} />
                              {c.ai_max_enabled && !maxSaving && (
                                <span style={{fontSize:9,color:'#4285f4',fontWeight:600}}>ON</span>
                              )}
                              {maxSaving && <span style={{fontSize:9,color:'var(--text-muted)'}}>…</span>}
                            </label>
                          )}
                        </td>
                      );
                    })()}

                    {/* Actions */}
                    <td style={{textAlign:'right'}}>
                      {c.is_synthetic ? (
                        <button className="btn btn-sm" style={{fontSize:10,background:'#4285f4',color:'#fff',border:'none'}}
                          onClick={openGadsImport}>⬇ Import</button>
                      ) : (() => {
                        if (c.status === 'ARCHIVED' || c.status === 'COMPLETED') return null;
                        const loading = campActionLoading[c.campaign_id];
                        return (
                          <div style={{display:'flex',gap:3,justifyContent:'flex-end',flexWrap:'wrap'}}>
                            {c.strategy_json && (
                              <button className="btn btn-ghost btn-sm"
                                style={{fontSize:10,color:'#7c3aed',borderColor:'#7c3aed'}}
                                onClick={()=>setExpandedStrategy(strategyOpen ? null : c.campaign_id)}>
                                🧠 {strategyOpen ? '▲' : '▼'}
                              </button>
                            )}
                            {c.status === 'ACTIVE' && (
                              <button className="btn btn-ghost btn-sm" disabled={isLoading}
                                style={{fontSize:10,color:'#d97706',borderColor:'#d97706'}}
                                onClick={()=>campaignAction(c.campaign_id,'pause')}>
                                {loading==='pause'?'…':'⏸'}
                              </button>
                            )}
                            {c.status === 'PAUSED' && (
                              <button className="btn btn-sm" disabled={isLoading}
                                style={{fontSize:10,background:'#059669',color:'#fff',border:'none'}}
                                onClick={()=>campaignAction(c.campaign_id,'resume')}>
                                {loading==='resume'?'…':'▶ Enable'}
                              </button>
                            )}
                            {c.is_gads_linked ? (
                              <button className="btn btn-ghost btn-sm" disabled={isLoading}
                                style={{fontSize:10,color:'var(--red)',borderColor:'var(--red)'}}
                                onClick={()=>setStopConfirm(c)}>
                                {loading==='stop'?'…':'⏹ Stop'}
                              </button>
                            ) : (
                              <button className="btn btn-ghost btn-sm" disabled={isLoading}
                                style={{fontSize:10,color:'#9ca3af',borderColor:'#9ca3af'}}
                                onClick={()=>deleteCampaign(c.campaign_id, c.campaign_name)}>
                                🗑
                              </button>
                            )}
                          </div>
                        );
                      })()}
                    </td>
                  </tr>

                  {/* Strategy expansion row */}
                  {strategyOpen && parsedStrategy && (
                    <tr>
                      <td colSpan={15} style={{padding:0,background:'#fafafa',borderTop:'none'}}>
                        <div style={{padding:'16px 18px',borderLeft:'3px solid var(--teal)'}}>
                          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12}}>
                            <span style={{fontSize:13,fontWeight:700,color:'var(--text)'}}>🧠 Opus Strategy</span>
                            <span style={{fontSize:10,background:'#ede9fe',color:'#5b21b6',padding:'2px 7px',borderRadius:3,fontWeight:600}}>claude-opus-4-5</span>
                          </div>
                          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
                            <div>
                              {parsedStrategy.objective && (
                                <div style={{marginBottom:10}}>
                                  <div style={{fontSize:10,fontWeight:700,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'.5px',marginBottom:4}}>Objective</div>
                                  <div style={{fontSize:12,lineHeight:1.5}}>{parsedStrategy.objective}</div>
                                </div>
                              )}
                              {parsedStrategy.target_audience && (
                                <div style={{marginBottom:10}}>
                                  <div style={{fontSize:10,fontWeight:700,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'.5px',marginBottom:4}}>Target Audience</div>
                                  <div style={{fontSize:12,lineHeight:1.5}}>{parsedStrategy.target_audience}</div>
                                </div>
                              )}
                              {(parsedStrategy.key_messages||[]).length > 0 && (
                                <div style={{marginBottom:10}}>
                                  <div style={{fontSize:10,fontWeight:700,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'.5px',marginBottom:4}}>Key Messages</div>
                                  {(parsedStrategy.key_messages||[]).map((msg,i)=>(
                                    <div key={i} style={{display:'flex',gap:6,marginBottom:3}}>
                                      <span style={{color:'var(--teal)',fontWeight:700,fontSize:11}}>→</span>
                                      <span style={{fontSize:11,lineHeight:1.4}}>{msg}</span>
                                    </div>
                                  ))}
                                </div>
                              )}
                            </div>
                            <div>
                              {(parsedStrategy.ad_headlines||[]).length > 0 && (
                                <div style={{marginBottom:10}}>
                                  <div style={{fontSize:10,fontWeight:700,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'.5px',marginBottom:4}}>Ad Headlines</div>
                                  <div>{(parsedStrategy.ad_headlines||[]).map((h,i)=>(
                                    <span key={i} style={{background:'#e0f2fe',color:'#0c4a6e',fontSize:10,
                                      padding:'2px 7px',borderRadius:3,display:'inline-block',marginRight:4,marginBottom:4}}>{h}</span>
                                  ))}</div>
                                </div>
                              )}
                              {(parsedStrategy.ad_descriptions||[]).length > 0 && (
                                <div style={{marginBottom:10}}>
                                  <div style={{fontSize:10,fontWeight:700,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'.5px',marginBottom:4}}>Ad Descriptions</div>
                                  {(parsedStrategy.ad_descriptions||[]).map((d,i)=>(
                                    <div key={i} style={{fontSize:11,color:'var(--text)',marginBottom:3,lineHeight:1.4}}>"{d}"</div>
                                  ))}
                                </div>
                              )}
                              {parsedStrategy.implementation_instructions && (
                                <div style={{marginTop:6,background:'#f0fdf4',border:'1px solid #bbf7d0',borderRadius:5,padding:'8px 10px'}}>
                                  <div style={{fontSize:10,fontWeight:700,color:'#166534',marginBottom:3}}>📋 Implementation Instructions</div>
                                  <div style={{fontSize:11,lineHeight:1.5}}>{parsedStrategy.implementation_instructions}</div>
                                </div>
                              )}
                            </div>
                          </div>
                        </div>
                      </td>
                    </tr>
                  )}
                </React.Fragment>
              );
            })}
          </tbody>
        </table>
      </div>


      {/* ── Google Ads Import Modal ── */}
      {gadsImportOpen && (
        <div style={{position:'fixed',top:0,left:0,right:0,bottom:0,background:'rgba(0,0,0,.45)',
          zIndex:280,display:'flex',alignItems:'center',justifyContent:'center'}}
          onClick={()=>{ if (!gadsImporting) { setGadsImportOpen(false); setGadsLinkMap({}); setGadsUnlinkedLocal([]); } }}>
          <div style={{background:'#fff',borderRadius:12,width:620,maxWidth:'96vw',maxHeight:'88vh',
            display:'flex',flexDirection:'column',boxShadow:'0 8px 40px rgba(0,0,0,.25)'}}
            onClick={e=>e.stopPropagation()}>

            {/* Header */}
            <div style={{padding:'16px 20px',borderBottom:'1px solid var(--border)',flexShrink:0,
              display:'flex',alignItems:'center',justifyContent:'space-between'}}>
              <div>
                <div style={{fontSize:15,fontWeight:700,display:'flex',alignItems:'center',gap:8}}>
                  <span style={{color:'#4285f4',fontSize:18}}>⬇</span>
                  Import Campaigns from Google Ads
                </div>
                <div style={{fontSize:11,color:'var(--text-muted)',marginTop:2}}>
                  Select campaigns to bring into your dashboard with full Pause/Stop control
                </div>
              </div>
              <button style={{background:'none',border:'none',fontSize:20,cursor:'pointer',
                color:'var(--text-muted)',padding:'0 4px'}}
                onClick={()=>setGadsImportOpen(false)}>×</button>
            </div>

            {/* Body */}
            <div style={{flex:1,overflowY:'auto',padding:'12px 20px'}}>
              {gadsImportLoading ? (
                <div style={{display:'flex',alignItems:'center',justifyContent:'center',
                  flexDirection:'column',gap:10,padding:'40px 0',color:'var(--text-muted)'}}>
                  <div className="spinner" style={{width:24,height:24,borderWidth:3}}/>
                  <div style={{fontSize:12}}>Fetching campaigns from Google Ads…</div>
                </div>
              ) : gadsImportList.length === 0 ? (
                <div style={{textAlign:'center',padding:'32px 0',color:'var(--text-muted)',fontSize:12}}>
                  No campaigns found in your Google Ads account.
                </div>
              ) : (
                <>
                  <div style={{fontSize:11,color:'var(--text-muted)',marginBottom:10}}>
                    {gadsImportList.length} campaign(s) found ·
                    {gadsImportSelected.size > 0 ? ` ${gadsImportSelected.size} selected` : ' none selected'}
                  </div>
                  <table className="report-table">
                    <thead>
                      <tr>
                        <th style={{width:32}}>
                          <input type="checkbox"
                            checked={gadsImportSelected.size === gadsImportList.filter(c=>!c.already_imported).length
                              && gadsImportList.filter(c=>!c.already_imported).length > 0}
                            onChange={e => {
                              if (e.target.checked) {
                                setGadsImportSelected(new Set(
                                  gadsImportList.filter(c=>!c.already_imported).map(c=>c.campaign_id)
                                ));
                              } else {
                                setGadsImportSelected(new Set());
                              }
                            }} />
                        </th>
                        <th>Campaign</th>
                        <th>Status</th>
                        <th>Type</th>
                        <th className="num">Daily Budget</th>

                    </thead>
                    <tbody>

                        const isSelected = gadsImportSelected.has(camp.campaign_id);
                        const statusColor = camp.gads_status === 'ENABLED' ? '#059669' : '#d97706';
                        const statusLabel = camp.gads_status === 'ENABLED' ? 'ACTIVE' : 'PAUSED';
                        return (
                          <tr key={camp.campaign_id}
                            style={{opacity: isImported ? 0.5 : 1,
                              background: isSelected ? 'rgba(13,122,127,.04)' : 'transparent',
                              cursor: isImported ? 'default' : 'pointer'}}

                              if (isImported) return;
                              const s = new Set(gadsImportSelected);
                              if (s.has(camp.campaign_id)) s.delete(camp.campaign_id);
                              else s.add(camp.campaign_id);
                              setGadsImportSelected(s);
                            }}>
                            <td onClick={e=>e.stopPropagation()}>
                              <input type="checkbox"
                                disabled={isImported}
                                checked={isSelected}
                                onChange={e => {
                                  const s = new Set(gadsImportSelected);
                                  if (e.target.checked) s.add(camp.campaign_id);
                                  else s.delete(camp.campaign_id);
                                  setGadsImportSelected(s);
                                }} />
                            </td>
                            <td style={{fontWeight:600,fontSize:12}}>{camp.campaign_name}</td>
                            <td>
                              <span style={{fontSize:10,fontWeight:700,color:statusColor,
                                background:statusColor+'18',padding:'2px 7px',borderRadius:3}}>
                                {statusLabel}
                              </span>
                            </td>
                            <td style={{fontSize:10,color:'var(--text-muted)'}}>{camp.channel_type}</td>
                            <td className="num" style={{fontSize:11}}>${camp.daily_budget_usd}/d</td>
                            <td className="num" style={{fontSize:11}}>${camp.monthly_budget_usd}</td>
                            <td onClick={e=>e.stopPropagation()} style={{fontSize:10,minWidth:150}}>
                              {isImported ? (
                                <span style={{color:'#059669',fontWeight:600}}>✓ Imported</span>
                              ) : gadsUnlinkedLocal.length > 0 ? (
                                <select
                                  value={gadsLinkMap[camp.campaign_id] || ''}
                                  onChange={e => {
                                    const v = e.target.value;
                                    setGadsLinkMap(m => {
                                      const next = {...m};
                                      if (v) next[camp.campaign_id] = v;
                                      else delete next[camp.campaign_id];
                                      return next;
                                    });
                                    // Auto-select the row when a link target is picked
                                    if (v) {
                                      const s = new Set(gadsImportSelected);
                                      s.add(camp.campaign_id);
                                      setGadsImportSelected(s);
                                    }
                                  }}
                                  style={{fontSize:10,padding:'2px 4px',maxWidth:180,borderRadius:4,
                                    border:'1px solid var(--border)',background:'#fff'}}>
                                  <option value="">— Link to existing… —</option>
                                  {gadsUnlinkedLocal.map(lc => (
                                    <option key={lc.campaign_id} value={lc.campaign_id}>{lc.campaign_name}</option>
                                  ))}
                                </select>
                              ) : null}
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </>

                <button className="btn btn-ghost btn-sm" style={{fontSize:11}}

                </button>

            </div>
          </div>
        </div>

              </div>

              const cd = campDetail;
              const camp = cd.campaign;
              const summary = cd.summary;
              const strategy = cd.strategy;
              const statusColor = {ACTIVE:'#059669',DRAFT:'#6b7280',PAUSED:'#d97706',COMPLETED:'#2563eb',ARCHIVED:'#9ca3af',SCHEDULED:'#7c3aed',QUEUED:'#0891b2'}[camp.status]||'#6b7280';

              const isLoading = !!loading;

                          <div style={{display:'flex',flexDirection:'column',gap:6}}>

                                color:'#fff',borderRadius:4,padding:'4px 8px',width:'100%'}}

                            <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                              <input value={campEditFields.service_focus ?? (camp.service_focus||'')}

                                style={{fontSize:11,background:'rgba(255,255,255,.1)',border:'1px solid rgba(255,255,255,.3)',
                                  color:'#fff',borderRadius:4,padding:'3px 7px',width:140}}
                                placeholder="Service focus"/>
                              <input type="number" min="0" step="0.01"
                                value={campEditFields.monthly_budget != null
                                  ? monthlyToDaily(campEditFields.monthly_budget)
