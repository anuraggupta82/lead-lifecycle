                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10,marginBottom:10}}>
                  <div>
                    <label style={{fontSize:11,fontWeight:600,display:'block',marginBottom:3}}>Daily Budget ($)</label>
                    <input type="number" min="0" step="0.01" style={{width:'100%',fontSize:12,padding:'7px 10px',border:'1px solid var(--border)',borderRadius:5,boxSizing:'border-box'}}
                      placeholder="e.g. 100"
                      value={wizardDailyBudget}
                      onChange={e=>{
                        const raw = e.target.value;
                        setWizardDailyBudget(raw);
                        const d = parseFloat(raw)||0;
                        setNewCamp(p => ({...p, monthly_budget: dailyToMonthly(d)}));
                      }} />
                    {parseFloat(wizardDailyBudget) > 0 && (
                      <div style={{fontSize:10,color:'var(--text-muted)',marginTop:2}}>
                        ~${dailyToMonthly(parseFloat(wizardDailyBudget)).toFixed(0)}/mo
                      </div>
                    )}
                  </div>
                  <div>
                    <label style={{fontSize:11,fontWeight:600,display:'block',marginBottom:3}}>Target CPL ($)</label>
                    <input type="number" min="0" style={{width:'100%',fontSize:12,padding:'7px 10px',border:'1px solid var(--border)',borderRadius:5,boxSizing:'border-box'}}
                      placeholder="e.g. 150"
                      value={newCamp.expected_cpl} onChange={e=>setNC('expected_cpl',e.target.value)} />
                    {newCamp.monthly_budget > 0 && newCamp.expected_cpl > 0 && (
                      <div style={{fontSize:10,color:'var(--teal)',marginTop:2}}>~{Math.round(newCamp.monthly_budget / newCamp.expected_cpl)} leads/mo</div>
                    )}
                  </div>
                  <div>
                    <label style={{fontSize:11,fontWeight:600,display:'block',marginBottom:3}}>Objective</label>
                    <input style={{width:'100%',fontSize:12,padding:'7px 10px',border:'1px solid var(--border)',borderRadius:5,boxSizing:'border-box'}}
                      placeholder="e.g. 20 implant consults"
                      value={newCamp.objective} onChange={e=>setNC('objective',e.target.value)} />
                  </div>
                </div>

                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:10}}>
                  <div>
                    <label style={{fontSize:11,fontWeight:600,display:'block',marginBottom:3}}>Start Date</label>
                    <input type="date" style={{width:'100%',fontSize:12,padding:'7px 10px',border:'1px solid var(--border)',borderRadius:5,boxSizing:'border-box'}}
                      value={newCamp.start_date} onChange={e=>setNC('start_date',e.target.value)} />
                  </div>
                  <div>
                    <label style={{fontSize:11,fontWeight:600,display:'block',marginBottom:3}}>End Date <span style={{fontWeight:400,color:'var(--text-muted)'}}>(optional)</span></label>
                    <input type="date" style={{width:'100%',fontSize:12,padding:'7px 10px',border:'1px solid var(--border)',borderRadius:5,boxSizing:'border-box'}}
                      value={newCamp.end_date} onChange={e=>setNC('end_date',e.target.value)} />
                  </div>
                </div>

                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:10}}>
                  <div>
                    <label style={{fontSize:11,fontWeight:600,display:'block',marginBottom:3}}>Target Audience</label>
                    <input style={{width:'100%',fontSize:12,padding:'7px 10px',border:'1px solid var(--border)',borderRadius:5,boxSizing:'border-box'}}
                      placeholder="e.g. Adults 35-65, Worcester MA"
                      value={newCamp.target_audience} onChange={e=>setNC('target_audience',e.target.value)} />
                  </div>
                  <div>
                    <label style={{fontSize:11,fontWeight:600,display:'block',marginBottom:3}}>Landing Page URL</label>
                    <input style={{width:'100%',fontSize:12,padding:'7px 10px',border:'1px solid var(--border)',borderRadius:5,boxSizing:'border-box'}}
                      placeholder={wizardPractice?.website || 'https://yourpractice.com'}
                      value={newCamp.landing_page} onChange={e=>setNC('landing_page',e.target.value)} />
                    {wizardPractice?.website && !newCamp.landing_page && (
                      <div style={{fontSize:10,color:'var(--text-muted)',marginTop:2}}>
                        Defaults to your practice website ({wizardPractice.website}) if left blank.
                      </div>
                    )}
                  </div>
                </div>

                {newCamp.campaign_type === 'GOOGLE_ADS' && (
                  <div style={{marginBottom:10}}>
                    <label style={{fontSize:11,fontWeight:600,display:'block',marginBottom:3}}>
                      Google Ads Campaign ID <span style={{fontWeight:400,color:'var(--text-muted)'}}>(links cost + ROI data)</span>
                    </label>
                    <input style={{width:'100%',fontSize:12,padding:'7px 10px',border:'1px solid var(--border)',borderRadius:5,boxSizing:'border-box'}}
                      placeholder="e.g. 1234567890"
                      value={newCamp.campaign_id} onChange={e=>setNC('campaign_id',e.target.value)} />
                  </div>
                )}

                <div style={{marginBottom:4}}>
                  <label style={{fontSize:11,fontWeight:600,display:'block',marginBottom:3}}>Internal Notes</label>
                  <textarea rows={2} style={{width:'100%',fontSize:12,padding:'7px 10px',border:'1px solid var(--border)',borderRadius:5,boxSizing:'border-box',resize:'vertical'}}
                    placeholder="Any additional context for the team…"
                    value={newCamp.notes} onChange={e=>setNC('notes',e.target.value)} />
                </div>
              </div>
            )}

            {/* ── Step 3: Workflow ── */}
            {wizardStep === 3 && (
              <div>
                <div style={{fontWeight:700,fontSize:15,marginBottom:4}}>Attach a Follow-up Workflow</div>
                <div style={{fontSize:11,color:'var(--text-muted)',marginBottom:16}}>
                  Choose which automated email/SMS sequence fires when a lead comes from this campaign.
                  Leave blank to use the default workflow.
                </div>

                {/* ── Skip workflow toggle ── */}
                <div style={{marginBottom:14,padding:'10px 14px',border:`2px solid ${wizardSkipWorkflow ? '#f97316' : 'var(--border)'}`,borderRadius:8,background: wizardSkipWorkflow ? '#fff7ed' : 'var(--bg)',cursor:'pointer',transition:'all .15s'}}
                  onClick={()=>{ setWizardSkipWorkflow(p=>!p); if(!wizardSkipWorkflow) setWizardWfId(''); }}>
                  <div style={{display:'flex',alignItems:'center',gap:10}}>
                    <div style={{width:36,height:20,borderRadius:10,background: wizardSkipWorkflow ? '#f97316' : '#d1d5db',transition:'background .15s',position:'relative',flexShrink:0}}>
                      <div style={{position:'absolute',top:2,left: wizardSkipWorkflow ? 18 : 2,width:16,height:16,borderRadius:'50%',background:'white',transition:'left .15s',boxShadow:'0 1px 3px rgba(0,0,0,.2)'}}/>
                    </div>
                    <div>
                      <div style={{fontSize:12,fontWeight:700,color: wizardSkipWorkflow ? '#ea580c' : 'var(--text)'}}>
                        🚫 No follow-up needed
                      </div>
                      <div style={{fontSize:10,color:'var(--text-muted)',marginTop:1}}>
                        Leads from this campaign will NOT receive automated emails or SMS. Use for emergency campaigns where patients call the office directly.
                      </div>
                    </div>
                  </div>
                </div>

                {!wizardSkipWorkflow && (
                <div style={{marginBottom:14}}>
                  <label style={{fontSize:11,fontWeight:600,display:'block',marginBottom:3}}>Workflow</label>
                  <select style={{width:'100%',fontSize:12,padding:'8px 10px',border:'1px solid var(--border)',borderRadius:5,boxSizing:'border-box'}}
                    value={wizardWfId}
                    onChange={e=>setWizardWfId(e.target.value)}>
                    <option value="">— Use default workflow —</option>
                    {wizardWorkflows.map(wf=>(
                      <option key={wf.id} value={String(wf.id)}>
                        {wf.name}{wf.campaign_tag ? ` [${wf.campaign_tag}]` : ' (default)'} · {(wf.steps||[]).length} steps
                      </option>
                    ))}
                  </select>
                </div>
                )}

                {/* Workflow step preview */}
                {!wizardSkipWorkflow && wizardWfId && (() => {
                  const wf = wizardWorkflows.find(w => String(w.id) === wizardWfId);
                  if (!wf || !(wf.steps||[]).length) return (
                    <div style={{fontSize:11,color:'var(--text-muted)',fontStyle:'italic',padding:'10px 0'}}>No steps in this workflow yet.</div>
                  );
                  return (
                    <div style={{background:'var(--bg)',border:'1px solid var(--border)',borderRadius:8,padding:'10px 12px'}}>
                      <div style={{fontSize:10,fontWeight:600,color:'var(--text-muted)',marginBottom:8,textTransform:'uppercase',letterSpacing:'.5px'}}>Sequence Preview</div>
                      {wf.steps.map((s,i)=>(
                        <div key={i} style={{display:'flex',gap:8,alignItems:'flex-start',marginBottom:6}}>
                          <div style={{minWidth:42,fontSize:10,fontWeight:700,color:'var(--teal)',paddingTop:1}}>Day {s.sequence_day}</div>
                          <div style={{fontSize:11,color: s.channel==='email' ? '#2563eb' : '#7c3aed',minWidth:32}}>{s.channel==='email' ? '✉' : '💬'}</div>
                          <div style={{fontSize:11,color:'var(--text)',flex:1,lineHeight:1.4}}>
                            {s.subject || (s.body||'').slice(0,70) + ((s.body||'').length>70?'…':'')}
                            {s.terminal && <span style={{fontSize:9,background:'#fee2e2',color:'#dc2626',borderRadius:3,padding:'1px 4px',marginLeft:4}}>final</span>}
                          </div>
                        </div>
                      ))}
                    </div>
                  );
                })()}

                {!wizardSkipWorkflow && !wizardWfId && (
                  <div style={{background:'#f0fdf4',border:'1px solid #bbf7d0',borderRadius:8,padding:'10px 14px',fontSize:11,color:'#166534'}}>
                    ✅ The default workflow will fire automatically for leads from this campaign.
                    You can attach a specific workflow later from the Campaigns table.
                  </div>
                )}
                {wizardSkipWorkflow && (
                  <div style={{background:'#fff7ed',border:'1px solid #fed7aa',borderRadius:8,padding:'10px 14px',fontSize:11,color:'#c2410c'}}>
                    🚫 No follow-up emails or SMS will be sent for leads from this campaign. Leads will still appear in the pipeline.
                  </div>
                )}
              </div>
            )}

            {/* ── Step 4: Opus Strategy Review ── */}
            {wizardStep === 4 && (
              <div>
                <div style={{fontWeight:700,fontSize:15,marginBottom:4}}>🧠 Opus Strategy Review</div>
                <div style={{fontSize:11,color:'var(--text-muted)',marginBottom:16}}>
                  Campaign saved. Opus is reviewing your campaign inputs and generating a full execution plan.
                </div>

                {wizardStrategyLoading && (
                  <div style={{textAlign:'center',padding:'32px 0'}}>
                    <div style={{fontSize:28,marginBottom:10}}>⏳</div>
                    <div style={{fontSize:13,color:'var(--text-muted)',fontWeight:500}}>Opus is thinking…</div>
                    <div style={{fontSize:11,color:'var(--text-muted)',marginTop:4}}>
                      {wizardCopyFrom
                        ? 'Analyzing source campaign keywords, search terms, and performance data to seed this strategy…'
                        : 'Analyzing your campaign details, practice data, and performance history.'}
                    </div>
                  </div>
                )}

                {!wizardStrategyLoading && wizardStrategy && wizardStrategy._error && (
                  <div style={{background:'#fee2e2',border:'1px solid #fca5a5',borderRadius:8,padding:'12px 14px',fontSize:12,color:'#dc2626'}}>
                    ❌ Strategy generation failed: {wizardStrategy._error}
                    <div style={{marginTop:8,fontSize:11,color:'#6b7280'}}>
                      Your campaign was saved. You can retry strategy generation by re-opening the campaign.
                    </div>
                  </div>
                )}

                {!wizardStrategyLoading && wizardStrategy && !wizardStrategy._error && (() => {
                  const s = wizardRefinedPreview || wizardStrategy;
                  const Section = ({title, children}) => (
                    <div style={{marginBottom:14}}>
                      <div style={{fontSize:10,fontWeight:700,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'.6px',marginBottom:5}}>{title}</div>
                      {children}
                    </div>
                  );
                  const Pill = ({children, color='#e0f2fe', text='#0c4a6e'}) => (
                    <span style={{background:color,color:text,fontSize:10,padding:'2px 8px',borderRadius:3,display:'inline-block',marginRight:4,marginBottom:4}}>{children}</span>
                  );
                  return (
                    <div style={{background:'var(--bg)',border:'1px solid var(--border)',borderRadius:8,padding:'14px 16px',maxHeight:400,overflowY:'auto'}}>
                      {/* Source campaign intelligence badge */}
                      {wizardStrategy._source_campaign_name && (
                        <div style={{background:'#f0fdf4',border:'1px solid #86efac',borderRadius:6,
                          padding:'6px 12px',marginBottom:12,fontSize:11,
                          display:'flex',alignItems:'center',gap:6,color:'#15803d'}}>
                          <span style={{fontWeight:700}}>📊 Built from real data</span>
                          <span>— keywords, search terms, CPL, and wasted spend from</span>
                          <span style={{fontWeight:700}}>"{wizardStrategy._source_campaign_name}"</span>
                        </div>
                      )}
                      {s.campaign_name && (
                        <div style={{fontWeight:700,fontSize:14,marginBottom:12,color:'var(--text)'}}>
                          📋 {s.campaign_name}
                        </div>
                      )}

                      {s.objective && (
                        <Section title="Objective">
                          <div style={{fontSize:12,color:'var(--text)',lineHeight:1.5}}>{s.objective}</div>
                        </Section>
                      )}

                      {s.target_audience && (
                        <Section title="Target Audience">
                          <div style={{fontSize:12,color:'var(--text)',lineHeight:1.5}}>{s.target_audience}</div>
                        </Section>
                      )}

                      {(s.key_messages||[]).length > 0 && (
                        <Section title="Key Messages">
                          <div>{(s.key_messages||[]).map((m,i)=>(
                            <div key={i} style={{display:'flex',gap:6,marginBottom:4,alignItems:'flex-start'}}>
                              <span style={{color:'var(--teal)',fontWeight:700,fontSize:12,minWidth:14}}>→</span>
                              <span style={{fontSize:12,color:'var(--text)',lineHeight:1.4}}>{m}</span>
                            </div>
                          ))}</div>
                        </Section>
                      )}

                      {(s.ad_headlines||[]).length > 0 && (
                        <Section title="Ad Headlines">
                          <div>{(s.ad_headlines||[]).map((h,i)=><Pill key={i}>{h}</Pill>)}</div>
                        </Section>
                      )}

                      {(s.ad_descriptions||[]).length > 0 && (
                        <Section title="Ad Descriptions">
                          {(s.ad_descriptions||[]).map((d,i)=>(
                            <div key={i} style={{fontSize:11,color:'var(--text)',padding:'4px 8px',background:'#fff',border:'1px solid var(--border)',borderRadius:4,marginBottom:4,lineHeight:1.4}}>{d}</div>
                          ))}
                        </Section>
                      )}

                      {s.sms_sequence_brief && (
                        <Section title="SMS Sequence Strategy">
                          <div style={{fontSize:11,color:'var(--text)',lineHeight:1.5,padding:'6px 10px',background:'#f5f3ff',borderRadius:5,border:'1px solid #e9d5ff'}}>
                            💬 {s.sms_sequence_brief}
                          </div>
                        </Section>
                      )}

                      {s.email_sequence_brief && (
                        <Section title="Email Sequence Strategy">
                          <div style={{fontSize:11,color:'var(--text)',lineHeight:1.5,padding:'6px 10px',background:'#eff6ff',borderRadius:5,border:'1px solid #bfdbfe'}}>
                            ✉ {s.email_sequence_brief}
                          </div>
                        </Section>
                      )}

                      {s.implementation_instructions && (
                        <Section title="Implementation Instructions">
                          <div style={{fontSize:11,color:'var(--text)',lineHeight:1.5,padding:'6px 10px',background:'#f0fdf4',borderRadius:5,border:'1px solid #bbf7d0'}}>
                            {s.implementation_instructions}
                          </div>
                        </Section>
                      )}

                      {/* Keyword recommendations — only shown when cloned from source campaign */}
                      {(s.keyword_recommendations||[]).length > 0 && (
                        <Section title="🎯 Recommended Keywords (from source campaign)">
                          <div style={{display:'flex',flexWrap:'wrap',gap:4}}>
                            {(s.keyword_recommendations||[]).map((k,i) => {
                              const matchColor = k.match_type === 'EXACT' ? '#1d4ed8'
                                : k.match_type === 'PHRASE' ? '#7c3aed' : '#64748b';
                              return (
                                <span key={i} title={k.rationale || ''}
                                  style={{fontSize:10,padding:'2px 7px',borderRadius:4,
                                    background: matchColor + '15', color: matchColor,
                                    border: '1px solid ' + matchColor + '40',
                                    cursor: 'default'}}>
                                  [{k.match_type}] {k.keyword}
                                </span>
                              );
                            })}
                          </div>
                          <div style={{fontSize:9,color:'var(--text-muted)',marginTop:4}}>
                            Hover for rationale · These will be available in the Keywords build step
                          </div>
                        </Section>
                      )}

                      {(s.negative_keyword_recommendations||[]).length > 0 && (
                        <Section title="🚫 Suggested Negatives (wasted spend from source)">
                          <div style={{display:'flex',flexWrap:'wrap',gap:4}}>
                            {(s.negative_keyword_recommendations||[]).map((kw,i) => (
                              <span key={i} style={{fontSize:10,padding:'2px 7px',borderRadius:4,
                                background:'#fee2e215',color:'#dc2626',border:'1px solid #dc262640'}}>
                                {kw}
                              </span>
                            ))}
                          </div>
                        </Section>
                      )}
                    </div>
                  );
                })()}

                {/* ── Refine chat box — only when strategy is loaded ── */}
                {!wizardStrategyLoading && wizardStrategy && !wizardStrategy._error && (
                  <div style={{marginTop:14,borderTop:'1px solid var(--border)',paddingTop:12}}>
                    <div style={{fontSize:10,fontWeight:700,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'.6px',marginBottom:6}}>
                      ✨ Refine Strategy
                    </div>
                    <div style={{display:'flex',gap:6}}>
                      <input
                        value={wizardRefineInput}
                        onChange={e=>setWizardRefineInput(e.target.value)}
                        onKeyDown={e=>{
                          if(e.key==='Enter'&&!e.shiftKey&&!wizardRefineLoading&&wizardRefineInput.trim()){
                            e.preventDefault();
                            (async()=>{
                              setWizardRefineLoading(true);
                              try {
                                const base = wizardRefinedPreview || wizardStrategy;
                                const res = await api(`/api/admin/campaigns/${wizardCreatedCampId}/build-step-refine`,{
                                  method:'POST',
                                  body:JSON.stringify({step:'strategy',instruction:wizardRefineInput,current_override:base}),
                                });
                                setWizardRefinedPreview(res.data);
                                setWizardRefineInput('');
                              } catch(e){ alert('Refine failed: '+e.message); }
                              finally { setWizardRefineLoading(false); }
                            })();
                          }
                        }}
                        placeholder='e.g. "Add more focus on insurance, remove implant mentions"'
                        style={{flex:1,fontSize:11,padding:'5px 8px',border:'1px solid var(--border)',borderRadius:5,background:'var(--bg)',color:'var(--text)'}}
                        disabled={wizardRefineLoading||!wizardCreatedCampId}
                      />
                      <button
                        className="btn btn-sm"
                        disabled={wizardRefineLoading||!wizardRefineInput.trim()||!wizardCreatedCampId}
                        onClick={async()=>{
                          setWizardRefineLoading(true);
                          try {
                            const base = wizardRefinedPreview || wizardStrategy;
                            const res = await api(`/api/admin/campaigns/${wizardCreatedCampId}/build-step-refine`,{
                              method:'POST',
                              body:JSON.stringify({step:'strategy',instruction:wizardRefineInput,current_override:base}),
                            });
                            setWizardRefinedPreview(res.data);
                            setWizardRefineInput('');
                          } catch(e){ alert('Refine failed: '+e.message); }
                          finally { setWizardRefineLoading(false); }
                        }}
                        style={{whiteSpace:'nowrap'}}
                      >
                        {wizardRefineLoading ? '⏳…' : '✨ Refine'}
                      </button>
                    </div>
                    {wizardRefinedPreview && (
                      <div style={{display:'flex',gap:6,marginTop:6,alignItems:'center'}}>
                        <span style={{fontSize:10,color:'#16a34a',fontWeight:600}}>✓ Strategy updated</span>
                        <button className="btn btn-sm" style={{fontSize:10,padding:'2px 8px',background:'#dcfce7',color:'#15803d',border:'1px solid #86efac'}}
                          onClick={async()=>{
                            if(!wizardCreatedCampId) return;
                            try {
                              await api(`/api/admin/campaigns/${wizardCreatedCampId}/strategy`,{
                                method:'PATCH',
                                body:JSON.stringify({strategy:wizardRefinedPreview}),
                              });
                              setWizardStrategy(wizardRefinedPreview);
                              setWizardRefinedPreview(null);
                            } catch(e){ alert('Save failed: '+e.message); }
                          }}>
                          💾 Save to campaign
                        </button>
                        <button className="btn btn-sm" style={{fontSize:10,padding:'2px 8px'}}
                          onClick={()=>setWizardRefinedPreview(null)}>
                          ✕ Discard
                        </button>
                      </div>
                    )}
                  </div>
                )}
              </div>
            )}

            {/* Error / success messages */}
            {wizardStepError && (
              <div style={{fontSize:11,padding:'6px 10px',borderRadius:4,marginTop:12,background:'#fee2e2',color:'#dc2626'}}>
                {wizardStepError}
              </div>
            )}
            {campSaveMsg && (
              <div style={{fontSize:11,padding:'6px 10px',borderRadius:4,marginTop:12,
                background:campSaveMsg.startsWith('✅')?'#dcfce7':'#fee2e2',
                color:campSaveMsg.startsWith('✅')?'#166534':'#dc2626'}}>
                {campSaveMsg}
              </div>
            )}

            {/* Navigation buttons */}
            <div style={{display:'flex',gap:8,justifyContent:'space-between',marginTop:20}}>
              {wizardStep < 4 && (
                <button className="btn btn-ghost btn-sm" onClick={closeWizard}>Cancel</button>
              )}
              {wizardStep === 4 && <div />}
              <div style={{display:'flex',gap:8}}>
                {wizardStep > 1 && wizardStep < 4 && (
                  <button className="btn btn-ghost btn-sm" onClick={()=>{setWizardStep(s=>s-1); setWizardStepError('');}}>← Back</button>
                )}
                {wizardStep < 3 && (
                  <button className="btn btn-teal btn-sm" onClick={wizardNext}>
                    Next →
                  </button>
                )}
                {wizardStep === 3 && (
                  <button className="btn btn-teal btn-sm" disabled={savingCamp} onClick={wizardLaunch}>
                    {savingCamp ? 'Launching…' : '🚀 Launch Campaign'}
                  </button>
                )}
                {wizardStep === 4 && (
                  <button className="btn btn-teal btn-sm" disabled={wizardStrategyLoading} onClick={closeWizard}>
                    {wizardStrategyLoading ? 'Generating…' : '✅ Done — Close'}
                  </button>
                )}
              </div>
            </div>
          </div>
        </div>
      )}
      </div>}
    </div>
  );
}

// ── Log Viewer ───────────────────────────────────────────────────────────────
function LogViewerSection() {
  const [lines, setLines] = useState([]);
  const [loading, setLoading] = useState(false);
  const [filter, setFilter] = useState('');
  const [inputFilter, setInputFilter] = useState('');
  const [lineCount, setLineCount] = useState(200);
  const [total, setTotal] = useState(0);
  const [error, setError] = useState('');
  const logContainerRef = React.useRef(null);
  const [autoScroll, setAutoScroll] = useState(true);

  const load = React.useCallback(async (f, n) => {
    setLoading(true); setError('');
    try {
      const params = new URLSearchParams({ lines: n || lineCount });
      if (f || filter) params.set('filter', f !== undefined ? f : filter);
      const d = await api('/api/admin/logs?' + params.toString());
      if (d.error) { setError(d.error); setLines([]); }
      else { setLines(d.lines || []); setTotal(d.total_matched || 0); }
    } catch(e) { setError(e.message); }
    finally { setLoading(false); }
  }, [filter, lineCount]);

  React.useEffect(() => { load(); }, []);

  // Auto-scroll to bottom within the log container (not the page)
  React.useEffect(() => {
    if (autoScroll && logContainerRef.current) {
      logContainerRef.current.scrollTop = logContainerRef.current.scrollHeight;
    }
  }, [lines, autoScroll]);

  const levelColor = (line) => {
    if (line.includes('[ERROR]'))   return '#dc2626';
    if (line.includes('[WARNING]')) return '#d97706';
    if (line.includes('[INFO]'))    return '#059669';
    if (line.includes('500 Internal')) return '#dc2626';
    if (line.includes('200 OK'))    return '#94a3b8';
    return '#cbd5e1';
  };

  const levelBg = (line) => {
    if (line.includes('[ERROR]') || line.includes('500 Internal')) return 'rgba(220,38,38,.06)';
    if (line.includes('[WARNING]')) return 'rgba(217,119,6,.04)';
    return 'transparent';
  };

  return (
    <div className="report-section">
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10,flexWrap:'wrap'}}>
        <div className="report-title" style={{margin:0}}>📋 App Logs</div>
        <span style={{fontSize:10,color:'var(--text-muted)'}}>
          {total > 0 ? `${lines.length} of ${total} matched` : `${lines.length} lines`}
        </span>
        <div style={{marginLeft:'auto',display:'flex',gap:6,alignItems:'center',flexWrap:'wrap'}}>
          <input
            value={inputFilter}
            onChange={e => setInputFilter(e.target.value)}
            onKeyDown={e => { if (e.key === 'Enter') { setFilter(inputFilter); load(inputFilter, lineCount); }}}
            placeholder="Filter (Enter to apply)…"
            style={{padding:'3px 8px',fontSize:11,border:'1px solid var(--border)',borderRadius:4,width:180}}
          />
          {['ERROR','WARNING','optimizer','gads/approve','500'].map(f => (
            <button key={f} onClick={() => { setInputFilter(f); setFilter(f); load(f, lineCount); }}
              style={{padding:'2px 8px',fontSize:10,borderRadius:4,cursor:'pointer',
                background: filter===f ? 'var(--teal)' : 'var(--gray-light)',
                color: filter===f ? '#fff' : 'var(--text-muted)',
                border:'1px solid var(--border)',fontWeight:600}}>
              {f}
            </button>
          ))}
          {filter && (
            <button onClick={() => { setInputFilter(''); setFilter(''); load('', lineCount); }}
              style={{padding:'2px 8px',fontSize:10,borderRadius:4,cursor:'pointer',
                background:'#fee2e2',color:'#dc2626',border:'none',fontWeight:600}}>
              ✕ Clear
            </button>
          )}
          <select value={lineCount} onChange={e => { const n=Number(e.target.value); setLineCount(n); load(filter, n); }}
            style={{padding:'3px 6px',fontSize:11,border:'1px solid var(--border)',borderRadius:4}}>
            {[50,100,200,500].map(n => <option key={n} value={n}>{n} lines</option>)}
          </select>
          <label style={{display:'flex',alignItems:'center',gap:4,fontSize:11,cursor:'pointer',color:'var(--text-muted)'}}>

function ScheduledJobsSection() {
  const [jobs, setJobs] = useState([]);
  const [loaded, setLoaded] = useState(false);

  useEffect(() => {
    api('/api/admin/jobs')
      .then(r => { setJobs(r.jobs || []); setLoaded(true); })
      .catch(() => setLoaded(true));
  }, []);

  // Merge API data with static metadata so all jobs always appear
  const merged = Object.keys(JOB_META).map(id => {
    const live = jobs.find(j => j.id === id) || {};
    const meta = JOB_META[id];
    return { id, ...meta, ...live, label: meta.label, schedule: meta.schedule, desc: meta.desc };
  });

  function fmtRunTime(iso) {
    if (!iso) return <span style={{color:'var(--text-muted)',fontStyle:'italic'}}>not yet</span>;
    const d = new Date(iso);
    const ago = timeAgo(iso);
    return <span title={d.toLocaleString()}>{d.toLocaleDateString('en-US',{month:'short',day:'numeric'})} {d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})} <span style={{color:'var(--text-muted)',fontSize:9}}>({ago})</span></span>;
  }

  function fmtNextRun(iso) {
    if (!iso) return <span style={{color:'var(--text-muted)'}}>—</span>;
    const d = new Date(iso);
    const inMs = d - Date.now();
    const inH = Math.floor(inMs / 3600000);
    const inM = Math.floor((inMs % 3600000) / 60000);
    const label = inMs < 0 ? 'overdue' : inH > 0 ? `in ${inH}h ${inM}m` : `in ${inM}m`;
    return <span title={d.toLocaleString()}>{d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})} <span style={{color:'var(--text-muted)',fontSize:9}}>({label})</span></span>;
  }

  return (
    <div className="report-section">
      <div className="report-title">Scheduled Jobs</div>
      <table className="report-table">
        <thead>
          <tr>
            <th>Job</th>
            <th>Schedule</th>
            <th>Description</th>
            <th className="num">Last Ran</th>
            <th className="num">Next Run</th>
          </tr>
        </thead>
        <tbody>
          {merged.map(job => (
            <tr key={job.id}>
              <td style={{fontWeight:500}}>{job.label}</td>
              <td style={{color:'var(--text-muted)'}}>{job.schedule}</td>
              <td style={{color:'var(--text-muted)',fontSize:10}}>{job.desc}</td>
              <td className="num" style={{fontSize:10}}>{fmtRunTime(job.last_run)}</td>
              <td className="num" style={{fontSize:10}}>{fmtNextRun(job.next_run)}</td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function WebsiteIntelligenceSection() {
  const [domains, setDomains]           = useState([]);
  const [loaded, setLoaded]             = useState(false);
  // Add domain form
  const [showAdd, setShowAdd]           = useState(false);
  const [addUrl, setAddUrl]             = useState('');
  const [addLabel, setAddLabel]         = useState('');
  const [addType, setAddType]           = useState('practice');
  const [addDepth, setAddDepth]         = useState(20);
  const [addEnabled, setAddEnabled]     = useState(true);
  const [addSaving, setAddSaving]       = useState(false);
  // Pages drawer
  const [drawerDomain, setDrawerDomain] = useState(null); // full domain obj
  const [drawerPages, setDrawerPages]   = useState([]);
  const [drawerLoading, setDrawerLoading] = useState(false);
  // Context preview
  const [contextDomain, setContextDomain] = useState(null);
  const [contextText, setContextText]   = useState('');
  const [contextLoading, setContextLoading] = useState(false);
  // Crawl status polling
  const [crawlingIds, setCrawlingIds]   = useState(new Set());

  // Load domain list on mount
  useEffect(() => {
    loadDomains();
  }, []);

  // Poll status for any running crawls every 3 seconds
  useEffect(() => {
    if (crawlingIds.size === 0) return;
    const t = setInterval(() => loadDomains(), 3000);
    return () => clearInterval(t);
  }, [crawlingIds.size]);

  async function loadDomains() {
    try {
      const r = await api('/api/admin/domains');
      const list = r.domains || [];
      setDomains(list);
      // Track which are running
      const running = new Set(list.filter(d => d.crawl_status === 'running').map(d => d.id));
      setCrawlingIds(running);
    } catch(e) {
      // silently fail on poll
    } finally {
      setLoaded(true);
    }
  }

  async function handleAdd() {
    if (!addUrl.trim()) { alert('Enter a domain URL'); return; }
    setAddSaving(true);
    try {
      await api('/api/admin/domains', {
        method: 'POST',
        body: JSON.stringify({
          domain_url: addUrl.trim(),
          label: addLabel.trim(),
          domain_type: addType,
          crawl_depth: Number(addDepth),
          crawl_enabled: addEnabled,
        }),
      });
      setShowAdd(false);
      setAddUrl(''); setAddLabel(''); setAddType('practice'); setAddDepth(20); setAddEnabled(true);
      await loadDomains();
    } catch(e) {
      alert('Failed to add domain: ' + e.message);
    }
    setAddSaving(false);
  }

  async function handleDelete(domain) {
    if (!confirm(`Remove "${domain.label || domain.domain_url}"?\nThis deletes all crawled page data.`)) return;
    try {
      await api('/api/admin/domains/' + domain.id, { method: 'DELETE' });
      await loadDomains();
      if (drawerDomain && drawerDomain.id === domain.id) setDrawerDomain(null);
      if (contextDomain && contextDomain.id === domain.id) setContextDomain(null);
    } catch(e) {
      alert('Delete failed: ' + e.message);
    }
  }

  async function handleCrawl(domain) {
    try {
      await api('/api/admin/domains/' + domain.id + '/crawl', { method: 'POST' });
      setCrawlingIds(prev => new Set([...prev, domain.id]));
      await loadDomains();
    } catch(e) {
      alert('Crawl trigger failed: ' + e.message);
    }
  }

  async function handleViewPages(domain) {
    setDrawerDomain(domain);
    setDrawerPages([]);
    setDrawerLoading(true);
    setContextDomain(null);
    try {
      const r = await api('/api/admin/domains/' + domain.id + '/pages');
      setDrawerPages(r.pages || []);
    } catch(e) {
      alert('Failed to load pages: ' + e.message);
    }
    setDrawerLoading(false);
  }

  async function handleViewContext(domain) {
    setContextDomain(domain);
    setContextText('');
    setContextLoading(true);
    setDrawerDomain(null);
    try {
      const r = await api('/api/admin/domains/' + domain.id + '/context');
      setContextText(r.context || r.message || '');
    } catch(e) {
      alert('Failed to load context: ' + e.message);
    }
    setContextLoading(false);
  }

  function statusPill(domain) {
    const s = domain.crawl_status || 'idle';
    const colors = {
      idle:    { bg:'#f3f4f6', color:'#6b7280' },
      done:    { bg:'#dcfce7', color:'#16a34a' },
      running: { bg:'#fef9c3', color:'#b45309' },
      error:   { bg:'#fee2e2', color:'#dc2626' },
    };
    const c = colors[s] || colors.idle;
    const label = s === 'running' ? '⟳ Crawling…' : s.charAt(0).toUpperCase() + s.slice(1);
    return (
      <span style={{
        background: c.bg, color: c.color,
        padding: '2px 7px', borderRadius: 10, fontSize: 10, fontWeight: 600,
      }}>{label}</span>
    );
  }

  function typeBadge(type) {
    const colors = {
      practice:   { bg:'#ede9fe', color:'#6d28d9' },
      landing:    { bg:'#dbeafe', color:'#1d4ed8' },
      competitor: { bg:'#fce7f3', color:'#be185d' },
    };
    const c = colors[type] || colors.practice;
    return (
      <span style={{
        background: c.bg, color: c.color,
        padding: '1px 6px', borderRadius: 8, fontSize: 10, fontWeight: 500,
      }}>{type}</span>
    );
  }

  function fmtCrawledAt(iso) {
    if (!iso) return <span style={{color:'var(--text-muted)',fontStyle:'italic'}}>never</span>;
    const d = new Date(iso);
    return <span title={d.toLocaleString()}>{d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</span>;
  }

  return (
    <div className="report-section">
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
        <div className="report-title" style={{marginBottom:0}}>🌐 Website Intelligence</div>

          {showAdd ? 'Cancel' : '+ Add Domain'}

      {/* Add Domain Form */}
      {showAdd && (
        <div style={{
          background:'var(--gray-light)', border:'1px solid var(--border)',
          borderRadius:6, padding:12, marginBottom:12,
        }}>
          <div style={{fontWeight:600,fontSize:11,marginBottom:8}}>Register New Domain</div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:8}}>
            <div>
              <label style={{fontSize:10,fontWeight:500,display:'block',marginBottom:3}}>Domain URL *</label>
              <input value={addUrl} onChange={e=>setAddUrl(e.target.value)}
                placeholder="https://graftondentalcare.com"
                style={{width:'100%',padding:'5px 8px',border:'1px solid var(--border)',borderRadius:4,fontSize:11,boxSizing:'border-box'}} />
            </div>
            <div>
              <label style={{fontSize:10,fontWeight:500,display:'block',marginBottom:3}}>Label</label>
              <input value={addLabel} onChange={e=>setAddLabel(e.target.value)}
                placeholder="Main Practice Site"
                style={{width:'100%',padding:'5px 8px',border:'1px solid var(--border)',borderRadius:4,fontSize:11,boxSizing:'border-box'}} />
            </div>
            <div>
              <label style={{fontSize:10,fontWeight:500,display:'block',marginBottom:3}}>Type</label>
              <select value={addType} onChange={e=>setAddType(e.target.value)}
                style={{width:'100%',padding:'5px 8px',border:'1px solid var(--border)',borderRadius:4,fontSize:11}}>
                <option value="practice">Practice Site</option>
                <option value="landing">Landing Page</option>
                <option value="competitor">Competitor</option>
              </select>
            </div>
            <div>
              <label style={{fontSize:10,fontWeight:500,display:'block',marginBottom:3}}>Max Pages to Crawl: {addDepth}</label>
              <input type="range" min="5" max="100" step="5"
                value={addDepth} onChange={e=>setAddDepth(Number(e.target.value))}
                style={{width:'100%'}} />
            </div>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:10}}>
            <label style={{fontSize:11,display:'flex',alignItems:'center',gap:5,cursor:'pointer'}}>
              <input type="checkbox" checked={addEnabled} onChange={e=>setAddEnabled(e.target.checked)} />

          </div>
        </div>
      )}

        <div style={{color:'var(--text-muted)',fontSize:11}}>Loading…</div>

        <div style={{
          textAlign:'center', padding:'24px 0',
          color:'var(--text-muted)', fontSize:11,
        }}>
          No domains registered yet.<br/>
          <span style={{fontSize:10}}>Add your practice website to give the AI real page data when building campaigns.</span>
        </div>
      ) : (
        <table className="report-table">
          <thead>
            <tr>
              <th>Domain</th>
              <th>Type</th>
              <th className="num">Pages</th>
              <th className="num">Last Crawled</th>
              <th className="num">Status</th>
              <th className="num">Actions</th>
            </tr>
          </thead>
          <tbody>
            {domains.map(d => (
              <tr key={d.id}>
                <td>
                  <div style={{fontWeight:500,fontSize:11}}>{d.label || d.domain_url}</div>
                  {d.label && <div style={{fontSize:9,color:'var(--text-muted)'}}>{d.domain_url}</div>}

                <td>{typeBadge(d.domain_type)}</td>
                <td className="num" style={{fontSize:11}}>{d.pages_found || 0}</td>
                <td className="num" style={{fontSize:11}}>{fmtCrawledAt(d.last_crawled_at)}</td>

        First crawl: full scan up to max pages. Subsequent crawls: incremental (only changed pages updated). Auto-crawl runs on the 1st of each month.
      </div>
    </div>
  );
}

function KeywordResearchSection() {
  const [seeds, setSeeds] = useState('');
  const [results, setResults] = useState([]);
  const [loading, setLoading] = useState(false);
  const [searched, setSearched] = useState(false);
  const [sortCol, setSortCol] = useState('avg_monthly_searches');
  const [sortDir, setSortDir] = useState('desc');

  async function runResearch() {
    const kws = seeds.split('\n').map(s=>s.trim()).filter(Boolean);
    if (!kws.length) { alert('Enter at least one keyword'); return; }
    setLoading(true);
    try {
      const r = await api('/api/admin/keyword-research', {
        method: 'POST',
        body: JSON.stringify({ seed_keywords: kws }),
      });
      setResults(r.ideas || []);
      setSearched(true);
    } catch(e) { alert('Research failed: '+e.message); }
    setLoading(false);
  }

  function toggleSort(col) {
    if (sortCol === col) setSortDir(d => d === 'asc' ? 'desc' : 'asc');
    else { setSortCol(col); setSortDir('desc'); }
  }

  const sorted = [...results].sort((a,b) => {
    const av = a[sortCol] ?? 0, bv = b[sortCol] ?? 0;
    return sortDir === 'asc' ? (av > bv ? 1 : -1) : (av < bv ? 1 : -1);
  });

  const compColor = c => c==='HIGH'?'#dc2626':c==='MEDIUM'?'#d97706':'#16a34a';

  function SortTh({col, label, title}) {
    const active = sortCol === col;
    return (
      <th className="num" title={title||''} style={{cursor:'pointer',userSelect:'none'}}
        onClick={()=>toggleSort(col)}>
        {label}{active ? (sortDir==='asc'?' ↑':' ↓') : ''}
      </th>
    );
  }

  return (
    <div className="report-section">
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:6}}>
        <div>
          <div className="report-title" style={{marginBottom:2}}>🔍 Keyword Research</div>
          <p style={{fontSize:10,color:'var(--text-muted)'}}>
            Google Keyword Planner — search volume, competition &amp; CPC for your market.
            Use before launching a new campaign to validate keyword demand.
          </p>
        </div>
      </div>

      <div style={{display:'flex',gap:8,alignItems:'flex-start',marginBottom:12}}>
        <textarea
          style={{flex:1,minHeight:70,maxHeight:140,padding:'6px 8px',fontSize:11,
            border:'1px solid var(--border)',borderRadius:6,fontFamily:'inherit',resize:'vertical'}}
          placeholder={"One keyword per line:\ngum grafting near me\nfree gingival graft cost\ngum graft dentist worcester"}
          value={seeds}
          onChange={e=>setSeeds(e.target.value)}
        />
        <button className="btn btn-teal" onClick={runResearch} disabled={loading}
          style={{whiteSpace:'nowrap',alignSelf:'flex-end'}}>
          {loading ? 'Researching...' : 'Get Volume & CPCs'}
        </button>
      </div>

      {searched && results.length === 0 && !loading && (
        <div style={{fontSize:11,color:'var(--text-muted)',fontStyle:'italic',padding:8}}>
          No results returned. Check that Google Ads API credentials are configured.
        </div>
      )}

      {sorted.length > 0 && (
        <>
          <div style={{fontSize:10,color:'var(--text-muted)',marginBottom:6}}>
            {sorted.length} keywords — click column headers to sort
          </div>
          <div style={{overflowX:'auto'}}>
          <table className="report-table" style={{fontSize:10}}>
            <thead>
              <tr>
                <th style={{cursor:'pointer',userSelect:'none'}} onClick={()=>toggleSort('keyword')}>
                  Keyword {sortCol==='keyword'?(sortDir==='asc'?'↑':'↓'):''}
                </th>
                <SortTh col="avg_monthly_searches" label="Searches/mo"
                  title="Average monthly searches in your target area" />
                <th className="num" title="LOW = less competition, cheaper clicks. HIGH = more competition, expensive.">Competition</th>
                <th className="num" title="Competition index 0-100. Higher = more advertisers bidding.">Comp. Index</th>
                <SortTh col="low_cpc" label="Low CPC" title="Low end of top-of-page bid range" />
                <SortTh col="high_cpc" label="High CPC" title="High end of top-of-page bid range" />
                <th className="num" title="12-month search trend">Trend</th>
              </tr>
            </thead>
            <tbody>
              {sorted.map((kw,i)=>{
                // Sparkline: last 6 months volumes
                const trend = (kw.trend_monthly||[]).slice(0,6).reverse();
                const maxVol = Math.max(...trend.map(t=>t.searches||0), 1);
                return (
                  <tr key={i}>
                    <td style={{fontWeight:500}}>{kw.keyword}</td>
                    <td className="num" style={{fontWeight:700}}>
                      {(kw.avg_monthly_searches||0).toLocaleString()}
                    </td>
                    <td className="num">
                      <span style={{fontWeight:700,color:compColor(kw.competition)}}>
                        {kw.competition||'—'}
                      </span>
                    </td>
                    <td className="num">{kw.competition_index||0}</td>
                    <td className="num">{kw.low_cpc > 0 ? '$'+kw.low_cpc.toFixed(2) : '—'}</td>
                    <td className="num">{kw.high_cpc > 0 ? '$'+kw.high_cpc.toFixed(2) : '—'}</td>
                    <td className="num">
                      {trend.length > 0 ? (
                        <span style={{display:'inline-flex',gap:1,alignItems:'flex-end',height:14}}>
                          {trend.map((t,ti)=>{
                            const h = Math.max(2, Math.round((t.searches/maxVol)*14));
                            return <span key={ti} style={{
                              width:4,height:h+'px',borderRadius:1,
                              background: h > 8 ? 'var(--teal)' : '#94a3b8',
                              display:'inline-block'}} />;
                          })}
                        </span>
                      ) : '—'}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
          </div>
        </>
      )}
    </div>
  );
}

function AITemplatesTab() {
  const [channel, setChannel]     = React.useState('email');
  const [apptType, setApptType]   = React.useState('general');
  const [prompt, setPrompt]       = React.useState('');
  const [generating, setGenerating] = React.useState(false);
  const [result, setResult]       = React.useState(null); // {channel, subject, body}
  const [editSubject, setEditSubject] = React.useState('');
  const [editBody, setEditBody]   = React.useState('');
  const [error, setError]         = React.useState('');
  const [success, setSuccess]     = React.useState('');

  // For "Add to existing workflow"
  const [workflows, setWorkflows] = React.useState([]);
  const [addWfId, setAddWfId]     = React.useState('');
  const [addDay, setAddDay]       = React.useState(1);
  const [addTplName, setAddTplName] = React.useState('');
  const [savingAdd, setSavingAdd] = React.useState(false);

  // For "Create new workflow"
  const [newWfName, setNewWfName] = React.useState('');
  const [savingNew, setSavingNew] = React.useState(false);

  // Track which body textarea ref for token insertion
  const bodyRef = React.useRef(null);
  const subjectRef = React.useRef(null);

  React.useEffect(() => {
    api('/api/admin/workflows').then(d => {
      const wfs = d.workflows || [];
      setWorkflows(wfs);
      if (wfs.length > 0) setAddWfId(String(wfs[0].id));
    }).catch(() => {});
  }, []);

  // Update default day when workflow selection changes
  React.useEffect(() => {
    if (!addWfId) return;
    const wf = workflows.find(w => String(w.id) === addWfId);
    if (!wf) return;
    const steps = wf.steps || [];
    const maxDay = steps.length > 0 ? Math.max(...steps.map(s => s.sequence_day)) : 0;
    setAddDay(maxDay > 0 ? maxDay + 3 : 1);
  }, [addWfId, workflows]);

  // Auto-generate template name slug when result arrives
  React.useEffect(() => {
    if (result) {
      const ts = Date.now().toString().slice(-6);
      setAddTplName(`ai_${result.channel}_${apptType}_${ts}`);
    }
  }, [result]);

  function insertToken(token) {
    // Try to insert at cursor in whichever textarea is focused
    const ta = document.activeElement;
    if (ta && (ta === bodyRef.current || ta === subjectRef.current)) {
      const start = ta.selectionStart;
      const end   = ta.selectionEnd;
      const val   = ta.value;
      const newVal = val.slice(0, start) + token + val.slice(end);
      if (ta === bodyRef.current) {
        setEditBody(newVal);
      } else {
        setEditSubject(newVal);
      }
      // Restore cursor after token
      requestAnimationFrame(() => {
        ta.focus();
        ta.setSelectionRange(start + token.length, start + token.length);
      });
    } else {
      // Append to body if nothing focused
      setEditBody(b => b + token);
    }
  }

  async function generate() {
    if (!prompt.trim()) return;
    setGenerating(true); setError(''); setResult(null);
    try {
      const r = await api('/api/admin/workflow/ai-generate-message', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ channel, appointment_type: apptType, prompt }),
      });
      setResult(r);
      setEditSubject(r.subject || '');
      setEditBody(r.body || '');
      setSuccess('');
    } catch(e) { setError(e.message); }
    setGenerating(false);
  }

  async function addToWorkflow() {
    if (!addWfId || !editBody.trim() || !addTplName.trim()) return;
    setSavingAdd(true); setError(''); setSuccess('');
    try {
      await api('/api/admin/workflow-steps', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          workflow_id: parseInt(addWfId),
          sequence_day: parseInt(addDay) || 1,
          channel: result.channel,
          template_name: addTplName.trim(),
          subject: editSubject.trim(),
          body: editBody.trim(),
          terminal: false,
        }),
      });
      // Refresh workflow steps count
      const fresh = await api('/api/admin/workflows');
      setWorkflows(fresh.workflows || []);
      setSuccess(`✅ Step added to workflow on day ${addDay}`);
    } catch(e) { setError(e.message); }
    setSavingAdd(false);
  }

  async function createAndAddWorkflow() {
    if (!newWfName.trim() || !editBody.trim()) return;
    setSavingNew(true); setError(''); setSuccess('');
    try {
      const wf = await api('/api/admin/workflows', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ name: newWfName.trim(), campaign_tag: '', description: '' }),
      });
      await api('/api/admin/workflow-steps', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          workflow_id: wf.id,
          sequence_day: 1,
          channel: result.channel,
          template_name: addTplName.trim(),
          subject: editSubject.trim(),
          body: editBody.trim(),
          terminal: false,
        }),
      });
      const fresh = await api('/api/admin/workflows');
      setWorkflows(fresh.workflows || []);
      setAddWfId(String(wf.id));
      setSuccess(`✅ New workflow "${newWfName.trim()}" created with this message as Day 1`);
      setNewWfName('');
    } catch(e) { setError(e.message); }
    setSavingNew(false);
  }

  function reset() {
    setResult(null); setEditSubject(''); setEditBody('');
    setPrompt(''); setError(''); setSuccess('');
  }

  const APPT_TYPES = [
    ['general','General'], ['consult','Consultation'], ['exam','New Patient Exam'],
    ['implant','Implant'], ['ortho','Ortho / Invisalign'],
  ];

  const TOKENS = [
    ['{first_name}', 'First Name'],
    ['{unsub_url}',  'Unsub URL'],
  ];

  const inputSt = {width:'100%',padding:'4px 8px',fontSize:11,border:'1px solid var(--border)',borderRadius:4,fontFamily:'inherit'};

  return (
    <div style={{display:'flex',gap:16,height:'calc(100vh - 140px)',overflow:'hidden'}}>
      {/* Left: generator controls */}
      <div style={{width:280,display:'flex',flexDirection:'column',gap:10,overflowY:'auto'}}>
        <div style={{background:'#fff',border:'1px solid var(--border)',borderRadius:8,padding:14}}>
          <div style={{fontWeight:700,fontSize:12,color:'var(--teal-dark)',marginBottom:10}}>✨ Generate Message</div>

          <div style={{marginBottom:8}}>
            <label style={{fontSize:10,fontWeight:600,color:'var(--text-muted)',display:'block',marginBottom:3}}>Channel</label>
            <div style={{display:'flex',gap:4}}>
              {['email','sms'].map(c => (
                <button key={c} onClick={() => setChannel(c)}
                  className={'btn btn-sm ' + (channel === c ? 'btn-teal' : 'btn-ghost')}
                  style={{flex:1,textTransform:'capitalize'}}>
                  {c === 'email' ? '✉ Email' : '💬 SMS'}
                </button>
              ))}
            </div>
          </div>

          <div style={{marginBottom:8}}>
            <label style={{fontSize:10,fontWeight:600,color:'var(--text-muted)',display:'block',marginBottom:3}}>Appointment Type</label>
            <select value={apptType} onChange={e => setApptType(e.target.value)} style={{...inputSt}}>
              {APPT_TYPES.map(([v,l]) => <option key={v} value={v}>{l}</option>)}
            </select>
          </div>

          <div style={{marginBottom:10}}>
            <label style={{fontSize:10,fontWeight:600,color:'var(--text-muted)',display:'block',marginBottom:3}}>Goal / Description</label>
            <textarea value={prompt} rows={5} onChange={e => setPrompt(e.target.value)}
              placeholder={'Example: Re-engage patient who saw our smile preview but hasn\'t booked. Emphasize that their smile transformation is waiting.'}
              style={{...inputSt,resize:'vertical'}} />
          </div>

          <button className="btn btn-teal btn-sm" style={{width:'100%'}}
            onClick={generate} disabled={generating || !prompt.trim()}>
            {generating ? 'Generating…' : '✨ Generate with AI'}
          </button>

          {result && (
            <button className="btn btn-ghost btn-sm" style={{width:'100%',marginTop:6}} onClick={reset}>
              ↩ Start Over
            </button>
          )}
        </div>

        {result && (
          <div style={{background:'#fff',border:'1px solid var(--border)',borderRadius:8,padding:14}}>
            <div style={{fontWeight:700,fontSize:12,color:'var(--teal-dark)',marginBottom:8}}>📌 Insert Token</div>
            <div style={{fontSize:10,color:'var(--text-muted)',marginBottom:6}}>
              Click to insert at cursor position in subject or body
            </div>
            <div style={{display:'flex',flexWrap:'wrap',gap:4}}>
              {TOKENS.map(([tok, label]) => (
                <button key={tok} onClick={() => insertToken(tok)}
                  style={{padding:'2px 7px',fontSize:10,borderRadius:4,border:'1px solid var(--teal)',
                    background:'var(--teal-light)',color:'var(--teal-dark)',cursor:'pointer',fontFamily:'monospace'}}>
                  {tok}
                </button>
              ))}
            </div>
          </div>
        )}
      </div>

      {/* Right: editable output + save actions */}
      <div style={{flex:1,display:'flex',flexDirection:'column',gap:10,overflowY:'auto'}}>
        {error && <div style={{background:'#fee2e2',border:'1px solid #fca5a5',borderRadius:6,padding:'6px 10px',fontSize:11,color:'#dc2626'}}>{error}</div>}
        {success && <div style={{background:'#dcfce7',border:'1px solid #86efac',borderRadius:6,padding:'6px 10px',fontSize:11,color:'#15803d'}}>{success}</div>}

        {!result ? (
          <div style={{background:'#fff',border:'1px solid var(--border)',borderRadius:8,padding:32,textAlign:'center',color:'var(--text-muted)',fontSize:12,flex:1}}>
            Configure your message on the left and click Generate.
            <br/><br/>
            <span style={{fontSize:11}}>💡 Practice info from Admin → Practice Information will be baked into the message automatically.</span>
          </div>
        ) : (
          <>
            {/* Editable message */}
            <div style={{background:'#fff',border:'1px solid var(--border)',borderRadius:8,padding:14}}>
              <div style={{fontWeight:700,fontSize:12,color:'var(--teal-dark)',marginBottom:10}}>
                ✏️ Edit Generated Message
                <span style={{fontWeight:400,fontSize:10,color:'var(--text-muted)',marginLeft:8}}>
                  {result.channel === 'email' ? '✉ Email' : '💬 SMS'}
                </span>
              </div>
              {result.channel === 'email' && (
                <div style={{marginBottom:8}}>
                  <label style={{fontSize:10,fontWeight:600,color:'var(--text-muted)',display:'block',marginBottom:2}}>Subject</label>
                  <input ref={subjectRef} value={editSubject} onChange={e => setEditSubject(e.target.value)}
                    style={inputSt} placeholder="Email subject line" />
                </div>
              )}
              <div>
                <label style={{fontSize:10,fontWeight:600,color:'var(--text-muted)',display:'block',marginBottom:2}}>

                </label>
                <textarea ref={bodyRef} value={editBody} onChange={e => setEditBody(e.target.value)}
                  rows={result.channel === 'email' ? 10 : 5}
                  style={{...inputSt,resize:'vertical'}} />

                  </div>
                  <div style={{width:70}}>
                    <label style={{fontSize:10,fontWeight:600,color:'var(--text-muted)',display:'block',marginBottom:2}}>Day</label>
                    <input type="number" min="0" max="365" value={addDay}
                      onChange={e => setAddDay(parseInt(e.target.value)||1)} style={inputSt} />
                  </div>
                  <button className="btn btn-teal btn-sm" onClick={addToWorkflow}
                    disabled={savingAdd || !editBody.trim() || !addTplName.trim()}>
                    {savingAdd ? 'Saving…' : 'Add Step'}
                  </button>
                </div>
              )}
            </div>

            {/* Create new workflow */}
            <div style={{background:'#fff',border:'1px solid var(--border)',borderRadius:8,padding:14}}>
              <div style={{fontWeight:700,fontSize:12,color:'var(--teal-dark)',marginBottom:8}}>🆕 Create New Workflow</div>
              <div style={{display:'flex',gap:8,alignItems:'flex-end'}}>
                <div style={{flex:1}}>
                  <label style={{fontSize:10,fontWeight:600,color:'var(--text-muted)',display:'block',marginBottom:2}}>Workflow Name</label>
                  <input value={newWfName} onChange={e => setNewWfName(e.target.value)}
                    placeholder="e.g. Implant Consult Follow-up" style={inputSt} />
                </div>
                <button className="btn btn-teal btn-sm" onClick={createAndAddWorkflow}
                  disabled={savingNew || !newWfName.trim() || !editBody.trim() || !addTplName.trim()}>
                  {savingNew ? 'Creating…' : 'Create & Add Step'}
                </button>
              </div>
            </div>
          </>
        )}
      </div>
    </div>
  );
}
