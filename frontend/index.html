function KanbanCard({ lead, isSelected, onClick, onStageChange }) {
  const name = [lead.first_name, lead.last_name].filter(Boolean).join(' ') || lead.email || 'Unknown';
  const needsFollowup = isStaffFollowUp(lead);
  const kw = (lead.keyword_text || '').replace(/^\[.*?\]\s*/, ''); // strip match type prefix
  const [dragging, setDragging] = useState(false);

  function handleStageSelect(e) {
    e.stopPropagation();
    const newStage = e.target.value;
    if (newStage && newStage !== lead.stage) onStageChange(lead.id, newStage);
  }

  return (
    <div
      className={'kanban-card' + (isSelected ? ' selected' : '') + (needsFollowup ? ' needs-followup' : '') + (dragging ? ' dragging' : '')}
      onClick={() => onClick(lead.id)}
      draggable
      onDragStart={e => {
        e.dataTransfer.setData('text/plain', lead.id);
        e.dataTransfer.effectAllowed = 'move';
        setDragging(true);
      }}
      onDragEnd={() => setDragging(false)}
    >
      <div className="kc-row">
        <span className="kc-name">{name}</span>
        <span className={'chip-source ' + srcClass(lead.source)} style={{fontSize:'8px'}}>{lead.source || '?'}</span>
      </div>
      {lead.phone && <div className="kc-meta">📞 {lead.phone}</div>}
      {lead.appointment_date && (
        <div className="kc-row">
          <span className="kc-badge kc-appt">📅 {fmtDate(lead.appointment_date)}</span>
        </div>
      )}
      {kw && <div className="kc-row"><span className="kc-badge kc-kw" title={kw}>🔑 {kw}</span></div>}
      <div className="kc-row">
        {lead.attributed_production > 0 && <span className="kc-revenue">{fmtMoney(lead.attributed_production)}</span>}
        {(lead.notes_count || 0) > 0 && <span className="kc-badge kc-notes">💬{lead.notes_count}</span>}
        <span className="kc-time" style={{marginLeft:'auto'}}>{timeAgo(lead.created_at)}</span>
      </div>
      {needsFollowup && (
        <div><span className="kc-followup-pill">⚠ Follow up</span></div>
      )}
      {/* Non-drag fallback: stage dropdown */}
      <div onClick={e => e.stopPropagation()} style={{marginTop:3}}>
        <select className="kc-stage-select" value={lead.stage} onChange={handleStageSelect}>
          {STAGES.filter(s => s !== 'cold').map(s => (
            <option key={s} value={s}>{STAGE_LABELS[s]}</option>
          ))}
          <option value="cold">{STAGE_LABELS.cold}</option>
        </select>
      </div>
    </div>
  );
}

function KanbanColumn({ stage, label, leads, color, selectedId, onCardClick, onDrop, onStageChange }) {
  const [dragOver, setDragOver] = useState(false);

  return (
    <div
      className={'kanban-col' + (dragOver ? ' drag-over' : '')}
    >
      <div className="kanban-col-header" style={{borderTopColor: color}}>
        <span className="stage-dot" style={{background: color}} />
        <span className="stage-label">{label}</span>
        <span className="stage-count">{leads.length}</span>
      </div>
      <div
        className="kanban-col-body"
        onDragOver={e => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; setDragOver(true); }}
        onDragLeave={e => { if (!e.currentTarget.contains(e.relatedTarget)) setDragOver(false); }}
        onDrop={e => {
          e.preventDefault();
          setDragOver(false);
          const id = e.dataTransfer.getData('text/plain');
          if (id) onDrop(id, stage);
        }}
      >
        {leads.length === 0 && <div className="kanban-empty">No leads</div>}
        {leads.map(l => (
          <KanbanCard
            key={l.id}
            lead={l}
            isSelected={selectedId === l.id}
            onClick={onCardClick}
            onStageChange={onStageChange}
          />
        ))}
      </div>
    </div>
  );
}

function KanbanBoard({ pipeline, stats, selectedId, onCardClick, onStageChange, onRefresh }) {
  const [searchTerm, setSearchTerm] = useState('');
  const [sourceFilter, setSourceFilter] = useState('all');
  const [showCold, setShowCold] = useState(false);
  const [followupOnly, setFollowupOnly] = useState(false);
  const boardRef = useRef(null);
  // Manual lead creation
  const EMPTY_LEAD = {first_name:'',last_name:'',email:'',phone:'',source:'manual',notes:''};
  const [showAddLead, setShowAddLead] = useState(false);
  const [newLead, setNewLead] = useState({...EMPTY_LEAD});
  const [addingLead, setAddingLead] = useState(false);
  const [addLeadError, setAddLeadError] = useState('');

  async function submitAddLead() {
    if (!newLead.first_name && !newLead.email && !newLead.phone) {
      setAddLeadError('Enter at least a name, email, or phone.');
      return;
    }
    setAddingLead(true); setAddLeadError('');
    try {
      await api('/api/admin/leads/create', {method:'POST', body:JSON.stringify(newLead)});
      setShowAddLead(false);
      setNewLead({...EMPTY_LEAD});
      onRefresh();
    } catch(e) {
      setAddLeadError(e?.detail || e?.message || 'Failed to create lead');
    } finally {
      setAddingLead(false);
    }
  }

  const filtered = useMemo(() => {
    return pipeline.filter(l => {
      if (!showCold && l.stage === 'cold') return false;
      if (sourceFilter !== 'all' && l.source !== sourceFilter) return false;
      if (followupOnly && !isStaffFollowUp(l)) return false;
      if (searchTerm) {
        const term = searchTerm.toLowerCase();
        const name = ((l.first_name || '') + ' ' + (l.last_name || '')).trim().toLowerCase();
        const email = (l.email || '').toLowerCase();
        const phone = (l.phone || '').toLowerCase();
        if (!name.includes(term) && !email.includes(term) && !phone.includes(term)) return false;
      }
      return true;
    });
  }, [pipeline, searchTerm, sourceFilter, showCold, followupOnly]);

  const byStage = useMemo(() => {
    const map = {};
    STAGES.forEach(s => { map[s] = []; });
    filtered.forEach(l => {
      if (map[l.stage] !== undefined) map[l.stage].push(l);
    });
    return map;
  }, [filtered]);

  const followupCount = useMemo(() => pipeline.filter(isStaffFollowUp).length, [pipeline]);

  const sources = useMemo(() => {
    const set = new Set(pipeline.filter(l => l.source).map(l => l.source));
    return ['all', ...Array.from(set).sort()];
  }, [pipeline]);

  async function handleDrop(leadId, newStage) {
    try {
      await api('/api/admin/lead/' + leadId + '/force-stage', { method: 'PUT', body: JSON.stringify({ stage: newStage, reason: 'drag-drop' }) });
      onStageChange(leadId, newStage);
    } catch (err) {
      console.error('Stage change failed', err);
      if (onRefresh) onRefresh();
    }
  }

  // Edge-scroll while dragging: scroll the kanban board when near edges
  function handleBoardDragOver(e) {
    const board = boardRef.current;
    if (!board) return;
    const rect = board.getBoundingClientRect();
    const edgeSize = 60;
    if (e.clientX < rect.left + edgeSize) board.scrollBy(-12, 0);
    else if (e.clientX > rect.right - edgeSize) board.scrollBy(12, 0);
  }

  const visibleStages = STAGES.filter(s => s !== 'cold');

  return (
    <div>
      {/* KPI strip */}
      <div className="kpi-strip">
        <div className="kpi"><div className="kpi-val">{stats?.total_leads || 0}</div><div className="kpi-label">Total</div></div>
        <div className="kpi"><div className="kpi-val">{filtered.length}</div><div className="kpi-label">Showing</div></div>
        <div className="kpi"><div className="kpi-val">{byStage.scheduled ? byStage.scheduled.length : 0}</div><div className="kpi-label">Scheduled</div></div>
        <div className="kpi"><div className="kpi-val">{byStage.no_show ? byStage.no_show.length : 0}</div><div className="kpi-label">No-Shows</div></div>
        <div className="kpi"><div className="kpi-val">{byStage.treatment_completed ? byStage.treatment_completed.length : 0}</div><div className="kpi-label">Treated</div></div>
        <div className="kpi"><div className="kpi-val">{fmtMoney(stats?.attributed_revenue || 0)}</div><div className="kpi-label">Revenue</div></div>
      </div>

      {/* Filter bar */}
      <div className="filter-bar">
        <select className="filter-select" value={sourceFilter} onChange={e => setSourceFilter(e.target.value)}>
          {sources.map(s => <option key={s} value={s}>{s === 'all' ? 'All Sources' : s}</option>)}
        </select>
        <input type="text" className="search-box" placeholder="Search name, email, phone..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} />
        <button
          className={'followup-pill-btn' + (followupOnly ? ' active' : '')}
          onClick={() => setFollowupOnly(f => !f)}
        >
          ⚠ <span className="pill-count">{followupCount}</span> Follow-up
        </button>
        <label style={{fontSize:11, display:'flex', gap:6, alignItems:'center', cursor:'pointer'}}>
          <input type="checkbox" checked={showCold} onChange={e => setShowCold(e.target.checked)} />
          Cold
        </label>
        <button className="btn btn-teal btn-sm" onClick={() => { setNewLead({...EMPTY_LEAD}); setAddLeadError(''); setShowAddLead(true); }}
          style={{marginLeft:'auto', fontSize:11, padding:'4px 14px', whiteSpace:'nowrap'}}>
          + Add Lead
        </button>
      </div>

      {/* Add Lead Modal */}
      {showAddLead && (
        <div className="modal-overlay" onClick={() => setShowAddLead(false)}>
          <div className="modal" onClick={e => e.stopPropagation()} style={{maxWidth:420, padding:24}}>
            <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:16}}>
              <h3 style={{margin:0, fontSize:15, fontWeight:700}}>Add Lead Manually</h3>
              <button onClick={() => setShowAddLead(false)} style={{background:'none', border:'none',
                fontSize:20, cursor:'pointer', color:'var(--text-muted)', lineHeight:1}}>×</button>
            </div>
            {[
              {label:'First Name', key:'first_name', type:'text', placeholder:'Jane'},
              {label:'Last Name',  key:'last_name',  type:'text', placeholder:'Smith'},
              {label:'Email',      key:'email',      type:'email', placeholder:'jane@example.com'},
              {label:'Phone',      key:'phone',      type:'tel',  placeholder:'(508) 555-0100'},
            ].map(f => (
              <div key={f.key} style={{marginBottom:10}}>
                <label style={{fontSize:11, fontWeight:600, color:'var(--text-muted)', display:'block', marginBottom:3}}>{f.label}</label>
                <input type={f.type} value={newLead[f.key]} placeholder={f.placeholder}
                  onChange={e => setNewLead(p => ({...p, [f.key]: e.target.value}))}
                  onKeyDown={e => e.key === 'Enter' && submitAddLead()}
                  style={{width:'100%', fontSize:12, padding:'6px 10px', borderRadius:6,
                    border:'1px solid var(--border)', background:'var(--surface)',
                    color:'var(--text)', boxSizing:'border-box'}} />
              </div>
            ))}
            <div style={{marginBottom:10}}>
              <label style={{fontSize:11, fontWeight:600, color:'var(--text-muted)', display:'block', marginBottom:3}}>Source</label>
              <select value={newLead.source} onChange={e => setNewLead(p => ({...p, source: e.target.value}))}
                style={{width:'100%', fontSize:12, padding:'6px 10px', borderRadius:6,
                  border:'1px solid var(--border)', background:'var(--surface)', color:'var(--text)'}}>
                <option value="manual">Manual</option>
                <option value="referral">Referral</option>
                <option value="phone_call">Phone Call</option>
                <option value="walk_in">Walk-in</option>
                <option value="smile_tool">Smile Tool</option>
                <option value="other">Other</option>
              </select>
            </div>
            <div style={{marginBottom:14}}>
              <label style={{fontSize:11, fontWeight:600, color:'var(--text-muted)', display:'block', marginBottom:3}}>Notes</label>
              <textarea value={newLead.notes} onChange={e => setNewLead(p => ({...p, notes: e.target.value}))}
                rows={3} placeholder="Optional context about this lead…"
                style={{width:'100%', fontSize:12, padding:'6px 10px', borderRadius:6, resize:'vertical',
                  border:'1px solid var(--border)', background:'var(--surface)',
                  color:'var(--text)', boxSizing:'border-box'}} />
            </div>
            {addLeadError && (
              <div style={{color:'var(--red)', fontSize:11, marginBottom:10}}>{addLeadError}</div>
            )}
            <div style={{display:'flex', gap:8, justifyContent:'flex-end'}}>
              <button className="btn btn-ghost btn-sm" onClick={() => setShowAddLead(false)}>Cancel</button>
              <button className="btn btn-teal btn-sm" onClick={submitAddLead} disabled={addingLead}>
                {addingLead ? 'Creating…' : 'Create Lead'}
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Kanban board */}
      <div className="kanban-board" ref={boardRef} onDragOver={handleBoardDragOver}>
        {visibleStages.map(s => (
          <KanbanColumn
            key={s}
            stage={s}
            label={STAGE_LABELS[s]}
            leads={byStage[s] || []}
            color={STAGE_COLORS[s] || '#6b7280'}
            selectedId={selectedId}
            onCardClick={onCardClick}
            onDrop={handleDrop}
            onStageChange={(id, newStage) => handleDrop(id, newStage)}
          />
        ))}
        {showCold && (
          <KanbanColumn
            stage="cold"
            label="Cold"
            leads={byStage.cold || []}
            color="#9ca3af"
            selectedId={selectedId}
            onCardClick={onCardClick}
            onDrop={handleDrop}
            onStageChange={(id, newStage) => handleDrop(id, newStage)}
          />
        )}
      </div>
    </div>
  );
}

function DashboardTab({ pipeline, stats, onTabSwitch }) {
  const now = Date.now();

  // Compute KPIs from pipeline data (exclude cold leads — they are archived, not active)
  const activeLeads = pipeline.filter(l => l.stage !== 'cold');
  const totalLeads = activeLeads.length;
  const scheduled = pipeline.filter(l => l.stage === 'scheduled').length;
  const totalRevenue = pipeline.reduce((s, l) => s + (l.attributed_production || 0), 0);
  const treated = pipeline.filter(l => l.stage === 'treatment_completed').length;
  const convRate = totalLeads > 0 ? Math.round(scheduled / totalLeads * 100) : 0;
  const revPerLead = totalLeads > 0 ? Math.round(totalRevenue / totalLeads) : 0;

  // Avg days to appointment (leads with appointment_date set)
  const withAppt = pipeline.filter(l => l.appointment_date && l.created_at);
  const avgDaysToAppt = withAppt.length > 0
    ? Math.round(withAppt.reduce((s, l) => {
        return s + (new Date(l.appointment_date) - new Date(l.created_at)) / (1000 * 60 * 60 * 24);
      }, 0) / withAppt.length)
    : null;

  // Alerts
  const followupNeeded = pipeline.filter(isStaffFollowUp).length;
  const noShowsThisWeek = pipeline.filter(l => {
    if (l.stage !== 'no_show') return false;
    const d = (now - new Date(l.updated_at).getTime()) / (1000 * 60 * 60 * 24);
    return d <= 7;
  }).length;
  const stuckInNew = pipeline.filter(l => {
    if (l.stage !== 'new') return false;
    const d = (now - new Date(l.created_at).getTime()) / (1000 * 60 * 60 * 24);
    return d > 7;
  }).length;
  const scheduledThisWeek = pipeline.filter(l => {
    if (!l.appointment_date) return false;
    const appt = new Date(l.appointment_date).getTime();
    return appt >= now && appt <= now + 7 * 24 * 60 * 60 * 1000;
  }).length;

  // Stage counts (used by Leads by Stage panel)
  const stageCounts = {};
  pipeline.forEach(l => { stageCounts[l.stage] = (stageCounts[l.stage] || 0) + 1; });

  return (
    <div className="dash-layout">
      <div className="dash-left">
        {/* KPI Cards */}
        <div className="dash-kpi-grid">
          <div className="dash-kpi">
            <div className="dash-kpi-val">{totalLeads}</div>
            <div className="dash-kpi-label">Total Leads</div>
            <div className="dash-kpi-sub">All time</div>
          </div>
          <div className="dash-kpi">
            <div className="dash-kpi-val">{convRate}%</div>
            <div className="dash-kpi-label">Booking Rate</div>
            <div className="dash-kpi-sub">{scheduled} scheduled / {totalLeads} leads</div>
          </div>
          <div className="dash-kpi">
            <div className="dash-kpi-val">{scheduled}</div>
            <div className="dash-kpi-label">Scheduled</div>
            <div className="dash-kpi-sub">Active appointments</div>
          </div>
          <div className="dash-kpi">
            <div className="dash-kpi-val">{fmtMoney(totalRevenue)}</div>
            <div className="dash-kpi-label">Attributed Revenue</div>
            <div className="dash-kpi-sub">{treated} treatment{treated !== 1 ? 's' : ''} completed</div>
          </div>
          <div className="dash-kpi">
            <div className="dash-kpi-val">{avgDaysToAppt !== null ? avgDaysToAppt + 'd' : '—'}</div>
            <div className="dash-kpi-label">Avg Days to Appt</div>
            <div className="dash-kpi-sub">{withAppt.length} leads with appt data</div>
          </div>
          <div className="dash-kpi">
            <div className="dash-kpi-val">{fmtMoney(revPerLead)}</div>
            <div className="dash-kpi-label">Revenue / Lead</div>
            <div className="dash-kpi-sub">Avg across all leads</div>
          </div>
        </div>

      </div>

      <div className="dash-right">
        {/* Alerts */}
        <div className="dash-section">
          <div className="dash-section-title">Action Items</div>
          <div className="alert-item" onClick={() => onTabSwitch('pipeline')}>
            <div>
              <div className="alert-label">Staff Follow-Up</div>
              <div className="alert-sub">Leads needing a call or email</div>
            </div>
            <div className={'alert-count ' + (followupNeeded > 0 ? 'warn' : 'ok')}>{followupNeeded}</div>
          </div>
          <div className="alert-item" onClick={() => onTabSwitch('pipeline')}>
            <div>
              <div className="alert-label">No-Shows This Week</div>
              <div className="alert-sub">Broken appointments (7d)</div>
            </div>
            <div className={'alert-count ' + (noShowsThisWeek > 0 ? 'danger' : 'ok')}>{noShowsThisWeek}</div>
          </div>
          <div className="alert-item" onClick={() => onTabSwitch('pipeline')}>
            <div>
              <div className="alert-label">Stuck in New {'>'} 7d</div>
              <div className="alert-sub">Not moving through funnel</div>
            </div>
            <div className={'alert-count ' + (stuckInNew > 0 ? 'warn' : 'ok')}>{stuckInNew}</div>
          </div>
          <div className="alert-item" onClick={() => onTabSwitch('pipeline')}>
            <div>
              <div className="alert-label">Scheduled This Week</div>
              <div className="alert-sub">Upcoming appointments (7d)</div>
            </div>
            <div className={'alert-count info'}>{scheduledThisWeek}</div>
          </div>
        </div>

        {/* Stage breakdown */}
        <div className="dash-section">
          <div className="dash-section-title">Leads by Stage</div>
          {STAGES.filter(s => (stageCounts[s] || 0) > 0).map(s => (
            <div key={s} style={{display:'flex',justifyContent:'space-between',alignItems:'center',

                {STAGE_LABELS[s]}
              </div>
              <span style={{fontWeight:600,color:'var(--text)'}}>{stageCounts[s] || 0}</span>

          ))}
        </div>

      </div>
    </div>
  );
}

// Default date range helpers
function defaultDateRange(days) {
  const end = new Date();
  const start = new Date();
  start.setDate(end.getDate() - days);
  const fmt = d => d.toISOString().split('T')[0];
  return { start: fmt(start), end: fmt(end) };
}

// ─── CampaignTrendChart ────────────────────────────────────────────────────
// NOTE: filter by campaign_name (not campaign_id) because get_campaign_stats()
// returns the name field as `campaign`, not a numeric ID.
function CampaignTrendChart({ campaignName, dailyStats }) {
  // Filter daily stats to this campaign (case-insensitive) and sort by date ascending
  const nameLower = (campaignName || '').toLowerCase();
  const rows = (dailyStats || [])
    .filter(r => (r.campaign_name || '').toLowerCase() === nameLower)
    .sort((a, b) => a.date.localeCompare(b.date));

  if (!rows.length) {
    return (
      <div className="trend-empty">
        No trend data yet — will populate after the next 6 AM Google Ads sync.
      </div>
    );
  }

  const W = 480, H = 80, PAD_L = 28, PAD_R = 8, PAD_T = 8, PAD_B = 20;
  const chartW = W - PAD_L - PAD_R;
  const chartH = H - PAD_T - PAD_B;
  const maxClicks = Math.max(...rows.map(r => r.clicks || 0), 1);
  const count = rows.length;

  // Build polyline points
  const pts = rows.map((r, i) => {
    const x = PAD_L + (count === 1 ? chartW / 2 : (i / (count - 1)) * chartW);
    const y = PAD_T + chartH - ((r.clicks || 0) / maxClicks) * chartH;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');

  const firstDate = rows[0].date.slice(5);  // MM-DD
  const lastDate = rows[rows.length - 1].date.slice(5);

  return (
    <div className="trend-chart-wrap">
      <div style={{fontSize:10, color:'var(--text-muted)', marginBottom:4}}>Clicks (last {count} days)</div>
      <svg className="trend-svg" viewBox={`0 0 ${W} ${H}`} xmlns="http://www.w3.org/2000/svg">
        {/* Axis lines */}
        <line x1={PAD_L} y1={PAD_T} x2={PAD_L} y2={PAD_T + chartH} stroke="var(--border)" strokeWidth="1"/>
        <line x1={PAD_L} y1={PAD_T + chartH} x2={W - PAD_R} y2={PAD_T + chartH} stroke="var(--border)" strokeWidth="1"/>
        {/* Y-axis labels */}
        <text x={PAD_L - 3} y={PAD_T + 4} fontSize="7" textAnchor="end" fill="var(--text-muted)">{maxClicks}</text>
        <text x={PAD_L - 3} y={PAD_T + chartH} fontSize="7" textAnchor="end" fill="var(--text-muted)">0</text>
        {/* X-axis date labels */}
        <text x={PAD_L} y={H - 4} fontSize="7" textAnchor="start" fill="var(--text-muted)">{firstDate}</text>
        <text x={W - PAD_R} y={H - 4} fontSize="7" textAnchor="end" fill="var(--text-muted)">{lastDate}</text>
        {/* Filled area under line */}
        <polygon
          points={`${PAD_L},${PAD_T + chartH} ${pts} ${PAD_L + (count === 1 ? chartW / 2 : chartW)},${PAD_T + chartH}`}
          fill="var(--teal)" fillOpacity="0.12"
        />
        {/* Trend line */}
        <polyline points={pts} fill="none" stroke="var(--teal)" strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round"/>
      </svg>
    </div>
  );
}

// ─── LandingPagesView ──────────────────────────────────────────────────────
function LandingPagesView({ ga4Data }) {
  const [activeSite, setActiveSite] = React.useState(null); // null = show all sites
  const [subTab, setSubTab]         = React.useState('perpage'); // 'perpage' | 'aggregate'

  if (!ga4Data) {
    return (
      <div className="report-section" style={{textAlign:'center',padding:32,color:'var(--text-muted)',fontSize:12}}>
        Loading GA4 data…
      </div>
    );
  }

  const ov         = ga4Data.overview || {};
  const configured = ov.configured === true && !ov.error && !ov.no_data;
  const properties = ga4Data.properties || [];
  const fetched    = ga4Data.fetched_at ? new Date(ga4Data.fetched_at).toLocaleString() : null;

  if (!configured) {
    return (
      <div className="report-section" style={{padding:24,color:'var(--text-muted)',fontSize:12}}>
        <div style={{fontWeight:600,marginBottom:6}}>GA4 not configured</div>
        <div>Set <code>GA4_PROPERTIES</code> and <code>GA4_SERVICE_ACCOUNT_JSON</code> in .env, then restart.</div>
      </div>
    );
  }

  const allPages       = ga4Data.top_pages              || [];
  const allSources     = ga4Data.traffic_sources        || [];
  const allLeads       = ga4Data.leads_by_campaign      || [];
  const allPageSources = ga4Data.page_traffic_sources   || [];

  // Build a lookup: "domain::page" → sources[]
  const pageSourceMap = useMemo(() => {
    const m = {};
    allPageSources.forEach(entry => {
      m[`${entry.property_domain}::${entry.page}`] = entry.sources || [];
    });
    return m;
  }, [allPageSources]);

  const teal  = 'var(--teal)';
  const muted = 'var(--text-muted)';
  const green = '#059669';
  const amber = '#d97706';
  const red   = '#dc2626';

  function pct(n)  { return (n||0).toFixed(1) + '%'; }
  function num(n)  { return Math.round(n||0).toLocaleString(); }

  // Mini bar — relative to maxVal
  function Bar({ val, maxVal, color }) {
    const w = maxVal > 0 ? Math.min(val / maxVal * 100, 100) : 0;
    return (
      <div style={{height:5,borderRadius:3,background:'#e5e7eb',overflow:'hidden',minWidth:60,flex:1}}>
        <div style={{height:'100%',width:`${w}%`,background:color||teal,borderRadius:3}}/>
      </div>
    );
  }

  // One card per site — shows that site's pages + leads
  function SiteCard({ domain }) {
    const sitePages  = allPages.filter(p => p.property_domain === domain);
    const siteLeads  = allLeads.filter(l => l.property_domain === domain);

    // Aggregate per-page sources into a single site-level source breakdown
    const siteSrcMap = {};
    sitePages.forEach(p => {
      const srcs = pageSourceMap[`${domain}::${p.page||'/'}`] || [];
      srcs.forEach(s => {
        if (!siteSrcMap[s.source_medium]) siteSrcMap[s.source_medium] = { sessions: 0, engaged_sum: 0, conversions: 0 };
        siteSrcMap[s.source_medium].sessions     += s.sessions;
        siteSrcMap[s.source_medium].engaged_sum  += s.engagement_rate * s.sessions;
        siteSrcMap[s.source_medium].conversions  += s.conversions;
      });
    });
    const siteSources = Object.entries(siteSrcMap)
      .map(([src, v]) => ({
        source_medium:   src,
        sessions:        v.sessions,
        engagement_rate: v.sessions > 0 ? v.engaged_sum / v.sessions : 0,
        conversions:     v.conversions,
      }))
      .sort((a,b) => b.sessions - a.sessions);

    // Aggregate site-level KPIs from pages
    const totalSessions   = sitePages.reduce((s,p)=>s+p.sessions,0);
    const totalConversions= sitePages.reduce((s,p)=>s+p.conversions,0);
    const totalLeads      = siteLeads.reduce((s,l)=>s+l.leads,0);
    const avgEngagement   = totalSessions > 0
      ? sitePages.reduce((s,p)=>s+p.engagement_rate*p.sessions,0)/totalSessions : 0;
    const avgBounce       = totalSessions > 0
      ? sitePages.reduce((s,p)=>s+p.bounce_rate*p.sessions,0)/totalSessions : 0;

    const maxPageSessions = Math.max(...sitePages.map(p=>p.sessions), 1);

    const DOMAIN_COLORS = {
      'nxtsmile.com':          {bg:'#f0fdf4', border:'#86efac', badge:'#16a34a', text:'#14532d'},
      'graftondentalcare.com': {bg:'#eff6ff', border:'#93c5fd', badge:'#2563eb', text:'#1e3a5f'},
      'visitgdc.com':          {bg:'#fdf4ff', border:'#d8b4fe', badge:'#7c3aed', text:'#4c1d95'},
    };
    const dc = DOMAIN_COLORS[domain] || {bg:'#f9fafb',border:'#e5e7eb',badge:'#6b7280',text:'#374151'};

    return (
      <div style={{border:`1px solid ${dc.border}`,borderRadius:10,background:dc.bg,overflow:'hidden',marginBottom:14}}>

              🌐 {domain}

            <a href={`https://${domain}`} target="_blank" rel="noopener noreferrer"
               style={{fontSize:9,color:dc.badge,textDecoration:'none'}}>↗ visit</a>
          </div>
          {/* Site-level KPI summary */}
          <div style={{display:'flex',gap:18,alignItems:'center'}}>
            {[
              {label:'Sessions',   val:num(totalSessions),              color:dc.badge},
              {label:'Engagement', val:pct(avgEngagement),              color:avgEngagement>=50?green:amber},
              {label:'Bounce',     val:pct(avgBounce),                  color:avgBounce>60?red:avgBounce>40?amber:green},
              {label:'Leads',      val:totalLeads,                      color:green},
              {label:'Conversions',val:totalConversions,                color:green},
            ].map(({label,val,color})=>(
              <div key={label} style={{textAlign:'center'}}>
                <div style={{fontSize:14,fontWeight:700,color}}>{val}</div>
                <div style={{fontSize:9,color:muted,textTransform:'uppercase',letterSpacing:'.3px'}}>{label}</div>
              </div>
            ))}
          </div>
        </div>

        {/* Pages table */}
        <div style={{padding:'10px 14px'}}>
          {sitePages.length === 0 ? (
            <div style={{fontSize:11,color:muted,fontStyle:'italic',padding:'6px 0'}}>No page data yet.</div>
          ) : (
            <table className="report-table" style={{background:'transparent'}}>
              <thead>
                <tr>
                  <th>Page</th>
                  <th className="num">Sessions</th>
                  <th style={{width:100}}>Traffic</th>
                  <th className="num">Engagement</th>
                  <th className="num">Bounce</th>
                  <th className="num">Avg Duration</th>
                  <th className="num">Conversions</th>
                  <th className="num">Leads</th>
                </tr>
              </thead>
              <tbody>
                {sitePages.map((p,i) => {
                  const pageLeads = siteLeads.filter(l=>l.landing_page===p.page||l.landing_page===(p.page||'/'));
                  const pageLead  = pageLeads.reduce((s,l)=>s+l.leads,0);
                  return (

                      <td className="num" style={{fontWeight:600}}>{num(p.sessions)}</td>

                </thead>

          {/* ── Traffic Sources for this site ── */}
          {siteSources.length > 0 && (
            <div style={{marginTop:10}}>
              <div style={{fontSize:10,fontWeight:600,color:dc.text,marginBottom:6}}>
                Traffic Sources — {domain}

                  <tr>
                    <th>Source / Medium</th>
                    <th className="num">Sessions</th>
                    <th style={{width:110}}>Share</th>
                    <th className="num">Engagement</th>
                    <th className="num">Conversions</th>
                  </tr>

                  {(() => {
                    const total = siteSources.reduce((s,r)=>s+r.sessions,0)||1;
                    return siteSources.map((s,i)=>(
                      <tr key={i}>
                        <td style={{fontWeight:500}}>{s.source_medium||'(direct)'}</td>
                        <td className="num" style={{fontWeight:600}}>{num(s.sessions)}</td>
                        <td style={{padding:'6px 8px'}}>
                          <div style={{display:'flex',alignItems:'center',gap:5}}>

                            </div>
                            <span style={{fontSize:9,color:muted,width:28,textAlign:'right'}}>{Math.round(s.sessions/total*100)}%</span>
                          </div>
                        </td>
                        <td className="num" style={{color:s.engagement_rate>=50?green:amber}}>{pct(s.engagement_rate)}</td>
                        <td className="num" style={{color:s.conversions>0?green:muted,fontWeight:s.conversions>0?600:400}}>{s.conversions||'—'}</td>
                      </tr>
                    ));
                  })()}
                </tbody>
              </table>
            </div>
          )}
        </div>
      </div>
    );
  }

  // Determine which sites have data
  const sitesWithData = properties.length > 0 ? properties
    : [...new Set(allPages.map(p=>p.property_domain).filter(Boolean))];

  // ── Aggregate: cross-site page rollup ──────────────────────────────────────
  const aggregatePages = (() => {
    const map = {};
    allPages.forEach(p => {
      const k = p.page || '/';
      if (!map[k]) map[k] = { page: k, sessions: 0, conversions: 0, _engSum: 0, _bounceSum: 0, sites: new Set() };
      map[k].sessions    += p.sessions;
      map[k].conversions += p.conversions;
      map[k]._engSum     += p.engagement_rate * p.sessions;
      map[k]._bounceSum  += p.bounce_rate     * p.sessions;
      map[k].sites.add(p.property_domain);
    });
    return Object.values(map)
      .map(r => ({
        ...r,
        sites:           [...r.sites].join(', '),
        engagement_rate: r.sessions > 0 ? r._engSum    / r.sessions : 0,
        bounce_rate:     r.sessions > 0 ? r._bounceSum / r.sessions : 0,
      }))
      .sort((a,b) => b.sessions - a.sessions);
  })();

  const aggMaxSessions = Math.max(...aggregatePages.map(p=>p.sessions), 1);

  const subTabStyle = (k) => ({
    fontSize: 11, padding: '4px 14px', borderRadius: 6, border: '1px solid',
    cursor: 'pointer', fontWeight: subTab===k ? 600 : 400,
    background:   subTab===k ? teal   : '#fff',

            <button style={subTabStyle('perpage')}  onClick={()=>setSubTab('perpage')}>Per Page</button>
            <button style={subTabStyle('aggregate')} onClick={()=>setSubTab('aggregate')}>Aggregate</button>
          </div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:6}}>
          {fetched && <span style={{fontSize:9,color:muted}}>Updated {fetched}</span>}
          {/* Site filter pills — only shown on Per Page tab */}
          {subTab==='perpage' && sitesWithData.length > 1 && (
            <div style={{display:'flex',gap:4}}>
              <button onClick={()=>setActiveSite(null)}
                style={{fontSize:10,padding:'3px 10px',borderRadius:12,border:'1px solid',cursor:'pointer',
                  background:activeSite===null?teal:'#fff',
                  color:activeSite===null?'#fff':muted,
                  borderColor:activeSite===null?teal:'var(--border)'}}>All</button>
              {sitesWithData.map(s=>(
                <button key={s} onClick={()=>setActiveSite(s)}
                  style={{fontSize:10,padding:'3px 10px',borderRadius:12,border:'1px solid',cursor:'pointer',
                    background:activeSite===s?teal:'#fff',
                    color:activeSite===s?'#fff':muted,
                    borderColor:activeSite===s?teal:'var(--border)'}}>
                  {s}
                </button>
              ))}
            </div>
          )}
        </div>
      </div>

      {/* ══════════ PER PAGE TAB ══════════ */}
      {subTab==='perpage' && (
        sitesWithData.length === 0 ? (
          <div className="report-section" style={{color:muted,fontSize:11,fontStyle:'italic'}}>
            No page data yet. Click "Refresh GA4 Data" in Admin to pull fresh data.
          </div>
        ) : (
          (activeSite ? [activeSite] : sitesWithData).map(domain => (
            <SiteCard key={domain} domain={domain} />
          ))
        )
      )}

      {/* ══════════ AGGREGATE TAB ══════════ */}
      {subTab==='aggregate' && (
        <div style={{display:'flex',flexDirection:'column',gap:14}}>

          {/* ── All-pages rollup ── */}
          <div className="report-section">
            <div className="report-title" style={{marginBottom:8}}>All Pages — Rolled Up</div>
            {aggregatePages.length === 0 ? (
              <div style={{color:muted,fontSize:11,fontStyle:'italic'}}>No page data yet.</div>
            ) : (
              <table className="report-table">
                <thead>
                  <tr>
                    <th>Page</th>
                    <th className="num">Sessions</th>
                    <th style={{width:100}}>Traffic</th>
                    <th className="num">Engagement</th>
                    <th className="num">Bounce</th>
                    <th className="num">Conversions</th>
                    <th>Site(s)</th>
                  </tr>
                </thead>
                <tbody>
                  {aggregatePages.map((p,i) => (
                    <tr key={i}>
                      <td style={{fontFamily:'monospace',fontSize:10,maxWidth:280,overflow:'hidden',
                                  textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={p.page}>
                        {p.page}
                      </td>
                      <td className="num" style={{fontWeight:600}}>{num(p.sessions)}</td>
                      <td style={{padding:'6px 8px'}}>
                        <Bar val={p.sessions} maxVal={aggMaxSessions} color={teal}/>
                      </td>
                      <td className="num" style={{color:p.engagement_rate>=50?green:amber}}>
                        {pct(p.engagement_rate)}
                      </td>
                      <td className="num" style={{color:p.bounce_rate>60?red:p.bounce_rate>40?amber:green}}>
                        {pct(p.bounce_rate)}
                      </td>
                      <td className="num" style={{color:p.conversions>0?green:muted,fontWeight:p.conversions>0?600:400}}>

                      </td>
                      <td style={{fontSize:9,color:muted}}>{p.sites}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            )}
          </div>

          {/* ── Traffic Sources ── */}
          {allSources.length > 0 && (
            <div className="report-section">
              <div className="report-title" style={{marginBottom:8}}>Traffic Sources — All Sites Combined</div>
              <table className="report-table">
                <thead>
                  <tr>
                    <th>Source / Medium</th>
                    <th className="num">Sessions</th>
                    <th className="num">New Users</th>
                    <th className="num">Engagement</th>
                    <th className="num">Avg Duration</th>
                    <th className="num">Conversions</th>
                    <th style={{width:110}}>Share</th>
                  </tr>
                </thead>
                <tbody>
                  {(() => {
                    const total = allSources.reduce((s,r)=>s+r.sessions,0)||1;
                    return allSources.map((s,i)=>(
                      <tr key={i}>
                        <td style={{fontWeight:500}}>{s.source_medium}</td>
                        <td className="num">{num(s.sessions)}</td>
                        <td className="num">{num(s.new_users)}</td>
                        <td className="num" style={{color:s.engagement_rate>=50?green:amber}}>{pct(s.engagement_rate)}</td>
                        <td className="num">{s.avg_duration}</td>
                        <td className="num" style={{color:s.conversions>0?green:muted,fontWeight:s.conversions>0?600:400}}>{s.conversions}</td>
                        <td style={{padding:'6px 8px'}}>
                          <div style={{display:'flex',alignItems:'center',gap:5}}>
                            <div style={{height:5,borderRadius:3,background:'#e5e7eb',overflow:'hidden',flex:1}}>
                              <div style={{height:'100%',width:`${s.sessions/total*100}%`,background:teal,borderRadius:3}}/>

          {/* ── Leads by campaign (all sites) ── */}
          {allLeads.length > 0 && (
            <div className="report-section">

              <table className="report-table" style={{fontSize:10}}>

                    <th>Site</th>
                    <th>Campaign</th>

                      <td style={{color:muted,maxWidth:110,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}
                          title={l.ad_group}>{l.ad_group||'—'}</td>
                      <td style={{fontStyle:'italic',maxWidth:120,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}

                      <td style={{fontFamily:'monospace',maxWidth:110,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}
                          title={l.landing_page}>{l.landing_page||'/'}</td>
                      <td className="num" style={{color:green,fontWeight:700}}>{l.leads}</td>
                      <td className="num">{num(l.sessions)}</td>

        </div>
      )}

    </div>
  );
}

              <td><span className={'st-status ' + statusClass(r.status)}>{(r.status||'NONE').toUpperCase()}</span></td>

function RecommendationCard({ rec, onQueue, onIgnore, onRefine }) {
  const [refineOpen, setRefineOpen] = React.useState(false);
  const [refineTxt, setRefineTxt]   = React.useState('');
  const [busy, setBusy] = React.useState(null); // 'queue'|'ignore'|'refine'|null
  const [done, setDone] = React.useState(null); // 'queued'|'ignored'|null
  const [err, setErr]   = React.useState('');

  const op = OP_LABELS[rec.operation] || { label: rec.operation, color: '#64748b', icon: '•' };
  const impact = rec.impact_estimate || {};

  if (done === 'queued') return (
    <div style={{padding:'8px 12px',marginBottom:6,borderRadius:6,
      border:'1px solid #a3e635',background:'#f7fee7',
      display:'flex',alignItems:'center',gap:8,fontSize:11}}>
      <span>🟢</span>
      <span style={{fontWeight:600,color:'#365314'}}>{rec.entity_name}</span>
      <span style={{color:'#4d7c0f'}}>— Queued for Push to Google</span>
    </div>
  );
  if (done === 'ignored') return (
    <div style={{padding:'8px 12px',marginBottom:6,borderRadius:6,border:'1px solid var(--border)',
      background:'#fafafa',display:'flex',alignItems:'center',gap:8,fontSize:11,color:'var(--text-muted)'}}>
      <span>🙈</span>
      <span style={{fontWeight:600}}>{rec.entity_name}</span>
      <span>— Ignored</span>
    </div>
  );

  return (
    <div style={{padding:'10px 12px',marginBottom:8,borderRadius:6,
      border:`1px solid ${op.color}33`,background:'#fff',fontSize:12}}>
      {/* Header row */}
      <div style={{display:'flex',alignItems:'flex-start',gap:8,marginBottom:4}}>
        <span style={{fontSize:14}}>{op.icon}</span>
        <div style={{flex:1}}>
          <span style={{fontWeight:700,color:'var(--text-main)',marginRight:6}}>{rec.entity_name}</span>
          <span style={{fontSize:10,padding:'1px 6px',borderRadius:10,background:op.color+'22',
            color:op.color,fontWeight:600}}>{op.label}</span>
          {impact.savings_30d_usd > 0 &&
            <span style={{fontSize:10,marginLeft:6,color:'#16a34a',fontWeight:600}}>
              saves ~${impact.savings_30d_usd}/mo
            </span>}
        </div>
        <div style={{display:'flex',gap:4,flexShrink:0}}>
          <button onClick={async()=>{
            setBusy('queue'); setErr('');
            try {
              await onQueue(rec.action_id);
              setDone('queued');
            } catch(e){ setErr(e.message||'Queue failed'); }
            finally{ setBusy(null); }
          }} disabled={!!busy}
            style={{padding:'3px 10px',fontSize:11,fontWeight:600,borderRadius:4,cursor:'pointer',
              border:'1px solid #65a30d',background:busy==='queue'?'#f7fee7':'#65a30d',
              color:busy==='queue'?'#65a30d':'#fff'}}>
            {busy==='queue'?'Queuing…':'✓ Approve'}
          </button>
          <button onClick={async()=>{
            setBusy('ignore'); setErr('');
            try {
              await onIgnore(rec.action_id);
              setDone('ignored');
            } catch(e){ setErr(e.message||'Ignore failed'); }
            finally{ setBusy(null); }
          }} disabled={!!busy}
            style={{padding:'3px 10px',fontSize:11,borderRadius:4,cursor:'pointer',
              border:'1px solid #94a3b8',background:'#f8fafc',color:'#64748b'}}>
            {busy==='ignore'?'…':'✕ Ignore'}
          </button>
          <button onClick={()=>setRefineOpen(o=>!o)}
            title="Give feedback to the AI about this recommendation"
            style={{padding:'3px 8px',fontSize:11,borderRadius:4,cursor:'pointer',
              border:'1px solid #e2e8f0',background:refineOpen?'#f1f5f9':'#fff',color:'#475569'}}>
            ✏️ Refine
          </button>
        </div>
      </div>

      {/* Rationale */}
      <div style={{fontSize:11,color:'var(--text-muted)',marginBottom:rec.user_feedback?4:0,paddingLeft:22}}>
        {rec.reason}
      </div>

      {/* Existing user feedback badge */}
      {rec.user_feedback && (
        <div style={{paddingLeft:22,marginTop:3,fontSize:10,color:'#7c3aed',fontStyle:'italic'}}>
          💬 Your note: {rec.user_feedback}
        </div>
      )}

      {/* Refine input */}
      {refineOpen && (
        <div style={{paddingLeft:22,marginTop:8,display:'flex',gap:6}}>
          <input value={refineTxt} onChange={e=>setRefineTxt(e.target.value)}
            placeholder="e.g. 'This keyword drives implant calls, don't pause it'"
            style={{flex:1,padding:'4px 8px',fontSize:11,border:'1px solid var(--border)',borderRadius:4}}
            onKeyDown={async e=>{
              if(e.key==='Enter' && refineTxt.trim()){
                setBusy('refine'); setErr('');
                try{
                  await onRefine(rec.action_id, refineTxt.trim());
                  setRefineOpen(false); setRefineTxt('');
                } catch(er){ setErr(er.message||'Refine failed'); }
                finally{ setBusy(null); }
              }
            }} />
          <button onClick={async()=>{
            if(!refineTxt.trim()) return;
            setBusy('refine'); setErr('');
            try{
              await onRefine(rec.action_id, refineTxt.trim());
              setRefineOpen(false); setRefineTxt('');
            } catch(er){ setErr(er.message||'Refine failed'); }
            finally{ setBusy(null); }
          }} disabled={!refineTxt.trim()||busy==='refine'}
            style={{padding:'4px 10px',fontSize:11,borderRadius:4,cursor:'pointer',
              border:'1px solid #7c3aed',background:'#7c3aed',color:'#fff'}}>
            {busy==='refine'?'Saving…':'Save'}
          </button>
        </div>
      )}

      {err && <div style={{paddingLeft:22,marginTop:4,fontSize:10,color:'#dc2626'}}>{err}</div>}
    </div>
  );
}

function OptimizationTab({ campaign }) {
  const campName = campaign?.campaign || '';
  // If a specific campaign is given, also show account-wide recs for full picture
  const showAllCampaigns = true; // always fetch account-level

  const [recs, setRecs]               = React.useState(null);
  const [accountImpact, setAccImpact] = React.useState(null);
  const [queued, setQueued]           = React.useState([]);
  const [loading, setLoading]         = React.useState(true);
  const [pushBusy, setPushBusy]       = React.useState(false);
  const [pushResult, setPushResult]   = React.useState(null);
  const [selected, setSelected]       = React.useState(new Set());
  const [bulkBusy, setBulkBusy]       = React.useState(false);
  const [bulkMsg, setBulkMsg]         = React.useState('');
  const [showHistory, setShowHistory] = React.useState(false);

  // Always fetch ALL campaigns — account-level view
  const loadRecs = React.useCallback(async () => {
    setLoading(true);
    try {
      const d = await api(`/api/admin/optimizer/account/recommendations?status=all&limit=500`);
      setRecs(d);
    } catch(e) { console.error('Opt recs load error', e); }
    finally { setLoading(false); }
  }, []);

  const loadQueued = React.useCallback(async () => {
    try {
      const d = await api(`/api/admin/gads/queued`);
      setQueued(d.queued || []);
    } catch(e) { console.error('Queued load error', e); }
  }, []);

  const loadImpact = React.useCallback(async () => {
    try {
      const d = await api(`/api/admin/optimizer/account/impact?days=90`);
      setAccImpact(d);
    } catch(e) { console.error('Impact load error', e); }
  }, []);

  React.useEffect(() => { loadRecs(); loadQueued(); loadImpact(); }, [loadRecs, loadQueued, loadImpact]);

  // Approve = queue (hold until Push to Google)
  const handleQueue = async (actionId) => {
    await api(`/api/admin/gads/queue/${actionId}`, {method:'POST'});
    await loadQueued();
    await loadRecs();
  };

  const handleIgnore = async (actionId) => {
    await api(`/api/admin/gads/reject/${actionId}`, {method:'POST', body:JSON.stringify({reason:''})});
    await loadRecs();
  };

  const handleRefine = async (actionId, feedback) => {
    await api(`/api/admin/gads/refine/${actionId}`, {method:'POST', body:JSON.stringify({feedback})});
    await loadRecs();
  };

  const handleUnqueue = async (actionId) => {
    await api(`/api/admin/gads/unqueue/${actionId}`, {method:'POST'});
    await loadQueued();
    await loadRecs();
  };

  // Bulk approve → queue all selected
  const handleBulkQueue = async () => {
    const ids = [...selected];
    if (!ids.length) return;
    setBulkBusy(true); setBulkMsg('');
    try {
      let ok = 0, fail = 0;
      for (const id of ids) {
        try { await api(`/api/admin/gads/queue/${id}`, {method:'POST'}); ok++; }
        catch(e) { fail++; }
      }
      setBulkMsg(`✓ ${ok} queued${fail > 0 ? `, ${fail} failed` : ''}`);
      setSelected(new Set());
      await loadQueued();
      await loadRecs();
    } catch(e) { setBulkMsg('✗ ' + (e.message||'Bulk queue failed')); }
    finally { setBulkBusy(false); }
  };

  // Push all queued → Google Ads
  const handlePushToGoogle = async () => {
    setPushBusy(true); setPushResult(null);
    try {
      const r = await api(`/api/admin/gads/push-queued`, {method:'POST'});
      setPushResult(r);
      await loadQueued();
      await loadRecs();
      await loadImpact();
    } catch(e) { setPushResult({error: e.message||'Push failed'}); }
    finally { setPushBusy(false); }
  };

  // What "Push" actually does for each operation type
  const OP_EFFECT = {
    add_negative_keyword: { live: true,  note: 'Adds negative keyword to campaign.' },
    add_exact_keyword:    { live: true,  note: 'Adds keyword as exact match to ad group.' },
    pause_keyword:        { live: true,  note: 'Pauses this keyword.' },
    enable_keyword:       { live: true,  note: 'Re-enables a paused keyword.' },
    increase_bid:         { live: true,  note: 'Raises max CPC bid.' },
    decrease_bid:         { live: true,  note: 'Lowers max CPC bid.' },
    tighten_match_type:   { live: true,  note: 'Adds exact match, pauses broad match.' },
    ad_copy_suggestion:   { live: true,  note: 'Updates RSA via API (needs ad_resource).' },
    geo_exclusion:        { live: true,  note: 'Adds negative geo target to campaign.' },
    change_budget:        { live: true,  note: 'Updates daily budget (max +25%, $5–$500).' },
    claude_advisory:      { live: false, note: 'Advisory — acknowledged only, no API call.' },
  };

  // Flatten all recs — then filter to this campaign if we're inside a campaign card
  // campName is empty when opened from the standalone Admin optimizer view (shows all)
  const campLower = (campName || '').trim().toLowerCase();
  const allRecs    = Object.values(recs?.recommendations||{}).flat();
  const matchesCamp = r => {
    if (!campLower) return true; // account-level view — show everything
    const rCamp = (r.campaign_name || '').trim().toLowerCase();
    return rCamp === campLower || rCamp === '' || !rCamp; // show recs for this campaign + unattributed
  };
  const pending    = allRecs.filter(r => r.execution_result === 'pending_approval' && matchesCamp(r));
  const applied    = allRecs.filter(r => r.execution_result === 'success'          && matchesCamp(r));
  const ignored    = allRecs.filter(r => r.execution_result === 'rejected'         && matchesCamp(r));

  function CampBadge({ name }) {
    if (!name) return <span style={{fontSize:9,background:'#f3f4f6',color:'#6b7280',padding:'1px 6px',borderRadius:3}}>Account</span>;
    return <span style={{fontSize:9,background:'#eff6ff',color:'#1d4ed8',padding:'1px 6px',borderRadius:3,fontWeight:600,maxWidth:140,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{name}</span>;
  }

  function EffectBadge({ op }) {
    const e = OP_EFFECT[op] || { live: false, note: 'No API call.' };
    return (
      <span style={{fontSize:9,padding:'1px 6px',borderRadius:3,fontWeight:600,
        background: e.live ? '#f0fdf4' : '#fef9c3',
        color: e.live ? '#166534' : '#854d0e',
        border: `1px solid ${e.live ? '#bbf7d0' : '#fde68a'}`}}>
        {e.live ? '⚡' : 'ℹ️'} {e.note}
      </span>
    );
  }

  function AppliedBadge({ rec }) {
    // api_executed: 1 = actually hit Google Ads API; 0 = acknowledged only
    const hit = rec.api_executed == 1 || rec.api_executed === true;
    return (
      <span style={{fontSize:10,fontWeight:700,padding:'1px 7px',borderRadius:10,
        background: hit ? '#dcfce7' : '#fef9c3',
        color:      hit ? '#15803d' : '#92400e',
        border:     `1px solid ${hit ? '#86efac' : '#fde68a'}`}}>
        {hit ? '⚡ Pushed to Google' : '📋 Acknowledged'}
      </span>
    );
  }

  function RecRow({ rec, showActions }) {
    return (
      <div style={{marginBottom:8, opacity: rec.execution_result==='rejected' ? 0.65 : 1}}>
        <div style={{display:'flex',alignItems:'center',gap:5,marginBottom:3,flexWrap:'wrap'}}>
          <CampBadge name={rec.campaign_name} />
          <EffectBadge op={rec.operation} />
        </div>
        {showActions
          ? <RecommendationCard rec={rec} onQueue={handleQueue} onIgnore={handleIgnore} onRefine={handleRefine} />
          : <div style={{padding:'7px 10px',borderRadius:6,border:'1px solid var(--border)',
              background: rec.execution_result==='success'?'#f0fdf4': rec.execution_result==='queued'?'#f7fee7':'#fafafa',
              fontSize:11,display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
              <span>{(OP_LABELS[rec.operation]?.icon)||'•'}</span>
              <span style={{fontWeight:600,maxWidth:180,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{rec.entity_name}</span>
              <span style={{color:'var(--text-muted)',fontSize:10}}>{OP_LABELS[rec.operation]?.label||rec.operation}</span>
              <span style={{marginLeft:'auto',display:'flex',gap:6,alignItems:'center'}}>
                {rec.execution_result==='success' && <AppliedBadge rec={rec} />}
                {rec.execution_result==='queued' && <span style={{fontSize:10,fontWeight:700,color:'#4d7c0f'}}>🟢 Queued</span>}
                {rec.execution_result==='rejected' && <span style={{fontSize:10,color:'#94a3b8'}}>❌ Ignored</span>}
                <span style={{fontSize:9,color:'var(--text-muted)'}}>{(rec.approved_at||rec.updated_at||'').slice(0,10)}</span>
              </span>
            </div>
        }
      </div>
    );
  }

  // Account impact breakdown
  function AccountImpactPanel() {
    if (!accountImpact) return null;
    const ai = accountImpact;
    const verdicts = ai.verdicts || {};
    return (
      <div style={{marginBottom:14,padding:'10px 14px',background:'#f8fafc',
        borderRadius:8,border:'1px solid var(--border)',fontSize:11}}>
        <div style={{fontWeight:700,fontSize:12,marginBottom:8,color:'var(--text-main)'}}>
          📊 Account-Level Impact (last 90d)
        </div>
        {/* Totals row */}
        <div style={{display:'flex',gap:16,marginBottom:10,flexWrap:'wrap'}}>
          <span><b>{ai.total_applied||0}</b> actions applied</span>
          <span style={{color:'#16a34a'}}><b>{ai.total_api_pushed||0}</b> ⚡ pushed to Google</span>
          <span style={{color:'#92400e'}}><b>{ai.total_acknowledged_only||0}</b> 📋 acknowledged only</span>
          {verdicts.improved > 0 && <span style={{color:'#16a34a'}}>✅ {verdicts.improved} improved</span>}
          {verdicts.neutral > 0 && <span style={{color:'#d97706'}}>➖ {verdicts.neutral} neutral</span>}
          {verdicts.degraded > 0 && <span style={{color:'#dc2626'}}>⚠️ {verdicts.degraded} degraded</span>}
        </div>
        {/* Per-campaign breakdown */}
        {(ai.by_campaign||[]).length > 0 && (
          <div>
            <div style={{fontSize:10,fontWeight:600,color:'var(--text-muted)',marginBottom:5,textTransform:'uppercase',letterSpacing:'.04em'}}>By Campaign</div>
            <div style={{display:'flex',flexDirection:'column',gap:3}}>
              {(ai.by_campaign||[]).slice(0,8).map(c=>(
                <div key={c.campaign_name} style={{display:'flex',alignItems:'center',gap:8,fontSize:11}}>
                  <span style={{flex:1,fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{c.campaign_name}</span>
                  <span style={{color:'#64748b'}}>{c.applied} applied</span>
                  <span style={{color:'#16a34a'}}>{c.api_pushed} ⚡</span>
                  <span style={{color:'#94a3b8',fontSize:9}}>{(c.last_action||'').slice(0,10)}</span>
                </div>
              ))}
            </div>
          </div>
        )}
        {/* Per-operation breakdown */}
        {(ai.by_operation||[]).length > 0 && (
          <div style={{marginTop:8,paddingTop:8,borderTop:'1px solid var(--border)'}}>
            <div style={{fontSize:10,fontWeight:600,color:'var(--text-muted)',marginBottom:5,textTransform:'uppercase',letterSpacing:'.04em'}}>By Action Type</div>
            <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
              {(ai.by_operation||[]).map(o=>(
                <span key={o.operation} style={{fontSize:10,padding:'2px 8px',borderRadius:10,
                  background:'#f1f5f9',border:'1px solid var(--border)',color:'#475569'}}>
                  {OP_LABELS[o.operation]?.icon||'•'} {OP_LABELS[o.operation]?.label||o.operation}: <b>{o.total}</b>
                  {o.api_pushed > 0 ? ` (${o.api_pushed} ⚡)` : ''}
                </span>
              ))}
            </div>
          </div>
        )}
      </div>
    );
  }

  return (
    <div style={{padding:'4px 0'}}>

      {/* ── Account Impact Panel ── */}
      <AccountImpactPanel />

      {/* ── Queued / Push to Google Panel ── always shows account total, push pushes ALL ── */}
      {queued.length > 0 && (
        <div style={{marginBottom:14,padding:'10px 14px',background:'#f0fdf4',
          borderRadius:8,border:'2px solid #86efac'}}>
          <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:8,flexWrap:'wrap'}}>
            <span style={{fontWeight:700,fontSize:12,color:'#14532d'}}>
              🟢 {queued.length} change{queued.length!==1?'s':''} queued across all campaigns
            </span>
            {campLower && queued.filter(q=>(q.campaign_name||'').toLowerCase()===campLower).length > 0 &&
              <span style={{fontSize:11,color:'#4d7c0f'}}>
                ({queued.filter(q=>(q.campaign_name||'').toLowerCase()===campLower).length} for this campaign)
              </span>
            }
            <button onClick={handlePushToGoogle} disabled={pushBusy}
              style={{padding:'5px 18px',fontSize:12,fontWeight:700,borderRadius:6,cursor:'pointer',
                border:'2px solid #15803d',
                background:pushBusy?'#dcfce7':'#15803d',
                color:pushBusy?'#15803d':'#fff',marginLeft:'auto'}}>
              {pushBusy ? '⏳ Pushing…' : '🚀 Push All to Google Ads'}
            </button>
          </div>
          {/* Queued list — show all campaigns' items, highlight current campaign */}
          <div style={{display:'flex',flexDirection:'column',gap:4}}>
            {queued.map(q=>{
              const op = OP_LABELS[q.operation]||{icon:'•',label:q.operation};
              const e = OP_EFFECT[q.operation]||{live:false};
              const isCurrent = campLower && (q.campaign_name||'').toLowerCase() === campLower;
              return (
                <div key={q.action_id} style={{display:'flex',alignItems:'center',gap:8,
                  padding:'5px 8px',borderRadius:5,fontSize:11,
                  background: isCurrent ? '#f0fdf4' : '#fff',
                  border:`1px solid ${isCurrent ? '#86efac' : '#d1fae5'}`}}>
                  <span>{op.icon}</span>
                  <span style={{fontWeight:600,flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{q.entity_name}</span>
                  <span style={{fontSize:9,color:'#64748b'}}>{op.label}</span>
                  {q.campaign_name && <CampBadge name={q.campaign_name} />}
                  <span style={{fontSize:9,color: e.live?'#16a34a':'#92400e'}}>{e.live?'⚡ API':'📋 Ack'}</span>
                  <button onClick={()=>handleUnqueue(q.action_id)}
                    title="Move back to pending"
                    style={{fontSize:9,padding:'1px 6px',borderRadius:3,cursor:'pointer',
                      border:'1px solid #fca5a5',background:'#fff',color:'#dc2626'}}>
                    ✕
                  </button>
                </div>
              );
            })}
          </div>
          {/* Push result */}
          {pushResult && !pushResult.error && (
            <div style={{marginTop:8,fontSize:11,padding:'6px 10px',borderRadius:5,
              background:'#dcfce7',border:'1px solid #86efac',color:'#14532d'}}>
              ✅ Pushed: <b>{pushResult.summary?.pushed_to_google||0} to Google Ads</b>
              {pushResult.summary?.acknowledged_only > 0 && `, ${pushResult.summary.acknowledged_only} acknowledged`}
              {pushResult.summary?.error > 0 && <span style={{color:'#dc2626'}}>, {pushResult.summary.error} failed</span>}
            </div>
          )}
          {pushResult?.error && (
            <div style={{marginTop:8,fontSize:11,padding:'6px 10px',borderRadius:5,
              background:'#fee2e2',border:'1px solid #fca5a5',color:'#991b1b'}}>
              ✗ {pushResult.error}
            </div>
          )}
        </div>
      )}

      {/* ── Bulk approve toolbar ── */}
      {pending.length > 1 && (
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10,padding:'6px 10px',
          background:'#f0f9ff',borderRadius:5,border:'1px solid #bae6fd',fontSize:11}}>
          <input type="checkbox"
            checked={selected.size === pending.length}
            onChange={e=>setSelected(e.target.checked ? new Set(pending.map(r=>r.action_id)) : new Set())} />
          <span style={{color:'#0369a1'}}>{selected.size ? `${selected.size} selected` : `Select all ${pending.length} pending`}</span>
          {selected.size > 0 && (
            <button onClick={handleBulkQueue} disabled={bulkBusy}
              style={{padding:'3px 12px',fontSize:11,fontWeight:600,borderRadius:4,cursor:'pointer',
                border:'1px solid #65a30d',background:bulkBusy?'#f7fee7':'#65a30d',
                color:bulkBusy?'#65a30d':'#fff',marginLeft:4}}>
              {bulkBusy?'Queueing…':`✓ Approve ${selected.size} → Queue`}
            </button>
          )}
          {bulkMsg && <span style={{color:bulkMsg.startsWith('✓')?'#16a34a':'#dc2626'}}>{bulkMsg}</span>}
        </div>
      )}

      {loading ? (
        <div style={{padding:'16px',textAlign:'center',color:'var(--text-muted)',fontSize:11}}>Loading…</div>
      ) : (
        <>
          {/* ── Pending ── */}
          {pending.length > 0 && (
            <div style={{marginBottom:16}}>
              <div style={{fontSize:10,fontWeight:700,color:'var(--text-muted)',textTransform:'uppercase',
                letterSpacing:'.05em',marginBottom:8}}>
                Pending — {pending.length} recommendation{pending.length!==1?'s':''}
              </div>
              {pending.map(rec=>(
                <div key={rec.action_id} style={{display:'flex',alignItems:'flex-start',gap:6}}>
                  {pending.length > 1 && (
                    <input type="checkbox" style={{marginTop:14}}
                      checked={selected.has(rec.action_id)}
                      onChange={e=>{const s=new Set(selected);e.target.checked?s.add(rec.action_id):s.delete(rec.action_id);setSelected(s);}} />
                  )}
                  <div style={{flex:1}}><RecRow rec={rec} showActions={true} /></div>
                </div>
              ))}
            </div>
          )}

          {pending.length === 0 && applied.length === 0 && ignored.length === 0 && queued.length === 0 && (
            <div style={{padding:'24px',textAlign:'center',color:'var(--text-muted)',fontSize:11}}>
              No recommendations yet across any campaign.<br/>
              <span style={{fontSize:10}}>Run the optimizer (Dashboard → AI Optimizer → Run Now) to generate new ones.</span>
            </div>
          )}

          {/* ── Applied / Ignored history toggle ── */}
          {(applied.length > 0 || ignored.length > 0) && (
            <div>
              <button onClick={()=>setShowHistory(h=>!h)}
                style={{fontSize:10,fontWeight:600,color:'var(--text-muted)',background:'none',border:'none',
                  cursor:'pointer',textTransform:'uppercase',letterSpacing:'.05em',marginBottom:8}}>
                {showHistory ? '▾' : '▸'} History — {applied.length} applied, {ignored.length} ignored
              </button>

              {showHistory && (
                <>
                  {/* ── Applied history ── */}
                  {applied.length > 0 && (
                    <div style={{marginBottom:12}}>
                      <div style={{fontSize:10,fontWeight:600,color:'#64748b',textTransform:'uppercase',
                        letterSpacing:'.04em',marginBottom:6}}>Applied — {applied.length}</div>
                      {applied.map(rec=><RecRow key={rec.action_id} rec={rec} showActions={false} />)}
                    </div>
                  )}
                  {/* ── Ignored history ── */}
                  {ignored.length > 0 && (
                    <div>
                      <div style={{fontSize:10,fontWeight:600,color:'#64748b',textTransform:'uppercase',
                        letterSpacing:'.04em',marginBottom:6}}>Ignored — {ignored.length}</div>
                      {ignored.map(rec=><RecRow key={rec.action_id} rec={rec} showActions={false} />)}
                    </div>
                  )}
                </>
              )}
            </div>
          )}
        </>
      )}
    </div>
  );
}

function CampaignExpandedPanel({ campaign, keywordStats, ga4Data, dailyStats, colSpan }) {
  const [panelTab, setPanelTab] = useState('analytics');
  const campName = (campaign.campaign||'').toLowerCase();

  // Filter keywords for this campaign
  const campKeywords = keywordStats.filter(k =>
    (k.campaign_name||'').toLowerCase() === campName ||
    (k.campaign_name||'').toLowerCase().includes(campName.replace(/^grafton_nxtsmile_/,''))
  );

  // GA4 data
  const ov = ga4Data?.overview || {};
  const ev = ga4Data?.events || {};
  const sources = (ga4Data?.traffic_sources || []).filter(s =>
    s.source_medium && s.source_medium.toLowerCase().includes('google')
  );
  const hasGa4 = ov.configured === true && !ov.error && !ov.no_data;

  // Treatment acceptance rate: presented vs accepted
  const presented = campaign.treatment_presented_count || 0;
  const accepted = campaign.treatment_accepted_count || 0;
  const txAcceptPct = presented > 0 ? Math.round(accepted / presented * 100) : null;

  return (

          {/* ── Keywords tab ── */}

                      <th className="num">CPL</th>
                      <th className="num">Scheduled</th>
                      <th className="num">Treated</th>
                      <th className="num">Revenue</th>

                      const isRaw = k.impression_share || 0;
                      const isPct = isRaw > 0 ? Math.round(isRaw * 100) : 0;
                      const isColor = isPct === 0 ? '#94a3b8' : isPct >= 60 ? '#16a34a' : isPct >= 30 ? '#d97706' : '#dc2626';

                      <tr key={i} style={{opacity:(!k.lead_count&&!k.total_cost)?0.55:1}}>

                        <td className="num">{(k.gads_clicks||0).toLocaleString()}</td>
                        <td className="num">{fmtMoney(k.total_cost||0)}</td>
                        <td className="num">{k.lead_count||0}</td>
                        <td className="num">{k.cpl ? '$'+Number(k.cpl).toFixed(0) : '—'}</td>
                        <td className="num">{k.scheduled_count||0}</td>
                        <td className="num">{k.treated_count||0}</td>

      </td>
    </tr>
  );
}

function AdCreativesView({ days }) {
  const [ads, setAds] = useState([]);
  const [loading, setLoading] = useState(true);
  const [expanded, setExpanded] = useState(null); // ad_id

  useEffect(() => {
    setLoading(true);
    api(`/api/admin/gads/ads?days=${days}`)
      .then(r => setAds(r.ads || []))
      .catch(() => setAds([]))
      .finally(() => setLoading(false));
  }, [days]);

  if (loading) return <div style={{padding:24,textAlign:'center',color:'var(--text-muted)',fontSize:12}}>Loading ad creatives…</div>;
  if (!ads.length) return <div style={{padding:24,textAlign:'center',color:'var(--text-muted)',fontSize:12}}>No ad creatives found. Run Google Ads Sync to populate data.</div>;

  function statusColor(s) {
    if (!s) return '#6b7280';
    const u = s.toUpperCase();
    if (u === 'ENABLED') return '#16a34a';
    if (u === 'PAUSED')  return '#f59e0b';
    if (u === 'REMOVED') return '#dc2626';
    return '#6b7280';
  }

  function fmtPct(n) { return n == null ? '—' : n.toFixed(1) + '%'; }
  function fmtMoney(n) { return n == null ? '—' : '$' + n.toFixed(2); }
  function fmtNum(n)  { return n == null || n === 0 ? '—' : n.toLocaleString(); }

  return (
    <div className="report-section">
      <div className="report-title">Ad Creatives</div>
      <table className="report-table">
        <thead>
          <tr>
            <th>Ad</th>
            <th>Campaign</th>
            <th>Ad Group</th>
            <th>Status</th>
            <th className="num">Impr</th>
            <th className="num">Clicks</th>
            <th className="num">CTR</th>
            <th className="num">Cost</th>
            <th className="num">Leads</th>
            <th className="num">CPL</th>
            <th style={{width:60}}></th>
          </tr>
        </thead>
        <tbody>
          {ads.map(ad => {
            const isOpen = expanded === ad.ad_id;
            const assets = ad.assets_json || {};
            const headlines = assets.headlines || [];
            const descriptions = assets.descriptions || [];
            // ETA fallback fields
            const h1 = ad.headline_1 || '';
            const h2 = ad.headline_2 || '';
            const h3 = ad.headline_3 || '';
            const d1 = ad.description_1 || '';
            const d2 = ad.description_2 || '';

            return (
              <React.Fragment key={ad.ad_id}>
                <tr>
                  <td style={{fontWeight:600,maxWidth:140,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={ad.ad_name||ad.ad_id}>
                    {ad.ad_name || ad.ad_id}
                  </td>
                  <td style={{maxWidth:120,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={ad.campaign_name}>
                    {(ad.campaign_name||'').replace(/^grafton_nxtsmile_/,'')||'—'}
                  </td>
                  <td style={{maxWidth:120,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={ad.ad_group_name}>
                    {ad.ad_group_name||'—'}
                  </td>
                  <td>
                    <span style={{fontSize:10,fontWeight:600,color:statusColor(ad.status),
                                  background:statusColor(ad.status)+'22',padding:'1px 5px',borderRadius:3}}>
                      {ad.status||'—'}
                    </span>
                  </td>
                  <td className="num">{fmtNum(ad.impressions)}</td>
                  <td className="num">{fmtNum(ad.clicks)}</td>
                  <td className="num">{fmtPct(ad.ctr)}</td>
                  <td className="num">{fmtMoney(ad.cost)}</td>
                  <td className="num">{fmtNum(ad.leads)}</td>
                  <td className="num">{fmtMoney(ad.cpl)}</td>
                  <td style={{textAlign:'center'}}>
                    <button className="btn btn-ghost btn-sm" onClick={() => setExpanded(isOpen ? null : ad.ad_id)}>

                  </td>
                </tr>
                {isOpen && (

                      {headlines.length > 0 && (

                              </span>
                            ))}

                        </div>
                      )}
