                                onChange={e=>setCampEditFields(f=>({...f,monthly_budget: dailyToMonthly(parseFloat(e.target.value)||0)}))}
                                style={{fontSize:11,background:'rgba(255,255,255,.1)',border:'1px solid rgba(255,255,255,.3)',
                                  color:'#fff',borderRadius:4,padding:'3px 7px',width:110}}
                                placeholder="Daily budget"
                                title="Daily budget — Google Ads bills daily"/>
                              <input value={campEditFields.start_date ?? (camp.start_date||'')}
                                onChange={e=>setCampEditFields(f=>({...f,start_date:e.target.value}))}
                                style={{fontSize:11,background:'rgba(255,255,255,.1)',border:'1px solid rgba(255,255,255,.3)',
                                  color:'#fff',borderRadius:4,padding:'3px 7px',width:110}}
                                placeholder="Start date"/>
                              <input value={campEditFields.end_date ?? (camp.end_date||'')}
                                onChange={e=>setCampEditFields(f=>({...f,end_date:e.target.value}))}
                                style={{fontSize:11,background:'rgba(255,255,255,.1)',border:'1px solid rgba(255,255,255,.3)',
                                  color:'#fff',borderRadius:4,padding:'3px 7px',width:110}}
                                placeholder="End date"/>
                            </div>
                            <div style={{display:'flex',gap:6,alignItems:'center',marginTop:2}}>
                              <input value={campEditFields.landing_page ?? (camp.landing_page||'')}
                                onChange={e=>setCampEditFields(f=>({...f,landing_page:e.target.value}))}
                                style={{fontSize:11,background:'rgba(255,255,255,.1)',border:'1px solid rgba(255,255,255,.3)',
                                  color:'#fff',borderRadius:4,padding:'3px 7px',flex:1,minWidth:0}}
                                placeholder="Landing page URL (https://...)"/>
                              <span style={{fontSize:10,color:'rgba(255,255,255,.55)',whiteSpace:'nowrap'}}>
                                {camp.gads_campaign_resource ? '↗ pushes to Google Ads ads' : 'local only'}
                              </span>
                            </div>
                          </div>
                        ) : (
                          <>
                            <div style={{fontSize:17,fontWeight:700,lineHeight:1.2,marginBottom:4}}>{camp.campaign_name}</div>
                            <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
                              <span style={{fontSize:10,background:'rgba(255,255,255,.15)',padding:'2px 8px',borderRadius:3}}>
                                {camp.campaign_type}
                              </span>
                              <span style={{fontSize:10,background:statusColor,padding:'2px 8px',borderRadius:3,fontWeight:700}}>
                                {camp.status}
                              </span>
                              {camp.service_focus && (
                                <span style={{fontSize:10,color:'rgba(255,255,255,.75)'}}>
                                  Service: {camp.service_focus}
                                </span>
                              )}
                              {camp.monthly_budget > 0 && (
                                <span style={{fontSize:10,color:'#5eead4',fontWeight:600}}>
                                  {fmtDailyBudget(camp.monthly_budget)}
                                </span>
                              )}
                              {camp.status === 'SCHEDULED' && camp.launch_date && (
                                <span style={{fontSize:11,color:'rgba(255,255,255,.7)',marginLeft:6}}>
                                  Scheduled: {new Date(camp.launch_date).toLocaleDateString()}
                                </span>
                              )}
                            </div>
                          </>
                        )}
                      </div>
                      <div style={{display:'flex',gap:4,flexShrink:0}}>
                        {campEditMode ? (
                          <>
                            <button style={{background:'#059669',border:'none',color:'#fff',fontSize:11,
                              padding:'4px 10px',borderRadius:4,cursor:'pointer'}}
                              disabled={campEditSaving}
                              onClick={async()=>{
                                setCampEditSaving(true);
                                try {
                                  const r = await api(`/api/admin/campaigns/${camp.campaign_id}`,{
                                    method:'PATCH',
                                    body:JSON.stringify(campEditFields)
                                  });
                                  await openCampaignDetail(camp.campaign_id, campDetailDays);
                                  setCampEditMode(false); setCampEditFields({});
                                  // Show Google Ads push result
                                  const pushed = r?.gads_pushed || [];
                                  const errors = r?.gads_errors || [];
                                  if (pushed.length > 0 || errors.length > 0) {
                                    const msgs = [];
                                    if (pushed.length) msgs.push('✓ Pushed to Google Ads: ' + pushed.join(', '));
                                    if (errors.length) msgs.push('⚠ Push errors: ' + errors.join('; '));
                                    alert(msgs.join('\n'));
                                  }
                                } catch(e){alert('Save failed: '+e.message);}
                                finally{setCampEditSaving(false);}
                              }}>{campEditSaving?'Saving…':'✓ Save'}</button>
                            <button style={{background:'rgba(255,255,255,.15)',border:'none',color:'#fff',fontSize:11,
                              padding:'4px 10px',borderRadius:4,cursor:'pointer'}}
                              onClick={()=>{setCampEditMode(false);setCampEditFields({});}}>Cancel</button>
                          </>
                        ) : (
                          <button style={{background:'rgba(255,255,255,.12)',border:'1px solid rgba(255,255,255,.3)',color:'#fff',
                            fontSize:10,padding:'3px 8px',borderRadius:4,cursor:'pointer'}}
                            onClick={()=>setCampEditMode(true)}>✏ Edit</button>
                        )}
                        <button style={{background:'rgba(255,255,255,.15)',border:'none',color:'#fff',
                          width:28,height:28,borderRadius:5,cursor:'pointer',fontSize:16}}
                          onClick={()=>setCampDetail(null)}>×</button>
                      </div>
                    </div>

                    {/* Action buttons */}
                    <div style={{display:'flex',gap:6,marginTop:12,flexWrap:'wrap'}}>
                      {camp.status === 'ACTIVE' && (
                        <button className="btn btn-sm" disabled={isLoading}
                          style={{fontSize:10,background:'rgba(255,255,255,.15)',color:'#fff',border:'1px solid rgba(255,255,255,.3)'}}
                          onClick={async()=>{await campaignAction(camp.campaign_id,'pause');openCampaignDetail(camp.campaign_id);}}>
                          {loading==='pause'?'…':'⏸ Pause'}
                        </button>
                      )}
                      {camp.status === 'PAUSED' && (
                        <button className="btn btn-sm" disabled={isLoading}
                          style={{fontSize:10,background:'#059669',color:'#fff',border:'none'}}
                          onClick={async()=>{await campaignAction(camp.campaign_id,'resume');openCampaignDetail(camp.campaign_id);}}>
                          {loading==='resume'?'…':'▶ Enable'}
                        </button>
                      )}
                      {(camp.status === 'ACTIVE' || camp.status === 'PAUSED') && (
                        <button className="btn btn-sm" disabled={isLoading}
                          style={{fontSize:10,background:'rgba(239,68,68,.8)',color:'#fff',border:'none'}}
                          onClick={()=>setStopConfirm(camp)}>
                          {loading==='stop'?'…':'⏹ Stop'}
                        </button>
                      )}
                      {/* Sync buttons — only for GAds-linked campaigns */}
                      {camp.gads_campaign_resource && (<>
                        {/* ↓ Sync FROM Google Ads → app */}
                        <button className="btn btn-sm" disabled={!!syncingFromGads[camp.campaign_id]}
                          title="Pull latest budget, status, keywords and ads from Google Ads into the dashboard"
                          style={{fontSize:10,background:'rgba(255,255,255,.15)',color:'#fff',
                            border:'1px solid rgba(255,255,255,.35)',display:'flex',alignItems:'center',gap:4}}
                          onClick={async()=>{
                            setSyncingFromGads(s=>({...s,[camp.campaign_id]:true}));
                            try {
                              const r = await api(`/api/admin/campaigns/${camp.campaign_id}/sync-from-gads`,{method:'POST'});
                              await openCampaignDetail(camp.campaign_id, campDetailDays);
                              const synced = r?.synced_fields || {};
                              // Show landing page discrepancy banner if detected
                              if (r?.landing_page_discrepancy) {
                                setLpDiscrepancy(s=>({...s,[camp.campaign_id]: r.landing_page_discrepancy}));
                              } else {
                                setLpDiscrepancy(s=>({...s,[camp.campaign_id]: null}));
                              }
                              const parts = [];
                              if (synced.monthly_budget != null) parts.push(`Budget → $${(synced.monthly_budget/30.4).toFixed(2)}/day`);
                              if (synced.status) parts.push(`Status → ${synced.status}`);
                              if (synced.landing_page) parts.push(`Landing page seeded from Google Ads`);
                              if (parts.length) alert('↓ Pulled from Google Ads:\n' + parts.join('\n'));
                            } catch(e){
                              alert('Sync failed: '+(e?.detail||e?.message));
                            } finally {
                              setSyncingFromGads(s=>({...s,[camp.campaign_id]:false}));
                            }
                          }}>
                          {syncingFromGads[camp.campaign_id]
                            ? <><span className="spinner" style={{width:10,height:10,borderWidth:1.5,display:'inline-block'}}/> Pulling…</>
                            : '↓ Pull from GAds'
                          }
                        </button>

                        {/* ↑ Sync TO Google Ads ← app */}
                        <button className="btn btn-sm" disabled={!!syncingToGads[camp.campaign_id]}
                          title="Push budget, status, and landing page from the dashboard to Google Ads, then verify"
                          style={{fontSize:10,background:'rgba(16,185,129,.25)',color:'#6ee7b7',
                            border:'1px solid rgba(16,185,129,.5)',display:'flex',alignItems:'center',gap:4}}
                          onClick={async()=>{
                            setSyncingToGads(s=>({...s,[camp.campaign_id]:true}));
                            setSyncToResult(s=>({...s,[camp.campaign_id]:null}));
                            try {
                              const r = await api(`/api/admin/campaigns/${camp.campaign_id}/sync-to-gads`,{method:'POST'});
                              setSyncToResult(s=>({...s,[camp.campaign_id]:r}));
                            } catch(e){
                              setSyncToResult(s=>({...s,[camp.campaign_id]:{error: e?.detail||e?.message||'Push failed'}}));
                            } finally {
                              setSyncingToGads(s=>({...s,[camp.campaign_id]:false}));
                            }
                          }}>
                          {syncingToGads[camp.campaign_id]
                            ? <><span className="spinner" style={{width:10,height:10,borderWidth:1.5,display:'inline-block'}}/> Pushing…</>
                            : '↑ Push to GAds'
                          }
                        </button>
                      </>)}
                      {/* Days filter */}
                      <div style={{marginLeft:'auto',display:'flex',gap:4}}>
                        {[7,30,90].map(d=>(
                          <button key={d} className="btn btn-sm" style={{fontSize:10,
                            background: campDetailDays===d ? 'rgba(255,255,255,.3)':'rgba(255,255,255,.1)',
                            color:'#fff',border:'1px solid rgba(255,255,255,.2)'}}
                            onClick={()=>openCampaignDetail(camp.campaign_id, d)}>
                            {d}d
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>

                  {/* ── Landing Page Discrepancy Banner ── */}
                  {lpDiscrepancy[camp.campaign_id] && (() => {
                    const lp = lpDiscrepancy[camp.campaign_id];
                    const cid = camp.campaign_id;
                    return (
                      <div style={{margin:'8px 16px',padding:'12px 14px',
                        background:'rgba(251,191,36,.08)',border:'1px solid rgba(251,191,36,.4)',
                        borderRadius:6,fontSize:11}}>
                        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:8}}>
                          <span style={{fontWeight:700,color:'#fde68a',fontSize:12}}>⚠ Landing Page Mismatch Detected</span>
                          <button onClick={()=>setLpDiscrepancy(s=>({...s,[cid]:null}))}
                            style={{background:'none',border:'none',color:'#9ca3af',cursor:'pointer',fontSize:12}}>✕</button>
                        </div>
                        <div style={{color:'#d1d5db',marginBottom:10,lineHeight:1.5}}>
                          <div><span style={{color:'#9ca3af'}}>Dashboard:</span> <span style={{color:'#fca5a5'}}>{lp.db_url}</span></div>
                          <div><span style={{color:'#9ca3af'}}>Google Ads:</span> <span style={{color:'#6ee7b7'}}>{lp.live_url}</span></div>
                        </div>
                        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                          <button className="btn btn-sm"
                            style={{fontSize:10,background:'rgba(16,185,129,.2)',color:'#6ee7b7',border:'1px solid rgba(16,185,129,.4)'}}
                            onClick={async()=>{
                              try {
                                await api(`/api/admin/campaigns/${cid}/accept-gads-landing-page`,{
                                  method:'POST', body: JSON.stringify({url: lp.live_url, all_live_urls: lp.all_live_urls||[]})
                                });
                                setLpDiscrepancy(s=>({...s,[cid]:null}));
                                await openCampaignDetail(cid, campDetailDays);
                                alert('✅ Dashboard updated to: ' + lp.live_url);
                              } catch(e) { alert('Failed: '+(e?.detail||e?.message)); }
                            }}>
                            ✅ Update Dashboard → {lp.live_url}
                          </button>
                          <a href={lp.gads_edit_url} target="_blank" rel="noopener noreferrer"
                            style={{fontSize:10,padding:'4px 10px',borderRadius:4,
                              background:'rgba(99,102,241,.2)',color:'#a5b4fc',
                              border:'1px solid rgba(99,102,241,.4)',textDecoration:'none',
                              display:'flex',alignItems:'center',gap:4}}>
                            ✏️ Update in Google Ads ↗
                          </a>
                        </div>
                      </div>
                    );
                  })()}

                  {/* ── Sync-To Verification Panel ── */}
                  {syncToResult[camp.campaign_id] && (() => {
                    const res = syncToResult[camp.campaign_id];
                    if (res.error) return (
                      <div style={{margin:'8px 16px',padding:'10px 14px',background:'rgba(239,68,68,.12)',
                        border:'1px solid rgba(239,68,68,.4)',borderRadius:6,fontSize:11,color:'#fca5a5'}}>
                        ✗ Push failed: {res.error}
                        <button onClick={()=>setSyncToResult(s=>({...s,[camp.campaign_id]:null}))}
                          style={{marginLeft:10,background:'none',border:'none',color:'#fca5a5',cursor:'pointer',fontSize:11}}>✕</button>
                      </div>
                    );
                    const allOk  = res.all_match && (!res.errors || res.errors.length === 0);
                    const noPush = !res.pushed?.length;
                    const headerText = noPush
                      ? '✅ Already in sync — nothing needed pushing'
                      : allOk ? '✅ Changes pushed & verified'
                              : '⚠ Pushed — review verification below';
                    return (
                      <div style={{margin:'8px 16px',padding:'12px 14px',
                        background: allOk ? 'rgba(16,185,129,.1)' : 'rgba(251,191,36,.1)',
                        border: `1px solid ${allOk ? 'rgba(16,185,129,.4)' : 'rgba(251,191,36,.4)'}`,
                        borderRadius:6,fontSize:11}}>
                        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
                          <span style={{fontWeight:700,color: allOk ? '#6ee7b7' : '#fde68a'}}>
                            {headerText}
                          </span>
                          <button onClick={()=>setSyncToResult(s=>({...s,[camp.campaign_id]:null}))}
                            style={{background:'none',border:'none',color:'#9ca3af',cursor:'pointer',fontSize:12}}>✕</button>
                        </div>
                        {/* What was pushed vs skipped */}
                        <div style={{marginBottom:8,display:'flex',flexWrap:'wrap',gap:6}}>
                          {res.pushed && res.pushed.map((p,i)=>(
                            <span key={i} style={{padding:'2px 8px',borderRadius:10,background:'rgba(16,185,129,.2)',
                              color:'#6ee7b7',fontSize:10,fontWeight:600}}>↑ {p}</span>
                          ))}
                          {res.skipped && res.skipped.map((s,i)=>(
                            <span key={i} style={{padding:'2px 8px',borderRadius:10,background:'rgba(156,163,175,.15)',
                              color:'#9ca3af',fontSize:10}}>— {s}</span>
                          ))}
                          {(!res.pushed?.length && !res.skipped?.length) && (
                            <span style={{color:'#9ca3af',fontSize:10}}>Nothing to push</span>
                          )}
                        </div>
                        {/* Verification table */}
                        {res.verification && res.verification.length > 0 && (
                          <table style={{width:'100%',borderCollapse:'collapse',fontSize:11}}>
                            <thead>
                              <tr style={{color:'#9ca3af',textAlign:'left'}}>
                                <th style={{paddingBottom:4,paddingRight:12,fontWeight:600}}>Field</th>
                                <th style={{paddingBottom:4,paddingRight:12,fontWeight:600}}>Pushed</th>
                                <th style={{paddingBottom:4,paddingRight:12,fontWeight:600}}>Live in Google Ads</th>
                                <th style={{paddingBottom:4,fontWeight:600}}>Match</th>
                              </tr>
                            </thead>
                            <tbody>
                              {res.verification.map((v,i)=>(
                                <tr key={i} style={{borderTop:'1px solid rgba(255,255,255,.08)'}}>
                                  <td style={{padding:'4px 12px 4px 0',color:'#e5e7eb'}}>{v.field}</td>
                                  <td style={{padding:'4px 12px 4px 0',color:'#d1fae5',fontFamily:'monospace'}}>{v.pushed}</td>
                                  <td style={{padding:'4px 12px 4px 0',color:'#bfdbfe',fontFamily:'monospace',maxWidth:260,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}
                                    title={v.live}>{v.live}</td>
                                  <td style={{padding:'4px 0',textAlign:'center'}}>
                                    {v.match === true ? '✅' : v.match === false ? '❌' : '⏳'}
                                  </td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        )}
                        {/* Errors */}
                        {res.errors && res.errors.length > 0 && (
                          <div style={{marginTop:8,color:'#fca5a5'}}>
                            {res.errors.map((e,i)=><div key={i}>✗ {e}</div>)}
                          </div>
                        )}
                      </div>
                    );
                  })()}

                  {/* ── Body ── */}
                  {(() => {
                    const build = cd.build || {};
                    const gadsSnap = cd.gads_snapshot || {};
                    const snapSyncedAt = gadsSnap.synced_from_gads_at
                      ? new Date(gadsSnap.synced_from_gads_at).toLocaleString()
                      : null;

                    // Helper: seed a wizard step from the Google Ads snapshot
                    async function seedFromSnapshot(step) {
                      const stepData = gadsSnap[step];
                      if (!stepData) return;
                      setBuildLoading('seed_'+step);
                      try {
                        await api(`/api/admin/campaigns/${camp.campaign_id}/build-step-save`, {
                          method: 'POST',
                          body: JSON.stringify({ step, data: stepData }),
                        });
                        await openCampaignDetail(camp.campaign_id, campDetailDays);
                      } catch(e) { alert('Could not seed from snapshot: '+e.message); }
                      finally { setBuildLoading(''); }
                    }

                    // Snapshot banner component — shown on wizard tabs when snapshot data exists
                    // but the wizard step is empty, offering one-click seeding.
                    function SnapshotBanner({ step, label }) {
                      const hasSnap = !!(gadsSnap[step] && (
                        (gadsSnap[step].keywords && gadsSnap[step].keywords.length > 0) ||
                        (gadsSnap[step].ads && gadsSnap[step].ads.length > 0) ||
                        (gadsSnap[step].ad_groups && gadsSnap[step].ad_groups.length > 0)
                      ));
                      if (!hasSnap) return null;
                      const seeding = buildLoading === 'seed_'+step;
                      return (
                        <div style={{background:'#eff6ff',border:'1px solid #bfdbfe',borderRadius:8,
                          padding:'12px 16px',marginBottom:16,display:'flex',alignItems:'center',
                          justifyContent:'space-between',gap:12}}>
                          <div>
                            <div style={{fontSize:12,fontWeight:700,color:'#1e40af',marginBottom:2}}>
                              📥 Google Ads data available
                            </div>
                            <div style={{fontSize:11,color:'#3b82f6'}}>
                              {label} were imported from your live Google Ads campaign
                              {snapSyncedAt ? ` (synced ${snapSyncedAt})` : ''}.
                              Seed the wizard from this data to start with real settings.
                            </div>
                          </div>
                          <button className="btn btn-sm" disabled={seeding}
                            style={{fontSize:11,background:'#2563eb',color:'#fff',border:'none',whiteSpace:'nowrap',flexShrink:0}}
                            onClick={()=>seedFromSnapshot(step)}>
                            {seeding ? '⏳ Seeding…' : '📥 Seed from Google Ads'}
                          </button>
                        </div>
                      );
                    }

                    async function generateBuildStep(step) {
                      setBuildLoading(step);
                      // Clear any inline edit in progress so stale keys don't linger
                      if (step === 'launch_checklist') setChecklistEditing(null);
                      try {
                        await api(`/api/admin/campaigns/${camp.campaign_id}/build-step`, {
                          method: 'POST',
                          body: JSON.stringify({ step }),
                        });
                        // Reload detail to get fresh build data
                        await openCampaignDetail(camp.campaign_id, campDetailDays);
                      } catch(e) {
                        alert('AI generation failed: ' + e.message);
                      } finally {
                        setBuildLoading('');
                      }
                    }

                    // Wizard step completion helpers
                    const stepDone = {
                      strategy:     !!strategy,
                      keywords:     !!build.keywords,
                      ad_copy:      !!build.ad_copy,
                      ad_groups:    !!build.ad_groups,
                      launch:       !!(build.launch_checklist && build.launch_checklist.some(x=>x.category==='required') && build.launch_checklist.filter(x=>x.category==='required').every(x=>x.done)),
                      performance:  true,
                    };
                    const WIZARD_ORDER = ['strategy','keywords','ad_copy','ad_groups','launch','performance'];
                    const TABS = [
                      { id: 'strategy',     label: '🧠 Strategy' },
                      { id: 'keywords',     label: '🔍 Keywords' },
                      { id: 'ad_copy',      label: '✍ Ad Copy' },
                      { id: 'ad_groups',    label: '📂 Ad Groups' },
                      { id: 'launch',       label: '🚀 Launch' },
                      { id: 'performance',  label: '📊 Performance' },
                    ];
                    const currentIdx = WIZARD_ORDER.indexOf(detailTab);
                    const nextStep = WIZARD_ORDER[currentIdx + 1];
                    const canAdvance = detailTab !== 'performance' && stepDone[detailTab];

                    // Refine helpers (shared across keyword/ad_copy/ad_groups tabs)
                    async function handleRefine(step) {
                      if (!refineInput.trim()) return;
                      setRefineLoading(true);
                      // If there's already a preview for this step, refine from that
                      // (not the saved version) — supports iterative refinement before committing
                      const currentOverride = (refinedPreview?.step === step) ? refinedPreview.data : null;
                      try {
                        const res = await api(`/api/admin/campaigns/${camp.campaign_id}/build-step-refine`, {
                          method: 'POST',
                          body: JSON.stringify({ step, instruction: refineInput, current_override: currentOverride }),
                        });
                        setRefinedPreview({ step, data: res.data });
                        setRefineInput(''); // clear input so next instruction starts fresh
                      } catch(e) { alert('Refine failed: ' + e.message); }
                      finally { setRefineLoading(false); }
                    }

                    async function acceptRefined() {
                      if (!refinedPreview) return;
                      const { step, data } = refinedPreview;
                      await api(`/api/admin/campaigns/${camp.campaign_id}/build-step-save`, {
                        method: 'POST',
                        body: JSON.stringify({ step, data }),
                      });
                      setRefinedPreview(null);
                      setRefineInput('');
                      // Immediately update campDetail so strategy tab re-renders without full reload
                      if (step === 'strategy') {
                        setCampDetail(prev => prev ? { ...prev, strategy: data } : prev);
                      }
                      await openCampaignDetail(camp.campaign_id, campDetailDays);
                    }

                    // Refine box — called as a plain function (not a JSX component) to avoid
                    // remount-on-keystroke caused by defining a component inside render.
                    function renderRefineBox(step) {
                      const isThisStep = refinedPreview?.step === step;
                      return (
                        <div style={{marginTop:20,background:'#f5f3ff',border:'1px solid #c4b5fd',borderRadius:8,padding:'12px 14px'}}>
                          <div style={{fontSize:11,fontWeight:700,color:'#5b21b6',marginBottom:6}}>
                            🤖 Ask AI to refine
                          </div>
                          <div style={{display:'flex',gap:6}}>
                            <input value={refineInput} onChange={e=>setRefineInput(e.target.value)}
                              onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();handleRefine(step);}}}
                              placeholder={`e.g. "Remove all broad match keywords" or "Add keywords for weekend hours"`}
                              style={{flex:1,fontSize:11,padding:'6px 10px',border:'1px solid #c4b5fd',borderRadius:5,outline:'none'}}/>
                            <button className="btn btn-sm" disabled={refineLoading||!refineInput.trim()}
                              style={{fontSize:11,background:'#7c3aed',color:'#fff',border:'none',whiteSpace:'nowrap'}}
                              onClick={()=>handleRefine(step)}>
                              {refineLoading?'⏳ Refining…':'✨ Refine'}
                            </button>
                          </div>
                          {isThisStep && refinedPreview && (
                            <div style={{marginTop:10,background:'#fff',border:'1px solid #a78bfa',borderRadius:6,padding:'10px 12px'}}>
                              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
                                <span style={{fontSize:11,fontWeight:700,color:'#5b21b6'}}>✨ AI Suggestion (preview)</span>
                                <div style={{display:'flex',gap:6}}>
                                  <button className="btn btn-sm" style={{fontSize:10,background:'#059669',color:'#fff',border:'none'}}
                                    onClick={acceptRefined}>✓ Accept & Save</button>
                                  <button className="btn btn-ghost btn-sm" style={{fontSize:10}}
                                    onClick={()=>setRefinedPreview(null)}>✕ Discard</button>
                                </div>
                              </div>
                              <pre style={{fontSize:10,lineHeight:1.4,color:'#374151',whiteSpace:'pre-wrap',
                                maxHeight:200,overflowY:'auto',margin:0}}>
                                {JSON.stringify(refinedPreview.data, null, 2)}
                              </pre>
                            </div>
                          )}
                        </div>
                      );
                    }

                    return (
                      <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
                        {/* Tab bar with wizard indicators */}
                        <div style={{borderBottom:'2px solid var(--border)',background:'#fafafa',flexShrink:0}}>
                          <div style={{display:'flex',overflowX:'auto',padding:'0 20px',gap:0}}>
                            {TABS.map(t => {
                              const done = stepDone[t.id];
                              const active = detailTab === t.id;
                              return (
                                <button key={t.id}
                                  style={{padding:'10px 14px',fontSize:11,fontWeight:active?700:400,
                                    color:active?'var(--teal)':'var(--text-muted)',
                                    background:'none',border:'none',cursor:'pointer',
                                    borderBottom:active?'2px solid var(--teal)':'2px solid transparent',
                                    marginBottom:-2,whiteSpace:'nowrap',display:'flex',alignItems:'center',gap:4}}
                                  onClick={()=>{setDetailTab(t.id);setRefinedPreview(null);setRefineInput('');}}>
                                  {t.label}
                                  {done && t.id !== 'performance' && t.id !== 'optimization' && (
                                    <span style={{fontSize:9,color:'#059669',fontWeight:700}}>✓</span>
                                  )}
                                </button>
                              );
                            })}
                          </div>
                          {/* Next step bar */}
                          {canAdvance && nextStep && (
                            <div style={{padding:'6px 20px',background:'#f0fdf4',borderTop:'1px solid #bbf7d0',
                              display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                              <span style={{fontSize:11,color:'#166534'}}>
                                ✓ Step complete — ready to move on?
                              </span>
                              <button className="btn btn-sm"
                                style={{fontSize:11,background:'#059669',color:'#fff',border:'none'}}
                                onClick={()=>{setDetailTab(nextStep);setRefinedPreview(null);setRefineInput('');}}>
                                Next: {TABS.find(t=>t.id===nextStep)?.label} →
                              </button>
                            </div>
                          )}
                        </div>

                        {/* Tab content */}
                        <div style={{flex:1,overflowY:'auto',padding:20}}>

                          {/* ── Strategy tab ── */}
                          {detailTab==='strategy' && (
                            <div>
                              {!strategy ? (
                                <div style={{textAlign:'center',color:'var(--text-muted)',padding:40,fontStyle:'italic'}}>
                                  No strategy generated yet. Use "+ New Campaign" and run Opus Strategy.
                                </div>
                              ) : (
                                <div style={{background:'#fafafa',border:'1px solid var(--border)',borderRadius:8,
                                  padding:16,borderLeft:'3px solid var(--teal)'}}>
                                  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
                                    <div>
                                      {strategy.objective && (<div style={{marginBottom:10}}>
                                        <div style={{fontSize:10,fontWeight:700,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'.4px',marginBottom:3}}>Objective</div>
                                        <div style={{fontSize:12,lineHeight:1.5}}>{strategy.objective}</div>
                                      </div>)}
                                      {strategy.target_audience && (<div style={{marginBottom:10}}>
                                        <div style={{fontSize:10,fontWeight:700,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'.4px',marginBottom:3}}>Target Audience</div>
                                        <div style={{fontSize:12,lineHeight:1.5}}>{strategy.target_audience}</div>
                                      </div>)}
                                      {(strategy.key_messages||[]).length>0 && (<div style={{marginBottom:10}}>
                                        <div style={{fontSize:10,fontWeight:700,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'.4px',marginBottom:3}}>Key Messages</div>
                                        {(strategy.key_messages||[]).map((m,i)=>(
                                          <div key={i} style={{display:'flex',gap:5,marginBottom:3}}>
                                            <span style={{color:'var(--teal)',fontWeight:700}}>→</span>
                                            <span style={{fontSize:11,lineHeight:1.4}}>{m}</span>
                                          </div>
                                        ))}
                                      </div>)}
                                    </div>
                                    <div>
                                      {(strategy.ad_headlines||[]).length>0 && (<div style={{marginBottom:10}}>
                                        <div style={{fontSize:10,fontWeight:700,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'.4px',marginBottom:3}}>Strategy Headlines</div>
                                        <div>{(strategy.ad_headlines||[]).map((h,i)=>(
                                          <span key={i} style={{display:'inline-block',background:'#e0f2fe',color:'#0c4a6e',
                                            fontSize:10,padding:'2px 7px',borderRadius:3,marginRight:4,marginBottom:4}}>{h}</span>
                                        ))}</div>
                                      </div>)}
                                      {(strategy.ad_descriptions||[]).length>0 && (<div style={{marginBottom:10}}>
                                        <div style={{fontSize:10,fontWeight:700,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'.4px',marginBottom:3}}>Strategy Descriptions</div>
                                        {(strategy.ad_descriptions||[]).map((d,i)=>(
                                          <div key={i} style={{fontSize:11,padding:'3px 8px',background:'#fff',
                                            border:'1px solid var(--border)',borderRadius:4,marginBottom:3,lineHeight:1.4}}>{d}</div>
                                        ))}
                                      </div>)}
                                    </div>
                                  </div>
                                  {strategy.implementation_instructions && (
                                    <div style={{marginTop:8,background:'#f0fdf4',border:'1px solid #bbf7d0',borderRadius:5,padding:'8px 10px'}}>
                                      <div style={{fontSize:10,fontWeight:700,color:'#166534',marginBottom:3}}>📋 Implementation Notes</div>
                                      <div style={{fontSize:11,lineHeight:1.5}}>{strategy.implementation_instructions}</div>
                                    </div>
                                  )}
                                </div>
                              )}
                              {/* Refine box — only shown after strategy is generated */}
                              {strategy && renderRefineBox('strategy')}
                            </div>
                          )}

                          {/* ── Keywords tab ── */}
                          {detailTab==='keywords' && (() => {
                            // Imported campaign: show live Google Ads keywords from snapshot
                            const snapKw = gadsSnap.keywords;
                            const hasSnapKw = snapKw && ((snapKw.keywords||[]).length > 0 || (snapKw.negative_keywords||[]).length > 0);
                            if (hasSnapKw) {
                              const allKw = snapKw.keywords || [];
                              const negKw = snapKw.negative_keywords || [];
                              // Group by match type
                              const byMatch = {};
                              allKw.forEach(k => {
                                const mt = k.match_type || 'Broad';
                                if (!byMatch[mt]) byMatch[mt] = [];
                                byMatch[mt].push(k);
                              });
                              const matchColors = {
                                'Exact': {color:'#0c4a6e', bg:'#e0f2fe'},
                                'Phrase': {color:'#065f46', bg:'#d1fae5'},
                                'Broad': {color:'#713f12', bg:'#fef3c7'},
                              };
                              return (
                                <div>
                                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
                                    <div style={{fontSize:13,fontWeight:700}}>🔍 Keywords</div>
                                    <span style={{fontSize:10,color:'var(--text-muted)'}}>
                                      Synced from Google Ads{snapSyncedAt ? ` · ${snapSyncedAt}` : ''}
                                    </span>
                                  </div>
                                  {Object.entries(byMatch).map(([mt, kws]) => {
                                    const {color, bg} = matchColors[mt] || {color:'#374151', bg:'#f3f4f6'};
                                    return (
                                      <div key={mt} style={{marginBottom:16}}>
                                        <div style={{fontSize:10,fontWeight:700,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'.5px',marginBottom:6}}>
                                          {mt} Match ({kws.length})
                                        </div>
                                        <div style={{display:'flex',flexWrap:'wrap',gap:5}}>
                                          {kws.map((k,i) => (
                                            <span key={i} style={{background:bg,color,fontSize:11,padding:'3px 9px',borderRadius:4,border:`1px solid ${color}30`}}>
                                              {k.keyword}
                                              {k.cpc_bid && k.cpc_bid >= 0.05 ? <span style={{marginLeft:4,fontWeight:700}}>${k.cpc_bid}</span> : null}
                                            </span>
                                          ))}
                                        </div>
                                      </div>
                                    );
                                  })}
                                  {negKw.length > 0 && (
                                    <div style={{marginBottom:16}}>
                                      <div style={{fontSize:10,fontWeight:700,color:'#7f1d1d',textTransform:'uppercase',letterSpacing:'.5px',marginBottom:6}}>
                                        Negative Keywords ({negKw.length})
                                      </div>
                                      <div style={{display:'flex',flexWrap:'wrap',gap:5}}>
                                        {negKw.map((k,i) => (
                                          <span key={i} style={{background:'#fee2e2',color:'#7f1d1d',fontSize:11,padding:'3px 9px',borderRadius:4,border:'1px solid #fca5a530'}}>
                                            -{k.keyword}
                                          </span>
                                        ))}
                                      </div>
                                    </div>
                                  )}
                                </div>
                              );
                            }
                            // New campaign: show AI generation wizard
                            return (
                              <div>
                                {!build.keywords ? (
                                  <div style={{textAlign:'center',padding:40}}>
                                    <div style={{fontSize:13,color:'var(--text)',marginBottom:8,fontWeight:600}}>🔍 Keyword Research</div>
                                    <div style={{fontSize:11,color:'var(--text-muted)',marginBottom:20}}>
                                      Sonnet will generate target keywords by match type plus negatives, based on your Opus Strategy.
                                    </div>
                                    <button className="btn btn-teal" disabled={!!buildLoading}
                                      style={{fontSize:12}}
                                      onClick={()=>generateBuildStep('keywords')}>
                                      {buildLoading==='keywords' ? '⏳ Generating…' : '✨ Generate Keywords'}
                                    </button>
                                  </div>
                                ) : (
                                  <div>
                                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
                                      <div style={{fontSize:13,fontWeight:700}}>🔍 Keyword Research</div>
                                      <button className="btn btn-ghost btn-sm" style={{fontSize:10}}
                                        disabled={!!buildLoading}
                                        onClick={()=>generateBuildStep('keywords')}>
                                        {buildLoading==='keywords'?'⏳ Regenerating…':'↺ Regenerate'}
                                      </button>
                                    </div>
                                    {[
                                      {key:'exact_match',          label:'Exact Match',   color:'#0c4a6e', bg:'#e0f2fe'},
                                      {key:'phrase_match',         label:'Phrase Match',  color:'#065f46', bg:'#d1fae5'},
                                      {key:'broad_match_modifier', label:'Broad Match',   color:'#713f12', bg:'#fef3c7'},
                                      {key:'negative_keywords',    label:'Negatives',     color:'#7f1d1d', bg:'#fee2e2'},
                                    ].map(({key,label,color,bg})=>(
                                      (build.keywords[key]||[]).length > 0 && (
                                        <div key={key} style={{marginBottom:16}}>
                                          <div style={{fontSize:10,fontWeight:700,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'.5px',marginBottom:6}}>
                                            {label} ({(build.keywords[key]||[]).length})
                                          </div>
                                          <div style={{display:'flex',flexWrap:'wrap',gap:5}}>
                                            {(build.keywords[key]||[]).map((kw,i)=>(
                                              <span key={i} style={{background:bg,color,fontSize:11,padding:'3px 9px',borderRadius:4,border:`1px solid ${color}30`}}>{kw}</span>
                                            ))}
                                          </div>
                                        </div>
                                      )
                                    ))}
                                  </div>
                                )}
                                {build.keywords && renderRefineBox('keywords')}
                              </div>
                            );
                          })()}

                          {/* ── Ad Copy tab ── */}
                          {detailTab==='ad_copy' && (() => {
                            const snapAds = gadsSnap.ad_copy;
                            const hasSnapAds = snapAds && (snapAds.ads||[]).length > 0;
                            if (hasSnapAds) {
                              return (
                                <div>
                                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
                                    <div style={{fontSize:13,fontWeight:700}}>✍ RSA Ad Copy</div>
                                    <span style={{fontSize:10,color:'var(--text-muted)'}}>
                                      Synced from Google Ads{snapSyncedAt ? ` · ${snapSyncedAt}` : ''}
                                    </span>
                                  </div>
                                  {(snapAds.ads||[]).map((ad, i) => (
                                    <div key={i} style={{background:'#fafafa',border:'1px solid var(--border)',
                                      borderRadius:8,padding:'14px 16px',marginBottom:14}}>
                                      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:8}}>
                                        <div>
                                          <div style={{fontSize:12,fontWeight:700}}>{ad.ad_group || `Ad ${i+1}`}</div>
                                          <div style={{fontSize:10,color:'var(--text-muted)',marginTop:1}}>{ad.ad_type}</div>
                                        </div>
                                        <div style={{display:'flex',gap:5,alignItems:'center'}}>
                                          {ad.ad_strength && ad.ad_strength !== 'UNSPECIFIED' && (
                                            <span style={{fontSize:9,padding:'2px 7px',borderRadius:3,fontWeight:700,
                                              background: ad.ad_strength==='EXCELLENT'?'#d1fae5':ad.ad_strength==='GOOD'?'#fef3c7':'#f3f4f6',
                                              color: ad.ad_strength==='EXCELLENT'?'#065f46':ad.ad_strength==='GOOD'?'#713f12':'#374151'}}>
                                              {ad.ad_strength}
                                            </span>
                                          )}
                                          {ad.approval_status && ad.approval_status !== 'UNSPECIFIED' && (
                                            <span style={{fontSize:9,padding:'2px 7px',borderRadius:3,
                                              background: ad.approval_status==='APPROVED'?'#d1fae5':'#fee2e2',
                                              color: ad.approval_status==='APPROVED'?'#065f46':'#7f1d1d'}}>
                                              {ad.approval_status}
                                            </span>
                                          )}
                                        </div>
                                      </div>
                                      {(ad.headlines||[]).length > 0 && (
                                        <div style={{marginBottom:10}}>
                                          <div style={{fontSize:10,fontWeight:700,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'.4px',marginBottom:5}}>
                                            Headlines ({ad.headlines.length})
                                          </div>
                                          <div style={{display:'flex',flexWrap:'wrap',gap:4}}>
                                            {ad.headlines.map((h,j)=>(
                                              <span key={j} style={{background:'#e0f2fe',color:'#0c4a6e',
                                                fontSize:10,padding:'3px 8px',borderRadius:4,border:'1px solid #bae6fd'}}>{typeof h==='object'?h.text||'':h}</span>
                                            ))}
                                          </div>
                                        </div>
                                      )}
                                      {(ad.descriptions||[]).length > 0 && (
                                        <div style={{marginBottom:8}}>
