          {/* ══ ACTIVITY TAB ══ */}
          {tab==='activity' && (
            <div>
              <div style={{fontSize:10,color:'var(--text-muted)',marginBottom:10}}>
                Full lead journey — messages, calls, notes, stage changes, and automation events in one place.
              </div>

              {/* Sequence queue */}
              {queue.length > 0 && (
                <div style={{marginBottom:12}}>
                  <div className="detail-section-title">Sequence Schedule</div>
                  {queue.map((q,i)=>(
                    <div key={i} className="fq-item" style={{opacity:q.status==='cancelled'?0.55:1}}>
                      <span className={'fq-status fq-'+q.status}>{q.status}</span>
                      <div style={{flex:1,marginLeft:4,fontSize:10}}>
                        <strong>{q.channel==='sms'?'SMS':'Email'}</strong> — {q.template||q.description||('Day '+q.sequence_day)}
                        {q.status==='cancelled'&&q.cancellation_reason&&(
                          <span style={{color:'var(--red)',marginLeft:4,fontSize:9}}>({q.cancellation_reason})</span>
                        )}
                      </div>
                      <div style={{fontSize:9,color:'var(--text-muted)',marginLeft:'auto',whiteSpace:'nowrap'}}>
                        {q.sent_at ? fmtDate(q.sent_at) : q.cancelled_at ? fmtDate(q.cancelled_at) : fmtDate(q.scheduled_at)}
                      </div>
                    </div>
                  ))}
                </div>
              )}

              {/* Full unified chronological timeline */}
              <div className="detail-section-title">Full Journey</div>
              {(() => {
                // Build all events into one sorted list
                const allItems = [];
                // Lead events
                events.forEach(e => allItems.push({_ts: new Date(e.created_at||0), _type:'event', data:e}));
                // Messages (both channels)
                messages.forEach(m => allItems.push({_ts: new Date(m.received_at||0), _type:'message', data:m}));
                // Calls
                calls.forEach(c => allItems.push({_ts: new Date(c.logged_at||0), _type:'call', data:c}));
                // Notes
                notes.forEach(n => allItems.push({_ts: new Date(n.created_at||0), _type:'note', data:n}));
                allItems.sort((a,b) => a._ts - b._ts);

                if (allItems.length === 0) return <div style={{fontSize:10,color:'var(--text-muted)'}}>No activity yet</div>;

                return allItems.map((item, idx) => {
                  if (item._type === 'event') {
                    const e = item.data;
                    const isStop = ['sms_stop','email_unsub','lead_paused','dnd_set','manual_pause'].includes(e.event_type);
                    const isResume = ['sms_resubscribed','lead_resumed','dnd_cleared'].includes(e.event_type);
                    const dotColor = isStop?'var(--red)':isResume?'#22c55e':e.event_type.includes('email')?'#3b82f6':e.event_type.includes('sms')?'#22c55e':'var(--teal)';
                    return (
                      <div key={'ev-'+idx} className="timeline-item">
                        <div className="timeline-dot" style={{background:dotColor}} />
                        <div style={{flex:1}}>
                          <div className="timeline-type">{e.event_type.replace(/_/g,' ')}</div>
                          {e.stage_to&&<div style={{fontSize:9,color:'var(--text-muted)'}}>→ {STAGE_LABELS[e.stage_to]||e.stage_to}</div>}
                        </div>
                        <div className="timeline-time">{fmtDate(e.created_at)}</div>
                      </div>
                    );
                  }
                  if (item._type === 'message') {
                    const m = item.data;
                    const isIn = m.direction === 'inbound';
                    const ch = m.channel || 'sms';
                    const icon = ch === 'email' ? '📧' : '💬';
                    const who = isIn ? 'Lead' : (m.message_type === 'auto' ? 'Auto' : 'Staff');
                    const dotColor = isIn ? '#22c55e' : ch === 'email' ? '#3b82f6' : 'var(--teal)';
                    return (
                      <div key={'msg-'+idx} className="timeline-item">
                        <div className="timeline-dot" style={{background:dotColor}} />
                        <div style={{flex:1,minWidth:0}}>
                          <div className="timeline-type">{icon} {who} {isIn?'replied':'sent'} {ch}</div>
                          {m.subject && <div style={{fontSize:9,color:'var(--text-muted)',fontStyle:'italic'}}>{m.subject}</div>}
                          <div style={{fontSize:10,color:'var(--text)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:400}}>
                            {(m.body||'').slice(0,120)}{(m.body||'').length>120?'…':''}
                          </div>
                        </div>
                        <div className="timeline-time">{fmtDate(m.received_at)}</div>
                      </div>
                    );
                  }
                  if (item._type === 'call') {
                    const c = item.data;
                    const ol = {spoke:'✅ Spoke',left_vm:'📞 Left VM',no_answer:'📵 No Answer',callback_scheduled:'📅 Callback'}[c.outcome]||c.outcome;
                    return (
                      <div key={'call-'+idx} className="timeline-item">
                        <div className="timeline-dot" style={{background:'#f59e0b'}} />
                        <div style={{flex:1}}>
                          <div className="timeline-type">📞 {ol} <span style={{fontWeight:400,color:'var(--text-muted)'}}>({c.direction})</span></div>
                          {c.notes&&<div style={{fontSize:9,color:'var(--text-muted)'}}>{c.notes}</div>}
                        </div>
                        <div className="timeline-time">{fmtDate(c.logged_at)}</div>
                      </div>
                    );
                  }
                  if (item._type === 'note') {
                    const n = item.data;
                    return (
                      <div key={'note-'+idx} className="timeline-item">
                        <div className="timeline-dot" style={{background:'#f59e0b'}} />
                        <div style={{flex:1}}>
                          <div className="timeline-type">📝 Staff note</div>
                          <div style={{fontSize:9,color:'var(--text)'}}>{n.note_text.slice(0,100)}{n.note_text.length>100?'…':''}</div>
                        </div>
                        <div className="timeline-time">{fmtDate(n.created_at)}</div>
                      </div>
                    );
                  }
                  return null;
                });
              })()}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ── Kanban Components ──────────────────────────────────────────────────────

function KanbanCard({ lead, isSelected, onClick, onStageChange }) {
  const name = [lead.first_name, lead.last_name].filter(Boolean).join(' ') || lead.email || 'Unknown';
  const needsFollowup = isStaffFollowUp(lead);
  const kw = (lead.keyword_text || '').replace(/^\[.*?\]\s*/, ''); // strip match type prefix
  const [dragging, setDragging] = useState(false);

  function handleStageSelect(e) {
    e.stopPropagation();
    const newStage = e.target.value;
    if (newStage && newStage !== lead.stage) onStageChange(lead.id, newStage);
  }

  return (
    <div
      className={'kanban-card' + (isSelected ? ' selected' : '') + (needsFollowup ? ' needs-followup' : '') + (dragging ? ' dragging' : '')}
      onClick={() => onClick(lead.id)}
      draggable
      onDragStart={e => {
        e.dataTransfer.setData('text/plain', lead.id);
        e.dataTransfer.effectAllowed = 'move';
        setDragging(true);
      }}
      onDragEnd={() => setDragging(false)}
    >
      <div className="kc-row">
        <span className="kc-name">{name}</span>
        <span className={'chip-source ' + srcClass(lead.source)} style={{fontSize:'8px'}}>{lead.source || '?'}</span>
      </div>
      {lead.phone && <div className="kc-meta">📞 {lead.phone}</div>}
      {lead.appointment_date && (
        <div className="kc-row">
          <span className="kc-badge kc-appt">📅 {fmtDate(lead.appointment_date)}</span>
        </div>
      )}
      {kw && <div className="kc-row"><span className="kc-badge kc-kw" title={kw}>🔑 {kw}</span></div>}
      <div className="kc-row">
        {lead.attributed_production > 0 && <span className="kc-revenue">{fmtMoney(lead.attributed_production)}</span>}
        {(lead.notes_count || 0) > 0 && <span className="kc-badge kc-notes">💬{lead.notes_count}</span>}
        <span className="kc-time" style={{marginLeft:'auto'}}>{timeAgo(lead.created_at)}</span>
      </div>
      {needsFollowup && (
        <div><span className="kc-followup-pill">⚠ Follow up</span></div>
      )}
      {/* Non-drag fallback: stage dropdown */}
      <div onClick={e => e.stopPropagation()} style={{marginTop:3}}>
        <select className="kc-stage-select" value={lead.stage} onChange={handleStageSelect}>
          {STAGES.filter(s => s !== 'cold').map(s => (
            <option key={s} value={s}>{STAGE_LABELS[s]}</option>
          ))}
          <option value="cold">{STAGE_LABELS.cold}</option>
        </select>
      </div>
    </div>
  );
}

function KanbanColumn({ stage, label, leads, color, selectedId, onCardClick, onDrop, onStageChange }) {
  const [dragOver, setDragOver] = useState(false);

  return (
    <div
      className={'kanban-col' + (dragOver ? ' drag-over' : '')}
    >
      <div className="kanban-col-header" style={{borderTopColor: color}}>
        <span className="stage-dot" style={{background: color}} />
        <span className="stage-label">{label}</span>
        <span className="stage-count">{leads.length}</span>
      </div>
      <div
        className="kanban-col-body"
        onDragOver={e => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; setDragOver(true); }}
        onDragLeave={e => { if (!e.currentTarget.contains(e.relatedTarget)) setDragOver(false); }}
        onDrop={e => {
          e.preventDefault();
          setDragOver(false);
          const id = e.dataTransfer.getData('text/plain');
          if (id) onDrop(id, stage);
        }}
      >
        {leads.length === 0 && <div className="kanban-empty">No leads</div>}
        {leads.map(l => (
          <KanbanCard
            key={l.id}
            lead={l}
            isSelected={selectedId === l.id}
            onClick={onCardClick}
            onStageChange={onStageChange}
          />
        ))}
      </div>
    </div>
  );
}

function KanbanBoard({ pipeline, stats, selectedId, onCardClick, onStageChange, onRefresh }) {
  const [searchTerm, setSearchTerm] = useState('');
  const [sourceFilter, setSourceFilter] = useState('all');
  const [showCold, setShowCold] = useState(false);
  const [followupOnly, setFollowupOnly] = useState(false);
  const boardRef = useRef(null);
  // Manual lead creation
  const EMPTY_LEAD = {first_name:'',last_name:'',email:'',phone:'',source:'manual',notes:''};
  const [showAddLead, setShowAddLead] = useState(false);
  const [newLead, setNewLead] = useState({...EMPTY_LEAD});
  const [addingLead, setAddingLead] = useState(false);
  const [addLeadError, setAddLeadError] = useState('');

  async function submitAddLead() {
    if (!newLead.first_name && !newLead.email && !newLead.phone) {
      setAddLeadError('Enter at least a name, email, or phone.');
      return;
    }
    setAddingLead(true); setAddLeadError('');
    try {
      await api('/api/admin/leads/create', {method:'POST', body:JSON.stringify(newLead)});
      setShowAddLead(false);
      setNewLead({...EMPTY_LEAD});
      onRefresh();
    } catch(e) {
      setAddLeadError(e?.detail || e?.message || 'Failed to create lead');
    } finally {
      setAddingLead(false);
    }
  }

  const filtered = useMemo(() => {
    return pipeline.filter(l => {
      if (!showCold && l.stage === 'cold') return false;
      if (sourceFilter !== 'all' && l.source !== sourceFilter) return false;
      if (followupOnly && !isStaffFollowUp(l)) return false;
      if (searchTerm) {
        const term = searchTerm.toLowerCase();
        const name = ((l.first_name || '') + ' ' + (l.last_name || '')).trim().toLowerCase();
        const email = (l.email || '').toLowerCase();
        const phone = (l.phone || '').toLowerCase();
        if (!name.includes(term) && !email.includes(term) && !phone.includes(term)) return false;
      }
      return true;
    });
  }, [pipeline, searchTerm, sourceFilter, showCold, followupOnly]);

  const byStage = useMemo(() => {
    const map = {};
    STAGES.forEach(s => { map[s] = []; });
    filtered.forEach(l => {
      if (map[l.stage] !== undefined) map[l.stage].push(l);
    });
    return map;
  }, [filtered]);

  const followupCount = useMemo(() => pipeline.filter(isStaffFollowUp).length, [pipeline]);

  const sources = useMemo(() => {
    const set = new Set(pipeline.filter(l => l.source).map(l => l.source));
    return ['all', ...Array.from(set).sort()];
  }, [pipeline]);

  async function handleDrop(leadId, newStage) {
    try {
      await api('/api/admin/lead/' + leadId + '/force-stage', { method: 'PUT', body: JSON.stringify({ stage: newStage, reason: 'drag-drop' }) });
      onStageChange(leadId, newStage);
    } catch (err) {
      console.error('Stage change failed', err);
      if (onRefresh) onRefresh();
    }
  }

  // Edge-scroll while dragging: scroll the kanban board when near edges
  function handleBoardDragOver(e) {
    const board = boardRef.current;
    if (!board) return;
    const rect = board.getBoundingClientRect();
    const edgeSize = 60;
    if (e.clientX < rect.left + edgeSize) board.scrollBy(-12, 0);
    else if (e.clientX > rect.right - edgeSize) board.scrollBy(12, 0);
  }

  const visibleStages = STAGES.filter(s => s !== 'cold');

  return (
    <div>
      {/* KPI strip */}
      <div className="kpi-strip">
        <div className="kpi"><div className="kpi-val">{stats?.total_leads || 0}</div><div className="kpi-label">Total</div></div>
        <div className="kpi"><div className="kpi-val">{filtered.length}</div><div className="kpi-label">Showing</div></div>
        <div className="kpi"><div className="kpi-val">{byStage.scheduled ? byStage.scheduled.length : 0}</div><div className="kpi-label">Scheduled</div></div>
        <div className="kpi"><div className="kpi-val">{byStage.no_show ? byStage.no_show.length : 0}</div><div className="kpi-label">No-Shows</div></div>
        <div className="kpi"><div className="kpi-val">{byStage.treatment_completed ? byStage.treatment_completed.length : 0}</div><div className="kpi-label">Treated</div></div>
        <div className="kpi"><div className="kpi-val">{fmtMoney(stats?.attributed_revenue || 0)}</div><div className="kpi-label">Revenue</div></div>
      </div>

      {/* Filter bar */}
      <div className="filter-bar">
        <select className="filter-select" value={sourceFilter} onChange={e => setSourceFilter(e.target.value)}>
          {sources.map(s => <option key={s} value={s}>{s === 'all' ? 'All Sources' : s}</option>)}
        </select>
        <input type="text" className="search-box" placeholder="Search name, email, phone..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} />
        <button
          className={'followup-pill-btn' + (followupOnly ? ' active' : '')}
          onClick={() => setFollowupOnly(f => !f)}
        >
          ⚠ <span className="pill-count">{followupCount}</span> Follow-up
        </button>
        <label style={{fontSize:11, display:'flex', gap:6, alignItems:'center', cursor:'pointer'}}>
          <input type="checkbox" checked={showCold} onChange={e => setShowCold(e.target.checked)} />
          Cold
        </label>
        <button className="btn btn-teal btn-sm" onClick={() => { setNewLead({...EMPTY_LEAD}); setAddLeadError(''); setShowAddLead(true); }}
          style={{marginLeft:'auto', fontSize:11, padding:'4px 14px', whiteSpace:'nowrap'}}>
          + Add Lead
        </button>
      </div>

      {/* Add Lead Modal */}
      {showAddLead && (
        <div className="modal-overlay" onClick={() => setShowAddLead(false)}>
          <div className="modal" onClick={e => e.stopPropagation()} style={{maxWidth:420, padding:24}}>
            <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:16}}>
              <h3 style={{margin:0, fontSize:15, fontWeight:700}}>Add Lead Manually</h3>
              <button onClick={() => setShowAddLead(false)} style={{background:'none', border:'none',
                fontSize:20, cursor:'pointer', color:'var(--text-muted)', lineHeight:1}}>×</button>
            </div>
            {[
              {label:'First Name', key:'first_name', type:'text', placeholder:'Jane'},
              {label:'Last Name',  key:'last_name',  type:'text', placeholder:'Smith'},
              {label:'Email',      key:'email',      type:'email', placeholder:'jane@example.com'},
              {label:'Phone',      key:'phone',      type:'tel',  placeholder:'(508) 555-0100'},
            ].map(f => (
              <div key={f.key} style={{marginBottom:10}}>
                <label style={{fontSize:11, fontWeight:600, color:'var(--text-muted)', display:'block', marginBottom:3}}>{f.label}</label>
                <input type={f.type} value={newLead[f.key]} placeholder={f.placeholder}
                  onChange={e => setNewLead(p => ({...p, [f.key]: e.target.value}))}
                  onKeyDown={e => e.key === 'Enter' && submitAddLead()}
                  style={{width:'100%', fontSize:12, padding:'6px 10px', borderRadius:6,
                    border:'1px solid var(--border)', background:'var(--surface)',
                    color:'var(--text)', boxSizing:'border-box'}} />
              </div>
            ))}
            <div style={{marginBottom:10}}>
              <label style={{fontSize:11, fontWeight:600, color:'var(--text-muted)', display:'block', marginBottom:3}}>Source</label>
              <select value={newLead.source} onChange={e => setNewLead(p => ({...p, source: e.target.value}))}
                style={{width:'100%', fontSize:12, padding:'6px 10px', borderRadius:6,
                  border:'1px solid var(--border)', background:'var(--surface)', color:'var(--text)'}}>
                <option value="manual">Manual</option>
                <option value="referral">Referral</option>
                <option value="phone_call">Phone Call</option>
                <option value="walk_in">Walk-in</option>
                <option value="smile_tool">Smile Tool</option>
                <option value="other">Other</option>
              </select>
            </div>
            <div style={{marginBottom:14}}>
              <label style={{fontSize:11, fontWeight:600, color:'var(--text-muted)', display:'block', marginBottom:3}}>Notes</label>
              <textarea value={newLead.notes} onChange={e => setNewLead(p => ({...p, notes: e.target.value}))}
                rows={3} placeholder="Optional context about this lead…"
                style={{width:'100%', fontSize:12, padding:'6px 10px', borderRadius:6, resize:'vertical',
                  border:'1px solid var(--border)', background:'var(--surface)',
                  color:'var(--text)', boxSizing:'border-box'}} />
            </div>
            {addLeadError && (
              <div style={{color:'var(--red)', fontSize:11, marginBottom:10}}>{addLeadError}</div>
            )}
            <div style={{display:'flex', gap:8, justifyContent:'flex-end'}}>
              <button className="btn btn-ghost btn-sm" onClick={() => setShowAddLead(false)}>Cancel</button>
              <button className="btn btn-teal btn-sm" onClick={submitAddLead} disabled={addingLead}>
                {addingLead ? 'Creating…' : 'Create Lead'}
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Kanban board */}
      <div className="kanban-board" ref={boardRef} onDragOver={handleBoardDragOver}>
        {visibleStages.map(s => (
          <KanbanColumn
            key={s}
            stage={s}
            label={STAGE_LABELS[s]}
            leads={byStage[s] || []}
            color={STAGE_COLORS[s] || '#6b7280'}
            selectedId={selectedId}
            onCardClick={onCardClick}
            onDrop={handleDrop}
            onStageChange={(id, newStage) => handleDrop(id, newStage)}
          />
        ))}
        {showCold && (
          <KanbanColumn
            stage="cold"
            label="Cold"
            leads={byStage.cold || []}
            color="#9ca3af"
            selectedId={selectedId}
            onCardClick={onCardClick}
            onDrop={handleDrop}
            onStageChange={(id, newStage) => handleDrop(id, newStage)}
          />
        )}
      </div>
    </div>
  );
}

// ── Dashboard Tab ───────────────────────────────────────────────────────────

const OD_REL_LABELS = {
  implant_prospect: '🦷 Implant Prospect',
  reactivation:     '🔄 Reactivation',
  active_patient:   '✅ Active Patient',
  new_patient:      '🆕 New Patient',
  cold:             '❄️ Cold',
};
const OD_REL_COLORS = {
  implant_prospect: '#dc2626',
  reactivation:     '#d97706',
  active_patient:   '#16a34a',
  new_patient:      '#2563eb',
  cold:             '#9ca3af',
};

function DashboardTab({ pipeline, stats, onTabSwitch }) {
  const now = Date.now();
  const [hotLeads, setHotLeads] = React.useState([]);
  const [hotLoading, setHotLoading] = React.useState(true);

  React.useEffect(() => {
    api('/api/admin/hot-leads')
      .then(d => { setHotLeads(d.leads || []); setHotLoading(false); })
      .catch(() => setHotLoading(false));
  }, []);

  // Compute KPIs from pipeline data (exclude cold leads — they are archived, not active)
  const activeLeads = pipeline.filter(l => l.stage !== 'cold');
  const totalLeads = activeLeads.length;
  const scheduled = pipeline.filter(l => l.stage === 'scheduled').length;
  const totalRevenue = pipeline.reduce((s, l) => s + (l.attributed_production || 0), 0);
  const treated = pipeline.filter(l => l.stage === 'treatment_completed').length;
  const convRate = totalLeads > 0 ? Math.round(scheduled / totalLeads * 100) : 0;
  const revPerLead = totalLeads > 0 ? Math.round(totalRevenue / totalLeads) : 0;

  // Avg days to appointment (leads with appointment_date set)
  const withAppt = pipeline.filter(l => l.appointment_date && l.created_at);
  const avgDaysToAppt = withAppt.length > 0
    ? Math.round(withAppt.reduce((s, l) => {
        return s + (new Date(l.appointment_date) - new Date(l.created_at)) / (1000 * 60 * 60 * 24);
      }, 0) / withAppt.length)
    : null;

  // Alerts
  const followupNeeded = pipeline.filter(isStaffFollowUp).length;
  const noShowsThisWeek = pipeline.filter(l => {
    if (l.stage !== 'no_show') return false;
    const d = (now - new Date(l.updated_at).getTime()) / (1000 * 60 * 60 * 24);
    return d <= 7;
  }).length;
  const stuckInNew = pipeline.filter(l => {
    if (l.stage !== 'new') return false;
    const d = (now - new Date(l.created_at).getTime()) / (1000 * 60 * 60 * 24);
    return d > 7;
  }).length;
  const scheduledThisWeek = pipeline.filter(l => {
    if (!l.appointment_date) return false;
    const appt = new Date(l.appointment_date).getTime();
    return appt >= now && appt <= now + 7 * 24 * 60 * 60 * 1000;
  }).length;

  // Funnel data
  const FUNNEL_STAGES = [
    { key: 'new', label: 'New Lead' },
    { key: 'auto_nurture', label: 'Auto-Nurture' },
    { key: 'scheduled', label: 'Scheduled' },
    { key: 'showed', label: 'Showed' },
    { key: 'treatment_presented', label: 'Tx Presented' },
    { key: 'treatment_accepted', label: 'Tx Accepted' },
    { key: 'treatment_completed', label: 'Tx Completed' },
  ];
  const stageCounts = {};
  pipeline.forEach(l => { stageCounts[l.stage] = (stageCounts[l.stage] || 0) + 1; });
  const maxCount = Math.max(...FUNNEL_STAGES.map(s => stageCounts[s.key] || 0), 1);

  return (
    <div className="dash-layout">
      <div className="dash-left">
        {/* KPI Cards */}
        <div className="dash-kpi-grid">
          <div className="dash-kpi">
            <div className="dash-kpi-val">{totalLeads}</div>
            <div className="dash-kpi-label">Total Leads</div>
            <div className="dash-kpi-sub">All time</div>
          </div>
          <div className="dash-kpi">
            <div className="dash-kpi-val">{convRate}%</div>
            <div className="dash-kpi-label">Booking Rate</div>
            <div className="dash-kpi-sub">{scheduled} scheduled / {totalLeads} leads</div>
          </div>
          <div className="dash-kpi">
            <div className="dash-kpi-val">{scheduled}</div>
            <div className="dash-kpi-label">Scheduled</div>
            <div className="dash-kpi-sub">Active appointments</div>
          </div>
          <div className="dash-kpi">
            <div className="dash-kpi-val">{fmtMoney(totalRevenue)}</div>
            <div className="dash-kpi-label">Attributed Revenue</div>
            <div className="dash-kpi-sub">{treated} treatment{treated !== 1 ? 's' : ''} completed</div>

// Default date range helpers
function defaultDateRange(days) {
  const end = new Date();
  const start = new Date();
  start.setDate(end.getDate() - days);
  const fmt = d => d.toISOString().split('T')[0];
  return { start: fmt(start), end: fmt(end) };
}

// ─── CampaignTrendChart ────────────────────────────────────────────────────
// NOTE: filter by campaign_name (not campaign_id) because get_campaign_stats()
// returns the name field as `campaign`, not a numeric ID.
function CampaignTrendChart({ campaignName, dailyStats }) {
  // Filter daily stats to this campaign (case-insensitive) and sort by date ascending
  const nameLower = (campaignName || '').toLowerCase();
  const rows = (dailyStats || [])
    .filter(r => (r.campaign_name || '').toLowerCase() === nameLower)
    .sort((a, b) => a.date.localeCompare(b.date));

  if (!rows.length) {
    return (
      <div className="trend-empty">
        No trend data yet — will populate after the next 6 AM Google Ads sync.
      </div>
    );
  }

  const W = 480, H = 80, PAD_L = 28, PAD_R = 8, PAD_T = 8, PAD_B = 20;
  const chartW = W - PAD_L - PAD_R;
  const chartH = H - PAD_T - PAD_B;
  const maxClicks = Math.max(...rows.map(r => r.clicks || 0), 1);
  const count = rows.length;

  // Build polyline points
  const pts = rows.map((r, i) => {
    const x = PAD_L + (count === 1 ? chartW / 2 : (i / (count - 1)) * chartW);
    const y = PAD_T + chartH - ((r.clicks || 0) / maxClicks) * chartH;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');

  const firstDate = rows[0].date.slice(5);  // MM-DD
  const lastDate = rows[rows.length - 1].date.slice(5);

  return (
    <div className="trend-chart-wrap">
      <div style={{fontSize:10, color:'var(--text-muted)', marginBottom:4}}>Clicks (last {count} days)</div>
      <svg className="trend-svg" viewBox={`0 0 ${W} ${H}`} xmlns="http://www.w3.org/2000/svg">
        {/* Axis lines */}
        <line x1={PAD_L} y1={PAD_T} x2={PAD_L} y2={PAD_T + chartH} stroke="var(--border)" strokeWidth="1"/>
        <line x1={PAD_L} y1={PAD_T + chartH} x2={W - PAD_R} y2={PAD_T + chartH} stroke="var(--border)" strokeWidth="1"/>
        {/* Y-axis labels */}
        <text x={PAD_L - 3} y={PAD_T + 4} fontSize="7" textAnchor="end" fill="var(--text-muted)">{maxClicks}</text>
        <text x={PAD_L - 3} y={PAD_T + chartH} fontSize="7" textAnchor="end" fill="var(--text-muted)">0</text>
        {/* X-axis date labels */}
        <text x={PAD_L} y={H - 4} fontSize="7" textAnchor="start" fill="var(--text-muted)">{firstDate}</text>
        <text x={W - PAD_R} y={H - 4} fontSize="7" textAnchor="end" fill="var(--text-muted)">{lastDate}</text>
        {/* Filled area under line */}
        <polygon
          points={`${PAD_L},${PAD_T + chartH} ${pts} ${PAD_L + (count === 1 ? chartW / 2 : chartW)},${PAD_T + chartH}`}
          fill="var(--teal)" fillOpacity="0.12"
        />
        {/* Trend line */}
        <polyline points={pts} fill="none" stroke="var(--teal)" strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round"/>
      </svg>
    </div>
  );
}

                            <span style={{fontWeight:600,color:isColor}}>{isPct}%</span>
                          ) : <span style={{color:'#94a3b8'}}>—</span>}
                        </td>
                        <td className="num">{(k.impressions||0).toLocaleString()}</td>
                        <td className="num">{(k.gads_clicks||0).toLocaleString()}</td>
                        <td className="num">{fmtMoney(k.total_cost||0)}</td>
                        <td className="num">{k.lead_count||0}</td>
                        <td className="num">{k.cpl ? '$'+Number(k.cpl).toFixed(0) : '—'}</td>
                        <td className="num">{k.scheduled_count||0}</td>
                        <td className="num">{k.treated_count||0}</td>
                        <td className="num money">{fmtMoney(k.revenue||0)}</td>
                        <td className="num">{k.roas ? k.roas.toFixed(1)+'x' : '—'}</td>
                      </tr>
                      );
                    })}
                  </tbody>
                </table>
              )}
            </div>
          )}

          {/* ── Trend tab ── */}
          {panelTab==='trend' && (
            <CampaignTrendChart campaignName={campaign.campaign||''} dailyStats={dailyStats||[]} />
          )}
        </div>
      </td>
    </tr>
  );
}

function AdCreativesView({ days }) {
  const [ads, setAds] = useState([]);
  const [loading, setLoading] = useState(true);
  const [expanded, setExpanded] = useState(null); // ad_id

  useEffect(() => {
    setLoading(true);
    api(`/api/admin/gads/ads?days=${days}`)
      .then(r => setAds(r.ads || []))
      .catch(() => setAds([]))
      .finally(() => setLoading(false));
  }, [days]);

  if (loading) return <div style={{padding:24,textAlign:'center',color:'var(--text-muted)',fontSize:12}}>Loading ad creatives…</div>;
  if (!ads.length) return <div style={{padding:24,textAlign:'center',color:'var(--text-muted)',fontSize:12}}>No ad creatives found. Run Google Ads Sync to populate data.</div>;

  function statusColor(s) {
    if (!s) return '#6b7280';
    const u = s.toUpperCase();
    if (u === 'ENABLED') return '#16a34a';
    if (u === 'PAUSED')  return '#f59e0b';
    if (u === 'REMOVED') return '#dc2626';
    return '#6b7280';
  }

  function fmtPct(n) { return n == null ? '—' : n.toFixed(1) + '%'; }
  function fmtMoney(n) { return n == null ? '—' : '$' + n.toFixed(2); }
  function fmtNum(n)  { return n == null || n === 0 ? '—' : n.toLocaleString(); }

  return (
    <div className="report-section">
      <div className="report-title">Ad Creatives</div>
      <table className="report-table">
        <thead>
          <tr>
            <th>Ad</th>
            <th>Campaign</th>
            <th>Ad Group</th>
            <th>Status</th>
            <th className="num">Impr</th>
            <th className="num">Clicks</th>
            <th className="num">CTR</th>
            <th className="num">Cost</th>
            <th className="num">Leads</th>
            <th className="num">CPL</th>
            <th style={{width:60}}></th>

        </thead>
        <tbody>

            const isOpen = expanded === ad.ad_id;
            const assets = ad.assets_json || {};
            const headlines = assets.headlines || [];
            const descriptions = assets.descriptions || [];
            // ETA fallback fields
            const h1 = ad.headline_1 || '';
            const h2 = ad.headline_2 || '';
            const h3 = ad.headline_3 || '';
            const d1 = ad.description_1 || '';
            const d2 = ad.description_2 || '';

            return (
              <React.Fragment key={ad.ad_id}>
                <tr>
                  <td style={{fontWeight:600,maxWidth:140,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={ad.ad_name||ad.ad_id}>
                    {ad.ad_name || ad.ad_id}
                  </td>
                  <td style={{maxWidth:120,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={ad.campaign_name}>
                    {(ad.campaign_name||'').replace(/^grafton_nxtsmile_/,'')||'—'}
                  </td>
                  <td style={{maxWidth:120,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={ad.ad_group_name}>
                    {ad.ad_group_name||'—'}
                  </td>
                  <td>
                    <span style={{fontSize:10,fontWeight:600,color:statusColor(ad.status),
                                  background:statusColor(ad.status)+'22',padding:'1px 5px',borderRadius:3}}>
                      {ad.status||'—'}
                    </span>
                  </td>
                  <td className="num">{fmtNum(ad.impressions)}</td>
                  <td className="num">{fmtNum(ad.clicks)}</td>
                  <td className="num">{fmtPct(ad.ctr)}</td>
                  <td className="num">{fmtMoney(ad.cost)}</td>
                  <td className="num">{fmtNum(ad.leads)}</td>
                  <td className="num">{fmtMoney(ad.cpl)}</td>
                  <td style={{textAlign:'center'}}>
                    <button className="btn btn-ghost btn-sm" onClick={() => setExpanded(isOpen ? null : ad.ad_id)}>
                      {isOpen ? '▲' : '▼'}

                  </td>
                </tr>
                {isOpen && (
                  <tr>
                    <td colSpan={11} style={{background:'#f8f9fa',padding:'10px 16px'}}>
                      <div style={{fontSize:11,color:'var(--text-muted)',marginBottom:6}}>
                        <strong>Type:</strong> {ad.ad_type||'—'} &nbsp;|&nbsp;
                        <strong>ID:</strong> {ad.ad_id} &nbsp;|&nbsp;
                        <strong>Final URL:</strong> {ad.final_url ? <a href={ad.final_url} target="_blank" rel="noreferrer" style={{color:'var(--teal)'}}>{ad.final_url}</a> : '—'}
                      </div>
                      {/* RSA assets */}
                      {headlines.length > 0 && (
                        <div style={{marginBottom:8}}>
                          <div style={{fontSize:11,fontWeight:600,marginBottom:4}}>Headlines ({headlines.length})</div>
                          <div style={{display:'flex',flexWrap:'wrap',gap:4}}>
                            {headlines.map((h,i) => (
                              <span key={i} style={{background:'#e8f4f4',color:'var(--teal-dark)',fontSize:10,padding:'2px 7px',borderRadius:3}}>
                                {h.text}{h.pinned && h.pinned !== 'UNSPECIFIED' ? <em style={{color:'var(--text-muted)'}}> (pin {h.pinned})</em> : ''}
                              </span>

                          </div>

                      )}
                      {descriptions.length > 0 && (
                        <div style={{marginBottom:4}}>
                          <div style={{fontSize:11,fontWeight:600,marginBottom:4}}>Descriptions ({descriptions.length})</div>
                          <div style={{display:'flex',flexWrap:'wrap',gap:4}}>

                              </span>
                            ))}
                          </div>
                        </div>
                      )}
                      {/* ETA fallback */}
                      {headlines.length === 0 && (h1||h2||h3) && (
                        <div style={{marginBottom:8}}>
                          <div style={{fontSize:11,fontWeight:600,marginBottom:4}}>Headlines</div>
                          <div style={{display:'flex',flexWrap:'wrap',gap:4}}>
                            {[h1,h2,h3].filter(Boolean).map((h,i)=>(
                              <span key={i} style={{background:'#e8f4f4',color:'var(--teal-dark)',fontSize:10,padding:'2px 7px',borderRadius:3}}>{h}</span>
                            ))}
                          </div>
                        </div>
                      )}
                      {headlines.length === 0 && (d1||d2) && (
                        <div>
                          <div style={{fontSize:11,fontWeight:600,marginBottom:4}}>Descriptions</div>
                          <div style={{display:'flex',flexWrap:'wrap',gap:4}}>
                            {[d1,d2].filter(Boolean).map((d,i)=>(
                              <span key={i} style={{background:'#fef9c3',color:'#854d0e',fontSize:10,padding:'2px 7px',borderRadius:3}}>{d}</span>
                            ))}
                          </div>
                        </div>
                      )}
                    </td>
                  </tr>
                )}
              </React.Fragment>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

// ─── AI Campaign sub-tab (REMOVED — AI is now built into campaign wizard) ──
// function AICampaignView() {  ← kept as comment to preserve line refs
function _AICampaignView_REMOVED() {
  // Section 1 — Strategy (Opus)
  const [goal, setGoal] = useState('');
  const [targetService, setTargetService] = useState('All-on-4 Implants');
  const [customService, setCustomService] = useState('');
  const [budgetHint, setBudgetHint] = useState('');
  const [stratLoading, setStratLoading] = useState(false);
  const [stratErr, setStratErr] = useState('');
  const [strategy, setStrategy] = useState(null);
  const [strategyModel, setStrategyModel] = useState('');

  // Section 2 — Implementation (Haiku/Sonnet)
  const [deliverable, setDeliverable] = useState('full_package');
  const [implModel, setImplModel] = useState('haiku');
  const [implLoading, setImplLoading] = useState(false);
  const [implErr, setImplErr] = useState('');
  const [implementation, setImplementation] = useState(null);
  const [implModelUsed, setImplModelUsed] = useState('');

  // Section 3 — Performance Analysis (Opus)
  const [analysisDays, setAnalysisDays] = useState(30);
  const [analysisFocus, setAnalysisFocus] = useState('overall');
  const [analysisLoading, setAnalysisLoading] = useState(false);
  const [analysisErr, setAnalysisErr] = useState('');
  const [analysis, setAnalysis] = useState(null);
  const [analysisModel, setAnalysisModel] = useState('');

  async function generateStrategy() {
    setStratErr(''); setStrategy(null); setImplementation(null);
    if (!goal.trim()) { setStratErr('Please describe the campaign goal.'); return; }
    setStratLoading(true);
    try {
      const service = targetService === 'Custom' ? (customService.trim() || 'Custom') : targetService;
      const res = await api('/api/admin/ai/campaign-strategy', {
        method: 'POST',
        body: JSON.stringify({
          campaign_goal: goal.trim(),
          target_service: service,
          budget_hint: budgetHint.trim(),
          additional_context: '',
        }),
      });
      setStrategy(res.strategy || null);
      setStrategyModel(res.model_used || '');
    } catch (e) {
      setStratErr(e?.detail || e?.message || 'Strategy generation failed');
    }
    setStratLoading(false);
  }

  async function runImplementation() {
    setImplErr(''); setImplementation(null);
    if (!strategy) { setImplErr('Generate a strategy first.'); return; }
    setImplLoading(true);
    try {
      const res = await api('/api/admin/ai/campaign-implement', {
        method: 'POST',
        body: JSON.stringify({
          strategy,
          deliverable,
          model: implModel,
        }),
      });
      setImplementation(res.content || null);
      setImplModelUsed(res.model_used || '');
    } catch (e) {
      setImplErr(e?.detail || e?.message || 'Implementation failed');
    }
    setImplLoading(false);
  }

  async function runAnalysis() {
    setAnalysisErr(''); setAnalysis(null);
    setAnalysisLoading(true);
    try {
      const res = await api('/api/admin/ai/performance-analysis', {
        method: 'POST',
        body: JSON.stringify({
          time_range_days: analysisDays,
          focus: analysisFocus,
        }),
      });
      setAnalysis(res.analysis || null);
      setAnalysisModel(res.model_used || '');
    } catch (e) {
      setAnalysisErr(e?.detail || e?.message || 'Analysis failed');
    }
    setAnalysisLoading(false);
  }

  function copyText(text) {
    try { navigator.clipboard.writeText(text); } catch(_) {}
  }

  const cardStyle = {
    background:'#fff', border:'1px solid var(--border)', borderRadius:6,
    padding:14, marginBottom:14,
  };
  const sectionTitle = {
    fontSize:13, fontWeight:600, marginBottom:8, color:'var(--text)',
    display:'flex', alignItems:'center', gap:6,
  };
  const labelStyle = { fontSize:11, color:'var(--text-muted)', display:'block', marginBottom:3 };
  const inputStyle = {
    width:'100%', padding:'6px 8px', fontSize:12, border:'1px solid var(--border)',
    borderRadius:4, fontFamily:'inherit',
  };
  const pillGreen = {
    background:'#d1fae5', color:'#065f46', fontSize:10, padding:'3px 8px',
    borderRadius:3, display:'inline-block',
  };
  const pillAmber = {
    background:'#fef3c7', color:'#92400e', fontSize:10, padding:'3px 8px',
    borderRadius:3, display:'inline-block',
  };
  const badge = {
    fontSize:9, padding:'1px 6px', borderRadius:3, marginLeft:6,
    background:'#ede9fe', color:'#5b21b6', fontWeight:600,
  };

  function PriorityBadge({ p }) {
    const pl = (p||'').toLowerCase();
    const colors = {
      high:   { bg:'#fee2e2', fg:'#991b1b' },
      medium: { bg:'#fef3c7', fg:'#92400e' },
      low:    { bg:'#dbeafe', fg:'#1e40af' },
    };
    const c = colors[pl] || colors.low;
    return <span style={{...pillGreen, background:c.bg, color:c.fg}}>{(pl||'low').toUpperCase()}</span>;
  }

  function renderImplementation() {
    if (!implementation) return null;
    const renderAdCopy = (ad) => (
      <div style={{marginBottom:10}}>
        {ad.headlines && ad.headlines.length > 0 && (
          <div style={{marginBottom:8}}>
            <div style={{fontSize:11,fontWeight:600,marginBottom:4}}>Headlines ({ad.headlines.length})</div>
            <div style={{display:'flex',flexWrap:'wrap',gap:4}}>
              {ad.headlines.map((h,i)=>(
                <span key={i} style={{background:'#e8f4f4',color:'var(--teal-dark)',fontSize:10,padding:'2px 7px',borderRadius:3,cursor:'pointer'}}
                  onClick={()=>copyText(h)} title="Click to copy">{h}</span>
              ))}
            </div>
          </div>
        )}
        {ad.descriptions && ad.descriptions.length > 0 && (
          <div style={{marginBottom:8}}>
            <div style={{fontSize:11,fontWeight:600,marginBottom:4}}>Descriptions ({ad.descriptions.length})</div>
            <div style={{display:'flex',flexWrap:'wrap',gap:4}}>
              {ad.descriptions.map((d,i)=>(
                <span key={i} style={{background:'#fef9c3',color:'#854d0e',fontSize:10,padding:'2px 7px',borderRadius:3,cursor:'pointer'}}
                  onClick={()=>copyText(d)} title="Click to copy">{d}</span>
              ))}
            </div>
          </div>
        )}
        {ad.callouts && ad.callouts.length > 0 && (
          <div style={{marginBottom:8}}>
            <div style={{fontSize:11,fontWeight:600,marginBottom:4}}>Callouts ({ad.callouts.length})</div>
            <div style={{display:'flex',flexWrap:'wrap',gap:4}}>
              {ad.callouts.map((c,i)=>(
                <span key={i} style={{background:'#ede9fe',color:'#5b21b6',fontSize:10,padding:'2px 7px',borderRadius:3,cursor:'pointer'}}
                  onClick={()=>copyText(c)} title="Click to copy">{c}</span>
              ))}
            </div>
          </div>
        )}
        {ad.final_url && (
          <div style={{fontSize:11,color:'var(--text-muted)'}}>
            <strong>Final URL:</strong> <a href={ad.final_url} target="_blank" rel="noreferrer" style={{color:'var(--teal)'}}>{ad.final_url}</a>
          </div>
        )}
      </div>
    );

    const renderSequence = (seq, channel) => (
      <div style={{marginBottom:10}}>
        <div style={{fontSize:11,fontWeight:600,marginBottom:6}}>
          {channel === 'sms' ? 'SMS Sequence' : 'Email Sequence'} ({(seq.steps||[]).length} steps)
        </div>
        <ol style={{margin:0,paddingLeft:18}}>
          {(seq.steps||[]).map((s,i)=>(
            <li key={i} style={{marginBottom:8,fontSize:12}}>
              <div style={{fontSize:10,color:'var(--text-muted)',marginBottom:2}}>
                Day {s.sequence_day}{s.subject ? ' — ' + s.subject : ''}
                <button style={{marginLeft:8,padding:'1px 6px',fontSize:9,border:'1px solid var(--border)',
                  borderRadius:3,background:'#fff',cursor:'pointer'}}
                  onClick={()=>copyText(s.body || '')}>Copy</button>
              </div>
              <pre style={{background:'#f8f9fa',padding:8,borderRadius:4,fontSize:11,
                whiteSpace:'pre-wrap',fontFamily:'inherit',margin:0,border:'1px solid var(--border)'}}>{s.body}</pre>
            </li>
          ))}
        </ol>
      </div>
    );

    if (implementation.headlines || implementation.descriptions || implementation.callouts) {
      return renderAdCopy(implementation);
    }
    if (implementation.steps) {
      return renderSequence(implementation, deliverable === 'sms_sequence' ? 'sms' : 'email');
    }
    if (implementation.ad_copy || implementation.sms_sequence || implementation.email_sequence) {
      return (
        <div>
          {implementation.ad_copy && (
            <div style={{marginBottom:14,paddingBottom:10,borderBottom:'1px solid var(--border)'}}>
              <div style={{fontSize:12,fontWeight:600,marginBottom:6,color:'var(--teal-dark)'}}>Ad Copy</div>
              {renderAdCopy(implementation.ad_copy)}
            </div>
          )}
          {implementation.sms_sequence && (
            <div style={{marginBottom:14,paddingBottom:10,borderBottom:'1px solid var(--border)'}}>
              {renderSequence(implementation.sms_sequence, 'sms')}
            </div>
          )}
          {implementation.email_sequence && (
            <div>
              {renderSequence(implementation.email_sequence, 'email')}
            </div>
          )}
        </div>
      );
    }
    // Fallback: dump JSON
    return <pre style={{background:'#f8f9fa',padding:8,borderRadius:4,fontSize:10,
      maxHeight:300,overflow:'auto'}}>{JSON.stringify(implementation,null,2)}</pre>;
  }

  return (
    <div>
      {/* ── Section 1: Strategy (Opus) ── */}
      <div style={cardStyle}>
        <div style={sectionTitle}>
          <span>1. Campaign Strategy</span>
          <span style={badge}>OPUS</span>
        </div>
        <div style={{fontSize:11,color:'var(--text-muted)',marginBottom:10}}>
          Opus researches your practice info, Google Ads performance, and pipeline metrics, then produces
          a structured campaign plan with explicit instructions for the implementer.
        </div>

        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:10}}>
          <div>
            <label style={labelStyle}>Target service</label>
            <select style={inputStyle} value={targetService} onChange={e=>setTargetService(e.target.value)}>
              <option>All-on-4 Implants</option>
              <option>Single Implants</option>
              <option>Orthodontics</option>
              <option>General Dentistry</option>
              <option>Cosmetic / Smile Makeover</option>
              <option>Custom</option>
            </select>
            {targetService === 'Custom' && (
              <input style={{...inputStyle,marginTop:4}} placeholder="Specify service..."
                value={customService} onChange={e=>setCustomService(e.target.value)} />
            )}
          </div>
          <div>
            <label style={labelStyle}>Budget hint (optional)</label>
            <input style={inputStyle} placeholder="e.g. $5k/mo Google Ads"
              value={budgetHint} onChange={e=>setBudgetHint(e.target.value)} />
          </div>
        </div>

        <div style={{marginBottom:10}}>
          <label style={labelStyle}>Campaign goal</label>
          <textarea style={{...inputStyle,minHeight:64,resize:'vertical'}}
            placeholder="e.g. Increase All-on-4 implant consultations from local 55+ patients in Worcester County"
            value={goal} onChange={e=>setGoal(e.target.value)} />
        </div>

        <button className="btn btn-teal btn-sm" onClick={generateStrategy} disabled={stratLoading}>
          {stratLoading ? '⏳ Opus is researching… (~30-60s)' : 'Generate Strategy (Opus)'}
        </button>
        {stratLoading && (
          <div style={{fontSize:10,color:'var(--text-muted)',marginTop:4}}>
            Opus is analyzing your pipeline, campaigns, and Google Ads data. This may take up to a minute.
          </div>
        )}
        {stratErr && <div style={{color:'var(--red)',fontSize:11,marginTop:6}}>{stratErr}</div>}

        {strategy && (
          <div style={{marginTop:14,paddingTop:12,borderTop:'1px solid var(--border)'}}>
            <div style={{fontSize:13,fontWeight:600,marginBottom:6}}>{strategy.campaign_name}</div>
            {strategyModel && <div style={{fontSize:9,color:'var(--text-muted)',marginBottom:8}}>Model: {strategyModel}</div>}

            <div style={{marginBottom:8}}>
              <div style={{fontSize:11,fontWeight:600,marginBottom:2}}>Objective</div>
              <div style={{fontSize:12,color:'var(--text)'}}>{strategy.objective}</div>
            </div>

            <div style={{marginBottom:8}}>
              <div style={{fontSize:11,fontWeight:600,marginBottom:2}}>Target Audience</div>
              <div style={{fontSize:12,color:'var(--text)'}}>{strategy.target_audience}</div>
            </div>

            {strategy.key_messages && strategy.key_messages.length > 0 && (
              <div style={{marginBottom:8}}>
                <div style={{fontSize:11,fontWeight:600,marginBottom:4}}>Key Messages</div>
                <ul style={{margin:0,paddingLeft:18,fontSize:12}}>
                  {strategy.key_messages.map((m,i)=>(<li key={i} style={{marginBottom:2}}>{m}</li>))}
                </ul>
              </div>
            )}

            {strategy.ad_headlines && strategy.ad_headlines.length > 0 && (
              <div style={{marginBottom:8}}>
                <div style={{fontSize:11,fontWeight:600,marginBottom:4}}>Ad Headlines</div>
                <div style={{display:'flex',flexWrap:'wrap',gap:4}}>
                  {strategy.ad_headlines.map((h,i)=>(
                    <span key={i} style={pillGreen}>{h}</span>
                  ))}
                </div>
              </div>

            {strategy.ad_descriptions && strategy.ad_descriptions.length > 0 && (
              <div style={{marginBottom:8}}>
                <div style={{fontSize:11,fontWeight:600,marginBottom:4}}>Ad Descriptions</div>
                <div style={{display:'flex',flexWrap:'wrap',gap:4}}>
                  {strategy.ad_descriptions.map((d,i)=>(
                    <span key={i} style={pillAmber}>{d}</span>
                  ))}
                </div>
              </div>
            )}

            {strategy.sms_sequence_brief && (
              <div style={{marginBottom:8}}>
                <div style={{fontSize:11,fontWeight:600,marginBottom:2}}>SMS Sequence Brief</div>
                <div style={{fontSize:12,color:'var(--text)'}}>{strategy.sms_sequence_brief}</div>
              </div>
            )}

            {strategy.email_sequence_brief && (
              <div style={{marginBottom:8}}>
                <div style={{fontSize:11,fontWeight:600,marginBottom:2}}>Email Sequence Brief</div>
                <div style={{fontSize:12,color:'var(--text)'}}>{strategy.email_sequence_brief}</div>
              </div>

            {strategy.implementation_instructions && (
              <details style={{marginTop:6}}>
                <summary style={{fontSize:11,fontWeight:600,cursor:'pointer'}}>Implementation instructions for Haiku/Sonnet</summary>
                <div style={{fontSize:11,color:'var(--text-muted)',marginTop:4,whiteSpace:'pre-wrap'}}>
                  {strategy.implementation_instructions}
                </div>
              </details>
            )}
          </div>
        )}
      </div>

      {/* ── Section 2: Implementation (Haiku/Sonnet) ── */}
      {strategy && (
        <div style={cardStyle}>
          <div style={sectionTitle}>
            <span>2. Implement Deliverables</span>
            <span style={{...badge,background:'#dbeafe',color:'#1e40af'}}>HAIKU / SONNET</span>
          </div>
          <div style={{fontSize:11,color:'var(--text-muted)',marginBottom:10}}>

          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:10}}>
            <div>
              <label style={labelStyle}>Deliverable</label>
              <select style={inputStyle} value={deliverable} onChange={e=>setDeliverable(e.target.value)}>
                <option value="full_package">Full Package (ad + SMS + email)</option>
                <option value="ad_copy">Ad Copy only</option>
                <option value="sms_sequence">SMS Sequence only</option>
                <option value="email_sequence">Email Sequence only</option>
              </select>
            </div>
            <div>
              <label style={labelStyle}>Model</label>
              <select style={inputStyle} value={implModel} onChange={e=>setImplModel(e.target.value)}>
                <option value="haiku">Haiku (fast)</option>
                <option value="sonnet">Sonnet (thorough)</option>
              </select>
            </div>
          </div>

          <button className="btn btn-teal btn-sm" onClick={runImplementation} disabled={implLoading}>
            {implLoading ? `⏳ ${implModel === 'sonnet' ? 'Sonnet' : 'Haiku'} is implementing…` : 'Implement'}
          </button>
          {implLoading && deliverable === 'full_package' && (
            <div style={{fontSize:10,color:'var(--text-muted)',marginTop:4}}>
              Full package includes ad copy, SMS sequence, and email sequence. Sonnet may take 20-40s.
            </div>
          )}
          {implErr && <div style={{color:'var(--red)',fontSize:11,marginTop:6}}>{implErr}</div>}

          {implementation && (
            <div style={{marginTop:14,paddingTop:12,borderTop:'1px solid var(--border)'}}>
              {implModelUsed && <div style={{fontSize:9,color:'var(--text-muted)',marginBottom:8}}>Model: {implModelUsed}</div>}
              {renderImplementation()}
            </div>
          )}
        </div>
      )}

      {/* ── Section 3: Performance Analysis (Opus) ── */}
      <div style={cardStyle}>
        <div style={sectionTitle}>
          <span>3. Performance Analysis</span>
          <span style={badge}>OPUS</span>
        </div>
        <div style={{fontSize:11,color:'var(--text-muted)',marginBottom:10}}>
          Opus reviews your pipeline + Google Ads performance and returns prioritized action items.
        </div>

        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:10}}>
          <div>
            <label style={labelStyle}>Time range</label>
            <select style={inputStyle} value={analysisDays} onChange={e=>setAnalysisDays(parseInt(e.target.value,10))}>
              <option value={7}>Last 7 days</option>
              <option value={14}>Last 14 days</option>
              <option value={30}>Last 30 days</option>
              <option value={60}>Last 60 days</option>
            </select>
          </div>
          <div>
            <label style={labelStyle}>Focus</label>
            <select style={inputStyle} value={analysisFocus} onChange={e=>setAnalysisFocus(e.target.value)}>
              <option value="overall">Overall</option>
              <option value="google_ads">Google Ads</option>
              <option value="leads">Leads</option>
              <option value="conversions">Conversions</option>
            </select>
          </div>
        </div>

        <button className="btn btn-teal btn-sm" onClick={runAnalysis} disabled={analysisLoading}>
          {analysisLoading ? '⏳ Opus is analyzing… (~30-60s)' : 'Analyze Performance (Opus)'}
        </button>
        {analysisLoading && (
          <div style={{fontSize:10,color:'var(--text-muted)',marginTop:4}}>
            Opus is reviewing your pipeline and Google Ads data. This may take up to a minute.
          </div>
        )}
        {analysisErr && <div style={{color:'var(--red)',fontSize:11,marginTop:6}}>{analysisErr}</div>}

        {analysis && (
          <div style={{marginTop:14,paddingTop:12,borderTop:'1px solid var(--border)'}}>
            {analysisModel && <div style={{fontSize:9,color:'var(--text-muted)',marginBottom:8}}>Model: {analysisModel}</div>}

            <div style={{marginBottom:10,padding:10,background:'#f0f9ff',borderRadius:4,
              borderLeft:'3px solid #0284c7'}}>
              <div style={{fontSize:11,fontWeight:600,marginBottom:4}}>Summary</div>
              <div style={{fontSize:12,color:'var(--text)'}}>{analysis.summary}</div>
            </div>

            {analysis.wins && analysis.wins.length > 0 && (
              <div style={{marginBottom:10}}>
                <div style={{fontSize:11,fontWeight:600,marginBottom:4,color:'#065f46'}}>Wins</div>
                <ul style={{margin:0,paddingLeft:18,fontSize:12}}>
                  {analysis.wins.map((w,i)=>(<li key={i} style={{marginBottom:3,color:'#065f46'}}>{w}</li>))}
                </ul>
              </div>
            )}

            {analysis.concerns && analysis.concerns.length > 0 && (
              <div style={{marginBottom:10}}>
                <div style={{fontSize:11,fontWeight:600,marginBottom:4,color:'#92400e'}}>Concerns</div>
                <ul style={{margin:0,paddingLeft:18,fontSize:12}}>
                  {analysis.concerns.map((c,i)=>(<li key={i} style={{marginBottom:3,color:'#92400e'}}>{c}</li>))}
                </ul>
              </div>
            )}

            {analysis.action_items && analysis.action_items.length > 0 && (() => {
              const order = { high: 0, medium: 1, low: 2 };
              const sorted = [...analysis.action_items].sort((a,b)=>
                (order[(a.priority||'low').toLowerCase()] ?? 9) -
                (order[(b.priority||'low').toLowerCase()] ?? 9)
              );
              return (
                <div style={{marginBottom:10}}>
                  <div style={{fontSize:11,fontWeight:600,marginBottom:4}}>Action Items</div>
                  {sorted.map((it,i)=>(
                    <div key={i} style={{padding:8,marginBottom:6,background:'#f8f9fa',borderRadius:4,
                      border:'1px solid var(--border)'}}>
                      <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:3}}>
                        <PriorityBadge p={it.priority} />
                        <span style={{fontSize:12,fontWeight:600}}>{it.action}</span>
                      </div>
                      {it.rationale && (
                        <div style={{fontSize:11,color:'var(--text-muted)',marginLeft:2}}>{it.rationale}</div>
                      )}
                    </div>
                  ))}
                </div>
              );
            })()}

            {analysis.implementation_prompt && (
              <details style={{marginTop:6}}>
                <summary style={{fontSize:11,fontWeight:600,cursor:'pointer'}}>Implementation prompt for Haiku</summary>
                <div style={{fontSize:11,color:'var(--text-muted)',marginTop:4,whiteSpace:'pre-wrap'}}>
                  {analysis.implementation_prompt}
                </div>
              </details>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

  async function loadUnifiedCamps() {
    setUnifiedLoading(true);
    try {
      const d = await api(`/api/admin/campaigns/unified?days=${unifiedDays}&include_inactive=${showInactive}`);
      setUnifiedCamps(d.campaigns || []);
    } catch(e) { console.error('Failed to load unified campaigns', e); }
    finally { setUnifiedLoading(false); }
  }
  useEffect(() => { loadUnifiedCamps(); }, [unifiedDays, showInactive]);

  async function toggleAiReview(camp) {
    if (!camp.campaign_id || camp.is_synthetic) return;
    const next = !camp.ai_review_enabled;
    setUnifiedCamps(prev => prev.map(r =>
      r.campaign_id === camp.campaign_id ? {...r, ai_review_enabled: next} : r));
    setAiReviewSaving(p => ({...p, [camp.campaign_id]: true}));
    try {
      await api(`/api/admin/campaigns/${camp.campaign_id}/ai-review`, {
        method: 'PATCH', body: JSON.stringify({enabled: next}),
      });
    } catch(e) {
      setUnifiedCamps(prev => prev.map(r =>
        r.campaign_id === camp.campaign_id ? {...r, ai_review_enabled: !next} : r));
      alert('Could not update AI Review: ' + (e?.detail || e?.message));
    } finally {
      setAiReviewSaving(p => ({...p, [camp.campaign_id]: false}));
    }
  }

  async function toggleAiMax(camp) {
    if (!camp.campaign_id || camp.is_synthetic) return;
    const next = !camp.ai_max_enabled;

    // Confirm before enabling — AI Max can expand spend significantly
    if (next) {
      const confirmed = window.confirm(
        `Enable AI Max for "${camp.campaign_name}"?\n\n` +
        `This allows Google's AI to expand your campaign beyond your keyword list. ` +
        `Spend may increase as more searches become eligible.\n\n` +
        `Recommended: run for 30 days and review CPL before making permanent.`
      );
      if (!confirmed) return;
    }

    // Optimistic update
    setUnifiedCamps(prev => prev.map(r =>
      r.campaign_id === camp.campaign_id ? {...r, ai_max_enabled: next} : r));
    setAiMaxSaving(p => ({...p, [camp.campaign_id]: true}));
    try {
      await api(`/api/admin/campaigns/${camp.campaign_id}/ai-max`, {
        method: 'PATCH', body: JSON.stringify({enabled: next}),
      });
    } catch(e) {
      // Revert on failure
      setUnifiedCamps(prev => prev.map(r =>
        r.campaign_id === camp.campaign_id ? {...r, ai_max_enabled: !next} : r));
      alert('Could not update AI Max: ' + (e?.detail || e?.message || 'Unknown error'));
    } finally {
      setAiMaxSaving(p => ({...p, [camp.campaign_id]: false}));
    }
  }

  // Keep loadManagedCamps as alias so wizard + other callers still work
  async function loadManagedCamps() { await loadUnifiedCamps(); }

  async function openCampaignDetail(campId, days) {
    const d = days || campDetailDays || 30;
    const isSameCampaign = campDetail?.campaign?.campaign_id === campId;
    setCampDetailLoading(true);
    setCampDetail(null);
    // Only reset tab + local write-state when opening a different campaign
    if (!isSameCampaign) {
      setDetailTab('strategy');
      setNegatedTerms(new Set());
      setAgStatusOverride({});
      setBudgetEdit(null);
      setBudgetEditValue('');
      setAddKwPopover(null);
      setAddKwText('');
      setAddKwMatchType('EXACT');
      setGeoEditOpen(false);
      setGeoEditDraft('');
      setGeoSaving(false);
    }
    setBuildLoading('');
    setCampEditMode(false);
    setCampEditFields({});
    setRefineInput('');
    setRefinedPreview(null);
    try {
      const data = await api(`/api/admin/campaigns/${campId}/detail?days=${d}`);
      setCampDetail(data);
      setCampDetailDays(d);
    } catch(e) {
      alert('Could not load campaign detail: ' + (e?.detail || e?.message));
    } finally {
      setCampDetailLoading(false);
    }
  }

  async function negateSearchTerm(campId, keywordText, matchType) {
    setNegateLoading(true);
    try {
      await api(`/api/admin/campaigns/${campId}/negative-keywords`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({keyword_text: keywordText, match_type: matchType}),
      });
      setNegatedTerms(prev => new Set([...prev, keywordText]));
      setNegatePopover(null);
    } catch(e) {
      alert('Negate failed: ' + (e?.detail || e?.message || 'Unknown error'));
    } finally {
      setNegateLoading(false);
    }
  }

  async function toggleAdGroupStatus(campId, agResourceName, agName, currentStatus) {
    const newStatus = currentStatus === 'PAUSED' ? 'ENABLED' : 'PAUSED';
    if (currentStatus === 'ENABLED') {
      if (!window.confirm(`Pause "${agName}"? Ads in this group will stop serving immediately.`)) return;
    }
    setAgStatusLoading(prev => ({...prev, [agResourceName]: true}));
    try {
      await api('/api/admin/ad-groups/set-status', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          ad_group_resource: agResourceName,
          status: newStatus,
          ad_group_name: agName,
          campaign_id: campId,
        }),
      });
      setAgStatusOverride(prev => ({...prev, [agResourceName]: newStatus}));
    } catch(e) {
      alert('Status change failed: ' + (e?.detail || e?.message || 'Unknown error'));
    } finally {
      setAgStatusLoading(prev => ({...prev, [agResourceName]: false}));
    }
  }

  // PR 2: Save daily budget
  async function saveBudget(campId) {
    const usd = parseFloat(budgetEditValue);
    if (!usd || usd < 1) { alert('Minimum budget is $1.00/day'); return; }
    setBudgetSaving(true);
    try {
      await api(`/api/admin/campaigns/${campId}/set-budget`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          campaign_resource: budgetEdit.campaign_resource,
          new_daily_budget_usd: usd,
          current_daily_budget_usd: budgetEdit.current_usd || 0,
        }),
      });
      alert(`✓ Budget updated to $${usd.toFixed(2)}/day`);
      setBudgetEdit(null);
      setBudgetEditValue('');
      // Reload detail so displayed budget reflects the write
      openCampaignDetail(campId, campDetailDays);
    } catch(e) {
      alert('Budget update failed: ' + (e?.detail || e?.message || 'Unknown error'));
    } finally {
      setBudgetSaving(false);
    }
  }

  // PR 2: Add positive keyword to ad group
  async function addKeyword(campId) {
    const text = addKwText.trim();
    if (!text) return;
    setAddKwLoading(true);
    try {
      await api('/api/admin/ad-groups/add-keyword', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          ad_group_resource: addKwPopover.ad_group_resource,
          ad_group_name: addKwPopover.ad_group_name,
          keyword_text: text,
          match_type: addKwMatchType,
          cpc_bid_micros: 0,
        }),
      });
      alert(`✓ Added [${addKwMatchType}] "${text}" to ${addKwPopover.ad_group_name || 'ad group'}`);
      setAddKwPopover(null);
      setAddKwText('');
      setAddKwMatchType('EXACT');
    } catch(e) {
      alert('Add keyword failed: ' + (e?.detail || e?.message || 'Unknown error'));
    } finally {
      setAddKwLoading(false);
    }
  }

  // PR 3: Save geographic targeting to Google Ads
  async function saveLocations(campId) {
    const cd = campDetail;
    const campResource = cd?.campaign?.gads_campaign_resource;
    if (!campResource) { alert('No campaign resource found'); return; }
    let parsed;
    try { parsed = JSON.parse(geoEditDraft); } catch(e) { alert('Invalid geo data'); return; }
    const locs = parsed?.locations || [];
    if (!locs.length) { alert('Add at least one location before saving'); return; }
    setGeoSaving(true);
    try {
      const res = await api(`/api/admin/campaigns/${campId}/set-locations`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({campaign_resource: campResource, geo_json: geoEditDraft}),
      });
      const warn = res.errors?.length ? `\n⚠️ Soft errors: ${res.errors.join(', ')}` : '';
      alert(`✓ Locations updated (removed ${res.removed}, added ${res.added})${warn}`);
      setGeoEditOpen(false);
      setGeoEditDraft('');
      openCampaignDetail(campId, campDetailDays);
    } catch(e) {
      alert('Location update failed: ' + (e?.detail || e?.message || 'Unknown error'));
    } finally {
      setGeoSaving(false);
    }

  async function syncCampaignPerf(campId) {
    setSyncPerfLoading(true);
    setSyncPerfResult(null);
    try {
      const res = await api(`/api/admin/campaigns/${campId}/sync-perf`, {method:'POST'});
      setSyncPerfResult(res);
      // Reload detail data so tables update
      await openCampaignDetail(campId, campDetailDays);
    } catch(e) {
      setSyncPerfResult({ok:false, errors:[e?.detail || e?.message || 'Unknown error']});

      setSyncPerfLoading(false);

  async function openGadsImport() {
    setGadsImportOpen(true);
    setGadsImportList([]);
    setGadsImportSelected(new Set());
    setGadsLinkMap({});
    setGadsUnlinkedLocal([]);
    setGadsImportLoading(true);
    try {
      const data = await api('/api/admin/gads/list-campaigns');
      setGadsImportList(data.campaigns || []);
      setGadsUnlinkedLocal(data.unlinked_local_campaigns || []);
    } catch(e) {
      alert('Could not fetch Google Ads campaigns: ' + (e?.detail || e?.message));
      setGadsImportOpen(false);
    } finally {
      setGadsImportLoading(false);
    }
  }

  async function doGadsImport() {
    if (gadsImportSelected.size === 0) return;
    setGadsImporting(true);
    try {
      // Split selected rows: those with a link target → /link-campaign; rest → /import-campaigns
      const linkPairs = [];
      const createIds = [];
      for (const gid of gadsImportSelected) {
        if (gadsLinkMap[gid]) linkPairs.push({ gads_campaign_id: gid, local_campaign_id: gadsLinkMap[gid] });
        else createIds.push(gid);
      }

      let linked = 0;
      const linkErrors = [];
      for (const pair of linkPairs) {
        try {
          await api('/api/admin/gads/link-campaign', { method: 'POST', body: JSON.stringify(pair) });
          linked++;
        } catch(e) {
          linkErrors.push(e?.detail || e?.message || 'Unknown error');
        }
      }

      let importResult = { imported: [], skipped: [], errors: [] };
      if (createIds.length > 0) {
        importResult = await api('/api/admin/gads/import-campaigns', {
          method: 'POST',
          body: JSON.stringify({ campaign_ids: createIds }),
        });
      }

      const msg = [
        linked                          ? `🔗 Linked ${linked}` : null,
        importResult.imported?.length   ? `✅ Imported ${importResult.imported.length}` : null,
        importResult.skipped?.length    ? `⏭ ${importResult.skipped.length} already imported` : null,
        importResult.errors?.length     ? `❌ ${importResult.errors.length} import error(s)` : null,
        linkErrors.length               ? `❌ ${linkErrors.length} link error(s): ${linkErrors[0]}` : null,
      ].filter(Boolean).join(' · ');
      alert(msg || 'Done');
      setGadsImportOpen(false);
      await loadUnifiedCamps();
    } catch(e) {
      alert('Import failed: ' + (e?.detail || e?.message));
    } finally {
      setGadsImporting(false);
    }
  }

    setCampActionLoading(prev => ({...prev, [campId]: action}));
    try {
      await api(`/api/admin/campaigns/${campId}/${action}`, { method: 'POST' });
