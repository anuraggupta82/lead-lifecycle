      const wfs = d.workflows || [];
      setWorkflows(wfs);
      if (wfs.length > 0) setAddWfId(String(wfs[0].id));
    }).catch(() => {});
  }, []);

  // Update default day when workflow selection changes
  React.useEffect(() => {
    if (!addWfId) return;
    const wf = workflows.find(w => String(w.id) === addWfId);
    if (!wf) return;
    const steps = wf.steps || [];
    const maxDay = steps.length > 0 ? Math.max(...steps.map(s => s.sequence_day)) : 0;
    setAddDay(maxDay > 0 ? maxDay + 3 : 1);
  }, [addWfId, workflows]);

  // Auto-generate template name slug when result arrives
  React.useEffect(() => {
    if (result) {
      const ts = Date.now().toString().slice(-6);
      setAddTplName(`ai_${result.channel}_${apptType}_${ts}`);
    }
  }, [result]);

  function insertToken(token) {
    // Try to insert at cursor in whichever textarea is focused
    const ta = document.activeElement;
    if (ta && (ta === bodyRef.current || ta === subjectRef.current)) {
      const start = ta.selectionStart;
      const end   = ta.selectionEnd;
      const val   = ta.value;
      const newVal = val.slice(0, start) + token + val.slice(end);
      if (ta === bodyRef.current) {
        setEditBody(newVal);
      } else {
        setEditSubject(newVal);
      }
      // Restore cursor after token
      requestAnimationFrame(() => {
        ta.focus();
        ta.setSelectionRange(start + token.length, start + token.length);
      });
    } else {
      // Append to body if nothing focused
      setEditBody(b => b + token);
    }
  }

  async function generate() {
    if (!prompt.trim()) return;
    setGenerating(true); setError(''); setResult(null);
    try {
      const r = await api('/api/admin/workflow/ai-generate-message', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ channel, appointment_type: apptType, prompt }),
      });
      setResult(r);
      setEditSubject(r.subject || '');
      setEditBody(r.body || '');
      setSuccess('');
    } catch(e) { setError(e.message); }
    setGenerating(false);
  }

  async function addToWorkflow() {
    if (!addWfId || !editBody.trim() || !addTplName.trim()) return;
    setSavingAdd(true); setError(''); setSuccess('');
    try {
      await api('/api/admin/workflow-steps', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          workflow_id: parseInt(addWfId),
          sequence_day: parseInt(addDay) || 1,
          channel: result.channel,
          template_name: addTplName.trim(),
          subject: editSubject.trim(),
          body: editBody.trim(),
          terminal: false,
        }),
      });
      // Refresh workflow steps count
      const fresh = await api('/api/admin/workflows');
      setWorkflows(fresh.workflows || []);
      setSuccess(`✅ Step added to workflow on day ${addDay}`);
    } catch(e) { setError(e.message); }
    setSavingAdd(false);
  }

  async function createAndAddWorkflow() {
    if (!newWfName.trim() || !editBody.trim()) return;
    setSavingNew(true); setError(''); setSuccess('');
    try {
      const wf = await api('/api/admin/workflows', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ name: newWfName.trim(), campaign_tag: '', description: '' }),
      });
      await api('/api/admin/workflow-steps', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          workflow_id: wf.id,
          sequence_day: 1,
          channel: result.channel,
          template_name: addTplName.trim(),
          subject: editSubject.trim(),
          body: editBody.trim(),
          terminal: false,
        }),
      });
      const fresh = await api('/api/admin/workflows');
      setWorkflows(fresh.workflows || []);
      setAddWfId(String(wf.id));
      setSuccess(`✅ New workflow "${newWfName.trim()}" created with this message as Day 1`);
      setNewWfName('');
    } catch(e) { setError(e.message); }
    setSavingNew(false);
  }

  function reset() {
    setResult(null); setEditSubject(''); setEditBody('');
    setPrompt(''); setError(''); setSuccess('');
  }

  const APPT_TYPES = [
    ['general','General'], ['consult','Consultation'], ['exam','New Patient Exam'],
    ['implant','Implant'], ['ortho','Ortho / Invisalign'],
  ];

  const TOKENS = [
    ['{first_name}', 'First Name'],
    ['{unsub_url}',  'Unsub URL'],
  ];

  const inputSt = {width:'100%',padding:'4px 8px',fontSize:11,border:'1px solid var(--border)',borderRadius:4,fontFamily:'inherit'};

  return (
    <div style={{display:'flex',gap:16,height:'calc(100vh - 140px)',overflow:'hidden'}}>
      {/* Left: generator controls */}
      <div style={{width:280,display:'flex',flexDirection:'column',gap:10,overflowY:'auto'}}>
        <div style={{background:'#fff',border:'1px solid var(--border)',borderRadius:8,padding:14}}>
          <div style={{fontWeight:700,fontSize:12,color:'var(--teal-dark)',marginBottom:10}}>✨ Generate Message</div>

          <div style={{marginBottom:8}}>
            <label style={{fontSize:10,fontWeight:600,color:'var(--text-muted)',display:'block',marginBottom:3}}>Channel</label>
            <div style={{display:'flex',gap:4}}>
              {['email','sms'].map(c => (
                <button key={c} onClick={() => setChannel(c)}
                  className={'btn btn-sm ' + (channel === c ? 'btn-teal' : 'btn-ghost')}
                  style={{flex:1,textTransform:'capitalize'}}>
                  {c === 'email' ? '✉ Email' : '💬 SMS'}
                </button>
              ))}
            </div>
          </div>

          <div style={{marginBottom:8}}>
            <label style={{fontSize:10,fontWeight:600,color:'var(--text-muted)',display:'block',marginBottom:3}}>Appointment Type</label>
            <select value={apptType} onChange={e => setApptType(e.target.value)} style={{...inputSt}}>
              {APPT_TYPES.map(([v,l]) => <option key={v} value={v}>{l}</option>)}
            </select>
          </div>

          <div style={{marginBottom:10}}>
            <label style={{fontSize:10,fontWeight:600,color:'var(--text-muted)',display:'block',marginBottom:3}}>Goal / Description</label>
            <textarea value={prompt} rows={5} onChange={e => setPrompt(e.target.value)}
              placeholder={'Example: Re-engage patient who saw our smile preview but hasn\'t booked. Emphasize that their smile transformation is waiting.'}
              style={{...inputSt,resize:'vertical'}} />
          </div>

          <button className="btn btn-teal btn-sm" style={{width:'100%'}}
            onClick={generate} disabled={generating || !prompt.trim()}>
            {generating ? 'Generating…' : '✨ Generate with AI'}
          </button>

          {result && (
            <button className="btn btn-ghost btn-sm" style={{width:'100%',marginTop:6}} onClick={reset}>
              ↩ Start Over
            </button>
          )}
        </div>

        {result && (
          <div style={{background:'#fff',border:'1px solid var(--border)',borderRadius:8,padding:14}}>
            <div style={{fontWeight:700,fontSize:12,color:'var(--teal-dark)',marginBottom:8}}>📌 Insert Token</div>
            <div style={{fontSize:10,color:'var(--text-muted)',marginBottom:6}}>
              Click to insert at cursor position in subject or body
            </div>
            <div style={{display:'flex',flexWrap:'wrap',gap:4}}>
              {TOKENS.map(([tok, label]) => (
                <button key={tok} onClick={() => insertToken(tok)}
                  style={{padding:'2px 7px',fontSize:10,borderRadius:4,border:'1px solid var(--teal)',
                    background:'var(--teal-light)',color:'var(--teal-dark)',cursor:'pointer',fontFamily:'monospace'}}>
                  {tok}
                </button>
              ))}
            </div>
          </div>
        )}
      </div>

      {/* Right: editable output + save actions */}
      <div style={{flex:1,display:'flex',flexDirection:'column',gap:10,overflowY:'auto'}}>
        {error && <div style={{background:'#fee2e2',border:'1px solid #fca5a5',borderRadius:6,padding:'6px 10px',fontSize:11,color:'#dc2626'}}>{error}</div>}
        {success && <div style={{background:'#dcfce7',border:'1px solid #86efac',borderRadius:6,padding:'6px 10px',fontSize:11,color:'#15803d'}}>{success}</div>}

        {!result ? (
          <div style={{background:'#fff',border:'1px solid var(--border)',borderRadius:8,padding:32,textAlign:'center',color:'var(--text-muted)',fontSize:12,flex:1}}>
            Configure your message on the left and click Generate.
            <br/><br/>
            <span style={{fontSize:11}}>💡 Practice info from Admin → Practice Information will be baked into the message automatically.</span>
          </div>
        ) : (
          <>
            {/* Editable message */}
            <div style={{background:'#fff',border:'1px solid var(--border)',borderRadius:8,padding:14}}>
              <div style={{fontWeight:700,fontSize:12,color:'var(--teal-dark)',marginBottom:10}}>
                ✏️ Edit Generated Message
                <span style={{fontWeight:400,fontSize:10,color:'var(--text-muted)',marginLeft:8}}>
                  {result.channel === 'email' ? '✉ Email' : '💬 SMS'}
                </span>
              </div>
              {result.channel === 'email' && (
                <div style={{marginBottom:8}}>
                  <label style={{fontSize:10,fontWeight:600,color:'var(--text-muted)',display:'block',marginBottom:2}}>Subject</label>
                  <input ref={subjectRef} value={editSubject} onChange={e => setEditSubject(e.target.value)}
                    style={inputSt} placeholder="Email subject line" />
                </div>
              )}
              <div>
                <label style={{fontSize:10,fontWeight:600,color:'var(--text-muted)',display:'block',marginBottom:2}}>
                  Body {result.channel === 'sms' && <span style={{fontWeight:400,color:'var(--text-muted)'}}>· {editBody.length} chars</span>}
                </label>
                <textarea ref={bodyRef} value={editBody} onChange={e => setEditBody(e.target.value)}
                  rows={result.channel === 'email' ? 10 : 5}
                  style={{...inputSt,resize:'vertical'}} />
              </div>
            </div>

            {/* Template name */}
            <div style={{background:'#fff',border:'1px solid var(--border)',borderRadius:8,padding:14}}>
              <div style={{fontWeight:700,fontSize:12,color:'var(--teal-dark)',marginBottom:6}}>🏷 Template Name</div>
              <div style={{fontSize:11,color:'var(--text-muted)',marginBottom:6}}>Unique slug identifier for this step.</div>
              <input value={addTplName} onChange={e => setAddTplName(e.target.value)}
                style={inputSt} placeholder="e.g. ai_email_consult_001" />
            </div>

            {/* Add to existing workflow */}
            <div style={{background:'#fff',border:'1px solid var(--border)',borderRadius:8,padding:14}}>
              <div style={{fontWeight:700,fontSize:12,color:'var(--teal-dark)',marginBottom:8}}>➕ Add to Existing Workflow</div>
              {workflows.length === 0 ? (
                <div style={{fontSize:11,color:'var(--text-muted)'}}>No workflows yet — create one below.</div>
              ) : (
                <div style={{display:'flex',gap:8,alignItems:'flex-end',flexWrap:'wrap'}}>
                  <div style={{flex:2,minWidth:140}}>
                    <label style={{fontSize:10,fontWeight:600,color:'var(--text-muted)',display:'block',marginBottom:2}}>Workflow</label>
                    <select value={addWfId} onChange={e => setAddWfId(e.target.value)} style={inputSt}>
                      {workflows.map(wf => <option key={wf.id} value={String(wf.id)}>{wf.name}</option>)}
                    </select>
                  </div>
                  <div style={{width:70}}>
                    <label style={{fontSize:10,fontWeight:600,color:'var(--text-muted)',display:'block',marginBottom:2}}>Day</label>
                    <input type="number" min="0" max="365" value={addDay}
                      onChange={e => setAddDay(parseInt(e.target.value)||1)} style={inputSt} />
                  </div>
                  <button className="btn btn-teal btn-sm" onClick={addToWorkflow}
                    disabled={savingAdd || !editBody.trim() || !addTplName.trim()}>
                    {savingAdd ? 'Saving…' : 'Add Step'}
                  </button>
                </div>
              )}
            </div>

            {/* Create new workflow */}
            <div style={{background:'#fff',border:'1px solid var(--border)',borderRadius:8,padding:14}}>
              <div style={{fontWeight:700,fontSize:12,color:'var(--teal-dark)',marginBottom:8}}>🆕 Create New Workflow</div>
              <div style={{display:'flex',gap:8,alignItems:'flex-end'}}>
                <div style={{flex:1}}>
                  <label style={{fontSize:10,fontWeight:600,color:'var(--text-muted)',display:'block',marginBottom:2}}>Workflow Name</label>
                  <input value={newWfName} onChange={e => setNewWfName(e.target.value)}
                    placeholder="e.g. Implant Consult Follow-up" style={inputSt} />
                </div>
                <button className="btn btn-teal btn-sm" onClick={createAndAddWorkflow}
                  disabled={savingNew || !newWfName.trim() || !editBody.trim() || !addTplName.trim()}>
                  {savingNew ? 'Creating…' : 'Create & Add Step'}
                </button>
              </div>
            </div>
          </>
        )}
      </div>
    </div>
  );
}


// ─── WorkflowsSection ────────────────────────────────────────────────────────

// Slugify helper: lowercase, replace non-alphanum runs with _, trim _
function slugify(str) {
  return (str || '').toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
}

function WorkflowsSection() {
  const [subTab, setSubTab] = React.useState('editor'); // 'editor' | 'templates'

  const [workflows, setWorkflows] = React.useState([]);
  const [selectedWfId, setSelectedWfId] = React.useState(null);
  const [steps, setSteps] = React.useState([]);
  const [loading, setLoading] = React.useState(false);
  const [saving, setSaving] = React.useState(false);
  const [copyingId, setCopyingId] = React.useState(null); // wf id being duplicated (null = none)
  const [seeding, setSeeding] = React.useState(false);
  const [error, setError] = React.useState('');
  const [success, setSuccess] = React.useState('');

  // New workflow form
  const [showNewWf, setShowNewWf] = React.useState(false);
  const [newWfName, setNewWfName] = React.useState('');
  const [newWfTag, setNewWfTag] = React.useState('');
  const [newWfTagManual, setNewWfTagManual] = React.useState(false);
  const [newWfDesc, setNewWfDesc] = React.useState('');

  // Edit workflow (rename/tag/desc)
  const [editingWf, setEditingWf] = React.useState(null);
  const [editWfDraft, setEditWfDraft] = React.useState({});

  // Edit step state
  const [editingStep, setEditingStep] = React.useState(null);
  const [stepDraft, setStepDraft] = React.useState({});
  const [stepTnameManual, setStepTnameManual] = React.useState(false);

  // Per-step AI writer
  const [stepAiPrompt, setStepAiPrompt] = React.useState('');
  const [stepAiApptType, setStepAiApptType] = React.useState('consult');
  const [stepAiGenerating, setStepAiGenerating] = React.useState(false);
  const [showStepAi, setShowStepAi] = React.useState(false);

  // Email preview modal
  const [previewStep, setPreviewStep] = React.useState(null);

  // Reset per-step AI state when editing step changes
  const stepEditKey = editingStep ? (editingStep.id ?? `new-${editingStep._key}`) : null;
  React.useEffect(() => {
    setStepAiPrompt('');
    setStepAiGenerating(false);
    setShowStepAi(false);
    setStepTnameManual(false);
  }, [stepEditKey]);

  React.useEffect(() => { loadWorkflows(); }, []);

  async function loadWorkflows() {
    setLoading(true);
    try {
      const data = await api('/api/admin/workflows');
      const wfs = data.workflows || [];
      setWorkflows(wfs);
      if (!selectedWfId && wfs.length > 0) {
        setSelectedWfId(wfs[0].id);
        setSteps(wfs[0].steps || []);
      }
    } catch (e) {
      setError(e.message);
    } finally {
      setLoading(false);
    }
  }

  function selectWorkflow(wf) {
    setSelectedWfId(wf.id);
    setSteps(wf.steps || []);
    setEditingStep(null);
    setEditingWf(null);
    setError(''); setSuccess('');
  }

  // Auto-slugify new workflow name → tag (stops once user manually edits tag)
  function handleNewWfName(val) {
    setNewWfName(val);
    if (!newWfTagManual) setNewWfTag(slugify(val));
  }
  function handleNewWfTag(val) {
    setNewWfTag(val);
    setNewWfTagManual(true);
  }

  async function createWorkflow() {
    if (!newWfName.trim()) return;
    setSaving(true); setError('');
    try {
      const wf = await api('/api/admin/workflows', {
        method: 'POST',
        body: JSON.stringify({ name: newWfName.trim(), campaign_tag: newWfTag.trim(), description: newWfDesc.trim() }),
      });
      setShowNewWf(false); setNewWfName(''); setNewWfTag(''); setNewWfDesc(''); setNewWfTagManual(false);
      const data = await api('/api/admin/workflows');
      const wfs = data.workflows || [];
      setWorkflows(wfs);
      setSelectedWfId(wf.id);
      setSteps([]);
      setEditingStep(null);
      setSuccess('Workflow created');
    } catch (e) { setError(e.message); }
    finally { setSaving(false); }
  }

  async function saveEditWf() {
    if (!editingWf) return;
    if (!(editWfDraft.name || '').trim()) { setError('Workflow name is required'); return; }
    setSaving(true); setError('');
    try {
      await api(`/api/admin/workflows/${editingWf.id}`, {
        method: 'PUT',
        body: JSON.stringify({ name: editWfDraft.name, campaign_tag: editWfDraft.campaign_tag, description: editWfDraft.description }),
      });
      const data = await api('/api/admin/workflows');
      const wfs = data.workflows || [];
      setWorkflows(wfs);
      const updated = wfs.find(w => w.id === editingWf.id);
      if (updated) setSteps(updated.steps || []);
      setEditingWf(null);
      setSuccess('Workflow updated');
    } catch (e) { setError(e.message); }
    finally { setSaving(false); }
  }

  async function copyWorkflow(wfId) {
    setCopyingId(wfId); setError('');
    try {
      const newWf = await api(`/api/admin/workflows/${wfId}/copy`, { method: 'POST' });
      const data = await api('/api/admin/workflows');
      const wfs = data.workflows || [];
      setWorkflows(wfs);
      setSelectedWfId(newWf.id);
      setSteps(newWf.steps || []);
      setEditingStep(null);
      setEditingWf(null); // close rename pane if open
      setSuccess(`Duplicated to "${newWf.name}" — rename and edit steps below`);
    } catch (e) { setError(e.message); }
    finally { setCopyingId(null); }
  }

  async function deleteWorkflow() {
    if (!selectedWfId) return;
    const wf = workflows.find(w => w.id === selectedWfId);
    if (!window.confirm(`Delete "${wf?.name}" and all its steps?`)) return;
    setSaving(true); setError('');
    try {
      await api(`/api/admin/workflows/${selectedWfId}`, { method: 'DELETE' });
      const data = await api('/api/admin/workflows');
      const wfs = data.workflows || [];
      setWorkflows(wfs);
      if (wfs.length > 0) {
        setSelectedWfId(wfs[0].id);
        setSteps(wfs[0].steps || []);
      } else {
        setSelectedWfId(null); setSteps([]);
      }
      setEditingStep(null);
      setSuccess('Workflow deleted');
    } catch (e) { setError(e.message); }
    finally { setSaving(false); }
  }

  async function seedNxtSmile() {
    if (!selectedWfId) return;
    setSeeding(true); setError('');
    try {
      const result = await api(`/api/admin/workflows/${selectedWfId}/seed-nxtsmile`, { method: 'POST' });
      setSteps(result.steps || []);
      const data = await api('/api/admin/workflows');
      setWorkflows(data.workflows || []);
      setSuccess('Loaded 4 nXtSmile email templates');
    } catch (e) { setError(e.message); }
    finally { setSeeding(false); }
  }

  // Auto-update template_name from day+channel unless manually edited
  function openEditStep(step) {
    setEditingStep({ ...step, _key: Date.now() });
    setStepDraft({ ...step });
    setStepTnameManual(!!step.id); // for existing steps, keep their existing name
  }

  function openNewStep() {
    const day = steps.length > 0 ? Math.max(...steps.map(s => s.sequence_day)) + 7 : 1;
    const blank = {
      id: null, workflow_id: selectedWfId,
      sequence_day: day, channel: 'email',
      template_name: `wf${selectedWfId}_d${day}_email`,
      subject: '', body: '', terminal: false, _key: Date.now(),
    };
    setEditingStep(blank);
    setStepDraft({ ...blank });
    setStepTnameManual(false);
  }

  function updateStepDraft(patch) {
    setStepDraft(prev => {
      const next = { ...prev, ...patch };
      // Auto-update template_name if not manually edited and step is new
      if (!stepTnameManual && !prev.id) {
        const day = patch.sequence_day !== undefined ? patch.sequence_day : prev.sequence_day;
        const ch  = patch.channel    !== undefined ? patch.channel    : prev.channel;
        next.template_name = `wf${selectedWfId}_d${day}_${ch}`;
      }
      return next;
    });
  }

  async function saveStep() {
    if (!stepDraft.template_name || !stepDraft.body) {
      setError('Template name and body are required'); return;
    }
    setSaving(true); setError('');
    try {
      const isNew = !stepDraft.id;
      const url = isNew ? '/api/admin/workflow-steps' : `/api/admin/workflow-steps/${stepDraft.id}`;
      await api(url, {
        method: isNew ? 'POST' : 'PUT',
        body: JSON.stringify({
          workflow_id: stepDraft.workflow_id || selectedWfId,
          sequence_day: parseInt(stepDraft.sequence_day) || 1,
          channel: stepDraft.channel,
          template_name: stepDraft.template_name,
          subject: stepDraft.subject || '',
          body: stepDraft.body,
          terminal: !!stepDraft.terminal,
        }),
      });
      setEditingStep(null);
      const wfData = await api(`/api/admin/workflows/${selectedWfId}`);
      setSteps(wfData.steps || []);
      const listData = await api('/api/admin/workflows');
      setWorkflows(listData.workflows || []);
      setSuccess('Step saved');
    } catch (e) { setError(e.message); }
    finally { setSaving(false); }
  }

  async function deleteStep(stepId) {
    if (!window.confirm('Delete this step?')) return;
    setSaving(true); setError('');
    try {
      await api(`/api/admin/workflow-steps/${stepId}`, { method: 'DELETE' });
      setSteps(s => s.filter(x => x.id !== stepId));
      if (editingStep && editingStep.id === stepId) setEditingStep(null);
      const listData = await api('/api/admin/workflows');
      setWorkflows(listData.workflows || []);
      setSuccess('Step deleted');
    } catch (e) { setError(e.message); }
    finally { setSaving(false); }
  }

  async function generateStepAi() {
    if (!stepAiPrompt.trim()) return;
    // Confirm BEFORE the API call to avoid wasting credits
    if (stepDraft.body && stepDraft.body.trim()) {
      if (!window.confirm('Replace the current body with AI-generated content?')) return;
    }
    setStepAiGenerating(true); setError('');
    try {
      const result = await api('/api/admin/workflow/ai-generate-message', {
        method: 'POST',
        body: JSON.stringify({ channel: stepDraft.channel || 'email', appointment_type: stepAiApptType, prompt: stepAiPrompt }),
      });
      setStepDraft(d => ({
        ...d,
        subject: result.subject || d.subject,
        body: result.body || d.body,
      }));
      setShowStepAi(false);
      setStepAiPrompt('');
    } catch (e) { setError(e.message); }
    finally { setStepAiGenerating(false); }
  }

  const selectedWf = workflows.find(w => w.id === selectedWfId);
  const sortedSteps = [...steps].sort((a,b) => a.sequence_day - b.sequence_day);

  // ── Email Preview Modal ───────────────────────────────────────────────────
  function EmailPreviewModal({ step, onClose }) {
    const previewName = 'Jane';
    const body = (step.body || '').replace(/\{first_name\}/g, previewName).replace(/\{unsub_url\}/g, '#unsubscribe');
    const htmlBody = body.replace(/\n/g, '<br/>');
    return (
      <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,.5)', zIndex: 2000, display: 'flex', alignItems: 'center', justifyContent: 'center' }}
        onClick={onClose}>
        <div style={{ background: '#fff', borderRadius: 10, width: 620, maxHeight: '85vh', overflow: 'hidden', display: 'flex', flexDirection: 'column', boxShadow: '0 20px 60px rgba(0,0,0,.3)' }}
          onClick={e => e.stopPropagation()}>
          {/* Header */}
          <div style={{ background: 'var(--teal-dark)', color: '#fff', padding: '12px 16px', display: 'flex', alignItems: 'center', gap: 10, flexShrink: 0 }}>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 11, opacity: .7, marginBottom: 2 }}>Email Preview — {step.template_name}</div>
              <div style={{ fontSize: 14, fontWeight: 700 }}>
                {(step.subject || '(no subject)').replace(/\{first_name\}/g, previewName)}
              </div>
            </div>
            <button onClick={onClose} style={{ background: 'rgba(255,255,255,.2)', border: 'none', color: '#fff', borderRadius: 5, padding: '4px 10px', cursor: 'pointer', fontSize: 13 }}>✕</button>
          </div>
          {/* Meta bar */}
          <div style={{ background: '#f8fafa', borderBottom: '1px solid var(--border)', padding: '8px 16px', fontSize: 11, color: 'var(--text-muted)', display: 'flex', gap: 16, flexShrink: 0 }}>
            <span>📅 Day {step.sequence_day}</span>
            <span>✉ {step.channel}</span>
            {step.terminal && <span style={{ color: 'var(--red)' }}>🔚 Terminal</span>}
            <span style={{ marginLeft: 'auto', color: '#999' }}>Placeholders filled with sample data</span>
          </div>
          {/* Body */}
          <div style={{ overflowY: 'auto', flex: 1, padding: '20px 24px' }}>
            {step.channel === 'email' ? (
              <div style={{ fontFamily: 'Arial, sans-serif', fontSize: 14, lineHeight: 1.7, color: '#333' }}>
                <div style={{ background: 'var(--teal-dark)', color: '#fff', padding: '20px 24px', borderRadius: '8px 8px 0 0', marginBottom: 0 }}>
                  <div style={{ fontSize: 18, fontWeight: 700 }}>
                    {(step.subject || '').replace(/\{first_name\}/g, previewName)}
                  </div>
                </div>
                <div style={{ border: '1px solid #e5e7eb', borderTop: 'none', borderRadius: '0 0 8px 8px', padding: '20px 24px' }}
                  dangerouslySetInnerHTML={{ __html: htmlBody }} />
                <div style={{ marginTop: 12, fontSize: 11, color: '#999', borderTop: '1px solid #eee', paddingTop: 10 }}>
                  From: info@nxtsmile.com · To: jane@example.com
                </div>
              </div>
            ) : (
              <div style={{ maxWidth: 320, margin: '0 auto' }}>
                <div style={{ background: '#e9ecef', borderRadius: 12, padding: '10px 14px', fontSize: 13, lineHeight: 1.5, color: '#333', whiteSpace: 'pre-wrap', fontFamily: 'inherit' }}>
                  {body}
                </div>
                <div style={{ fontSize: 11, color: '#999', marginTop: 8, textAlign: 'center' }}>SMS preview · {body.length} chars</div>
              </div>
            )}
          </div>
        </div>
      </div>
    );
  }

  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: 'calc(100vh - 100px)', overflow: 'hidden', gap: 0 }}>
      {previewStep && <EmailPreviewModal step={previewStep} onClose={() => setPreviewStep(null)} />}

      {/* Sub-tab bar */}
      <div style={{ display: 'flex', borderBottom: '2px solid var(--border)', background: '#fff', marginBottom: 12, flexShrink: 0 }}>
        {[['editor','📋 Workflow Editor'],['templates','✨ AI Templates']].map(([key, label]) => (
          <button key={key} onClick={() => setSubTab(key)}
            style={{
              padding: '7px 18px', fontSize: 12, fontWeight: subTab === key ? 700 : 500,
              background: 'none', border: 'none', cursor: 'pointer',
              borderBottom: subTab === key ? '2px solid var(--teal)' : '2px solid transparent',
              color: subTab === key ? 'var(--teal)' : 'var(--text-muted)',
              marginBottom: -2,
            }}>{label}</button>
        ))}
      </div>

      {subTab === 'templates' && <AITemplatesTab />}

      {subTab === 'editor' && (
        <div style={{ display: 'flex', gap: 16, flex: 1, overflow: 'hidden' }}>

          {/* ── Left: workflow list ─────────────────────────────────────────── */}
          <div style={{ width: 230, background: '#fff', border: '1px solid var(--border)', borderRadius: 8, padding: 12, display: 'flex', flexDirection: 'column', gap: 6, overflow: 'hidden' }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 4 }}>
              <span style={{ fontSize: 11, fontWeight: 700, color: 'var(--text-muted)', textTransform: 'uppercase' }}>Workflows</span>
              <button className="btn btn-teal btn-sm" onClick={() => { setShowNewWf(v => !v); setError(''); }}>+ New</button>
            </div>

            {/* New workflow form */}
            {showNewWf && (
              <div style={{ background: 'var(--gray-light)', borderRadius: 6, padding: 8, marginBottom: 4 }}>
                <div style={{ fontSize: 10, fontWeight: 600, color: 'var(--text-muted)', marginBottom: 2 }}>Name</div>
                <input placeholder="e.g. nXtSmile Follow-up" value={newWfName} onChange={e => handleNewWfName(e.target.value)}
                  style={{ width: '100%', padding: '4px 6px', border: '1px solid var(--border)', borderRadius: 4, fontSize: 11, marginBottom: 4 }} />
                <div style={{ fontSize: 10, fontWeight: 600, color: 'var(--text-muted)', marginBottom: 2 }}>Campaign Tag <span style={{ fontWeight: 400, color: '#aaa' }}>(auto-filled)</span></div>
                <input placeholder="e.g. nxtsmile_followup" value={newWfTag} onChange={e => handleNewWfTag(e.target.value)}
                  style={{ width: '100%', padding: '4px 6px', border: '1px solid var(--border)', borderRadius: 4, fontSize: 11, marginBottom: 4, fontFamily: 'monospace' }} />
                <div style={{ fontSize: 10, fontWeight: 600, color: 'var(--text-muted)', marginBottom: 2 }}>Description</div>
                <input placeholder="Optional" value={newWfDesc} onChange={e => setNewWfDesc(e.target.value)}
                  style={{ width: '100%', padding: '4px 6px', border: '1px solid var(--border)', borderRadius: 4, fontSize: 11, marginBottom: 6 }} />
                <div style={{ display: 'flex', gap: 4 }}>
                  <button className="btn btn-teal btn-sm" onClick={createWorkflow} disabled={saving || !newWfName.trim()}>Create</button>
                  <button className="btn btn-ghost btn-sm" onClick={() => { setShowNewWf(false); setNewWfName(''); setNewWfTag(''); setNewWfDesc(''); setNewWfTagManual(false); }}>Cancel</button>
                </div>
              </div>
            )}

            {/* Workflow list */}
            <div style={{ overflowY: 'auto', flex: 1 }}>
              {loading && <div style={{ fontSize: 11, color: 'var(--text-muted)', textAlign: 'center', padding: 8 }}>Loading…</div>}
              {workflows.map(wf => (
                <div key={wf.id}>
                  {/* Edit workflow form inline */}
                  {editingWf && editingWf.id === wf.id ? (
                    <div style={{ background: 'var(--teal-light)', border: '1px solid var(--teal)', borderRadius: 6, padding: 8, marginBottom: 4 }}>
                      <input value={editWfDraft.name || ''} onChange={e => setEditWfDraft(d => ({...d, name: e.target.value}))}
                        placeholder="Name"
                        style={{ width: '100%', padding: '3px 5px', border: '1px solid var(--border)', borderRadius: 3, fontSize: 11, marginBottom: 3 }} />
                      <input value={editWfDraft.campaign_tag || ''} onChange={e => setEditWfDraft(d => ({...d, campaign_tag: e.target.value}))}
                        placeholder="Campaign tag"
                        style={{ width: '100%', padding: '3px 5px', border: '1px solid var(--border)', borderRadius: 3, fontSize: 11, marginBottom: 3, fontFamily: 'monospace' }} />
                      <input value={editWfDraft.description || ''} onChange={e => setEditWfDraft(d => ({...d, description: e.target.value}))}
                        placeholder="Description"
                        style={{ width: '100%', padding: '3px 5px', border: '1px solid var(--border)', borderRadius: 3, fontSize: 11, marginBottom: 5 }} />
                      <div style={{ display: 'flex', gap: 3 }}>
                        <button className="btn btn-teal btn-sm" onClick={saveEditWf} disabled={saving}>Save</button>
                        <button className="btn btn-ghost btn-sm" onClick={() => setEditingWf(null)}>Cancel</button>
                      </div>
                    </div>
                  ) : (
                    <div
                      onClick={() => selectWorkflow(wf)}
                      style={{
                        padding: '6px 8px', borderRadius: 5, cursor: 'pointer', marginBottom: 2,
                        background: wf.id === selectedWfId ? 'var(--teal-light)' : 'transparent',
                        border: '1px solid ' + (wf.id === selectedWfId ? 'var(--teal)' : 'transparent'),
                        position: 'relative',
                      }}>
                      <div style={{ fontSize: 11, fontWeight: 600, color: wf.id === selectedWfId ? 'var(--teal-dark)' : 'var(--text)', paddingRight: 40 }}>{wf.name}</div>
                      <div style={{ fontSize: 10, color: 'var(--text-muted)' }}>
                        {wf.campaign_tag ? <code style={{ fontSize: 9 }}>{wf.campaign_tag}</code> : <em>default</em>} · {(wf.steps || []).length} steps
                      </div>
                      {/* Action buttons — edit always visible on hover/selected; duplicate on every row */}
                      <div style={{ position: 'absolute', top: 4, right: 4, display: 'flex', gap: 2 }}>
                        {wf.id === selectedWfId && (
                          <button title="Edit name/tag" onClick={e => { e.stopPropagation(); setEditingWf(wf); setEditWfDraft({ name: wf.name, campaign_tag: wf.campaign_tag, description: wf.description }); }}
                            style={{ background: 'none', border: 'none', cursor: 'pointer', fontSize: 11, padding: '1px 4px', borderRadius: 3, color: 'var(--text-muted)' }}>✏️</button>
                        )}
                        <button
                          title="Duplicate workflow"
                          onClick={e => { e.stopPropagation(); copyWorkflow(wf.id); }}
                          disabled={copyingId !== null}
                          style={{ background: 'none', border: '1px solid var(--border)', cursor: 'pointer', fontSize: 10,
                            padding: '1px 5px', borderRadius: 3, color: 'var(--text-muted)',
                            opacity: copyingId !== null ? 0.5 : 1 }}>
                          {copyingId === wf.id ? '…' : '⧉'}
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              ))}
            </div>
          </div>

          {/* ── Right: step editor ──────────────────────────────────────────── */}
          <div style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: 10, overflow: 'hidden' }}>
            {error && <div style={{ background: '#fee2e2', border: '1px solid #fca5a5', borderRadius: 6, padding: '6px 10px', fontSize: 11, color: '#dc2626', flexShrink: 0 }}>{error}<button onClick={() => setError('')} style={{ float: 'right', background: 'none', border: 'none', cursor: 'pointer', color: '#dc2626' }}>✕</button></div>}
            {success && <div style={{ background: '#dcfce7', border: '1px solid #86efac', borderRadius: 6, padding: '6px 10px', fontSize: 11, color: '#15803d', flexShrink: 0 }}>{success}<button onClick={() => setSuccess('')} style={{ float: 'right', background: 'none', border: 'none', cursor: 'pointer', color: '#15803d' }}>✕</button></div>}

            {selectedWf ? (
              <>
                {/* Workflow header */}
                <div style={{ background: '#fff', border: '1px solid var(--border)', borderRadius: 8, padding: '10px 14px', display: 'flex', alignItems: 'center', gap: 10, flexShrink: 0 }}>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: 13, fontWeight: 700 }}>{selectedWf.name}</div>
                    <div style={{ fontSize: 11, color: 'var(--text-muted)' }}>
                      Tag: <strong>{selectedWf.campaign_tag || '(default)'}</strong>
                      {selectedWf.description ? ' · ' + selectedWf.description : ''}
                    </div>
                  </div>
                  {steps.length === 0 && (
                    <button className="btn btn-sm" style={{ background: '#fef3c7', color: '#92400e', border: '1px solid #fcd34d', whiteSpace: 'nowrap' }}
                      onClick={seedNxtSmile} disabled={seeding}>
                      {seeding ? 'Loading…' : '📧 Load nXtSmile Emails'}
                    </button>
                  )}
                  <button className="btn btn-teal btn-sm" onClick={openNewStep} disabled={saving}>+ Add Step</button>
                  <button className="btn btn-sm" style={{ background: '#fee2e2', color: '#dc2626', border: '1px solid #fca5a5' }}
                    onClick={deleteWorkflow} disabled={saving}>🗑 Delete</button>
                </div>

                <div style={{ display: 'flex', gap: 10, flex: 1, overflow: 'hidden' }}>
                  {/* Timeline */}
                  <div style={{ width: 220, background: '#fff', border: '1px solid var(--border)', borderRadius: 8, overflowY: 'auto', padding: 10, flexShrink: 0 }}>
                    <div style={{ fontSize: 10, fontWeight: 700, textTransform: 'uppercase', color: 'var(--text-muted)', marginBottom: 8 }}>Sequence ({steps.length} steps)</div>
                    {steps.length === 0 && (
                      <div style={{ fontSize: 11, color: 'var(--text-muted)', textAlign: 'center', padding: '20px 8px' }}>
                        No steps yet.<br/>
                        <span style={{ color: 'var(--teal)', cursor: 'pointer' }} onClick={openNewStep}>+ Add a step</span>
                        <span> or </span>
                        <span style={{ color: '#92400e', cursor: 'pointer' }} onClick={seedNxtSmile}>load nXtSmile emails</span>
                      </div>
                    )}
                    {sortedSteps.map(step => (
                      <div key={step.id}
                        onClick={() => openEditStep(step)}
                        style={{
                          display: 'flex', alignItems: 'center', gap: 6, padding: '5px 6px', borderRadius: 5,
                          cursor: 'pointer', marginBottom: 4, fontSize: 11,
                          background: editingStep && editingStep.id === step.id ? 'var(--teal-light)' : 'var(--gray-light)',
                          border: '1px solid ' + (editingStep && editingStep.id === step.id ? 'var(--teal)' : 'transparent'),
                        }}>
                        <div style={{
                          width: 28, height: 28, borderRadius: '50%', flexShrink: 0,
                          background: step.channel === 'email' ? '#dbeafe' : '#fef9c3',
                          display: 'flex', alignItems: 'center', justifyContent: 'center',
                          fontSize: 10, fontWeight: 700, color: step.channel === 'email' ? '#1d4ed8' : '#92400e',
                        }}>D{step.sequence_day}</div>
                        <div style={{ flex: 1, overflow: 'hidden' }}>
                          <div style={{ fontWeight: 600, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>
                            {step.channel === 'email' ? '✉ ' : '💬 '}{step.subject || step.template_name}
                          </div>
                          <div style={{ fontSize: 10, color: 'var(--text-muted)' }}>
                            {step.channel}{step.terminal ? ' · 🔚 terminal' : ''}
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>

                  {/* Step editor panel */}
                  <div style={{ flex: 1, display: 'flex', gap: 10, overflow: 'hidden' }}>
                    {editingStep ? (
                      <>
                        {/* Main step form */}
                        <div style={{ flex: 1, background: '#fff', border: '1px solid var(--border)', borderRadius: 8, padding: 14, overflowY: 'auto' }}>
                          <div style={{ display: 'flex', alignItems: 'center', marginBottom: 12 }}>
                            <div style={{ fontWeight: 700, fontSize: 12, color: 'var(--teal-dark)' }}>
                              {editingStep.id ? 'Edit Step' : 'New Step'}
                            </div>
                            {/* Preview button */}
                            {stepDraft.body && (
                              <button className="btn btn-ghost btn-sm" style={{ marginLeft: 'auto' }}
                                onClick={() => setPreviewStep(stepDraft)}>
                                👁 Preview
                              </button>
                            )}
                          </div>

                          {/* Day + Channel row */}
                          <div style={{ display: 'flex', gap: 8, marginBottom: 10, alignItems: 'flex-end' }}>
                            <div style={{ flex: 1 }}>
                              <label style={{ fontSize: 10, fontWeight: 600, color: 'var(--text-muted)', display: 'block', marginBottom: 2 }}>Day</label>
                              <input type="number" value={stepDraft.sequence_day ?? 1} min="0" max="365"
                                onChange={e => updateStepDraft({ sequence_day: parseInt(e.target.value) || 1 })}
                                style={{ width: '100%', padding: '5px 8px', border: '1px solid var(--border)', borderRadius: 5, fontSize: 13, fontWeight: 600 }} />
                            </div>
                            <div style={{ flex: 2 }}>
                              <label style={{ fontSize: 10, fontWeight: 600, color: 'var(--text-muted)', display: 'block', marginBottom: 2 }}>Channel</label>
                              <div style={{ display: 'flex', gap: 0 }}>
                                {['email','sms'].map(ch => (
                                  <button key={ch} onClick={() => updateStepDraft({ channel: ch })}
                                    style={{
                                      flex: 1, padding: '5px 0', fontSize: 12, fontWeight: 600, border: '1px solid var(--border)',
                                      borderRadius: ch === 'email' ? '5px 0 0 5px' : '0 5px 5px 0',
                                      background: stepDraft.channel === ch ? 'var(--teal)' : '#fff',
                                      color: stepDraft.channel === ch ? '#fff' : 'var(--text-muted)',
                                      cursor: 'pointer',
                                    }}>
                                    {ch === 'email' ? '✉ Email' : '💬 SMS'}
                                  </button>
                                ))}
                              </div>
                            </div>
                          </div>

                          {/* Subject (email only) */}
                          {stepDraft.channel === 'email' && (
                            <div style={{ marginBottom: 8 }}>
                              <label style={{ fontSize: 10, fontWeight: 600, color: 'var(--text-muted)', display: 'block', marginBottom: 2 }}>Subject</label>
                              <input value={stepDraft.subject || ''} placeholder="Email subject line — can use {first_name}"
                                onChange={e => setStepDraft(d => ({...d, subject: e.target.value}))}
                                style={{ width: '100%', padding: '5px 8px', border: '1px solid var(--border)', borderRadius: 5, fontSize: 12 }} />
                            </div>
                          )}

                          {/* Body */}
                          <div style={{ marginBottom: 8 }}>
                            <div style={{ display: 'flex', alignItems: 'center', marginBottom: 2 }}>
                              <label style={{ fontSize: 10, fontWeight: 600, color: 'var(--text-muted)' }}>Body</label>
                              <button onClick={() => setShowStepAi(v => !v)}
                                style={{ marginLeft: 'auto', background: showStepAi ? 'var(--teal)' : 'var(--teal-light)', border: 'none', color: showStepAi ? '#fff' : 'var(--teal-dark)', padding: '2px 8px', borderRadius: 4, fontSize: 10, fontWeight: 600, cursor: 'pointer' }}>
                                ✨ Write with AI
                              </button>
                            </div>

                            {/* Per-step AI writer */}
                            {showStepAi && (
                              <div style={{ background: 'var(--teal-light)', border: '1px solid #b2d8da', borderRadius: 6, padding: 10, marginBottom: 8 }}>
                                <div style={{ display: 'flex', gap: 6, marginBottom: 6 }}>
                                  <div style={{ flex: 1 }}>
                                    <label style={{ fontSize: 10, fontWeight: 600, color: 'var(--teal-dark)', display: 'block', marginBottom: 2 }}>Appointment Type</label>
                                    <select value={stepAiApptType} onChange={e => setStepAiApptType(e.target.value)}
                                      style={{ width: '100%', padding: '4px 6px', border: '1px solid var(--border)', borderRadius: 4, fontSize: 11 }}>
                                      <option value="consult">Consultation</option>
                                      <option value="exam">New Patient Exam</option>
                                      <option value="implant">Implant</option>
                                      <option value="ortho">Ortho / Invisalign</option>
                                      <option value="general">General</option>
                                    </select>
                                  </div>
                                </div>
                                <label style={{ fontSize: 10, fontWeight: 600, color: 'var(--teal-dark)', display: 'block', marginBottom: 2 }}>Describe what you want this message to do</label>
                                <textarea value={stepAiPrompt} rows={3}
                                  placeholder="e.g. Day 7 follow-up — address cost objections, mention CareCredit financing, encourage booking free consult"
                                  onChange={e => setStepAiPrompt(e.target.value)}
                                  style={{ width: '100%', padding: '5px 8px', border: '1px solid var(--border)', borderRadius: 4, fontSize: 11, resize: 'vertical', fontFamily: 'inherit', marginBottom: 6 }} />
                                <button className="btn btn-teal btn-sm" onClick={generateStepAi} disabled={stepAiGenerating || !stepAiPrompt.trim()}>
                                  {stepAiGenerating ? '✨ Generating…' : '✨ Generate'}
                                </button>
                                <button className="btn btn-ghost btn-sm" style={{ marginLeft: 6 }} onClick={() => setShowStepAi(false)}>Cancel</button>
                              </div>
                            )}

                            <textarea value={stepDraft.body || ''} rows={10}
                              placeholder={'Message body…\n\nAvailable placeholders:\n{first_name} — patient name\n{unsub_url} — unsubscribe link (email only)'}
                              onChange={e => setStepDraft(d => ({...d, body: e.target.value}))}
                              style={{ display: 'block', width: '100%', padding: '6px 8px', border: '1px solid var(--border)', borderRadius: 5, fontSize: 12, resize: 'vertical', fontFamily: 'inherit' }} />
                            {stepDraft.channel === 'sms' && (
                              <div style={{ fontSize: 10, color: (stepDraft.body||'').length > 160 ? '#92400e' : 'var(--text-muted)', marginTop: 2, textAlign: 'right' }}>
                                {(stepDraft.body||'').length} chars {(stepDraft.body||'').length > 160 ? '· multiple SMS segments' : '· 1 SMS segment'}
                              </div>
                            )}
                          </div>

                          {/* Template name */}
                          <div style={{ marginBottom: 8 }}>
                            <label style={{ fontSize: 10, fontWeight: 600, color: 'var(--text-muted)', display: 'block', marginBottom: 2 }}>
                              Template Name <span style={{ fontWeight: 400, color: '#aaa' }}>(unique slug — auto-generated)</span>
                            </label>
                            <input value={stepDraft.template_name || ''}
                              onChange={e => { setStepTnameManual(true); setStepDraft(d => ({...d, template_name: e.target.value})); }}
                              style={{ width: '100%', padding: '4px 8px', border: '1px solid var(--border)', borderRadius: 4, fontSize: 11, fontFamily: 'monospace', color: 'var(--text-muted)' }} />
                          </div>

                          {/* Terminal */}
                          <div style={{ marginBottom: 14, display: 'flex', alignItems: 'center', gap: 6 }}>
                            <input type="checkbox" id="terminal-chk" checked={!!stepDraft.terminal}
                              onChange={e => setStepDraft(d => ({...d, terminal: e.target.checked}))} />
                            <label htmlFor="terminal-chk" style={{ fontSize: 11, color: 'var(--text-muted)', cursor: 'pointer' }}>
                              Terminal step — marks lead cold + deletes smile image
                            </label>
                          </div>

                          {/* Save / Cancel / Delete */}
                          <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
                            <button className="btn btn-teal btn-sm" onClick={saveStep} disabled={saving}>{saving ? 'Saving…' : 'Save Step'}</button>
                            <button className="btn btn-ghost btn-sm" onClick={() => setEditingStep(null)}>Cancel</button>
                            {editingStep.id && (
                              <button className="btn btn-sm" style={{ marginLeft: 'auto', background: '#fee2e2', color: '#dc2626', border: '1px solid #fca5a5' }}
                                onClick={() => deleteStep(editingStep.id)} disabled={saving}>Delete Step</button>
                            )}
                          </div>
                        </div>

                        {/* Placeholder reference panel */}
                        <div style={{ width: 180, background: '#fff', border: '1px solid var(--border)', borderRadius: 8, padding: 12, flexShrink: 0, overflowY: 'auto' }}>
                          <div style={{ fontSize: 10, fontWeight: 700, textTransform: 'uppercase', color: 'var(--text-muted)', marginBottom: 8 }}>Placeholders</div>
                          {[
                            ['{first_name}', 'Patient first name — always safe'],

                            <div style={{ fontSize: 10, fontWeight: 700, color: 'var(--text-muted)', marginBottom: 6 }}>Baked in by AI</div>
                            {['Practice name','Doctor name','Phone number','Booking link','Address'].map(item => (
                              <div key={item} style={{ fontSize: 10, color: '#aaa', marginBottom: 3 }}>✓ {item}</div>
                            ))}
                          </div>
                          {stepDraft.channel === 'sms' && (
                            <div style={{ borderTop: '1px solid var(--border)', paddingTop: 8, marginTop: 4 }}>
                              <div style={{ fontSize: 10, color: '#f59e0b', fontWeight: 600 }}>SMS tip</div>
                              <div style={{ fontSize: 10, color: 'var(--text-muted)', marginTop: 3 }}>End with "Reply STOP to opt out." and keep under 160 chars for 1 segment.</div>
                            </div>
                          )}

                      </>
                    ) : (
                      /* Empty state when no step selected */
                      <div style={{ flex: 1, background: '#fff', border: '1px solid var(--border)', borderRadius: 8, display: 'flex', alignItems: 'center', justifyContent: 'center', flexDirection: 'column', gap: 10, color: 'var(--text-muted)', fontSize: 12 }}>
                        <div style={{ fontSize: 32 }}>📋</div>
                        <div style={{ fontWeight: 600 }}>Select a step to edit, or add a new one</div>

                {loading ? 'Loading workflows…' : (

                    <div>Select or create a workflow on the left</div>
                  </>
                )}
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}


// ── Geo Targeting Builder ──────────────────────────────────────────────────
function GeoTargetingBuilder({value, onChange, practiceAddress, defaultRadius}) {
  const geo = React.useMemo(() => parseGeoTargeting(value), [value]);
  const [unit, setUnit] = React.useState(geo.unit || 'miles');
  const [locations, setLocations] = React.useState(geo.locations || []);
  const [locType, setLocType] = React.useState('city');
  const [searchVal, setSearchVal] = React.useState('');
  const [radius, setRadius] = React.useState(defaultRadius || 15);

  // Sync state back up whenever locations or unit change
  React.useEffect(() => {
    onChange(serializeGeoTargeting({unit, locations}));
  }, [unit, locations]);

  function addLocation() {
    const trimmed = searchVal.trim();
    if (!trimmed) return;
    // Only city+radius creates a proximity criterion (radius circle).
    // postal/address → GeoTargetConstant (zip boundary, no radius).
    // state/country → GeoTargetConstant, no radius.
    const needsRadius = locType === 'city';
    setLocations(prev => [...prev, {
      type: locType,
      value: trimmed,
      radius: needsRadius ? Number(radius) : null,
      include: true
    }]);
    setSearchVal('');
  }

  function removeLocation(idx) {
    setLocations(prev => prev.filter((_,i) => i !== idx));
  }

  function toggleInclude(idx) {
    setLocations(prev => prev.map((l,i) => i===idx ? {...l, include:!l.include} : l));
  }

  function updateRadius(idx, val) {
    setLocations(prev => prev.map((l,i) => i===idx ? {...l, radius:Number(val)} : l));
  }

  function switchUnit(newUnit) {
    if (newUnit === unit) return;
    // Convert radii
    const factor = newUnit === 'miles' ? 0.621371 : 1.60934;
    setLocations(prev => prev.map(l => l.radius ? {...l, radius: Math.round(l.radius * factor)} : l));
    setUnit(newUnit);
  }

  // City first — it's the primary radius-targeting option.
  // Postal/address = zip boundary (no radius circle). State/country = broad exclusions.
  const typeLabels = {city:'City + Radius ◎', postal:'Postal Code', address:'Address', state:'State', country:'Country'};
  // Only city+radius creates a proximity circle in Google Ads.
  // postal/address → GeoTargetConstant (zip boundary or address area, no radius).
  const showRadius = locType === 'city';

  return (
    <div style={{fontSize:13}}>
      {/* Tip banner */}
      <div style={{fontSize:11, color:'#92400e', background:'#fffbeb', border:'1px solid #fde68a',
                   borderRadius:6, padding:'6px 10px', marginBottom:10, lineHeight:1.5}}>
        💡 <strong>Radius targeting:</strong> Use <strong>City + Radius ◎</strong> to draw a circle around a city (e.g. "Grafton" + 15 mi).
        Postal Code targets the full zip boundary only — no radius circle.
      </div>
      {/* Unit toggle */}
      <div style={{display:'flex', alignItems:'center', gap:8, marginBottom:10}}>
        <span style={{color:'var(--text-muted)', fontSize:12}}>Distance unit:</span>
        {['miles','kilometers'].map(u => (
          <button key={u} onClick={()=>switchUnit(u)}
            style={{padding:'3px 10px', borderRadius:20, border:'0.5px solid var(--border)',
                    background: unit===u ? 'var(--accent)' : 'transparent',
                    color: unit===u ? '#fff' : 'var(--text-muted)',
                    cursor:'pointer', fontSize:12}}>
            {u === 'miles' ? 'Miles' : 'Kilometers'}
          </button>
        ))}
      </div>

      {/* Add row — two lines to avoid wrapping that hides the Add button */}
      <div style={{marginBottom:8}}>
        <div style={{display:'flex', gap:6, marginBottom:4}}>
          <select value={locType} onChange={e=>setLocType(e.target.value)}
            style={{fontSize:12, padding:'5px 8px', border:'0.5px solid var(--border)',
                    borderRadius:6, background:'var(--surface)', flexShrink:0}}>
            {Object.entries(typeLabels).map(([k,v]) => <option key={k} value={k}>{v}</option>)}
          </select>
          <input value={searchVal} onChange={e=>setSearchVal(e.target.value)}
            onKeyDown={e=>e.key==='Enter'&&addLocation()}
            placeholder={locType==='city'?'e.g. Grafton':locType==='postal'?'e.g. 01536':locType==='state'?'e.g. Massachusetts':'Search…'}
            style={{flex:1, fontSize:12, padding:'5px 8px',
                    border:'0.5px solid var(--border)', borderRadius:6}} />
        </div>
        <div style={{display:'flex', gap:6, alignItems:'center'}}>
          {showRadius && (
            <>
              <span style={{fontSize:11, color:'var(--text-muted)', flexShrink:0}}>Radius:</span>
              <input type="number" value={radius} onChange={e=>setRadius(e.target.value)}
                min={1} max={500}
                style={{width:56, fontSize:12, padding:'4px 6px',
                        border:'0.5px solid var(--border)', borderRadius:6, textAlign:'center'}} />
              <span style={{fontSize:12, color:'var(--text-muted)', flexShrink:0}}>
                {unit==='miles'?'mi':'km'}
              </span>
            </>
          )}
          {(locType === 'postal' || locType === 'address') && (
            <span style={{fontSize:11, color:'var(--text-muted)', fontStyle:'italic', flexShrink:0}}>
              {locType === 'postal' ? 'Targets full zip boundary (no radius)' : 'Targets address area (no radius)'}
            </span>
          )}
          <button onClick={addLocation}
            style={{padding:'5px 18px', background:'var(--teal)', color:'#fff',
                    border:'none', borderRadius:6, cursor:'pointer', fontSize:12,
                    fontWeight:600, marginLeft:'auto', flexShrink:0}}>
            + Add Location
          </button>
        </div>
      </div>

      {/* Locations list */}
      {locations.length === 0 ? (
        <div style={{color:'var(--text-muted)', fontSize:12, padding:'8px 0'}}>
          No locations added yet.
          {practiceAddress && (
            <span> Suggested: <button onClick={()=>setLocations([{type:'city',value:practiceAddress,radius:15,include:true}])}
              style={{background:'none',border:'none',color:'var(--accent)',cursor:'pointer',fontSize:12,padding:0}}>
              Use practice address ({practiceAddress})
            </button></span>
          )}
        </div>
      ) : (
        <div style={{display:'flex', flexDirection:'column', gap:4}}>
          {locations.map((loc, idx) => (
            <div key={idx} style={{display:'flex', alignItems:'center', gap:6, padding:'6px 8px',
                                    background:'var(--bg)', border:'0.5px solid var(--border)',
                                    borderRadius:6, fontSize:12}}>
              <span style={{fontSize:10, padding:'1px 6px', borderRadius:10, fontWeight:500,
                            background: loc.include ? '#dcfce7' : '#fee2e2',
                            color: loc.include ? '#15803d' : '#b91c1c'}}>
                {typeLabels[loc.type] || loc.type}
              </span>
              <span style={{flex:1, color:'var(--text)'}}>{loc.value}</span>
              {loc.type === 'city' && loc.radius != null && (
                <>
                  <input type="number" value={loc.radius} min={1} max={500}
                    onChange={e=>updateRadius(idx, e.target.value)}
                    style={{width:44, fontSize:11, padding:'2px 4px', textAlign:'center',
                            border:'0.5px solid var(--border)', borderRadius:4}} />
                  <span style={{fontSize:11, color:'var(--text-muted)'}}>{unit==='miles'?'mi':'km'}</span>
                </>
              )}
              {(loc.type === 'postal' || loc.type === 'address') && (
                <span style={{fontSize:10, color:'var(--text-muted)', fontStyle:'italic'}}>zip boundary</span>
              )}
              <button onClick={()=>toggleInclude(idx)}
                style={{padding:'2px 8px', borderRadius:10, fontSize:11, cursor:'pointer', border:'none',
                        background: loc.include ? '#dcfce7' : '#fee2e2',
                        color: loc.include ? '#15803d' : '#b91c1c', fontWeight:500}}>
                {loc.include ? 'Include' : 'Exclude'}
              </button>
              <button onClick={()=>removeLocation(idx)}
                style={{background:'none', border:'none', color:'var(--text-muted)',
                        cursor:'pointer', fontSize:14, padding:'0 2px', lineHeight:1}}>×</button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}


// ── Ad Preview Panel ──────────────────────────────────────────────────────────
function AdPreviewPanel({campDetail, practiceSettings, adPreviewMode, setAdPreviewMode, setDetailTab}) {
  const camp = campDetail?.campaign || {};
  const build = campDetail?.build || {};

  // Derive display URL: strip https://, show domain + first path segment
  const rawUrl = camp.landing_page || practiceSettings?.website || 'graftondentalcare.com';
  const stripped = rawUrl.replace(/^https?:\/\//, '').replace(/\/$/, '');
  const parts = stripped.split('/');
  const displayUrl = parts.length > 1 ? `${parts[0]} › ${parts[1]}` : parts[0];

  // Safely extract text from a headline/description item (object with .text or plain string)
  const getText = (item) => (item && typeof item === 'object' ? item.text || '' : item || '');

  // Pull ad copy data
  const adGroups = build?.ad_copy?.ad_groups || [];
  const firstGroup = adGroups[0] || null;
  const headlines = firstGroup ? (firstGroup.headlines || []).slice(0, 3).map(getText).filter(Boolean) : [];
  const description = firstGroup ? getText((firstGroup.descriptions || [])[0]) : '';
  const phone = camp.call_extension_phone || practiceSettings?.phone || '';

  const hasAdCopy = headlines.length > 0;

  const panelStyle = {
    background: '#fff',
    border: '1px solid #e0e0e0',
    borderRadius: 10,
    overflow: 'hidden',
    boxShadow: '0 1px 4px rgba(0,0,0,.08)',
    position: 'sticky',
    top: 80,
    alignSelf: 'flex-start',
    minWidth: 0,

  const headerStyle = {
    display: 'flex',
    alignItems: 'center',
    justifyContent: 'space-between',
    padding: '10px 14px',
    borderBottom: '1px solid #e0e0e0',
    background: '#fafafa',
  };

  const toggleBtnStyle = (active) => ({
    fontSize: 11,
    fontWeight: active ? 700 : 500,
    padding: '3px 10px',
    border: `1px solid ${active ? '#4285f4' : '#dadce0'}`,
    borderRadius: 20,
    background: active ? '#e8f0fe' : '#fff',
    color: active ? '#1a73e8' : '#5f6368',
    cursor: 'pointer',
    outline: 'none',
  });

  return (
    <div style={panelStyle}>
      {/* Header */}
      <div style={headerStyle}>
        <span style={{fontSize: 12, fontWeight: 700}}>Ad Preview</span>
        <div style={{display: 'flex', gap: 5}}>
          <button style={toggleBtnStyle(adPreviewMode === 'search')}
            onClick={() => setAdPreviewMode('search')}>Search</button>
          <button style={toggleBtnStyle(adPreviewMode === 'pmax')}
            onClick={() => setAdPreviewMode('pmax')}>PMax</button>
        </div>
      </div>

      {/* Body */}
      <div style={{padding: 16}}>
        {adPreviewMode === 'pmax' ? (
          /* PMax placeholder */
          <div style={{textAlign: 'center', color: '#5f6368'}}>
            <div style={{fontSize: 22, marginBottom: 8}}>📸</div>
            <div style={{fontWeight: 700, fontSize: 13, marginBottom: 6}}>Performance Max</div>
            <div style={{background: '#f1f3f4', borderRadius: 8, height: 160, marginBottom: 12,
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              fontSize: 11, color: '#9aa0a6'}}>
              Image / Video placeholder
            </div>
            <div style={{fontSize: 11, lineHeight: 1.5, color: '#5f6368'}}>
              Add images and videos to preview your Performance Max creative. (Coming soon)
            </div>
          </div>
        ) : !hasAdCopy ? (
          /* Empty state */
          <div style={{textAlign: 'center', padding: '20px 8px',
            border: '2px dashed #dadce0', borderRadius: 8, color: '#9aa0a6'}}>
            <div style={{fontSize: 28, marginBottom: 8}}>🔍</div>
            <div style={{fontSize: 12, lineHeight: 1.5, marginBottom: 10}}>
              Build your ad copy in the Ad Copy tab to preview your ad here.
            </div>

// ── Launch Button Group (split button: Launch / Schedule / Queue) ─────────────
function LaunchButtonGroup({campaignId, canLaunch, onLaunched}) {
  const [open, setOpen] = React.useState(false);
  const [showSchedule, setShowSchedule] = React.useState(false);
  const [schedDate, setSchedDate] = React.useState('');
  const [busy, setBusy] = React.useState(false);
  const [err, setErr] = React.useState('');
  const [launchLog, setLaunchLog] = React.useState(null); // creation log from API

  async function doLaunch(mode, launch_date) {
    setBusy(true); setErr(''); setLaunchLog(null);
    try {
      const r = await api(`/api/admin/campaigns/${campaignId}/launch`, {
        method: 'POST',
        body: JSON.stringify({mode, launch_date: launch_date || null})
      });
      // Show creation log if a new campaign was pushed to Google Ads
      if (r.gads_action === 'created' && r.log) {
        setLaunchLog({log: r.log, keywords: r.keywords_added, ads: r.ads_created, resource: r.resource_name, enabled: r.enabled});
      }
      if (typeof onLaunched === 'function') onLaunched(r.status, r.launch_date || '');
    } catch(e) {
      setErr(e.message || 'Launch failed');
    }
    setBusy(false);
    setOpen(false);
    setShowSchedule(false);
  }

  return (
    <div style={{position:'relative'}}>
      {err && <div style={{color:'#dc2626',fontSize:12,marginBottom:6}}>{err}</div>}
      {launchLog && (
        <div style={{background:'#f0fdf4',border:'1px solid #86efac',borderRadius:8,padding:'12px 14px',marginBottom:12,fontSize:11}}>
          <div style={{fontWeight:700,color:'#15803d',marginBottom:6}}>
            ✅ Campaign live in Google Ads! {launchLog.keywords} keywords · {launchLog.ads} RSA ad(s)
          </div>
          <div style={{fontFamily:'monospace',fontSize:10,color:'#374151',lineHeight:1.6,maxHeight:140,overflowY:'auto'}}>
            {(launchLog.log||[]).map((line,i)=><div key={i}>{line}</div>)}
          </div>
          {!launchLog.enabled && (
            <div style={{color:'#d97706',marginTop:6,fontSize:11}}>⚠ Campaign created but not auto-enabled — please enable manually in Google Ads.</div>
          )}
          <button onClick={()=>setLaunchLog(null)} style={{marginTop:8,fontSize:10,color:'#6b7280',background:'none',border:'none',cursor:'pointer'}}>Dismiss</button>
        </div>
      )}
      <div style={{display:'flex',borderRadius:8,overflow:'hidden'}}>
        <button
          disabled={!canLaunch || busy}
          onClick={() => doLaunch('now')}
          style={{flex:1, background: canLaunch ? '#16a34a' : '#9ca3af', color:'#fff', border:'none',
                  padding:'12px 18px', fontSize:14, fontWeight:500,
                  cursor: canLaunch && !busy ? 'pointer' : 'not-allowed', textAlign:'left'}}>
          {busy ? '⏳ Launching…' : '▶ Launch Campaign'}
        </button>
        <button
          disabled={busy}
          onClick={() => setOpen(o => !o)}
          style={{background: canLaunch ? '#15803d' : '#6b7280', color:'#fff', border:'none',
                  borderLeft:'1px solid rgba(255,255,255,0.2)', padding:'12px 14px',
                  cursor:'pointer', fontSize:14}}>
          ▾
        </button>
      </div>
      {open && (
        <div style={{position:'absolute', bottom:'calc(100% + 4px)', left:0, right:0,
                     background:'var(--surface, #fff)',
                     border:'0.5px solid var(--border, #e5e7eb)',
                     boxShadow:'0 4px 12px rgba(0,0,0,0.08)',
                     borderRadius:8, zIndex:50, overflow:'hidden'}}>
          <div onClick={() => { setOpen(false); doLaunch('now'); }}
               style={{padding:'10px 14px', cursor:'pointer', fontSize:13,
                       borderBottom:'0.5px solid var(--border, #e5e7eb)'}}>
            ▶ Launch now
          </div>
          <div onClick={() => setShowSchedule(s => !s)}
               style={{padding:'10px 14px', cursor:'pointer', fontSize:13,
                       borderBottom:'0.5px solid var(--border, #e5e7eb)'}}>
            🕐 Schedule for later…
          </div>
          {showSchedule && (
            <div style={{padding:'8px 14px', borderBottom:'0.5px solid var(--border, #e5e7eb)'}}>
              <input type="datetime-local" value={schedDate}
                onChange={e => setSchedDate(e.target.value)}
                style={{width:'100%', fontSize:13, padding:'6px 8px',
                        border:'0.5px solid var(--border, #e5e7eb)', borderRadius:6}} />
              <button onClick={() => schedDate && doLaunch('schedule', schedDate)}
                disabled={!schedDate}
                style={{marginTop:6, width:'100%', background:'#7c3aed', color:'#fff',
                        border:'none', borderRadius:6, padding:'8px', fontSize:13,
                        cursor: schedDate ? 'pointer' : 'not-allowed'}}>
                Schedule →
              </button>
            </div>
          )}
          <div onClick={() => { setOpen(false); doLaunch('queue'); }}
               style={{padding:'10px 14px', cursor:'pointer', fontSize:13}}>
            💾 Save as Queued
          </div>
        </div>
      )}
    </div>
  );
}


// ── Practice Information Card ─────────────────────────────────────────────────
function PracticeSettingsCard() {
  const emptyForm = {
    name:'', phone:'', email:'', doctor_name:'', address:'', hours:'', review_link:'',
    website:'',
    booking_link_consult:'', booking_link_exam:'', booking_link_implant:'',
    booking_link_ortho:'', booking_link_general:'',
  };
  const [form, setForm] = React.useState(emptyForm);
  const [loaded, setLoaded] = React.useState(false);
  const [saving, setSaving] = React.useState(false);
  const [msg, setMsg] = React.useState('');

  React.useEffect(() => {
    api('/api/admin/practice-settings').then(data => {
      setForm(f => ({...f, ...data}));
      setLoaded(true);
    }).catch(() => setLoaded(true));
  }, []);

  async function handleSave(e) {
    e.preventDefault();
    setSaving(true); setMsg('');
    try {
      await api('/api/admin/practice-settings', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(form),
      });
      setMsg('Saved ✓');
      setTimeout(() => setMsg(''), 3000);
    } catch(err) { setMsg('Error: ' + err.message); }
    setSaving(false);
  }

  function field(key, label, placeholder, token) {
    return (
      <div style={{marginBottom:8}}>
        <label style={{fontSize:10,fontWeight:600,color:'var(--text-muted)',display:'block',marginBottom:2}}>
          {label} {token && <span style={{fontFamily:'monospace',fontSize:9,color:'var(--teal)',background:'var(--teal-light)',padding:'1px 4px',borderRadius:3}}>{token}</span>}
        </label>
        <input
          value={form[key] || ''}
          onChange={e => setForm(f => ({...f, [key]: e.target.value}))}
          placeholder={placeholder}
          style={{width:'100%',padding:'4px 8px',fontSize:11,border:'1px solid var(--border)',borderRadius:4}}
        />
      </div>
    );
  }

  if (!loaded) return null;

  return (
    <div className="report-section" style={{marginBottom:12}}>
      <div className="report-title" style={{marginBottom:12}}>🏥 Practice Information</div>
      <div style={{fontSize:11,color:'var(--text-muted)',marginBottom:10}}>
        Used by AI to generate messages. Values are baked into generated text — keep them current.
      </div>
      <form onSubmit={handleSave}>
        <div style={{fontSize:10,fontWeight:700,textTransform:'uppercase',color:'var(--text-muted)',marginBottom:6,letterSpacing:.5}}>Contact Info</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'0 12px'}}>
