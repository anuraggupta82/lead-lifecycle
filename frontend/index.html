<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pipeline Dashboard — Grafton Dental Care</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --teal: #0d7a7f; --teal-dark: #0a5f63; --teal-light: #e8f4f4;
      --green: #22c55e; --yellow: #f59e0b; --red: #ef4444; --purple: #8b5cf6;
      --gray: #6b7280; --gray-light: #f3f4f6; --border: #e5e7eb;
      --text: #111827; --text-muted: #6b7280;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
           background: #f0f4f8; color: var(--text); min-height: 100vh; }
    #root { display: flex; flex-direction: column; min-height: 100vh; }

    .header { background: var(--teal-dark); color: #fff; padding: 0 20px;
               display: flex; align-items: center; gap: 12px; height: 44px; flex-shrink: 0; }
    .header-logo { font-size: 15px; font-weight: 700; white-space: nowrap; }
    .header-logo span { color: #5eead4; }
    .header-right { margin-left: auto; display: flex; gap: 8px; align-items: center; font-size: 11px; }
    .header-dot { width: 6px; height: 6px; border-radius: 50%; background: #5eead4; }

    .btn { padding: 5px 10px; border-radius: 5px; border: none; cursor: pointer;
            font-size: 11px; font-weight: 500; transition: all .15s; }
    .btn:hover { opacity: .85; }
    .btn-teal { background: var(--teal); color: #fff; }
    .btn-white { background: rgba(255,255,255,.15); color: #fff; border: 1px solid rgba(255,255,255,.3); }
    .btn-sm { padding: 3px 8px; font-size: 10px; }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-muted); }

    /* Tabs */
    .tab-bar { background: #fff; border-bottom: 1px solid var(--border); display: flex; gap: 0; flex-shrink: 0; }
    .tab { padding: 8px 20px; font-size: 12px; font-weight: 500; cursor: pointer; border-bottom: 2px solid transparent;
           color: var(--text-muted); background: none; border-top: none; border-left: none; border-right: none; }
    .tab:hover { color: var(--text); background: var(--gray-light); }
    .tab.active { color: var(--teal); border-bottom-color: var(--teal); font-weight: 600; }

    /* Main content */
    .main { flex: 1; overflow-y: auto; padding: 12px 16px; }

    /* KPI strip */
    .kpi-strip { display: flex; gap: 0; background: #fff; border: 1px solid var(--border);
                 border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
    .kpi { flex: 1; padding: 10px 12px; text-align: center; border-right: 1px solid var(--border); }
    .kpi:last-child { border-right: none; }
    .kpi-val { font-size: 20px; font-weight: 700; color: var(--teal); line-height: 1.1; }
    .kpi-label { font-size: 9px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .3px; margin-top: 2px; }

    /* Filter bar */
    .filter-bar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
    .filter-select { padding: 5px 10px; border: 1px solid var(--border); border-radius: 5px;
                     font-size: 11px; background: #fff; color: var(--text); }
    .search-box { padding: 5px 10px; border: 1px solid var(--border); border-radius: 5px;
                  font-size: 11px; width: 200px; }
    .search-box:focus, .filter-select:focus { outline: none; border-color: var(--teal); }

    /* Stage rows */
    .stage-row { background: #fff; border: 1px solid var(--border); border-radius: 8px;
                 margin-bottom: 4px; display: flex; align-items: center; flex-wrap: wrap;
                 padding: 6px 12px; gap: 6px; min-height: 40px; }
    .stage-row.drag-over { background: rgba(13,122,127,.04); border-color: var(--teal); }
    .stage-row.special { border-left: 3px solid; }
    .stage-row.followup-row { border-left-color: #f59e0b; background: #fffbeb; }
    .stage-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .stage-label { font-size: 11px; font-weight: 600; color: var(--text); white-space: nowrap; }
    .stage-count { font-size: 10px; font-weight: 600; background: var(--gray-light); padding: 0 6px;
                   border-radius: 8px; color: var(--text-muted); }
    .stage-sep { width: 1px; height: 20px; background: var(--border); flex-shrink: 0; }

    /* Lead chips */
    .lead-chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px;
                 border: 1px solid var(--border); border-radius: 6px; background: #fff;
                 cursor: pointer; font-size: 11px; transition: all .12s; white-space: nowrap;
                 max-width: 300px; }
    .lead-chip:hover { border-color: var(--teal); background: var(--teal-light); }
    .lead-chip.selected { border-color: var(--teal); box-shadow: 0 0 0 2px rgba(13,122,127,.15); }
    .lead-chip.has-priority { border-left: 3px solid var(--yellow); }
    .chip-name { font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; }
    .chip-source { font-size: 8px; padding: 0 4px; border-radius: 3px; font-weight: 600; line-height: 14px; }
    .src-google { background: #dbeafe; color: #1d4ed8; }
    .src-fb { background: #ede9fe; color: #7c3aed; }
    .src-smile { background: #f3e8ff; color: #9333ea; }
    .src-phone { background: #fef9c3; color: #854d0e; }
    .src-form { background: #d1fae5; color: #065f46; }
    .src-chat { background: #fce7f3; color: #be185d; }
    .src-default { background: var(--gray-light); color: var(--gray); }
    .chip-phone { font-size: 10px; color: var(--text-muted); }
    .chip-time { font-size: 9px; color: var(--text-muted); }
    .chip-revenue { font-size: 9px; color: #059669; font-weight: 700; }
    .chip-notes { font-size: 8px; background: #fef3c7; color: #92400e; padding: 0 3px;
                  border-radius: 3px; font-weight: 700; }
    .chip-campaign { font-size: 8px; color: var(--purple); font-weight: 500; max-width: 80px;
                     overflow: hidden; text-overflow: ellipsis; }
    .chip-appt { font-size: 8px; color: #059669; font-weight: 600; }

    /* Detail panel */
    .detail-overlay { position: fixed; top: 0; right: 0; bottom: 0; width: 400px;
                      background: #fff; border-left: 1px solid var(--border);
                      box-shadow: -4px 0 20px rgba(0,0,0,.08); z-index: 100;
                      display: flex; flex-direction: column;
                      transform: translateX(100%); transition: transform .2s ease; }
    .detail-overlay.open { transform: translateX(0); }
    .detail-backdrop { position: fixed; top: 0; left: 0; right: 0; bottom: 0;
                       background: rgba(0,0,0,.1); z-index: 99; }
    .detail-header { padding: 12px 14px; border-bottom: 1px solid var(--border);
                     display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .detail-close { background: none; border: none; font-size: 16px; cursor: pointer; color: var(--text-muted); }
    .detail-body { flex: 1; overflow-y: auto; padding: 12px 14px; }
    .detail-section { margin-bottom: 14px; }
    .detail-section-title { font-size: 10px; font-weight: 600; text-transform: uppercase;
                            color: var(--text-muted); letter-spacing: .4px; margin-bottom: 6px; }
    .detail-row { display: flex; justify-content: space-between; padding: 3px 0;
                  font-size: 11px; border-bottom: 1px solid #f5f5f5; }
    .detail-row-label { color: var(--text-muted); }
    .detail-row-value { font-weight: 500; text-align: right; max-width: 200px; word-break: break-all; }

    /* Stage move menu */
    .stage-move-menu { position: absolute; top: 100%; left: 0; background: #fff; border: 1px solid var(--border);
                       border-radius: 6px; box-shadow: 0 4px 12px rgba(0,0,0,.1); z-index: 10;
                       min-width: 180px; max-height: 280px; overflow-y: auto; }
    .stage-move-item { padding: 6px 10px; font-size: 11px; cursor: pointer; display: flex;
                       align-items: center; gap: 6px; }
    .stage-move-item:hover { background: var(--teal-light); }
    .stage-move-item.current { background: #f0fdf4; font-weight: 600; }

    /* Notes */
    .note-item { background: #fffbeb; border: 1px solid #fef3c7; border-radius: 5px;
                 padding: 6px 8px; margin-bottom: 4px; font-size: 11px; }
    .note-header { display: flex; justify-content: space-between; margin-bottom: 2px; }
    .note-author { font-weight: 600; color: #92400e; font-size: 10px; }
    .note-time { color: var(--text-muted); font-size: 9px; }
    .note-input { width: 100%; border: 1px solid var(--border); border-radius: 5px;
                  padding: 6px 8px; font-size: 11px; resize: vertical; min-height: 50px; font-family: inherit; }
    .note-input:focus { outline: none; border-color: var(--teal); }

    /* Timeline */
    .timeline-item { display: flex; gap: 6px; padding: 4px 0; border-bottom: 1px solid #f5f5f5; font-size: 10px; }
    .timeline-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--teal); margin-top: 4px; flex-shrink: 0; }
    .timeline-type { font-weight: 600; color: var(--teal); }
    .timeline-time { color: var(--text-muted); font-size: 9px; white-space: nowrap; margin-left: auto; }

    /* Follow-up queue */
    .fq-item { display: flex; gap: 4px; align-items: center; padding: 3px 0; font-size: 10px; border-bottom: 1px solid #f5f5f5; }
    .fq-status { padding: 1px 4px; border-radius: 3px; font-size: 9px; font-weight: 500; }
    .fq-pending { background: #fef9c3; color: #854d0e; }
    .fq-sent { background: #d1fae5; color: #065f46; }
    .fq-skipped { background: #e5e7eb; color: #6b7280; }
    .fq-failed { background: #fef2f2; color: #dc2626; }

    /* Reports & Admin */
    .report-section { background: #fff; border: 1px solid var(--border); border-radius: 8px;
                      padding: 14px; margin-bottom: 12px; }
    .report-title { font-size: 13px; font-weight: 600; margin-bottom: 10px; }
    .report-table { width: 100%; border-collapse: collapse; font-size: 11px; }
    .report-table th { text-align: left; padding: 6px 8px; background: var(--gray-light);
                       font-weight: 600; font-size: 10px; text-transform: uppercase;
                       letter-spacing: .3px; color: var(--text-muted); border-bottom: 1px solid var(--border); }
    .report-table td { padding: 6px 8px; border-bottom: 1px solid #f5f5f5; }
    .report-table tr:hover td { background: #fafafa; }
    .report-table .num { text-align: right; font-variant-numeric: tabular-nums; }
    .report-table .money { color: #059669; font-weight: 600; }

    .admin-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .time-range { display: flex; gap: 4px; }
    .time-range button { padding: 4px 8px; font-size: 10px; border: 1px solid var(--border); border-radius: 4px; background: #fff; cursor: pointer; }
    .time-range button.active { background: var(--teal); color: #fff; border-color: var(--teal); }

    /* Campaign analytics expand panel */
    .camp-analytics-row { background: #f8fafc; border-top: 1px solid var(--border); }
    .camp-analytics-inner { padding: 12px 14px; }
    .camp-analytics-grid { display: grid; grid-template-columns: repeat(5,1fr); gap: 8px; margin-bottom: 12px; }
    .camp-kpi { background: #fff; border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; text-align: center; }
    .camp-kpi-val { font-size: 16px; font-weight: 700; color: var(--teal); }
    .camp-kpi-label { font-size: 9px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .3px; margin-top: 1px; }
    .date-filter-bar { display: flex; gap: 6px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
    .date-filter-bar label { font-size: 10px; color: var(--text-muted); }
    .date-input { padding: 3px 6px; border: 1px solid var(--border); border-radius: 4px; font-size: 10px; }
    .date-input:focus { outline: none; border-color: var(--teal); }
    .btn-expand { padding: 2px 7px; font-size: 10px; border: 1px solid var(--border); border-radius: 4px; background: #fff; cursor: pointer; color: var(--text-muted); }
    .btn-expand:hover { border-color: var(--teal); color: var(--teal); }
    .btn-expand.active { background: var(--teal-light); border-color: var(--teal); color: var(--teal); }

    /* Memory module */
    .memory-row { display: flex; gap: 8px; align-items: flex-start; padding: 6px 8px; border-bottom: 1px solid #f5f5f5; font-size: 11px; }
    .memory-category { padding: 2px 6px; border-radius: 3px; font-size: 9px; font-weight: 600; white-space: nowrap; }
    .mem-cat-override { background: #fef3c7; color: #92400e; }
    .mem-cat-classification { background: #dbeafe; color: #1d4ed8; }
    .mem-cat-rule { background: #d1fae5; color: #065f46; }
    .mem-cat-general { background: #f3f4f6; color: #374151; }
    .memory-key { font-weight: 600; flex: 1; }
    .memory-value { color: var(--teal); font-weight: 600; }
    .memory-reason { font-size: 10px; color: var(--text-muted); flex: 2; }
    .memory-author { font-size: 9px; color: var(--text-muted); white-space: nowrap; }

    .ai-chat { display: flex; flex-direction: column; height: 300px; }
    .ai-messages { flex: 1; overflow-y: auto; padding: 8px; border: 1px solid var(--border); border-radius: 5px;
                   background: #f9f9f9; margin-bottom: 8px; font-size: 11px; }
    .ai-message { padding: 6px; margin-bottom: 4px; border-radius: 4px; background: #fff; border: 1px solid var(--border); }
    .ai-input-area { display: flex; gap: 4px; }
    .ai-input-area textarea { flex: 1; padding: 6px; border: 1px solid var(--border); border-radius: 4px; font-size: 11px; font-family: inherit; resize: none; }
    .ai-input-area button { padding: 6px 10px; background: var(--teal); color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 10px; }

    .feature-list { font-size: 10px; color: var(--text-muted); margin: 6px 0; }
    .feature-list li { margin-left: 14px; }
    .coming-soon-badge { display: inline-block; background: #fef9c3; color: #854d0e; padding: 2px 6px; border-radius: 3px; font-size: 9px; font-weight: 600; margin-top: 4px; }

    .empty-row { font-size: 10px; color: var(--text-muted); font-style: italic; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

const ADMIN_PW = 'GDC-pipeline-2026!';
const API = window.location.origin;

const STAGES = ['new','auto_nurture','scheduled','no_show','showed','treatment_presented','treatment_accepted','treatment_completed'];
const STAGE_LABELS = {
  new:'New Lead', auto_nurture:'Auto-Nurture', scheduled:'Scheduled',
  no_show:'No-Show', showed:'Showed', treatment_presented:'Tx Presented',
  treatment_accepted:'Tx Accepted', treatment_completed:'Tx Completed',
};
const STAGE_COLORS = {
  new:'#3b82f6', auto_nurture:'#f59e0b', scheduled:'#059669',
  no_show:'#dc2626', showed:'#16a34a', treatment_presented:'#0891b2',
  treatment_accepted:'#0d9488', treatment_completed:'#059669',
};

async function api(path, opts = {}) {
  const res = await fetch(API + path, {
    ...opts,
    headers: { 'Content-Type':'application/json', 'X-Admin-Password':ADMIN_PW, ...(opts.headers||{}) },
  });
  if (!res.ok) throw new Error('API ' + res.status);
  return res.json();
}

function timeAgo(iso) {
  if (!iso) return '';
  const d = Date.now() - new Date(iso).getTime();
  const m = Math.floor(d/60000);
  if (m < 1) return 'now'; if (m < 60) return m+'m';
  const h = Math.floor(m/60);
  if (h < 24) return h+'h'; const dy = Math.floor(h/24);
  if (dy < 30) return dy+'d'; return Math.floor(dy/30)+'mo';
}
function fmtDate(iso) { if (!iso) return ''; return new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
function fmtMoney(v) { if (!v) return '$0'; return '$'+Number(v).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0}); }
function pct(a,b) { if (!b) return '0%'; return Math.round(a/b*100)+'%'; }

function srcClass(s) {
  if (!s) return 'src-default';
  const l = s.toLowerCase();
  if (l.includes('google')) return 'src-google';
  if (l.includes('fb')||l.includes('facebook')) return 'src-fb';
  if (l.includes('smile')) return 'src-smile';
  if (l.includes('phone')||l.includes('call')) return 'src-phone';
  if (l.includes('contact')||l.includes('form')) return 'src-form';
  if (l.includes('pearly')||l.includes('chat')) return 'src-chat';
  return 'src-default';
}

function isStaffFollowUp(lead) {
  if (!['new','auto_nurture'].includes(lead.stage)) return false;
  // Must be older than 1 day
  const daysSince = (Date.now() - new Date(lead.created_at).getTime()) / (1000*60*60*24);
  if (daysSince < 1) return false;
  // Clear from this row if staff has contacted within the last 7 days
  if (lead.last_staff_contact_at) {
    const daysSinceContact = (Date.now() - new Date(lead.last_staff_contact_at).getTime()) / (1000*60*60*24);
    if (daysSinceContact < 7) return false;
  }
  return true;
}

function LeadChip({ lead, isSelected, onClick, onDragStart }) {
  const name = [lead.first_name,lead.last_name].filter(Boolean).join(' ') || lead.email || 'Unknown';
  const camp = lead.campaign_name || '';
  const shortCamp = camp.replace(/^grafton_nxtsmile_/,'');
  const apptDate = lead.appointment_date ? fmtDate(lead.appointment_date) : null;
  return (
    <span className={'lead-chip' + (isSelected?' selected':'') + (lead.next_follow_up?' has-priority':'')}
      onClick={()=>onClick(lead.id)}
      draggable onDragStart={e=>{e.dataTransfer.setData('text/plain',lead.id); e.dataTransfer.effectAllowed='move'; onDragStart&&onDragStart(lead.id);}}>
      <span className="chip-name">{name}</span>
      <span className={'chip-source '+srcClass(lead.source)}>{lead.source||'?'}</span>
      {lead.phone && <span className="chip-phone">{lead.phone}</span>}
      {apptDate && <span className="chip-appt">{apptDate}</span>}
      {shortCamp && <span className="chip-campaign" title={camp}>{shortCamp}</span>}
      {(lead.notes_count||0)>0 && <span className="chip-notes">{lead.notes_count}</span>}
      {lead.attributed_production>0 && <span className="chip-revenue">{fmtMoney(lead.attributed_production)}</span>}
      <span className="chip-time">{timeAgo(lead.updated_at)}</span>
    </span>
  );
}

function StageRow({ stage, label, leads, selectedId, onCardClick, onDrop, onDragStart, color, className }) {
  const [dragOver, setDragOver] = useState(false);
  return (
    <div className={'stage-row' + (dragOver?' drag-over':'') + (className?' '+className:'')}
      onDragOver={e=>{e.preventDefault();e.dataTransfer.dropEffect='move';setDragOver(true);}}
      onDragLeave={()=>setDragOver(false)}
      onDrop={e=>{e.preventDefault();setDragOver(false);const id=e.dataTransfer.getData('text/plain');onDrop(id,stage);}}>
      <span className="stage-dot" style={{background:color}} />
      <span className="stage-label">{label}</span>
      <span className="stage-count">{leads.length}</span>
      {leads.length > 0 && <span className="stage-sep" />}
      {leads.map(l=>(
        <LeadChip key={l.id} lead={l} isSelected={selectedId===l.id}
          onClick={onCardClick} onDragStart={onDragStart} />
      ))}
      {leads.length === 0 && <span className="empty-row">No leads</span>}
    </div>
  );
}

function DetailPanel({ lead, onClose, onStageChange, onRefresh }) {
  const [detail, setDetail] = useState(null);
  const [notes, setNotes] = useState([]);
  const [newNote, setNewNote] = useState('');
  const [showMove, setShowMove] = useState(false);
  const [tab, setTab] = useState('info');
  const [saving, setSaving] = useState(false);

  useEffect(() => {
    if (!lead) return;
    api('/api/lead/' + lead.id).then(setDetail);
    api('/api/admin/lead/' + lead.id + '/notes').then(d=>setNotes(d.notes||[]));
  }, [lead?.id]);

  if (!lead) return null;
  const name = [lead.first_name,lead.last_name].filter(Boolean).join(' ')||lead.email||'Unknown';

  async function addNote() {
    if (!newNote.trim()) return;
    setSaving(true);
    await api('/api/admin/lead/' + lead.id + '/notes',{method:'POST',body:JSON.stringify({note_text:newNote.trim()})});
    setNewNote('');
    const d = await api('/api/admin/lead/' + lead.id + '/notes');
    setNotes(d.notes||[]); setSaving(false); onRefresh();
  }
  async function delNote(id) {
    await api('/api/admin/note/' + id,{method:'DELETE'});
    setNotes(notes.filter(n=>n.id!==id)); onRefresh();
  }
  async function moveStage(s) {
    setShowMove(false);
    await api('/api/admin/lead/' + lead.id + '/force-stage',{method:'PUT',body:JSON.stringify({stage:s,reason:'manual move'})});
    onStageChange(lead.id,s);
  }

  const events = detail?.events||[];
  const queue = detail?.follow_up_queue||[];

  return (
    <React.Fragment>
      <div className="detail-backdrop" onClick={onClose} />
      <div className="detail-overlay open">
        <div className="detail-header">
          <button className="detail-close" onClick={onClose}>✕</button>
          <div style={{flex:1}}>
            <div style={{fontWeight:600,fontSize:13}}>{name}</div>
            <div style={{fontSize:10,color:'var(--text-muted)'}}>
              {lead.email}{lead.phone&&(' · '+lead.phone)}
            </div>
          </div>
          <div style={{position:'relative'}}>
            <button className="btn btn-teal btn-sm" onClick={()=>setShowMove(!showMove)}>
              {STAGE_LABELS[lead.stage]} ▾
            </button>
            {showMove && (
              <div className="stage-move-menu">
                {STAGES.map(s=>(
                  <div key={s} className={'stage-move-item'+(s===lead.stage?' current':'')}
                    onClick={()=>s!==lead.stage&&moveStage(s)}>
                    <span className="stage-dot" style={{background:STAGE_COLORS[s],width:7,height:7}} />
                    {STAGE_LABELS[s]}{s===lead.stage&&' ✓'}
                  </div>
                ))}
              </div>

function PipelineTab({ pipeline, stats, selectedId, onCardClick, onStageChange, onRefresh }) {
  const [searchTerm, setSearchTerm] = useState('');
  const [sourceFilter, setSourceFilter] = useState('all');
  const [showCold, setShowCold] = useState(false);

  const filtered = useMemo(() => {
    let items = pipeline.filter(l => {
      if (!showCold && l.stage === 'cold') return false;
      if (sourceFilter !== 'all' && l.source !== sourceFilter) return false;
      if (searchTerm) {
        const term = searchTerm.toLowerCase();
        const name = (l.first_name + ' ' + l.last_name).toLowerCase();
        const email = (l.email||'').toLowerCase();
        const phone = (l.phone||'').toLowerCase();
        if (!name.includes(term) && !email.includes(term) && !phone.includes(term)) return false;
      }
      return true;
    });
    return items;
  }, [pipeline, searchTerm, sourceFilter, showCold]);

  const byStage = useMemo(() => {
    const map = {};
    STAGES.forEach(s => map[s] = []);
    map['cold'] = [];
    filtered.forEach(l => {
      if (map[l.stage] !== undefined) map[l.stage].push(l);
    });
    return map;
  }, [filtered]);

  const staffFollowUps = filtered.filter(isStaffFollowUp);

  const sources = useMemo(() => {
    const set = new Set(pipeline.filter(l=>l.source).map(l=>l.source));
    return ['all', ...Array.from(set).sort()];
  }, [pipeline]);

  async function handleDrop(leadId, newStage) {
    await api('/api/admin/lead/' + leadId + '/force-stage',{method:'PUT',body:JSON.stringify({stage:newStage,reason:'drag-drop'})});
    onStageChange(leadId, newStage);
  }

  return (
    <div>
      <div className="kpi-strip">
        <div className="kpi"><div className="kpi-val">{stats?.total_leads||0}</div><div className="kpi-label">Total</div></div>
        <div className="kpi"><div className="kpi-val">{filtered.length}</div><div className="kpi-label">Active</div></div>
        <div className="kpi"><div className="kpi-val">{byStage.scheduled.length}</div><div className="kpi-label">Scheduled</div></div>
        <div className="kpi"><div className="kpi-val">{byStage.no_show.length}</div><div className="kpi-label">No-Shows</div></div>
        <div className="kpi"><div className="kpi-val">{byStage.treatment_completed.length}</div><div className="kpi-label">Treated</div></div>
        <div className="kpi"><div className="kpi-val">{fmtMoney(stats?.attributed_revenue||0)}</div><div className="kpi-label">Revenue</div></div>
      </div>

      <div className="filter-bar">
        <select className="filter-select" value={sourceFilter} onChange={e=>setSourceFilter(e.target.value)}>
          {sources.map(s => (
            <option key={s} value={s}>{s === 'all' ? 'All Sources' : s}</option>
          ))}
        </select>
        <input type="text" className="search-box" placeholder="Search name, email, phone..." value={searchTerm} onChange={e=>setSearchTerm(e.target.value)} />
        <label style={{fontSize:11,display:'flex',gap:6,alignItems:'center',cursor:'pointer'}}>
          <input type="checkbox" checked={showCold} onChange={e=>setShowCold(e.target.checked)} />
          Show Cold
        </label>
      </div>

      {staffFollowUps.length > 0 && (
        <StageRow stage="followup" label="Staff Follow-Up" leads={staffFollowUps} selectedId={selectedId}
          onCardClick={onCardClick} onDrop={handleDrop} color="#f59e0b" className="special followup-row" />
      )}

      {STAGES.map(s => (
        <StageRow key={s} stage={s} label={STAGE_LABELS[s]} leads={byStage[s]} selectedId={selectedId}
          onCardClick={onCardClick} onDrop={handleDrop} color={STAGE_COLORS[s]} />
      ))}
      {showCold && byStage.cold.length > 0 && (
        <StageRow stage="cold" label="Cold" leads={byStage.cold} selectedId={selectedId}
          onCardClick={onCardClick} onDrop={handleDrop} color="#9ca3af" />
      )}
    </div>
  );
}

// Default date range helpers
function defaultDateRange(days) {
  const end = new Date();
  const start = new Date();
  start.setDate(end.getDate() - days);
  const fmt = d => d.toISOString().split('T')[0];
  return { start: fmt(start), end: fmt(end) };
}

function CampaignExpandedPanel({ campaign, keywordStats, ga4Data, colSpan }) {
  const [panelTab, setPanelTab] = useState('analytics');
  const campName = (campaign.campaign||'').toLowerCase();

  // Filter keywords for this campaign
  const campKeywords = keywordStats.filter(k =>
    (k.campaign_name||'').toLowerCase() === campName ||
    (k.campaign_name||'').toLowerCase().includes(campName.replace(/^grafton_nxtsmile_/,''))

  // GA4 data
  const ov = ga4Data?.overview || {};
  const ev = ga4Data?.events || {};
  const sources = (ga4Data?.traffic_sources || []).filter(s =>
    s.source_medium && s.source_medium.toLowerCase().includes('google')
  );
  const hasGa4 = ov.configured === true && !ov.error && !ov.no_data;

  // Treatment acceptance rate: presented vs accepted
  const presented = campaign.treatment_presented_count || 0;
  const accepted = campaign.treatment_accepted_count || 0;
  const txAcceptPct = presented > 0 ? Math.round(accepted / presented * 100) : null;

                  background:'none',border:'none',
                  borderBottom:panelTab===k?'2px solid var(--teal)':'2px solid transparent',
                  color:panelTab===k?'var(--teal)':'var(--text-muted)'}}>
                {l}

          {panelTab==='analytics' && (
            <div>
              {hasGa4 ? (
                <div>
                  <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:6,marginBottom:12}}>
                    {[
                      ['Sessions', Math.round(ov.sessions||0).toLocaleString()],
                      ['Engagement', (ov.engagement_rate||0)+'%'],
                      ['Avg Duration', ov.avg_session_duration_formatted||'—'],
                      ['Bounce Rate', (ov.bounce_rate_pct||0)+'%'],
                      ['Smile Starts', ev.smile_started||0],
                      ['Smile Submitted', ev.smile_submitted||0],
                      ['Form Submits', ev.form_submit||0],
                      ['Chat Leads', ev.chat_lead_captured||0],
                    ].map(([label,val])=>(
                      <div key={label} style={{background:'#fff',border:'1px solid var(--border)',borderRadius:5,padding:'6px 10px',textAlign:'center'}}>
                        <div style={{fontSize:14,fontWeight:700,color:'var(--teal)'}}>{val}</div>
                        <div style={{fontSize:9,color:'var(--text-muted)',marginTop:1}}>{label}</div>

                          <th className="num">Avg Duration</th>
                          <th className="num">Conversions</th>

                            <td className="num">{s.new_users}</td>

                        ))}

                  )}
                  <p style={{fontSize:9,color:'var(--text-muted)',marginTop:6,fontStyle:'italic'}}>

                <table className="report-table" style={{fontSize:10}}>
                  <thead>
                    <tr>
                      <th>Keyword</th>
                      <th className="num" title="Quality Score (1-10). Below 5 = fix ad relevance or landing page.">QS</th>
                      <th className="num" title="Impression Share — % of eligible impressions you're winning. Low = raise bid or improve quality.">Imp.Share</th>

                            <span style={{fontWeight:600,color:isColor}}>{isPct}%</span>

                        </td>
                        <td className="num">{(k.impressions||0).toLocaleString()}</td>
                        <td className="num">{(k.gads_clicks||0).toLocaleString()}</td>
                        <td className="num">{fmtMoney(k.total_cost||0)}</td>
                        <td className="num">{k.lead_count||0}</td>
                        <td className="num">{k.cpl ? '$'+Number(k.cpl).toFixed(0) : '—'}</td>
                        <td className="num">{k.scheduled_count||0}</td>
                        <td className="num">{k.treated_count||0}</td>
                        <td className="num money">{fmtMoney(k.revenue||0)}</td>

    </tr>

function ReportsTab({ campaignStats, keywordStats, ga4Data }) {
  const [dateRange, setDateRange] = useState(() => defaultDateRange(30));
  const [expanded, setExpanded] = useState(null); // campKey → null | 'analytics' | 'keywords'
  const [ga4Refreshing, setGa4Refreshing] = useState(false);

  const presets = [
    { label: '7d', days: 7 },
    { label: '30d', days: 30 },
    { label: '90d', days: 90 },
    { label: 'All', days: 365 },
  ];

  async function refreshGA4() {
    setGa4Refreshing(true);
    try { await api('/api/admin/ga4/refresh', {method:'POST'}); window.location.reload(); }
    catch(e) { alert('GA4 refresh failed: '+e.message); }
    setGa4Refreshing(false);
  }

  function togglePanel(campKey, tab) {
    // If same campaign + same tab → close. Otherwise open that tab.
    setExpanded(prev =>
      prev && prev.key === campKey && prev.tab === tab ? null : { key: campKey, tab }
    );
  }

  const COLS = 8; // number of columns in campaign table

  return (
    <div>
      <div className="report-section">
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:8,marginBottom:12}}>
          <div className="report-title" style={{marginBottom:0}}>Campaign Performance</div>
          <div style={{display:'flex',gap:4,alignItems:'center',flexWrap:'wrap'}}>
            {presets.map(p=>(
              <button key={p.label}
                style={{padding:'3px 8px',fontSize:10,border:'1px solid var(--border)',borderRadius:4,cursor:'pointer',
                  background:dateRange.start===defaultDateRange(p.days).start?'var(--teal)':'#fff',
                  color:dateRange.start===defaultDateRange(p.days).start?'#fff':'var(--text-muted)'}}
                onClick={()=>setDateRange(defaultDateRange(p.days))}>
                {p.label}
              </button>

function ScheduledJobsSection() {
  const [jobs, setJobs] = useState([]);
  const [loaded, setLoaded] = useState(false);

  useEffect(() => {
    api('/api/admin/jobs')
      .then(r => { setJobs(r.jobs || []); setLoaded(true); })
      .catch(() => setLoaded(true));
  }, []);

  // Merge API data with static metadata so all jobs always appear
  const merged = Object.keys(JOB_META).map(id => {
    const live = jobs.find(j => j.id === id) || {};
    const meta = JOB_META[id];
    return { id, ...meta, ...live, label: meta.label, schedule: meta.schedule, desc: meta.desc };
  });

  function fmtRunTime(iso) {
    if (!iso) return <span style={{color:'var(--text-muted)',fontStyle:'italic'}}>not yet</span>;
    const d = new Date(iso);
    const ago = timeAgo(iso);
    return <span title={d.toLocaleString()}>{d.toLocaleDateString('en-US',{month:'short',day:'numeric'})} {d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})} <span style={{color:'var(--text-muted)',fontSize:9}}>({ago})</span></span>;
  }

  function fmtNextRun(iso) {
    if (!iso) return <span style={{color:'var(--text-muted)'}}>—</span>;
    const d = new Date(iso);
    const inMs = d - Date.now();
    const inH = Math.floor(inMs / 3600000);
    const inM = Math.floor((inMs % 3600000) / 60000);
    const label = inMs < 0 ? 'overdue' : inH > 0 ? `in ${inH}h ${inM}m` : `in ${inM}m`;
    return <span title={d.toLocaleString()}>{d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})} <span style={{color:'var(--text-muted)',fontSize:9}}>({label})</span></span>;
  }

  return (
    <div className="report-section">
      <div className="report-title">Scheduled Jobs</div>
      <table className="report-table">
        <thead>
          <tr>
            <th>Job</th>
            <th>Schedule</th>
            <th>Description</th>
            <th className="num">Last Ran</th>
            <th className="num">Next Run</th>
          </tr>
        </thead>
        <tbody>
          {merged.map(job => (
            <tr key={job.id}>
              <td style={{fontWeight:500}}>{job.label}</td>
              <td style={{color:'var(--text-muted)'}}>{job.schedule}</td>
              <td style={{color:'var(--text-muted)',fontSize:10}}>{job.desc}</td>
              <td className="num" style={{fontSize:10}}>{fmtRunTime(job.last_run)}</td>
              <td className="num" style={{fontSize:10}}>{fmtNextRun(job.next_run)}</td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function KeywordResearchSection() {
  const [seeds, setSeeds] = useState('');
  const [results, setResults] = useState([]);
  const [loading, setLoading] = useState(false);
  const [searched, setSearched] = useState(false);
  const [sortCol, setSortCol] = useState('avg_monthly_searches');
  const [sortDir, setSortDir] = useState('desc');

  async function runResearch() {
    const kws = seeds.split('\n').map(s=>s.trim()).filter(Boolean);
    if (!kws.length) { alert('Enter at least one keyword'); return; }
    setLoading(true);
    try {
      const r = await api('/api/admin/keyword-research', {
        method: 'POST',
        body: JSON.stringify({ seed_keywords: kws }),
      });
      setResults(r.ideas || []);
      setSearched(true);
    } catch(e) { alert('Research failed: '+e.message); }
    setLoading(false);
  }

  function toggleSort(col) {
    if (sortCol === col) setSortDir(d => d === 'asc' ? 'desc' : 'asc');
    else { setSortCol(col); setSortDir('desc'); }
  }

  const sorted = [...results].sort((a,b) => {
    const av = a[sortCol] ?? 0, bv = b[sortCol] ?? 0;
    return sortDir === 'asc' ? (av > bv ? 1 : -1) : (av < bv ? 1 : -1);
  });

  const compColor = c => c==='HIGH'?'#dc2626':c==='MEDIUM'?'#d97706':'#16a34a';

  function SortTh({col, label, title}) {
    const active = sortCol === col;
    return (
      <th className="num" title={title||''} style={{cursor:'pointer',userSelect:'none'}}
        onClick={()=>toggleSort(col)}>
        {label}{active ? (sortDir==='asc'?' ↑':' ↓') : ''}
      </th>
    );
  }

  return (
    <div className="report-section">
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:6}}>
        <div>
          <div className="report-title" style={{marginBottom:2}}>🔍 Keyword Research</div>
          <p style={{fontSize:10,color:'var(--text-muted)'}}>
            Google Keyword Planner — search volume, competition &amp; CPC for your market.
            Use before launching a new campaign to validate keyword demand.
          </p>
        </div>
      </div>

      <div style={{display:'flex',gap:8,alignItems:'flex-start',marginBottom:12}}>
        <textarea
          style={{flex:1,minHeight:70,maxHeight:140,padding:'6px 8px',fontSize:11,
            border:'1px solid var(--border)',borderRadius:6,fontFamily:'inherit',resize:'vertical'}}
          placeholder={"One keyword per line:\ngum grafting near me\nfree gingival graft cost\ngum graft dentist worcester"}
          value={seeds}
          onChange={e=>setSeeds(e.target.value)}
        />
        <button className="btn btn-teal" onClick={runResearch} disabled={loading}
          style={{whiteSpace:'nowrap',alignSelf:'flex-end'}}>
          {loading ? 'Researching...' : 'Get Volume & CPCs'}
        </button>
      </div>

      {searched && results.length === 0 && !loading && (
        <div style={{fontSize:11,color:'var(--text-muted)',fontStyle:'italic',padding:8}}>
          No results returned. Check that Google Ads API credentials are configured.
        </div>
      )}

      {sorted.length > 0 && (
        <>
          <div style={{fontSize:10,color:'var(--text-muted)',marginBottom:6}}>
            {sorted.length} keywords — click column headers to sort
          </div>
          <div style={{overflowX:'auto'}}>
          <table className="report-table" style={{fontSize:10}}>
            <thead>
              <tr>
                <th style={{cursor:'pointer',userSelect:'none'}} onClick={()=>toggleSort('keyword')}>
                  Keyword {sortCol==='keyword'?(sortDir==='asc'?'↑':'↓'):''}
                </th>
                <SortTh col="avg_monthly_searches" label="Searches/mo"
                  title="Average monthly searches in your target area" />
                <th className="num" title="LOW = less competition, cheaper clicks. HIGH = more competition, expensive.">Competition</th>
                <th className="num" title="Competition index 0-100. Higher = more advertisers bidding.">Comp. Index</th>
                <SortTh col="low_cpc" label="Low CPC" title="Low end of top-of-page bid range" />
                <SortTh col="high_cpc" label="High CPC" title="High end of top-of-page bid range" />
                <th className="num" title="12-month search trend">Trend</th>
              </tr>
            </thead>
            <tbody>
              {sorted.map((kw,i)=>{
                // Sparkline: last 6 months volumes
                const trend = (kw.trend_monthly||[]).slice(0,6).reverse();
                const maxVol = Math.max(...trend.map(t=>t.searches||0), 1);
                return (
                  <tr key={i}>
                    <td style={{fontWeight:500}}>{kw.keyword}</td>
                    <td className="num" style={{fontWeight:700}}>
                      {(kw.avg_monthly_searches||0).toLocaleString()}
                    </td>
                    <td className="num">
                      <span style={{fontWeight:700,color:compColor(kw.competition)}}>
                        {kw.competition||'—'}
                      </span>
                    </td>
                    <td className="num">{kw.competition_index||0}</td>
                    <td className="num">{kw.low_cpc > 0 ? '$'+kw.low_cpc.toFixed(2) : '—'}</td>
                    <td className="num">{kw.high_cpc > 0 ? '$'+kw.high_cpc.toFixed(2) : '—'}</td>
                    <td className="num">
                      {trend.length > 0 ? (
                        <span style={{display:'inline-flex',gap:1,alignItems:'flex-end',height:14}}>
                          {trend.map((t,ti)=>{
                            const h = Math.max(2, Math.round((t.searches/maxVol)*14));
                            return <span key={ti} style={{
                              width:4,height:h+'px',borderRadius:1,
                              background: h > 8 ? 'var(--teal)' : '#94a3b8',
                              display:'inline-block'}} />;
                          })}
                        </span>
                      ) : '—'}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
          </div>
        </>
      )}
    </div>
  );
}

          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
            <div className="report-title">AI Optimizer Report — {optimizerResult.mode}</div>
            <span style={{fontSize:10,color:'var(--text-muted)'}}>{new Date(optimizerResult.timestamp).toLocaleString()}</span>
          </div>

          {optimizerResult.error && (
            <div style={{padding:12,background:'#fef2f2',borderRadius:6,color:'#dc2626',fontSize:12}}>
              Error: {optimizerResult.error}
            </div>
          )}

          {optimizerResult.summary && (
            <>
              <div style={{display:'grid',gridTemplateColumns:'repeat(6,1fr)',gap:8,marginBottom:12}}>
                {[
                  ['Total Spend',`$${optimizerResult.summary.total_spend}`],
                  ['Total Clicks',optimizerResult.summary.total_clicks],
                  ['Total Leads',optimizerResult.summary.total_leads],
                  ['ROAS',optimizerResult.summary.overall_roas+'x'],
                  ['CPL',`$${optimizerResult.summary.cost_per_lead}`],
                  ['Production',`$${optimizerResult.summary.total_production}`],
                ].map(([label,val])=>(
                  <div key={label} style={{background:'var(--gray-light)',borderRadius:6,padding:'8px 10px',textAlign:'center'}}>
                    <div style={{fontSize:9,color:'var(--text-muted)',marginBottom:2}}>{label}</div>
                    <div style={{fontSize:14,fontWeight:700,color:'var(--teal)'}}>{val}</div>
                  </div>
                ))}
              </div>

              {optimizerResult.actions?.pause?.length > 0 && (
                <div style={{marginBottom:10}}>
                  <div style={{fontSize:11,fontWeight:600,color:'#dc2626',marginBottom:4}}>⛔ Pause ({optimizerResult.actions.pause.length} keywords)</div>
                  {optimizerResult.actions.pause.map((k,i)=>(
                    <div key={i} style={{fontSize:11,padding:'4px 8px',background:'#fef2f2',borderRadius:4,marginBottom:3}}>
                      <strong>"{k.keyword}"</strong> — {k.reason}
                    </div>
                  ))}
                </div>
              )}

              {optimizerResult.actions?.increase_bid?.length > 0 && (
                <div style={{marginBottom:10}}>
                  <div style={{fontSize:11,fontWeight:600,color:'#16a34a',marginBottom:4}}>⬆️ Bid Up ({optimizerResult.actions.increase_bid.length} keywords)</div>
                  {optimizerResult.actions.increase_bid.map((k,i)=>(
                    <div key={i} style={{fontSize:11,padding:'4px 8px',background:'#f0fdf4',borderRadius:4,marginBottom:3}}>
                      <strong>"{k.keyword}"</strong> — {k.reason}
                    </div>
                  ))}
                </div>
              )}

              {optimizerResult.actions?.decrease_bid?.length > 0 && (
                <div style={{marginBottom:10}}>
                  <div style={{fontSize:11,fontWeight:600,color:'#f59e0b',marginBottom:4}}>⬇️ Bid Down ({optimizerResult.actions.decrease_bid.length} keywords)</div>
                  {optimizerResult.actions.decrease_bid.map((k,i)=>(
                    <div key={i} style={{fontSize:11,padding:'4px 8px',background:'#fffbeb',borderRadius:4,marginBottom:3}}>
                      <strong>"{k.keyword}"</strong> — {k.reason}
                    </div>
                  ))}
                </div>
              )}

              {optimizerResult.actions?.new_exact?.length > 0 && (
                <div style={{marginBottom:10}}>
                  <div style={{fontSize:11,fontWeight:600,color:'#0891b2',marginBottom:4}}>✨ Add as Exact Match ({optimizerResult.actions.new_exact.length} terms)</div>
                  {optimizerResult.actions.new_exact.map((k,i)=>(
                    <div key={i} style={{fontSize:11,padding:'4px 8px',background:'#f0f9ff',borderRadius:4,marginBottom:3}}>
                      <strong>"{k.search_term}"</strong> — {k.clicks} clicks, {k.conversions} conversions
                    </div>
                  ))}
                </div>
              )}

              {optimizerResult.actions?.new_negatives?.length > 0 && (
                <div style={{marginBottom:10}}>
                  <div style={{fontSize:11,fontWeight:600,color:'#6b7280',marginBottom:4}}>🚫 Add as Negative ({optimizerResult.actions.new_negatives.length} terms)</div>
                  {optimizerResult.actions.new_negatives.slice(0,10).map((k,i)=>(
                    <div key={i} style={{fontSize:11,padding:'4px 8px',background:'var(--gray-light)',borderRadius:4,marginBottom:3}}>
                      <strong>"{k.search_term}"</strong> — {k.reason}
                    </div>
                  ))}
                  {optimizerResult.actions.new_negatives.length > 10 && (
                    <div style={{fontSize:10,color:'var(--text-muted)',padding:'2px 8px'}}>+{optimizerResult.actions.new_negatives.length-10} more</div>
                  )}
                </div>
              )}

              {optimizerResult.memory_applied?.length > 0 && (
                <div style={{marginBottom:10}}>
                  <div style={{fontSize:11,fontWeight:600,color:'#8b5cf6',marginBottom:4}}>🧠 Memory Overrides Applied ({optimizerResult.memory_applied.length})</div>
                  {optimizerResult.memory_applied.map((m,i)=>(
                    <div key={i} style={{fontSize:10,padding:'3px 8px',background:'#f5f3ff',borderRadius:4,marginBottom:2,color:'#6d28d9'}}>
                      {m}
                    </div>
                  ))}
                </div>
              )}

              {optimizerResult.summary.keywords_to_pause === 0 &&
               optimizerResult.summary.keywords_to_bid_up === 0 &&
               optimizerResult.summary.new_negatives === 0 && (
                <div style={{fontSize:12,color:'var(--text-muted)',textAlign:'center',padding:12}}>
                  Not enough data yet for recommendations. Needs gclid attribution from new leads.
                </div>
              )}
            </>
          )}
        </div>
      )}

      <KeywordResearchSection />

      <MemorySection />

      <ScheduledJobsSection />

      <div className="report-section">
        <div className="report-title">AI Report Engine</div>
        <p style={{fontSize:11,marginBottom:10}}>Ask questions about your pipeline data</p>
        <div className="ai-chat">
          <div className="ai-messages">
            <div className="ai-message">AI chat coming soon. Upload CSV files for ROI analysis.</div>
          </div>
          <div className="ai-input-area">
            <textarea placeholder="Ask a question..." value={chatMsg} onChange={e=>setChatMsg(e.target.value)} style={{maxHeight:80}}></textarea>
            <button disabled>Send</button>
          </div>
        </div>
        <button className="btn btn-ghost btn-sm" style={{marginTop:8}}>Upload CSV</button>
      </div>

      <div className="report-section">
        <div className="report-title">Campaign Email/SMS Builder</div>
        <p style={{fontSize:11}}>Create custom email and SMS sequences for campaigns like Invisalign, Cosmetic, etc.</p>
        <div style={{marginTop:8}}>
          <div className="coming-soon-badge">Coming Soon</div>
          <ul className="feature-list">
            <li>Custom drip sequences</li>
            <li>AI-assisted copy generation</li>
            <li>Template library</li>
            <li>A/B testing</li>
          </ul>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [tab, setTab] = useState('pipeline');
  const [pipeline, setPipeline] = useState([]);
  const [stats, setStats] = useState(null);
  const [campaignStats, setCampaignStats] = useState([]);
  const [keywordStats, setKeywordStats] = useState([]);
  const [ga4Data, setGa4Data] = useState(null);
  const [selectedId, setSelectedId] = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    loadData();
    const interval = setInterval(loadData, 30000);
    return () => clearInterval(interval);
  }, []);

  async function loadData() {
    try {
      const [p, s, c, g] = await Promise.all([
        api('/api/pipeline/enriched'),
        api('/api/admin/stats'),
        api('/api/admin/campaigns'),
        api('/api/admin/ga4').catch(()=>null),
      ]);
      setPipeline(p.leads||[]);
      setStats(s);
      setCampaignStats(c.campaigns||[]);
      setKeywordStats(c.keywords||[]);
      if (g) setGa4Data(g);
    } catch (e) {
      console.error('Load error:', e);
    } finally {
      setLoading(false);
    }
  }

  function handleStageChange(leadId, newStage) {
    setPipeline(pipeline.map(l => l.id === leadId ? {...l, stage:newStage} : l));
  }

  return (
    <div>
      <div className="header">
        <div className="header-logo">nXt<span>smile</span> Pipeline</div>
        <div className="header-right">
          <div className="header-dot" />
          Live
        </div>
      </div>
      <div className="tab-bar">
        <button className={'tab' + (tab==='pipeline'?' active':'')} onClick={()=>setTab('pipeline')}>Pipeline</button>
        <button className={'tab' + (tab==='reports'?' active':'')} onClick={()=>setTab('reports')}>Reports & Campaigns</button>
        <button className={'tab' + (tab==='admin'?' active':'')} onClick={()=>setTab('admin')}>Admin</button>
      </div>
      <div className="main">
        {loading ? (
          <div style={{textAlign:'center',padding:20,color:'var(--text-muted)'}}>Loading...</div>
        ) : (
          <>
            {tab==='pipeline' && (
              <>
                <PipelineTab pipeline={pipeline} stats={stats} selectedId={selectedId}
                  onCardClick={setSelectedId} onStageChange={handleStageChange} onRefresh={loadData} />
                {selectedId && (
                  <DetailPanel lead={pipeline.find(l=>l.id===selectedId)} onClose={()=>setSelectedId(null)}
                    onStageChange={handleStageChange} onRefresh={loadData} />
                )}
              </>
            )}
            {tab==='reports' && <ReportsTab campaignStats={campaignStats} keywordStats={keywordStats} ga4Data={ga4Data} />}
            {tab==='admin' && (
              <AdminTab
                onSync={()=>api('/api/admin/sync', {method:'POST'})}
                onMatch={()=>api('/api/admin/match', {method:'POST'})}
                onGAds={()=>api('/api/admin/gads-sync', {method:'POST'})}
                onConversions={()=>api('/api/admin/upload-conversions', {method:'POST'})}
                onGA4Refresh={()=>api('/api/admin/ga4/refresh', {method:'POST'})}
                onOptimize={()=>api('/api/admin/optimize?dry_run=true', {method:'POST'})} />
            )}
          </>
        )}
      </div>
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
