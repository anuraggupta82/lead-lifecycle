// ── Pending Approvals Panel ────────────────────────────────────────────────────
function PendingApprovalsPanel() {
  const [rows, setRows]           = useState(null);   // null = loading
  const [writesStatus, setWrites] = useState(null);   // {enabled, env_enabled, runtime_enabled}
  const [acting, setActing]       = useState({});     // {action_id: 'apply'|'reject'}
  const [togglingWrites, setTW]   = useState(false);
  const [error, setError]         = useState(null);

  async function load() {
    try {
      const [pr, wr] = await Promise.all([
        api('/api/admin/gads/pending-approvals'),
        api('/api/admin/gads/writes-status'),
      ]);
      setRows(pr.pending || []);
      setWrites(wr);
      setError(null);
    } catch(e) {
      setError(e.message);
      setRows([]);
    }
  }

  useEffect(() => { load(); }, []);

  async function handleApply(action_id) {
    if (writesStatus && !writesStatus.enabled) {
      alert('Google Ads writes are disabled. Enable writes first.');
      return;
    }
    if (!confirm('Apply this recommendation to Google Ads now?')) return;
    setActing(prev => ({...prev, [action_id]: 'apply'}));
    try {
      await api(`/api/admin/gads/approve/${action_id}`, { method: 'POST' });
      setRows(prev => prev.map(r => r.action_id === action_id
        ? {...r, _result: 'applied'} : r));
    } catch(e) {
      alert('Apply failed: ' + e.message);
    }
    setActing(prev => ({...prev, [action_id]: null}));
  }

  async function handleReject(action_id) {
    if (!confirm('Reject and dismiss this recommendation?')) return;
    setActing(prev => ({...prev, [action_id]: 'reject'}));
    try {
      await api(`/api/admin/gads/reject/${action_id}`, { method: 'POST' });
      setRows(prev => prev.map(r => r.action_id === action_id
        ? {...r, _result: 'rejected'} : r));
    } catch(e) {
      alert('Reject failed: ' + e.message);
    }
    setActing(prev => ({...prev, [action_id]: null}));
  }

  async function toggleWrites() {
    if (!writesStatus) return;
    const newVal = !writesStatus.runtime_enabled;
    if (newVal && !confirm('Enable live Google Ads writes? This allows keyword pauses, bid changes, and keyword additions to execute immediately.')) return;
    setTW(true);
    try {
      await api('/api/admin/gads/writes-enabled', { method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ enabled: newVal }) });
      setWrites(prev => ({...prev, runtime_enabled: newVal, enabled: prev.env_enabled && newVal}));
    } catch(e) {
      alert('Toggle failed: ' + e.message);
    }
    setTW(false);
  }

  const OP_ICONS = {
    pause_keyword:       '⛔',
    increase_bid:        '⬆️',
    decrease_bid:        '⬇️',
    add_exact_keyword:   '✨',
    add_negative_keyword:'🚫',
  };
  const OP_COLORS = {
    pause_keyword:       { bg:'#fef2f2', label:'#dc2626' },
    increase_bid:        { bg:'#f0fdf4', label:'#16a34a' },
    decrease_bid:        { bg:'#fffbeb', label:'#f59e0b' },
    add_exact_keyword:   { bg:'#f0f9ff', label:'#0891b2' },
    add_negative_keyword:{ bg:'var(--gray-light)', label:'#6b7280' },
  };

  function fmtState(json_str, op) {
    if (!json_str) return '—';
    try {
      const obj = JSON.parse(json_str);
      if (op === 'pause_keyword')        return `enabled → paused`;
      if (op === 'increase_bid' || op === 'decrease_bid') {
        const before = obj.current_bid_micros ? `$${(obj.current_bid_micros/1e6).toFixed(2)}` : '—';
        const after  = obj.new_bid_micros     ? `$${(obj.new_bid_micros/1e6).toFixed(2)}`     : '—';
        return op === 'increase_bid' ? `${before} → ${after} ⬆️` : `${before} → ${after} ⬇️`;
      }
      if (op === 'add_exact_keyword')    return `[exact] "${obj.keyword_text}"`;
      if (op === 'add_negative_keyword') return `[neg/${obj.match_type||'broad'}] "${obj.keyword_text}"`;
      return JSON.stringify(obj).slice(0,80);
    } catch { return json_str.slice(0,80); }
  }

  const writesEnabled = writesStatus?.enabled ?? false;

  return (
    <div className="report-section">
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
        <div className="report-title" style={{marginBottom:0}}>Pending Recommendations</div>
        <button className="btn" style={{fontSize:10,padding:'3px 8px'}} onClick={load}>↻ Refresh</button>
      </div>

      {/* Write Controls Banner */}
      {writesStatus && (
        <div style={{
          display:'flex', alignItems:'center', gap:10, marginBottom:12,
          padding:'8px 12px', borderRadius:6,
          background: writesEnabled ? '#f0fdf4' : '#fef9c3',
          border: `1px solid ${writesEnabled ? '#86efac' : '#fde68a'}`,
          fontSize:11
        }}>
          <span style={{fontWeight:600, color: writesEnabled ? '#15803d' : '#854d0e'}}>
            Google Ads Writes: {writesEnabled ? '✅ ENABLED' : '⚠️ DISABLED'}
          </span>
          {!writesStatus.env_enabled && (
            <span style={{color:'#92400e',fontSize:10}}>
              (CAMPAIGN_WRITE_OPS_ENABLED env var is off — set to true to allow writes)
            </span>
          )}
          {writesStatus.env_enabled && (
            <button
              className="btn"
              style={{fontSize:10, padding:'2px 10px',
                background: writesEnabled ? '#fef2f2' : '#f0fdf4',
                color: writesEnabled ? '#dc2626' : '#16a34a'}}
              onClick={toggleWrites}
              disabled={togglingWrites}
            >
              {togglingWrites ? '…' : writesEnabled ? 'Disable Writes' : 'Enable Writes'}
            </button>
          )}
          <span style={{color:'var(--text-muted)',fontSize:9,marginLeft:'auto'}}>
            Both env var and runtime switch must be on for any action to execute
          </span>
        </div>
      )}

      {error && (
        <div style={{padding:10,background:'#fef2f2',borderRadius:6,color:'#dc2626',fontSize:11,marginBottom:8}}>
          Error loading recommendations: {error}
        </div>
      )}

      {rows === null && !error && (
        <div style={{fontSize:11,color:'var(--text-muted)',textAlign:'center',padding:16}}>Loading…</div>
      )}

      {rows !== null && rows.length === 0 && (
        <div style={{fontSize:11,color:'var(--text-muted)',textAlign:'center',padding:16}}>
          No pending recommendations. Run the optimizer to generate new ones.
        </div>
      )}

      {rows !== null && rows.length > 0 && rows.map(row => {
        const done   = row._result === 'applied' || row._result === 'rejected';
        const colors = OP_COLORS[row.operation] || {bg:'var(--gray-light)',label:'#374151'};
        const icon   = OP_ICONS[row.operation] || '❓';
        const busy   = acting[row.action_id];
        return (
          <div key={row.action_id} style={{
            background: done ? '#f8fafc' : colors.bg,
            border:'1px solid var(--border)',
            borderRadius:6, padding:'10px 12px', marginBottom:8,
            opacity: done ? 0.65 : 1
          }}>
            <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:4}}>
              <span style={{fontSize:13}}>{icon}</span>
              <span style={{fontSize:11,fontWeight:700,color:colors.label,textTransform:'uppercase',letterSpacing:'0.5px'}}>
                {row.operation.replace(/_/g,' ')}
              </span>
              <span style={{fontSize:12,fontWeight:600,color:'var(--text)',marginLeft:4}}>
                "{row.entity_name}"
              </span>
              {row._result && (
                <span style={{marginLeft:'auto',fontSize:10,fontWeight:700,
                  color: row._result==='applied' ? '#16a34a' : '#dc2626'}}>
                  {row._result === 'applied' ? '✅ Applied' : '❌ Rejected'}
                </span>
              )}
            </div>

            <div style={{fontSize:10,color:'var(--text-muted)',marginBottom:3}}>
              <strong>Reason:</strong> {row.reason}
            </div>

            <div style={{fontSize:10,color:'var(--text-muted)',marginBottom:6}}>
              <strong>Change:</strong> {fmtState(row.after_state_json || row.before_state_json, row.operation)}
              &nbsp;&nbsp;
              <strong>Requested:</strong> {new Date(row.created_at).toLocaleString()}
            </div>

            {!done && (
              <div style={{display:'flex',gap:6}}>
                <button
                  className="btn btn-teal"
                  style={{fontSize:10,padding:'3px 12px',opacity: writesEnabled?1:0.5}}
                  onClick={()=>handleApply(row.action_id)}
                  disabled={!!busy}
                  title={writesEnabled?'Apply this recommendation':'Enable Google Ads writes first'}
                >
                  {busy==='apply' ? '…' : '✅ Apply'}
                </button>
                <button
                  className="btn"
                  style={{fontSize:10,padding:'3px 12px',background:'#fef2f2',color:'#dc2626'}}
                  onClick={()=>handleReject(row.action_id)}
                  disabled={!!busy}
                >
                  {busy==='reject' ? '…' : '❌ Reject'}
                </button>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

                  <div style={{fontSize:11,fontWeight:600,color:'#16a34a',marginBottom:4}}>⬆️ Bid Up ({optimizerResult.actions.increase_bid.length} keywords)</div>
                  {optimizerResult.actions.increase_bid.map((k,i)=>(
                    <div key={i} style={{fontSize:11,padding:'4px 8px',background:'#f0fdf4',borderRadius:4,marginBottom:3}}>
                      <strong>"{k.keyword}"</strong> — {k.reason}
                    </div>
                  ))}
                </div>
              )}

              {optimizerResult.actions?.decrease_bid?.length > 0 && (
                <div style={{marginBottom:10}}>
                  <div style={{fontSize:11,fontWeight:600,color:'#f59e0b',marginBottom:4}}>⬇️ Bid Down ({optimizerResult.actions.decrease_bid.length} keywords)</div>
                  {optimizerResult.actions.decrease_bid.map((k,i)=>(
                    <div key={i} style={{fontSize:11,padding:'4px 8px',background:'#fffbeb',borderRadius:4,marginBottom:3}}>
                      <strong>"{k.keyword}"</strong> — {k.reason}
                    </div>
                  ))}
                </div>
              )}

              {optimizerResult.actions?.new_exact?.length > 0 && (
                <div style={{marginBottom:10}}>
                  <div style={{fontSize:11,fontWeight:600,color:'#0891b2',marginBottom:4}}>✨ Add as Exact Match ({optimizerResult.actions.new_exact.length} terms)</div>
                  {optimizerResult.actions.new_exact.map((k,i)=>(
                    <div key={i} style={{fontSize:11,padding:'4px 8px',background:'#f0f9ff',borderRadius:4,marginBottom:3}}>
                      <strong>"{k.search_term}"</strong> — {k.clicks} clicks, {k.conversions} conversions
                    </div>
                  ))}
                </div>
              )}

              {optimizerResult.actions?.new_negatives?.length > 0 && (
                <div style={{marginBottom:10}}>
                  <div style={{fontSize:11,fontWeight:600,color:'#6b7280',marginBottom:4}}>🚫 Add as Negative ({optimizerResult.actions.new_negatives.length} terms)</div>
                  {optimizerResult.actions.new_negatives.slice(0,10).map((k,i)=>(
                    <div key={i} style={{fontSize:11,padding:'4px 8px',background:'var(--gray-light)',borderRadius:4,marginBottom:3}}>
                      <strong>"{k.search_term}"</strong> — {k.reason}
                    </div>
                  ))}
                  {optimizerResult.actions.new_negatives.length > 10 && (
                    <div style={{fontSize:10,color:'var(--text-muted)',padding:'2px 8px'}}>+{optimizerResult.actions.new_negatives.length-10} more</div>
                  )}
                </div>
              )}

              {optimizerResult.memory_applied?.length > 0 && (
                <div style={{marginBottom:10}}>
                  <div style={{fontSize:11,fontWeight:600,color:'#8b5cf6',marginBottom:4}}>🧠 Memory Overrides Applied ({optimizerResult.memory_applied.length})</div>
                  {optimizerResult.memory_applied.map((m,i)=>(
                    <div key={i} style={{fontSize:10,padding:'3px 8px',background:'#f5f3ff',borderRadius:4,marginBottom:2,color:'#6d28d9'}}>
                      {m}
                    </div>
                  ))}
                </div>
              )}

              {optimizerResult.summary.keywords_to_pause === 0 &&
               optimizerResult.summary.keywords_to_bid_up === 0 &&
               optimizerResult.summary.new_negatives === 0 && (
                <div style={{fontSize:12,color:'var(--text-muted)',textAlign:'center',padding:12}}>
                  Not enough data yet for recommendations. Needs gclid attribution from new leads.
                </div>
              )}
            </>
          )}
        </div>
      )}

      <KeywordResearchSection />

      <MemorySection />

      <ScheduledJobsSection />

      <div className="report-section">
        <div className="report-title">AI Report Engine</div>
        <p style={{fontSize:11,marginBottom:10}}>Ask questions about your pipeline data</p>
        <div className="ai-chat">
          <div className="ai-messages">
            <div className="ai-message">AI chat coming soon. Upload CSV files for ROI analysis.</div>
          </div>
          <div className="ai-input-area">
            <textarea placeholder="Ask a question..." value={chatMsg} onChange={e=>setChatMsg(e.target.value)} style={{maxHeight:80}}></textarea>
            <button disabled>Send</button>
          </div>
        </div>
        <button className="btn btn-ghost btn-sm" style={{marginTop:8}}>Upload CSV</button>
      </div>

      <div className="report-section">
        <div className="report-title">Campaign Email/SMS Builder</div>
        <p style={{fontSize:11}}>Create custom email and SMS sequences for campaigns like Invisalign, Cosmetic, etc.</p>
        <div style={{marginTop:8}}>
          <div className="coming-soon-badge">Coming Soon</div>
          <ul className="feature-list">
            <li>Custom drip sequences</li>
            <li>AI-assisted copy generation</li>
            <li>Template library</li>
            <li>A/B testing</li>
          </ul>
        </div>
      </div>
    </div>
  );
}

function InboxTab({ onOpenLead }) {
  const [data, setData] = useState({ count: 0, leads: [] });
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    loadInbox();
    const t = setInterval(loadInbox, 15000);
    return () => clearInterval(t);
  }, []);

  async function loadInbox() {
    try {
      const d = await api('/api/admin/inbox/unread');
      setData(d);
    } catch(e) { console.error('inbox load error', e); }
    finally { setLoading(false); }
  }

  async function markRead(leadId) {
    // Unmatched conversations have no lead record — skip the API call and just refresh
    if ((leadId || '').startsWith('unmatched-')) {
      loadInbox();
      return;
    }
    await api('/api/admin/lead/' + leadId + '/mark-read', { method: 'POST' });
    loadInbox();
    // Notify the App bell so the badge count refreshes immediately
    try { window.dispatchEvent(new CustomEvent('inbox-unread-changed')); } catch(_) {}
  }

  if (loading) return <div style={{padding:20,color:'var(--text-muted)',fontSize:12}}>Loading…</div>;

  return (
    <div style={{maxWidth:700}}>
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12}}>
        <div style={{fontSize:14,fontWeight:700}}>Unread Messages</div>
        {data.count > 0 && (
          <span style={{background:'var(--red)',color:'#fff',borderRadius:10,padding:'1px 7px',fontSize:11,fontWeight:700}}>
            {data.count}
          </span>
        )}
      </div>
      {data.leads.length === 0 ? (
        <div style={{background:'#fff',border:'1px solid var(--border)',borderRadius:8,padding:'24px',textAlign:'center',color:'var(--text-muted)',fontSize:12}}>
          ✓ All caught up — no unread messages
        </div>
      ) : (
        data.leads.map(l => {
          const name = [l.first_name, l.last_name].filter(Boolean).join(' ') || l.email || l.phone || 'Unknown';
          // Normalize field names: SMS uses last_received_at/last_body, email uses latest_at/latest_body
          const ago = timeAgo(l.last_received_at || l.latest_at);
          const preview = l.last_body || l.latest_body || '';
          const isUnmatched = (l.lead_id || '').startsWith('unmatched-');
          const channelBadge = l.channel === 'email' ? '✉' : l.channel === 'both' ? '✉💬' : '💬';
          return (
            <div key={l.lead_id} style={{background:'#fff',border:'1px solid var(--border)',borderRadius:8,
              padding:'10px 14px',marginBottom:6,display:'flex',gap:10,alignItems:'flex-start'}}>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:3}}>
                  <span style={{fontWeight:700,fontSize:12}}>{name}</span>
                  <span style={{background:'var(--red)',color:'#fff',borderRadius:8,padding:'0 5px',fontSize:9,fontWeight:700}}>
                    {l.unread_count} new
                  </span>
                  <span style={{fontSize:9,color:'var(--teal)'}}>{channelBadge}</span>
                  <span style={{fontSize:9,color:'var(--text-muted)'}}>{ago}</span>
                </div>
                <div style={{fontSize:11,color:'var(--text)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:420}}>
                  {preview}
                </div>
                {isUnmatched && <div style={{fontSize:9,color:'var(--text-muted)',marginTop:1}}>⚠ No matching lead</div>}
              </div>
              <div style={{display:'flex',gap:4,flexShrink:0}}>
                {!isUnmatched && (
                  <button className="btn btn-teal btn-sm" onClick={() => { markRead(l.lead_id); onOpenLead && onOpenLead(l.lead_id); }}>
                    Open
                  </button>
                )}
                <button className="btn btn-ghost btn-sm" onClick={() => markRead(l.lead_id)}>
                  ✓ Read
                </button>
              </div>
            </div>
          );
        })
      )}
    </div>
  );
}

function App() {
  const [tab, setTab] = useState('dashboard');  // Dashboard is now the landing tab
  const [pipeline, setPipeline] = useState([]);
  const [stats, setStats] = useState(null);
  const [campaignStats, setCampaignStats] = useState([]);
  const [keywordStats, setKeywordStats] = useState([]);
  const [ga4Data, setGa4Data] = useState(null);
  const [selectedId, setSelectedId] = useState(null);
  const [loading, setLoading] = useState(true);
  const [unreadCount, setUnreadCount] = useState(0);
  const [showNotifPanel, setShowNotifPanel] = useState(false);
  const [notifLeads, setNotifLeads] = useState([]);
  const [desktopPermission, setDesktopPermission] = useState(
    typeof Notification !== 'undefined' ? Notification.permission : 'denied'
  );
  const prevUnreadRef = React.useRef(null);
  const prevLeadIdsRef = React.useRef(null); // track which lead_ids had unread last poll

  useEffect(() => {
    loadData();
    const interval = setInterval(loadData, 30000);
    // Re-fetch inbox count immediately when a lead is marked read (from DetailPanel or InboxTab)
    window.addEventListener('inbox-unread-changed', loadData);
    return () => {
      clearInterval(interval);
      window.removeEventListener('inbox-unread-changed', loadData);
    };
  }, []);

  // Update browser tab title
  useEffect(() => {
    document.title = unreadCount > 0 ? `(${unreadCount}) nXtSmile Pipeline` : 'nXtSmile Pipeline';
  }, [unreadCount]);

  function requestDesktopNotifications() {
    if (typeof Notification === 'undefined') return;
    Notification.requestPermission().then(p => setDesktopPermission(p));
  }

  async function markReadAndRefreshBadge(leadId) {
    try {
      await api('/api/admin/lead/' + leadId + '/mark-read', { method: 'POST' });
      const d = await api('/api/admin/inbox/unread');
      setUnreadCount(d.count || 0);
      setNotifLeads(d.leads || []);
      try { window.dispatchEvent(new CustomEvent('inbox-unread-changed')); } catch(_) {}
    } catch(_) {}
  }

  async function loadData() {
    try {
      const [p, s, c, g] = await Promise.all([
        api('/api/pipeline/enriched'),
        api('/api/admin/stats'),
        api('/api/admin/campaigns'),
        api('/api/admin/ga4').catch(() => null),
      ]);
      setPipeline(p.leads || []);
      setStats(s);
      setCampaignStats(c.campaigns || []);
      setKeywordStats(c.keywords || []);
      if (g) setGa4Data(g);
      api('/api/admin/inbox/unread').then(d => {
        const newCount = d.count || 0;
        const leads = d.leads || [];
        setNotifLeads(leads);
        // Fire desktop notification for each newly-appeared unread lead
        // Read permission live (avoids stale closure after user grants mid-session)
        const livePermission = typeof Notification !== 'undefined' ? Notification.permission : 'denied';
        if (livePermission === 'granted' && prevLeadIdsRef.current !== null) {
          const prevIds = prevLeadIdsRef.current;
          const newLeads = leads.filter(l => !prevIds.has(l.lead_id));
          newLeads.forEach(l => {
            const name = [l.first_name, l.last_name].filter(Boolean).join(' ') || l.phone || 'Unknown';
            const n = new Notification('nXtSmile — New SMS', {
              body: `${name}: ${(l.last_body || '').slice(0, 80)}`,
              icon: '/favicon.ico',
              tag: `sms-${l.lead_id}`,
            });
            n.onclick = () => { window.focus(); n.close(); };
          });
        }
        prevLeadIdsRef.current = new Set(leads.map(l => l.lead_id));
        prevUnreadRef.current = newCount;
        setUnreadCount(newCount);
      }).catch(() => {});
    } catch (e) {
      console.error('Load error:', e);
    } finally {
      setLoading(false);
    }
  }

  function handleStageChange(leadId, newStage) {
    setPipeline(pipeline.map(l => l.id === leadId ? { ...l, stage: newStage } : l));
  }

  return (
    <div>
      <div className="header">
        <div className="header-logo">nXt<span>smile</span> Pipeline</div>
        <div className="header-right">
          <div className="header-dot" />
          <span style={{fontSize:10,opacity:.7}}>Live</span>

          {/* Desktop notification permission prompt */}
          {desktopPermission === 'default' && (
            <button onClick={requestDesktopNotifications}
              style={{fontSize:10,padding:'2px 8px',borderRadius:4,border:'1px solid rgba(255,255,255,.4)',
                background:'rgba(255,255,255,.1)',color:'#fff',cursor:'pointer',display:'flex',alignItems:'center',gap:4}}>
              🔔 Enable alerts
            </button>
          )}

          {/* Bell icon with dropdown */}
          <div style={{position:'relative'}}>
            <button onClick={() => setShowNotifPanel(v => !v)}
              style={{background:'none',border:'none',cursor:'pointer',color:'#fff',padding:'2px 4px',
                display:'flex',alignItems:'center',gap:4,position:'relative'}}>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
              </svg>
              {unreadCount > 0 && (
                <span style={{position:'absolute',top:-4,right:-4,background:'var(--red)',color:'#fff',
                  borderRadius:'50%',minWidth:16,height:16,fontSize:9,fontWeight:700,
                  display:'flex',alignItems:'center',justifyContent:'center',padding:'0 3px',lineHeight:1}}>
                  {unreadCount > 9 ? '9+' : unreadCount}
                </span>
              )}
            </button>

            {/* Click-outside overlay */}
            {showNotifPanel && (
              <div onClick={() => setShowNotifPanel(false)}
                style={{position:'fixed',inset:0,zIndex:9998}} />
            )}

            {/* Notification dropdown panel */}
            {showNotifPanel && (
              <div style={{position:'absolute',top:'calc(100% + 8px)',right:0,width:320,
                background:'#fff',borderRadius:8,boxShadow:'0 8px 32px rgba(0,0,0,.18)',
                border:'1px solid var(--border)',zIndex:9999,overflow:'hidden'}}>
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',
                  padding:'10px 14px',borderBottom:'1px solid var(--border)'}}>
                  <span style={{fontSize:12,fontWeight:700,color:'var(--text)'}}>
                    Unread Messages {unreadCount > 0 && (
                      <span style={{background:'var(--red)',color:'#fff',borderRadius:8,
                        padding:'0 5px',fontSize:9,fontWeight:700,marginLeft:4}}>{unreadCount}</span>
                    )}
                  </span>
                  <button onClick={() => { setShowNotifPanel(false); setTab('inbox'); }}
                    style={{fontSize:10,color:'var(--teal)',background:'none',border:'none',cursor:'pointer',fontWeight:600}}>
                    View all →
                  </button>
                </div>
                <div style={{maxHeight:320,overflowY:'auto'}}>
                  {notifLeads.length === 0 ? (
                    <div style={{padding:'20px',textAlign:'center',color:'var(--text-muted)',fontSize:11}}>
                      ✓ All caught up
                    </div>
                  ) : notifLeads.slice(0, 8).map(l => {
                    const name = [l.first_name, l.last_name].filter(Boolean).join(' ') || l.email || l.phone || 'Unknown';
                    const isUnmatched = (l.lead_id || '').startsWith('unmatched-');
                    const preview = l.last_body || l.latest_body || '';
                    const ago = timeAgo(l.last_received_at || l.latest_at);
                    const channelIcon = l.channel === 'email' ? '✉ ' : l.channel === 'both' ? '✉💬 ' : '💬 ';
                    return (
                      <div key={l.lead_id}
                        onClick={() => { if (!isUnmatched) { setShowNotifPanel(false); setSelectedId(l.lead_id); setTab('pipeline'); markReadAndRefreshBadge(l.lead_id); } }}
                        style={{display:'flex',gap:10,padding:'10px 14px',cursor: isUnmatched ? 'default' : 'pointer',
                          borderBottom:'1px solid var(--border)',background:'#fff'}}
                        onMouseOver={e => { if (!isUnmatched) e.currentTarget.style.background='var(--teal-light)'; }}
                        onMouseOut={e => e.currentTarget.style.background='#fff'}>
                        <div style={{width:32,height:32,borderRadius:'50%',background:'var(--teal-light)',
                          display:'flex',alignItems:'center',justifyContent:'center',
                          fontSize:12,fontWeight:700,color:'var(--teal)',flexShrink:0}}>
                          {(name[0]||'?').toUpperCase()}
                        </div>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:2}}>
                            <span style={{fontWeight:700,fontSize:11,color:'var(--text)'}}>{channelIcon}{name}</span>
                            <span style={{background:'var(--red)',color:'#fff',borderRadius:8,
                              padding:'0 4px',fontSize:8,fontWeight:700}}>{l.unread_count} new</span>
                          </div>
                          <div style={{fontSize:10,color:'var(--text-muted)',overflow:'hidden',
                            textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{preview}</div>
                          <div style={{fontSize:9,color:'var(--text-muted)',marginTop:1}}>{ago}</div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
          </div>
        </div>
      </div>
      <div className="tab-bar">
        <button className={'tab' + (tab === 'inbox' ? ' active' : '')} onClick={() => { setTab('inbox'); setShowNotifPanel(false); }} style={{position:'relative'}}>
          Inbox
          {unreadCount > 0 && (
            <span style={{display:'inline-flex',alignItems:'center',justifyContent:'center',
              background:'var(--red)',color:'#fff',borderRadius:8,fontSize:8,fontWeight:700,
              padding:'0 5px',minWidth:14,height:14,marginLeft:4,lineHeight:1}}>
              {unreadCount > 9 ? '9+' : unreadCount}
            </span>
          )}
        </button>
        <button className={'tab' + (tab === 'dashboard' ? ' active' : '')} onClick={() => setTab('dashboard')}>Dashboard</button>
        <button className={'tab' + (tab === 'pipeline' ? ' active' : '')} onClick={() => setTab('pipeline')}>Pipeline</button>
        <button className={'tab' + (tab === 'reports' ? ' active' : '')} onClick={() => setTab('reports')}>Reports & Campaigns</button>
        <button className={'tab' + (tab === 'workflows' ? ' active' : '')} onClick={() => setTab('workflows')}>Workflows</button>
        <button className={'tab' + (tab === 'admin' ? ' active' : '')} onClick={() => setTab('admin')}>Admin</button>
      </div>
      <div className="main">
        {loading ? (
          <div style={{ textAlign: 'center', padding: 20, color: 'var(--text-muted)' }}>Loading...</div>
        ) : (
          <React.Fragment>
            {tab === 'inbox' && (
              <InboxTab onOpenLead={(id) => { setSelectedId(id); setTab('pipeline'); }} />
            )}
            {tab === 'dashboard' && (
              <DashboardTab pipeline={pipeline} stats={stats} onTabSwitch={setTab} />
            )}
            {tab === 'pipeline' && (
              <React.Fragment>
                <PipelineTab pipeline={pipeline} stats={stats} selectedId={selectedId}
                  onCardClick={setSelectedId} onStageChange={handleStageChange} onRefresh={loadData} />
                {selectedId && (
                  <DetailPanel lead={pipeline.find(l => l.id === selectedId)} onClose={() => setSelectedId(null)}
                    onStageChange={handleStageChange} onRefresh={loadData}
                    onDelete={(id) => { setPipeline(p => p.filter(l => l.id !== id)); setSelectedId(null); }} />
                )}
              </React.Fragment>
            )}
            {tab === 'reports' && <ReportsTab campaignStats={campaignStats} keywordStats={keywordStats} ga4Data={ga4Data} />}
            {tab === 'workflows' && <WorkflowsSection />}
            {tab === 'admin' && (
              <AdminTab
                onSync={() => api('/api/admin/sync', { method: 'POST' })}
                onMatch={() => api('/api/admin/match', { method: 'POST' })}
                onGAds={() => api('/api/admin/gads-sync', { method: 'POST' })}
                onConversions={() => api('/api/admin/upload-conversions', { method: 'POST' })}
                onGA4Refresh={() => api('/api/admin/ga4/refresh', { method: 'POST' })}
                onOptimize={() => api('/api/admin/optimize?dry_run=true', { method: 'POST' })} />
            )}
          </React.Fragment>
        )}
      </div>
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
