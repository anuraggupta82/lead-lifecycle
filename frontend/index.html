                                        <input autoFocus
                                          value={launchCardEdit.draft}
                                          onChange={e=>setLaunchCardEdit(p=>({...p, draft: e.target.value}))}
                                          onKeyDown={e=>{
                                            if (e.key==='Enter') saveCardField('call_extension_phone', launchCardEdit.draft);
                                            if (e.key==='Escape') setLaunchCardEdit(null);
                                          }}
                                          placeholder="(508) 555-0100"
                                          style={{width:200,fontSize:13,padding:'5px 9px',border:'1px solid var(--teal)',
                                            borderRadius:6,outline:'none'}}/>
                                        <button className="btn btn-teal btn-sm" style={{fontSize:11}}
                                          disabled={launchCardEdit.saving}
                                          onClick={()=>saveCardField('call_extension_phone', launchCardEdit.draft)}>
                                          {launchCardEdit.saving ? '…' : isLinkedAlready ? 'Save Changes' : 'Save'}
                                        </button>
                                        <button className="btn btn-sm" style={{fontSize:11,
                                          background:'var(--surface)',border:'1px solid var(--border)',color:'var(--text-muted)'}}
                                          onClick={()=>setLaunchCardEdit(null)}>Cancel</button>
                                      </div>
                                    ) : (
                                      <div style={{fontSize:14,fontWeight:600,color: (camp.call_extension_phone || practiceSettings.phone) ? 'var(--text)' : '#9ca3af'}}>
                                        {camp.call_extension_phone || practiceSettings.phone || <em style={{fontWeight:400}}>Not set</em>}
                                      </div>
                                    )}
                                  </div>
                                </div>

                                {/* Card 5b — Sitelink Extensions */}
                                {(() => {
                                  // Parse existing sitelinks from campaign
                                  let existingSitelinks = [];
                                  try {
                                    const raw = camp.sitelinks || '';
                                    existingSitelinks = raw ? JSON.parse(raw) : [];
                                  } catch(e) {}
                                  const slCount = existingSitelinks.length;

                                  // Default blank sitelinks for the editor
                                  const DEFAULT_SITELINKS = [
                                    {title:'Book Online',    url: (camp.landing_page || practiceSettings.website || 'https://graftondentalcare.com') + '/book'},
                                    {title:'New Patients',   url: (camp.landing_page || practiceSettings.website || 'https://graftondentalcare.com') + '/new-patients'},
                                    {title:'About Us',       url: (camp.landing_page || practiceSettings.website || 'https://graftondentalcare.com') + '/about'},
                                    {title:'Patient Forms',  url: (camp.landing_page || practiceSettings.website || 'https://graftondentalcare.com') + '/forms'},
                                  ];

                                  function openEditor() {
                                    setSitelinkDraft(existingSitelinks.length > 0
                                      ? existingSitelinks.map(sl => ({title: sl.title||'', url: sl.url||''}))
                                      : DEFAULT_SITELINKS.map(sl => ({...sl}))
                                    );
                                    setSitelinkResult(null);
                                    setSitelinkSuggestions([]);
                                    setSitelinkSuggestInstruction('');
                                    setSitelinkSuggestError(null);
                                    setSitelinkRetryCount(0);
                                    setSitelinkEditorOpen(true);
                                    // Load sitelink library (non-blocking)
                                    api('/api/admin/sitelink-library').then(r => {
                                      setSitelinkLibrary(r?.sitelinks || []);
                                    }).catch(()=>{});
                                  }

                                  // AI suggest — accepts optional overrides for error-retry loop
                                  async function aiSuggest(overrideInstruction, previousErrors, previousSuggestions) {
                                    setSitelinkSuggestLoading(true);
                                    setSitelinkSuggestError(null);
                                    try {
                                      const body = { instruction: overrideInstruction !== undefined ? overrideInstruction : (sitelinkSuggestInstruction || null) };
                                      if (previousErrors && previousErrors.length > 0) {
                                        body.previous_errors = previousErrors;
                                        body.previous_suggestions = previousSuggestions || sitelinkDraft;
                                      }
                                      const r = await api(`/api/admin/campaigns/${camp.campaign_id}/sitelinks/suggest`, {
                                        method: 'POST',
                                        body: JSON.stringify(body)
                                      });
                                      const sugs = r.suggestions || [];
                                      setSitelinkSuggestions(sugs);
                                      if (sugs.length === 0) {
                                        setSitelinkSuggestError('AI returned no suggestions — try a more specific instruction (e.g. "focus on insurance and financing").');
                                      }
                                    } catch(e) {
                                      setSitelinkSuggestError(e.message || 'AI suggest failed');
                                    }
                                    setSitelinkSuggestLoading(false);
                                  }

                                  // Add a suggestion to the draft (replace if title already exists, else append)
                                  function addSuggestionToDraft(sg) {
                                    setSitelinkDraft(d => {
                                      const existing = d.findIndex(x => x.title.toLowerCase() === sg.title.toLowerCase());
                                      const entry = {title: sg.title, url: sg.url};
                                      if (existing >= 0) return d.map((x,i) => i===existing ? entry : x);
                                      if (d.length >= 10) return d; // max 10
                                      return [...d, entry];
                                    });
                                  }

                                  // Replace entire draft with all suggestions (max 10)
                                  function useAllSuggestions() {
                                    setSitelinkDraft(sitelinkSuggestions.slice(0,10).map(sg => ({title:sg.title, url:sg.url})));
                                  }

                                  async function saveSitelinks() {
                                    const valid = sitelinkDraft.filter(sl => sl.title.trim() && sl.url.trim().startsWith('https://'));
                                    if (valid.length === 0) {
                                      setSitelinkResult({ok:false, msg:'At least one sitelink with a title and https:// URL is required.'});
                                      return;
                                    }
                                    setSitelinkSaving(true);
                                    setSitelinkResult(null);
                                    try {
                                      const r = await api(`/api/admin/campaigns/${camp.campaign_id}/sitelinks`, {
                                        method: 'POST',
                                        body: JSON.stringify({sitelinks: valid})
                                      });
                                      const gadsErrors = r.gads_errors || [];
                                      if (r.gads_applied && gadsErrors.length === 0) {
                                        // Clean success
                                        setSitelinkResult({ok:true, count:r.saved, gads_applied:true, gads_errors:[]});
                                        setCampDetail(prev => prev ? {
                                          ...prev,
                                          campaign: {...prev.campaign, sitelinks: JSON.stringify(valid)}
                                        } : prev);
                                        setSitelinkEditorOpen(false);
                                      } else if (r.gads_applied && gadsErrors.length > 0) {
                                        // Partial success — GAds had errors, show AI retry prompt
                                        setCampDetail(prev => prev ? {
                                          ...prev,
                                          campaign: {...prev.campaign, sitelinks: JSON.stringify(valid)}
                                        } : prev);
                                        setSitelinkResult({ok:'partial', count:r.saved, gads_count:r.gads_count,
                                          gads_errors: gadsErrors, draft_at_save: valid});
                                      } else {
                                        // Saved to DB but not live (no gads resource), or not applied
                                        setSitelinkResult({ok:true, count:r.saved, gads_applied:false, gads_errors:[]});
                                        setCampDetail(prev => prev ? {
                                          ...prev,
                                          campaign: {...prev.campaign, sitelinks: JSON.stringify(valid)}
                                        } : prev);
                                        setSitelinkEditorOpen(false);
                                      }
                                    } catch(e) {
                                      setSitelinkResult({ok:false, msg: e.message || 'Save failed'});
                                    }
                                    setSitelinkSaving(false);
                                  }

                                  const MAX_AI_RETRIES = 2;

                                  // AI Fix & Retry — feed GAds errors back to AI, get improved sitelinks, auto-save
                                  async function aiFixAndRetry(gadsErrors, draftAtSave) {
                                    // Iteration cap — prevent infinite loop if AI can't fix
                                    if (sitelinkRetryCount >= MAX_AI_RETRIES) {
                                      setSitelinkResult({ok:false, msg:`AI could not fix the errors after ${MAX_AI_RETRIES} attempts. Please edit the sitelinks manually to resolve the Google Ads issues above.`});
                                      return;
                                    }
                                    setSitelinkRetryCount(c => c + 1);
                                    setSitelinkResult(null);
                                    // 1. Get AI-improved suggestions
                                    setSitelinkSuggestLoading(true);
                                    setSitelinkSuggestError(null);
                                    let improved = [];
                                    try {
                                      const r = await api(`/api/admin/campaigns/${camp.campaign_id}/sitelinks/suggest`, {
                                        method: 'POST',
                                        body: JSON.stringify({
                                          previous_errors: gadsErrors,
                                          previous_suggestions: draftAtSave,
                                          instruction: 'Fix the Google Ads errors. Make all titles strictly under 25 characters.'
                                        })
                                      });
                                      improved = r.suggestions || [];
                                      setSitelinkSuggestions(improved);
                                    } catch(e) {
                                      setSitelinkSuggestError(e.message || 'AI fix failed');
                                      setSitelinkSuggestLoading(false);
                                      return;
                                    }
                                    setSitelinkSuggestLoading(false);
                                    if (improved.length === 0) {
                                      setSitelinkSuggestError('AI could not generate improved sitelinks. Please edit manually.');
                                      return;
                                    }
                                    // 2. Replace draft with improved suggestions and validate before save
                                    const rawDraft = improved.slice(0,10).map(sg => ({title:sg.title, url:sg.url}));
                                    const newDraft = rawDraft.filter(sl => sl.title.trim() && sl.url.trim().startsWith('https://'));
                                    setSitelinkDraft(newDraft);
                                    if (newDraft.length === 0) {
                                      setSitelinkSuggestError('AI returned no valid sitelinks (missing titles or https:// URLs). Please edit manually.');
                                      return;
                                    }
                                    // 3. Auto-save the improved sitelinks
                                    setSitelinkSaving(true);
                                    try {
                                      const r2 = await api(`/api/admin/campaigns/${camp.campaign_id}/sitelinks`, {
                                        method: 'POST',
                                        body: JSON.stringify({sitelinks: newDraft})
                                      });
                                      const errs2 = r2.gads_errors || [];
                                      if (r2.gads_applied && errs2.length === 0) {
                                        setSitelinkResult({ok:true, count:r2.saved, gads_applied:true, gads_errors:[], ai_fixed:true});
                                        setCampDetail(prev => prev ? {
                                          ...prev, campaign: {...prev.campaign, sitelinks: JSON.stringify(newDraft)}
                                        } : prev);
                                        setSitelinkEditorOpen(false);
                                      } else if (errs2.length > 0) {
                                        // Still failing — show partial panel again (user can retry or give up)
                                        setSitelinkResult({ok:'partial', count:r2.saved, gads_count:r2.gads_count,
                                          gads_errors:errs2, draft_at_save:newDraft});
                                      } else {
                                        setSitelinkResult({ok:true, count:r2.saved, gads_applied:false, gads_errors:[], ai_fixed:true});
                                        setCampDetail(prev => prev ? {
                                          ...prev, campaign: {...prev.campaign, sitelinks: JSON.stringify(newDraft)}
                                        } : prev);
                                        setSitelinkEditorOpen(false);
                                      }
                                    } catch(e2) {
                                      setSitelinkResult({ok:false, msg: e2.message || 'Auto-save after AI fix failed'});
                                    }
                                    setSitelinkSaving(false);
                                  }

                                  return (
                                    <div style={cardStyle}>
                                      <div style={cardHeaderStyle}>
                                        <span style={{fontSize:12,fontWeight:700}}>🔗 Sitelink Extensions</span>
                                        <div style={{display:'flex',alignItems:'center',gap:8}}>
                                          {slCount > 0 && (
                                            <span style={{fontSize:10,background:'#dcfce7',color:'#166534',
                                              border:'1px solid #86efac',borderRadius:10,padding:'1px 8px',fontWeight:600}}>
                                              ✓ {slCount} sitelink{slCount!==1?'s':''} saved
                                            </span>
                                          )}
                                          <button style={{fontSize:11,background:'none',border:'1px solid var(--border)',
                                            borderRadius:5,padding:'3px 10px',cursor:'pointer',color:'var(--teal)',fontWeight:600}}
                                            onClick={openEditor}>
                                            {slCount > 0 ? 'Edit' : '+ Add Sitelinks'}
                                          </button>
                                        </div>
                                      </div>

                                      {/* Saved sitelinks summary */}
                                      {slCount > 0 && !sitelinkEditorOpen && (
                                        <div style={{padding:'8px 14px 12px'}}>
                                          {existingSitelinks.map((sl,i) => (
                                            <div key={i} style={{display:'flex',gap:8,alignItems:'baseline',
                                              padding:'4px 0',borderBottom:'1px solid var(--border)'}}>
                                              <span style={{fontSize:12,color:'#1a0dab',fontWeight:600,minWidth:120,flexShrink:0}}>
                                                {sl.title}
                                              </span>
                                              <span style={{fontSize:11,color:'#6b7280',wordBreak:'break-all'}}>
                                                {sl.url}
                                              </span>
                                            </div>
                                          ))}
                                        </div>
                                      )}

                                      {/* Empty state */}
                                      {slCount === 0 && !sitelinkEditorOpen && (
                                        <div style={{padding:'10px 14px',fontSize:11,color:'#9ca3af',fontStyle:'italic'}}>
                                          No sitelinks configured. Add 4+ for best ad performance.
                                        </div>
                                      )}

                                      {/* Editor */}
                                      {sitelinkEditorOpen && (
                                        <div style={{padding:'10px 14px 14px'}}>

                                          {/* Library chips — sitelinks previously pushed to GAds */}
                                          {sitelinkLibrary.length > 0 && (
                                            <div style={{marginBottom:10,padding:'8px 10px',
                                              background:'#f0fdf4',border:'1px solid #bbf7d0',borderRadius:6}}>
                                              <div style={{fontSize:11,fontWeight:600,color:'#166534',marginBottom:6}}>
                                                📚 From your library — click to add
                                              </div>
                                              <div style={{display:'flex',flexWrap:'wrap',gap:5}}>
                                                {sitelinkLibrary.map((sl,i) => {
                                                  const alreadyIn = sitelinkDraft.some(d =>
                                                    d.title.toLowerCase() === sl.title.toLowerCase()
                                                  );
                                                  return (
                                                    <button key={i}
                                                      onClick={() => !alreadyIn && addSuggestionToDraft(sl)}
                                                      title={sl.url}
                                                      style={{fontSize:10,padding:'3px 9px',borderRadius:10,cursor: alreadyIn ? 'default' : 'pointer',
                                                        background: alreadyIn ? '#dcfce7' : 'white',
                                                        color: alreadyIn ? '#166534' : '#15803d',
                                                        border: `1px solid ${alreadyIn ? '#86efac' : '#86efac'}`,
                                                        opacity: alreadyIn ? 0.6 : 1,
                                                        fontWeight:600}}>
                                                      {alreadyIn ? '✓ ' : '+ '}{sl.title}
                                                      {sl.use_count > 1 && <span style={{fontWeight:400,opacity:.7}}> ×{sl.use_count}</span>}
                                                    </button>
                                                  );
                                                })}
                                              </div>
                                            </div>
                                          )}

                                          {/* AI Suggest row */}
                                          <div style={{display:'flex',gap:6,alignItems:'center',marginBottom:10,
                                            padding:'8px 10px',background:'#f8f4ff',border:'1px solid #ddd6fe',borderRadius:6}}>
                                            <span style={{fontSize:11,fontWeight:600,color:'#7c3aed',flexShrink:0}}>✨ AI Suggest</span>
                                            <input
                                              value={sitelinkSuggestInstruction}
                                              onChange={e => setSitelinkSuggestInstruction(e.target.value)}
                                              placeholder="Refinement hint… (e.g. focus on insurance, financing, Invisalign)"
                                              onKeyDown={e => { if(e.key==='Enter') aiSuggest(); }}
                                              style={{flex:1,fontSize:11,padding:'4px 8px',border:'1px solid #ddd6fe',
                                                borderRadius:5,outline:'none',background:'white'}}
                                            />
                                            <button
                                              onClick={() => aiSuggest()}
                                              disabled={sitelinkSuggestLoading}
                                              style={{fontSize:11,padding:'4px 12px',borderRadius:5,cursor:'pointer',
                                                background:'#7c3aed',color:'white',border:'none',fontWeight:600,flexShrink:0}}>
                                              {sitelinkSuggestLoading ? '…' : sitelinkSuggestions.length > 0 ? 'Suggest Again →' : 'Suggest'}
                                            </button>
                                          </div>

                                          {/* AI Suggest error */}
                                          {sitelinkSuggestError && (
                                            <div style={{fontSize:11,color:'#dc2626',marginBottom:8,padding:'5px 8px',
                                              background:'#fef2f2',borderRadius:5,border:'1px solid #fecaca'}}>
                                              ✗ {sitelinkSuggestError}
                                            </div>
                                          )}

                                          {/* Suggestion chips */}
                                          {sitelinkSuggestions.length > 0 && (
                                            <div style={{marginBottom:12,padding:'8px 10px',background:'#fdf4ff',
                                              border:'1px solid #e9d5ff',borderRadius:6}}>
                                              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:6}}>
                                                <span style={{fontSize:10,color:'#7c3aed',fontWeight:700}}>
                                                  AI SUGGESTIONS — click to add to draft
                                                </span>
                                                <button onClick={useAllSuggestions}
                                                  style={{fontSize:10,color:'#7c3aed',background:'none',border:'1px solid #ddd6fe',
                                                    borderRadius:4,padding:'2px 8px',cursor:'pointer',fontWeight:600}}>
                                                  Use All
                                                </button>
                                              </div>
                                              <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
                                                {sitelinkSuggestions.map((sg,i) => {
                                                  const alreadyInDraft = sitelinkDraft.some(d => d.title.toLowerCase()===sg.title.toLowerCase());
                                                  return (
                                                    <button key={i}
                                                      title={sg.reason || sg.url}
                                                      onClick={() => addSuggestionToDraft(sg)}
                                                      style={{fontSize:11,padding:'4px 10px',borderRadius:12,cursor:'pointer',
                                                        border: alreadyInDraft ? '1px solid #a855f7' : '1px solid #c4b5fd',
                                                        background: alreadyInDraft ? '#a855f7' : 'white',
                                                        color: alreadyInDraft ? 'white' : '#6d28d9',
                                                        fontWeight: alreadyInDraft ? 700 : 400}}>
                                                      {alreadyInDraft ? '✓ ' : ''}{sg.title}
                                                    </button>
                                                  );
                                                })}
                                              </div>
                                              <div style={{fontSize:10,color:'#9ca3af',marginTop:6}}>
                                                Hover a chip for rationale · Click to add · Click again to update
                                              </div>
                                            </div>
                                          )}

                                          {/* Draft rows */}
                                          <div style={{fontSize:10,color:'var(--text-muted)',marginBottom:8}}>
                                            Title ≤ 25 chars · URL must start with https:// · Google recommends 4+
                                          </div>
                                          {sitelinkDraft.map((sl,i) => (
                                            <div key={i} style={{display:'flex',gap:6,alignItems:'center',marginBottom:6}}>
                                              <div style={{position:'relative',width:160}}>
                                                <input
                                                  value={sl.title}
                                                  maxLength={25}
                                                  placeholder="Title (25 chars max)"
                                                  onChange={e => {
                                                    setSitelinkDraft(d => d.map((x,j)=> j===i ? {...x,title:e.target.value} : x));
                                                    // Clear stale partial GAds error panel when user manually edits
                                                    setSitelinkResult(r => (r && r.ok === 'partial') ? null : r);
                                                  }}
                                                  style={{width:'100%',fontSize:12,padding:'4px 28px 4px 7px',
                                                    border: `1px solid ${sl.title.length > 22 ? '#f59e0b' : 'var(--border)'}`,
                                                    borderRadius:5,outline:'none',boxSizing:'border-box'}}
                                                />
                                                <span style={{position:'absolute',right:5,top:'50%',transform:'translateY(-50%)',
                                                  fontSize:9,color: sl.title.length > 22 ? '#f59e0b' : '#9ca3af',pointerEvents:'none'}}>
                                                  {sl.title.length}/25
                                                </span>
                                              </div>
                                              <input
                                                value={sl.url}
                                                placeholder="https://..."
                                                onChange={e => {
                                                  setSitelinkDraft(d => d.map((x,j)=> j===i ? {...x,url:e.target.value} : x));
                                                  setSitelinkResult(r => (r && r.ok === 'partial') ? null : r);
                                                }}
                                                style={{flex:1,fontSize:12,padding:'4px 7px',
                                                  border:`1px solid ${sl.url && !sl.url.startsWith('https://') ? '#ef4444' : 'var(--border)'}`,
                                                  borderRadius:5,outline:'none'}}
                                              />
                                              <button
                                                title="Remove"
                                                onClick={()=> setSitelinkDraft(d => d.filter((_,j)=>j!==i))}
                                                style={{fontSize:13,background:'none',border:'none',cursor:'pointer',
                                                  color:'#9ca3af',padding:'0 4px',lineHeight:1}}>✕</button>
                                            </div>
                                          ))}
                                          {sitelinkDraft.length < 10 && (
                                            <button
                                              onClick={()=> setSitelinkDraft(d => [...d, {title:'',url:'https://'}])}
                                              style={{fontSize:11,color:'var(--teal)',background:'none',border:'none',
                                                cursor:'pointer',padding:'4px 0',textDecoration:'underline'}}>
                                              + Add another sitelink
                                            </button>
                                          )}

                                          {/* Save result / GAds error panel */}
                                          {sitelinkResult && (
                                            <div style={{marginTop:8,fontSize:11,
                                              color: sitelinkResult.ok === true ? '#166534' : sitelinkResult.ok === 'partial' ? '#92400e' : '#dc2626',
                                              background: sitelinkResult.ok === true ? '#f0fdf4' : sitelinkResult.ok === 'partial' ? '#fffbeb' : '#fef2f2',
                                              border: `1px solid ${sitelinkResult.ok === true ? '#86efac' : sitelinkResult.ok === 'partial' ? '#fcd34d' : '#fecaca'}`,
                                              borderRadius:5,padding:'8px 10px'}}>
                                              {sitelinkResult.ok === true && (
                                                <>
                                                  {sitelinkResult.ai_fixed && <span>🤖 AI fixed &amp; </span>}
                                                  ✓ {sitelinkResult.count} sitelink(s) saved
                                                  {sitelinkResult.gads_applied ? ' and pushed to Google Ads' : ''}
                                                </>
                                              )}
                                              {sitelinkResult.ok === 'partial' && (
                                                <div>
                                                  <div style={{fontWeight:600,marginBottom:4}}>
                                                    ⚠ Saved to DB ({sitelinkResult.count}) but Google Ads returned {sitelinkResult.gads_errors.length} error(s):
                                                  </div>
                                                  {sitelinkResult.gads_errors.slice(0,5).map((e,i) => (
                                                    <div key={i} style={{fontSize:10,color:'#78350f',marginBottom:2}}>• {e}</div>
                                                  ))}
                                                  <div style={{marginTop:8}}>
                                                    {sitelinkRetryCount < MAX_AI_RETRIES ? (
                                                      <>
                                                        <button
                                                          disabled={sitelinkSuggestLoading || sitelinkSaving}
                                                          onClick={() => aiFixAndRetry(sitelinkResult.gads_errors, sitelinkResult.draft_at_save)}
                                                          style={{fontSize:11,padding:'5px 12px',borderRadius:5,cursor:'pointer',
                                                            background:'#d97706',color:'white',border:'none',fontWeight:600}}>
                                                          {(sitelinkSuggestLoading || sitelinkSaving) ? '🤖 AI fixing…' : '🤖 AI Fix & Retry →'}
                                                        </button>
                                                        <span style={{fontSize:10,color:'#92400e',marginLeft:8}}>
                                                          AI will evaluate errors and push improved sitelinks automatically
                                                          {sitelinkRetryCount > 0 && ` (attempt ${sitelinkRetryCount + 1}/${MAX_AI_RETRIES})`}
                                                        </span>
                                                      </>
                                                    ) : (
                                                      <span style={{fontSize:10,color:'#78350f',fontStyle:'italic'}}>
                                                        AI has reached its retry limit. Please edit the sitelinks manually to fix the issues above.
                                                      </span>
                                                    )}
                                                  </div>
                                                </div>
                                              )}
                                              {sitelinkResult.ok === false && `✗ ${sitelinkResult.msg}`}
                                            </div>
                                          )}

                                          <div style={{display:'flex',gap:8,marginTop:10}}>
                                            <button className="btn btn-teal btn-sm" style={{fontSize:11}}
                                              disabled={sitelinkSaving}
                                              onClick={saveSitelinks}>
                                              {sitelinkSaving ? '…' : isLinkedAlready ? 'Save & Push to Google Ads' : 'Save Sitelinks'}
                                            </button>
                                            <button className="btn btn-sm" style={{fontSize:11,background:'var(--surface)',
                                              border:'1px solid var(--border)',color:'var(--text-muted)'}}
                                              onClick={()=>{ setSitelinkEditorOpen(false); setSitelinkResult(null); setSitelinkSuggestions([]); }}>
                                              Cancel
                                            </button>
                                          </div>
                                        </div>
                                      )}
                                    </div>
                                  );
                                })()}

                                {/* Card 6 — Custom Values (collapsed accordion) */}
                                <div style={cardStyle}>
                                  <div style={{...cardHeaderStyle, cursor:'pointer'}}
                                    onClick={()=>setCustomValsOpen(o=>!o)}>
                                    <span style={{fontSize:12,fontWeight:700}}>⚙ Custom Values</span>
                                    <span style={{fontSize:11,color:'var(--text-muted)',userSelect:'none'}}>
                                      {customValsOpen ? '▲ collapse' : '▼ expand'}
                                    </span>
                                  </div>
                                  {customValsOpen && (
                                    <div style={cardBodyStyle}>
                                      {[
                                        {label:'Bidding Strategy', val: adGroups.bidding_strategy || camp.bidding_strategy || ''},
                                        {label:'Callouts',         val: camp.callouts || ''},
                                        {label:'Ad Schedule',      val: camp.ad_schedule || ''},
                                        {label:'UTM Parameters',   val: camp.utm_params || ''},

                                                <button

                                                    fontSize:10, fontWeight:600, padding:'2px 8px',

                                                    background: isLoading ? '#e5e7eb'

                                                    color: isLoading ? '#9ca3af'

                                                      ad_group_name: ag.ad_group_name||''

                                                    cursor:'pointer',color:'#059669',padding:'0 4px',

                                                  ➕

                                                <span style={{fontSize:10,color:'var(--text-muted)'}}>—</span>

                                  </table>
                                </div>

                                  <div style={{fontSize:12,fontWeight:700,marginBottom:8}}>📝 Live Ad Creatives ({cd.ads.length})</div>

                                    const assets = ad.assets_json || {};
                                    const headlines = assets.headlines||[];
                                    const descs = assets.descriptions||[];
                                    return (
                                      <div key={i} style={{background:'#fafafa',border:'1px solid var(--border)',
                                        borderRadius:7,padding:'12px 14px',marginBottom:8}}>
                                        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:8}}>
                                          <div>
                                            <div style={{fontSize:11,fontWeight:600,color:'var(--text)',marginBottom:2}}>
                                              {ad.ad_group_name || 'Ad Group'} — RSA #{i+1}
                                            </div>
                                            <span style={{fontSize:10,padding:'1px 6px',borderRadius:3,fontWeight:600,
                                              background: ad.status==='ENABLED'?'#d1fae5':'#f3f4f6',
                                              color: ad.status==='ENABLED'?'#065f46':'#6b7280'}}>

                                          </div>
                                          <div style={{display:'flex',gap:12,fontSize:10,color:'var(--text-muted)',textAlign:'right'}}>

                                            <div><div style={{fontWeight:700,color:'var(--text)'}}>{ad.ctr||0}%</div>CTR</div>
                                            <div><div style={{fontWeight:700,color:'var(--text)'}}>{'$'+(ad.cost||0).toFixed(2)}</div>cost</div>
                                            <div><div style={{fontWeight:700,color:'var(--purple)'}}>{ad.leads||0}</div>leads</div>
                                          </div>
                                        </div>
                                        {headlines.length>0 && (
                                          <div style={{marginBottom:6}}>
                                            <div style={{fontSize:9,fontWeight:700,color:'var(--text-muted)',textTransform:'uppercase',marginBottom:3}}>Headlines</div>

                                              {headlines.map((h,j)=>(
                                                <span key={j} style={{background:'#e0f2fe',color:'#0c4a6e',fontSize:10,
                                                  padding:'2px 7px',borderRadius:3}}>{typeof h==='object'?h.text||'':h}</span>
                                              ))}
                                            </div>
                                          </div>
                                        )}
                                        {descs.length>0 && (
                                          <div>
                                            <div style={{fontSize:9,fontWeight:700,color:'var(--text-muted)',textTransform:'uppercase',marginBottom:3}}>Descriptions</div>

                                              <div key={j} style={{fontSize:11,padding:'3px 8px',background:'#fff',
                                                border:'1px solid var(--border)',borderRadius:4,marginBottom:2,lineHeight:1.4}}>{typeof d==='object'?d.text||'':d}</div>
                                            ))}
                                          </div>
                                        )}
                                      </div>
                                    );
                                  })}
                                </div>
                              )}

                              {/* Search Terms */}
                              {cd.search_terms && cd.search_terms.length > 0 && (
                                <div style={{marginBottom:20}}>
                                  <div style={{fontSize:12,fontWeight:700,marginBottom:8}}>

                                  {/* Negate popover */}
                                  {negatePopover && (
                                    <div style={{background:'#fff',border:'1px solid var(--border)',
                                      borderRadius:8,padding:'12px 14px',marginBottom:10,

                                      <div style={{fontSize:11,fontWeight:700,marginBottom:8,color:'var(--text)'}}>
                                        🚫 Negate: <span style={{fontFamily:'monospace',color:'#dc2626'}}>{negatePopover.term}</span>
                                      </div>
                                      <div style={{fontSize:11,marginBottom:10,color:'var(--text-muted)'}}>

                                            padding:'4px 10px',borderRadius:4,
                                            background: negatePopover.matchType===mt?'#fee2e2':'#f9fafb',

                                            campDetail.campaign.campaign_id,
                                            negatePopover.term,
                                            negatePopover.matchType

                                        <button className="btn btn-ghost btn-sm" style={{fontSize:11}}

                                      </div>
                                    </div>
                                  )}

                                  <div style={{maxHeight:320,overflowY:'auto',border:'1px solid var(--border)',borderRadius:7}}>
                                    <table className="report-table" style={{margin:0,borderRadius:0}}>

                                        <tr>
                                          <th>Search Term</th>
                                          <th className="num">Impr</th>
                                          <th className="num">Clicks</th>
                                          <th className="num">CTR</th>
                                          <th className="num">Cost</th>
                                          <th className="num">Conv</th>
                                          <th>Status</th>
                                          <th style={{textAlign:'center'}}>Action</th>
                                        </tr>
                                      </thead>
                                      <tbody>
                                        {cd.search_terms.slice(0,100).map((st,i)=>{
                                          const impr = st.impressions||0;
                                          const clk  = st.clicks||0;
                                          const cost = st.cost||0;          // stored as dollars by save_gads_search_terms_cache
                                          const ctr  = impr>0 ? ((clk/impr)*100).toFixed(1)+'%' : '—';
                                          const isAdded = st.status==='ADDED';
                                          const isExcluded = st.status==='EXCLUDED';
                                          const isNegated = negatedTerms.has(st.search_term) || isExcluded;
                                          return (
                                            <tr key={i} style={{opacity: isNegated?0.5:1,
                                              textDecoration: isNegated?'line-through':'none'}}>
                                              <td style={{fontFamily:'monospace',fontSize:11,maxWidth:200,
                                                overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                                                {st.search_term}
                                              </td>
                                              <td className="num">{impr.toLocaleString()}</td>
                                              <td className="num">{clk.toLocaleString()}</td>
                                              <td className="num">{ctr}</td>
                                              <td className="num">${cost.toFixed(2)}</td>
                                              <td className="num">{st.conversions||0}</td>
                                              <td>
                                                <span style={{fontSize:9,padding:'1px 5px',borderRadius:3,fontWeight:600,
                                                  background: isNegated?'#fee2e2': isAdded?'#d1fae5':'#f3f4f6',
                                                  color: isNegated?'#991b1b': isAdded?'#065f46':'#6b7280'}}>
                                                  {isNegated?'NEGATED': st.status||'—'}
                                                </span>
                                              </td>
                                              <td style={{textAlign:'center'}}>
                                                {!isNegated && (
                                                  <button
                                                    title="Add as negative keyword to campaign"
                                                    onClick={()=>setNegatePopover({
                                                      term: st.search_term, matchType:'EXACT'
                                                    })}
                                                    style={{fontSize:13,background:'none',border:'none',
                                                      cursor:'pointer',color:'#dc2626',padding:'0 4px',
                                                      lineHeight:1}}>
                                                    🚫
                                                  </button>
                                                )}
                                              </td>
                                            </tr>
                                          );
                                        })}
                                        {cd.search_terms.length > 100 && (
                                          <tr>
                                            <td colSpan={7} style={{textAlign:'center',fontSize:11,
                                              color:'var(--text-muted)',fontStyle:'italic',padding:'8px'}}>
                                              Showing top 100 of {cd.search_terms.length} terms. Click ↻ Sync to refresh.
                                            </td>
                                          </tr>
                                        )}
                                      </tbody>
                                    </table>
                                  </div>
                                </div>
                              )}

                              {cd.has_gads_data && cd.ad_groups.length===0 && cd.ads.length===0 && (
                                <div style={{fontSize:12,color:'var(--text-muted)',fontStyle:'italic',textAlign:'center',padding:'24px 0'}}>
                                  No ad group or creative data yet for the selected period ({campDetailDays}d).
                                  Run a Google Ads sync to populate performance data.
                                </div>
                              )}
                            </div>
                          )}

                          {/* Optimization moved to AI Optimizer tab */}

                        </div>
                      </div>
                    );
                  })()}

                </>
              );
            })()}
          </div>
        </div>
      )}

      {/* ── Stop Campaign Confirmation Modal ── */}
      {stopConfirm && (
        <div style={{position:'fixed',top:0,left:0,right:0,bottom:0,background:'rgba(0,0,0,.5)',
          zIndex:300,display:'flex',alignItems:'center',justifyContent:'center'}}
          onClick={()=>setStopConfirm(null)}>
          <div style={{background:'#fff',borderRadius:10,padding:24,width:400,maxWidth:'92vw',
            boxShadow:'0 8px 40px rgba(0,0,0,.25)'}}
            onClick={e=>e.stopPropagation()}>
            <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:14}}>
              <span style={{fontSize:22}}>⏹</span>
              <div>
                <div style={{fontSize:15,fontWeight:700,color:'var(--text)'}}>Stop Campaign</div>
                <div style={{fontSize:11,color:'var(--text-muted)',marginTop:2}}>This action is irreversible</div>
              </div>
            </div>
            <div style={{fontSize:12,lineHeight:1.6,color:'var(--text)',marginBottom:16,
              background:'#fff5f5',border:'1px solid #fecaca',borderRadius:6,padding:'10px 12px'}}>
              <strong>Warning:</strong> Stopping <em>{stopConfirm.campaign_name}</em> will permanently
              remove it from Google Ads (<code>REMOVED</code> status). This cannot be undone.
              The campaign will be archived locally. All spending stops immediately.
            </div>
            <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
              <button className="btn btn-ghost btn-sm" style={{fontSize:11}}
                onClick={()=>setStopConfirm(null)}>Cancel</button>
              <button
                className="btn btn-sm"
                style={{fontSize:11,background:'var(--red)',color:'#fff',border:'none'}}
                disabled={!!campActionLoading[stopConfirm.campaign_id]}
                onClick={()=>campaignAction(stopConfirm.campaign_id, 'stop')}>
                {campActionLoading[stopConfirm.campaign_id]==='stop' ? 'Stopping…' : '⏹ Yes, Stop Campaign'}
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ── Campaign Creation Wizard ── */}
      {showWizard && (
        <div style={{position:'fixed',top:0,left:0,right:0,bottom:0,background:'rgba(0,0,0,.45)',
          zIndex:200,display:'flex',alignItems:'center',justifyContent:'center'}}
          onClick={closeWizard}>
          <div style={{background:'#fff',borderRadius:12,padding:28,width:660,maxWidth:'96vw',
            maxHeight:'92vh',overflowY:'auto',boxShadow:'0 8px 40px rgba(0,0,0,.2)'}}
            onClick={e=>e.stopPropagation()}>

            {/* Progress bar */}
            <div style={{display:'flex',gap:4,marginBottom:18}}>
              {[1,2,3,4].map(s=>(
                <div key={s} style={{flex:1,height:4,borderRadius:2,
                  background: s <= wizardStep ? 'var(--teal)' : 'var(--border)',
                  transition:'background .2s'}} />
              ))}
            </div>

            {/* Step labels */}
            <div style={{display:'flex',justifyContent:'space-between',marginBottom:16}}>
              {[['1','Identity'],['2','Budget & Targeting'],['3','Workflow'],['4','Opus Strategy']].map(([n,lbl])=>(
                <div key={n} style={{fontSize:10,color: parseInt(n)===wizardStep ? 'var(--teal)' : 'var(--text-muted)',fontWeight: parseInt(n)===wizardStep ? 700 : 400}}>
                  Step {n}: {lbl}
                </div>
              ))}
            </div>

            {/* ── Step 1: Identity ── */}
            {wizardStep === 1 && (
              <div>
                <div style={{fontWeight:700,fontSize:15,marginBottom:4}}>Campaign Identity</div>
                <div style={{fontSize:11,color:'var(--text-muted)',marginBottom:16}}>Name this campaign and tell us what type it is.</div>

                {/* ── Copy from existing campaign ── */}
                {(unifiedCamps||[]).length > 0 && (
                  <div style={{background:'#f0f9ff',border:'1px solid #bae6fd',borderRadius:7,padding:'10px 12px',marginBottom:14,display:'flex',alignItems:'center',gap:10}}>
                    <span style={{fontSize:11,fontWeight:600,color:'#0369a1',whiteSpace:'nowrap'}}>📋 Copy from:</span>
                    <select style={{flex:1,fontSize:12,padding:'6px 8px',border:'1px solid #bae6fd',borderRadius:5,background:'white'}}
                      value={wizardCopyFrom}
                      onChange={e => {
                        const campId = e.target.value;
                        setWizardCopyFrom(campId);
                        if (!campId) return;
                        const src = (unifiedCamps||[]).find(c => c.campaign_id === campId);
                        if (!src) return;
                        // Pre-fill all editable fields from source campaign (keep name blank for user to name)
                        setNewCamp(p => ({
                          ...p,
                          campaign_type: src.campaign_type || 'MANUAL',
                          service_focus: src.service_focus || '',
                          promo_offer: src.promo_offer || '',
                          target_audience: src.target_audience || '',
                          objective: src.objective || '',
                          monthly_budget: src.monthly_budget || '',
                          expected_cpl: src.expected_cpl || '',
                          landing_page: src.landing_page || '',
                          notes: src.notes || '',
                        }));
                        if (src.monthly_budget) setWizardDailyBudget(String(monthlyToDaily(src.monthly_budget)));
                        if (src.workflow_id) setWizardWfId(String(src.workflow_id));
                        if (src.skip_workflow) setWizardSkipWorkflow(true);
                      }}>
                      <option value="">— Start from scratch —</option>
                      {(unifiedCamps||[]).filter(c=>c.campaign_id).map(c=>(
                        <option key={c.campaign_id} value={c.campaign_id}>{c.campaign_name}</option>
                      ))}
                    </select>
                    {wizardCopyFrom && (
                      <button style={{fontSize:11,color:'#64748b',background:'none',border:'none',cursor:'pointer',whiteSpace:'nowrap'}}
                        onClick={()=>{ setWizardCopyFrom(''); setNewCamp(p=>({...EMPTY_CAMP,campaign_name:p.campaign_name})); setWizardDailyBudget(''); setWizardWfId(''); setWizardSkipWorkflow(false); }}>
                        ✕ Clear
                      </button>
                    )}
                  </div>
                )}

                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:10}}>
                  <div>
                    <label style={{fontSize:11,fontWeight:600,display:'block',marginBottom:3}}>Campaign Name *</label>
                    <input style={{width:'100%',fontSize:12,padding:'7px 10px',border:'1px solid var(--border)',borderRadius:5,boxSizing:'border-box'}}
                      placeholder="e.g. All-on-X Implants Q3 2026"
                      value={newCamp.campaign_name} onChange={e=>setNC('campaign_name',e.target.value)} autoFocus />
                  </div>
                  <div>
                    <label style={{fontSize:11,fontWeight:600,display:'block',marginBottom:3}}>Campaign Type *</label>
                    <select style={{width:'100%',fontSize:12,padding:'7px 10px',border:'1px solid var(--border)',borderRadius:5,boxSizing:'border-box'}}
                      value={newCamp.campaign_type} onChange={e=>{setNC('campaign_type',e.target.value); if(e.target.value!=='GOOGLE_ADS') setNC('campaign_id','');}}>
                      <option value="MANUAL">Manual / Other</option>
                      <option value="GOOGLE_ADS">Google Ads</option>
                      <option value="META">Meta (Facebook/Instagram)</option>
                      <option value="EMAIL">Email</option>
                    </select>
                  </div>
                </div>

                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:10}}>
                  <div>
                    <label style={{fontSize:11,fontWeight:600,display:'block',marginBottom:3}}>Service / Procedure Focus</label>
                    <select style={{width:'100%',fontSize:12,padding:'7px 10px',border:'1px solid var(--border)',borderRadius:5,boxSizing:'border-box'}}
                      value={newCamp.service_focus} onChange={e=>setNC('service_focus',e.target.value)}>
                      <option value="">— Select —</option>
                      <option value="Implants">Dental Implants</option>
                      <option value="All-on-X">All-on-X / Full Arch</option>
                      <option value="Invisalign">Invisalign / Clear Aligners</option>
                      <option value="Whitening">Teeth Whitening</option>
                      <option value="Emergency">Emergency Dentistry</option>
                      <option value="New Patient">New Patient</option>
                      <option value="Hygiene">Hygiene / Preventive</option>
                      <option value="Cosmetic">Cosmetic Dentistry</option>
                      <option value="Other">Other</option>
                    </select>
                  </div>
                  <div>
                    <label style={{fontSize:11,fontWeight:600,display:'block',marginBottom:3}}>Promo / Offer</label>
                    <input style={{width:'100%',fontSize:12,padding:'7px 10px',border:'1px solid var(--border)',borderRadius:5,boxSizing:'border-box'}}
                      placeholder='e.g. "Free implant consult"'
                      value={newCamp.promo_offer} onChange={e=>setNC('promo_offer',e.target.value)} />
                  </div>
                </div>
              </div>
            )}

            {/* ── Step 2: Budget & Targeting ── */}
            {wizardStep === 2 && (
              <div>
                <div style={{fontWeight:700,fontSize:15,marginBottom:4}}>Budget & Targeting</div>
